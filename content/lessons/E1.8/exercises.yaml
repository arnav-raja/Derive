exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-first-broken
    phase: puzzle
    kind: predict
    concept: E1.8/bisection
    title: A thousand changes
    prompt: >-
      What is the smallest number of checks that is always enough to find the change that broke
      the script, however the versions turn out?
    answer:
      type: choice
      options:
        - { id: thousand, label: 'About 1,000' }
        - { id: five-hundred, label: 'About 500' }
        - { id: hundred, label: 'About 100' }
        - { id: ten, label: 'About 10' }
      correct: [ten]
    explanation: >-
      Check the version midway first: whether it works or not, one check halves the changes that
      could be to blame, from 1,000 to 500. Each later check halves what is left, and
      $2^{10} = 1{,}024$ is more than 1,000, so after 10 checks one change is left, the one that
      broke the script. Checking in order could take 999 checks, since today's version is already
      known to be broken, and every 10th version and then the gap about 100.

  # Recall ---------------------------------------------------------------------
  - id: recall-order
    phase: recall
    kind: recall
    concept: E1.1/evaluation-order
    prompt: |
      What number does this program print?

      ```python
      print(120 / 60 * 60)
      ```
    answer: { type: number, value: 120, tolerance: { abs: 0 } }
    explanation: >-
      `*` and `/` have the same precedence, so Python works from left to right: `120 / 60` is 2.0,
      and `2.0 * 60` is 120.0.

  - id: recall-range
    phase: recall
    kind: recall
    concept: E1.2/loops
    prompt: Which values does `k` take, in order, in the loop `for k in range(4):`?
    answer:
      type: choice
      options:
        - { id: one-to-four, label: '1, 2, 3, 4' }
        - { id: zero-to-four, label: '0, 1, 2, 3, 4' }
        - { id: zero-to-three, label: '0, 1, 2, 3' }
        - { id: one-to-three, label: '1, 2, 3' }
      correct: [zero-to-three]
    explanation: >-
      `range(4)` starts at 0 and stops before 4, so the loop runs four passes, with `k` equal to 0,
      1, 2 and 3.

  - id: recall-none
    phase: recall
    kind: recall
    concept: E1.3/defining-functions
    prompt: |
      What does this program print?

      ```python
      def report(loss):
          print("loss", loss)

      x = report(0.5)
      print(x)
      ```
    answer:
      type: choice
      options:
        - { id: twice, label: '`loss 0.5`, and then `loss 0.5` again' }
        - { id: value, label: '`loss 0.5`, and then `0.5`' }
        - { id: none-first, label: '`None`, and then `loss 0.5`' }
        - { id: right, label: '`loss 0.5`, and then `None`' }
      correct: [right]
    explanation: >-
      The call prints `loss 0.5`, and since `report` reaches no `return`, its value is `None`,
      which is kept in `x` and printed by the last line.

  - id: recall-local
    phase: recall
    kind: recall
    concept: E1.3/scope
    prompt: |
      What does this program print?

      ```python
      rate = 0.1

      def scaled(x):
          rate = 2.0
          return x * rate

      y = scaled(1.0)
      print(rate, y)
      ```
    answer:
      type: choice
      options:
        - { id: both-changed, label: '`2.0 2.0`' }
        - { id: right, label: '`0.1 2.0`' }
        - { id: unchanged, label: '`0.1 0.1`' }
        - { id: error, label: 'Nothing: Python stops with `UnboundLocalError`' }
      correct: [right]
    explanation: >-
      `rate = 2.0` inside `scaled` makes a local `rate` of the call's own, which the
      multiplication uses, so `y` is 2.0. The main program's `rate` is never touched and is still
      0.1. Nothing reads the local `rate` before it is assigned, so there is no error.

  - id: recall-invariant
    phase: recall
    kind: recall
    concept: E1.2/loop-invariants
    prompt: |
      What does E1.2's loop print?

      ```python
      lr = 1.0
      halvings = 0
      while lr > 0.001:
          lr = lr / 2
          halvings = halvings + 1
      print(halvings)
      ```
    answer: { type: number, value: 10, tolerance: { abs: 0 } }
    explanation: >-
      `lr` times $2^{\text{halvings}}$ stays 1, so the loop stops at the first count $h$ with $2^h$
      at least 1,000. $2^9 = 512$ is not, and $2^{10} = 1{,}024$ is, so it prints 10.

  # Explore --------------------------------------------------------------------
  - id: explore-which-hypothesis
    phase: explore
    kind: predict
    concept: E1.8/hypothesis
    title: Three results, one cause
    prompt: Which guess at the cause explains all three results?
    placement: true
    answer:
      type: choice
      options:
        - { id: starts-at-one, label: 'The count starts at 1 instead of 0' }
        - { id: one-pass, label: 'The loop stops after its first pass' }
        - { id: big-divide, label: 'Each pass divides `lr` by much more than 2' }
        - { id: after-loop, label: 'The count goes up once, after the loop has ended' }
      correct: [after-loop]
    explanation: >-
      Only a count that goes up once, after the loop, gives 1 for every rate, even for 0.0005,
      where the loop never runs. A count that started at 1 would give 11 and 8 for the first two
      rates, and a loop that stopped after one pass, or divided by much more than 2, would give 0
      for 0.0005, since a `while` loop checks its test before the first pass.
    review:
      variants:
        - prompt: >-
            A function should give the largest of the losses it is given. Given 0.3, 0.9 and 0.5 it
            gives 0.5, given 0.8 and 0.2 it gives 0.2, and given the one loss 0.4 it gives 0.4.
            Which guess explains all three?
          answer:
            type: choice
            options:
              - { id: last, label: 'It gives the last loss it is given' }
              - { id: smallest, label: 'It gives the smallest loss it is given' }
              - { id: second, label: 'It gives the second loss it is given' }
              - { id: first, label: 'It gives the first loss it is given' }
            correct: [last]
          explanation: >-
            The last loss is 0.5, 0.2 and 0.4 in turn. The smallest of 0.3, 0.9 and 0.5 is 0.3, so is
            the first, and a single loss has no second: one result rules out each of the others.
        - prompt: >-
            A function should count the steps whose loss is above 1.0. Given the losses 2.0, 0.5 and
            3.0 it gives 3, given 0.5 and 0.5 it gives 2, and given no losses at all it gives 0.
            Which guess explains all three?
          answer:
            type: choice
            options:
              - { id: below, label: 'It counts the steps whose loss is below 1.0' }
              - { id: every, label: 'It counts every step, whatever its loss' }
              - { id: plus-one, label: 'It counts the steps above 1.0, and adds 1' }
              - { id: above-half, label: 'It counts the steps whose loss is above 0.5' }
            correct: [every]
          explanation: >-
            Counting every step gives 3, 2 and 0. Counting the steps below 1.0 gives 1 for the
            first losses, counting those above 0.5 gives 2 for them, and the right count plus 1
            gives 1 for 0.5 and 0.5.
        - prompt: >-
            Two hypotheses both explain what a buggy function did on its first two inputs. On a
            third input, the first predicts 5 and the second predicts 7, and the function gives 7.
            What follows?
          answer:
            type: choice
            options:
              - { id: proved, label: 'The second hypothesis is now proved to be the cause' }
              - { id: wait, label: 'Neither can be judged until many more inputs are tried' }
              - { id: first-out, label: 'The first is ruled out, and the second is not yet proved' }
              - { id: both-out, label: 'Both are ruled out, since they disagreed with each other' }
            correct: [first-out]
          explanation: >-
            One result that a hypothesis cannot explain rules it out, so the first is gone. The
            second has passed a test it could have failed, which makes it more likely, but another
            input could still rule it out, so it is not proved.

  - id: explore-tell-apart
    phase: explore
    kind: predict
    concept: E1.8/observation
    title: Two guesses, one result
    prompt: Which of these would tell the colleague's two hypotheses apart?
    placement: true
    answer:
      type: choice
      options:
        - { id: ten, label: 'Call `mean_up_to(10)` and compare the result with 5.5' }
        - { id: one, label: 'Call `mean_up_to(1)` and compare the result with 1' }
        - { id: print-k, label: 'Print `k` on every pass of the loop' }
        - { id: fix, label: 'Change the loop to `range(1, n + 1)` and check the mean' }
      correct: [print-k]
    explanation: >-
      Printing `k` shows 0, 1, 2, 3 under the first hypothesis and 1, 2, 3 under the second.
      Adding 0 never changes a total, so both predict 4.5 for `mean_up_to(10)` and 0.0 for
      `mean_up_to(1)`, and `range(1, n + 1)` would mend the function under either, so none of
      those can tell them apart.
    review:
      variants:
        - prompt: >-
            A function should give the largest of the losses it is given, and given 0.2, 0.9 and 0.4
            it gives 0.4. One hypothesis says that it gives the last loss, and another that it gives
            the smallest loss above 0.3. Which losses, given to it, tell the two apart?
          answer:
            type: choice
            options:
              - { id: low-first, label: '0.1 and 0.4' }
              - { id: single, label: '0.6 alone' }
              - { id: mixed, label: '0.3, 0.8 and 0.5' }
              - { id: rising, label: '0.5 and 0.7' }
            correct: [rising]
          explanation: >-
            For 0.5 and 0.7 the last loss is 0.7 and the smallest above 0.3 is 0.5, so the two
            predict different results. For each of the others both give the same value: 0.4, 0.6
            and 0.5.
        - prompt: >-
            Two hypotheses explain a wrong total equally well, and both say that the same change
            will mend it. The change is made, and the total comes out right. What has been learned
            about which hypothesis was true?
          answer:
            type: choice
            options:
              - { id: nothing, label: 'Nothing, since both predicted that the change would work' }
              - { id: first, label: 'The first was true, since it was the first to be thought of' }
              - { id: both, label: 'Both were true, since the change that they shared worked' }
              - { id: neither, label: 'Neither was true, since a working fix replaces them both' }
            correct: [nothing]
          explanation: >-
            An observation tells hypotheses apart only where they predict different things. Both
            predicted that the change would work, so its working fits either, and the bug is mended
            without its cause being known.

  - id: explore-first-wrong
    phase: explore
    kind: predict
    concept: E1.8/observation
    title: Twenty million days
    prompt: Which line makes the first wrong value?
    answer:
      type: choice
      options:
        - { id: tokens, label: '`return batch * length`' }
        - { id: steps, label: '`return total_tokens / tokens_per_step(batch, length)`' }
        - { id: call, label: '`steps = steps_needed(total_tokens, batch, length)`' }
        - { id: days, label: '`return steps * seconds_per_step / 60 * 60 * 24`' }
      correct: [days]
    explanation: >-
      $500 \times 2{,}000 = 10^6$ tokens a step and $10^{12} / 10^6 = 10^6$ steps are right, but
      $10^6$ steps of 0.864 seconds are 864,000 seconds, which is 10 days, not twenty million. The
      first wrong value comes from the last line, where `/ 60 * 60 * 24` divides by 60 and then
      multiplies by 60 and by 24, since Python works from left to right.
    review:
      variants:
        - prompt: >-
            Three functions run one after another, each using the value before. They give 64, then
            4,096, then 40.96, where estimates made beforehand say about 60, about 4,000 and about
            4,000. Where should the search for the mistake start?
          answer:
            type: choice
            options:
              - { id: first, label: 'In the first function, since 64 is not exactly 60' }
              - { id: third, label: 'In the third function, which made 40.96 from 4,096' }
              - { id: second, label: 'In the second function, which made the largest value' }
              - { id: all, label: 'In all three at once, since the result is wrong' }
            correct: [third]
          explanation: >-
            64 and 4,096 agree with their estimates, so the functions that made them are not to
            blame. 40.96 is the first value that disagrees, so the mistake lies in the step that
            made it, the third function.
        - prompt: >-
            In a chain of functions, each using the value before, the first value is right, the
            second is wrong, and every value after it is wrong too. Where does the mistake lie?
          answer:
            type: choice
            options:
              - { id: start, label: 'In the first function, since the chain starts there' }
              - { id: end, label: 'In the last function, which made the final wrong result' }
              - { id: anywhere, label: 'Anywhere after the first, since every later value is wrong' }
              - { id: second, label: 'In the second function, which made the first wrong value' }
            correct: [second]
          explanation: >-
            The first value is right, so the first function is not to blame, and the later values
            may be wrong only because they were made from a wrong one. The mistake lies in the
            step that made the first wrong value.

  - id: explore-read-error
    phase: explore
    kind: predict
    concept: E1.8/observation
    title: Where Python stopped
    prompt: Which line holds the cause of the error?
    answer:
      type: choice
      options:
        - { id: line-1, label: 'Line 1: `total = 0`' }
        - { id: line-4, label: 'Line 4: `print("adding", loss, "to", total)`' }
        - { id: line-5, label: 'Line 5: `total = total + loss`' }
        - { id: line-7, label: 'Line 7: `add_loss(0.5)`' }
      correct: [line-5]
    explanation: >-
      Line 5 assigns `total` inside `add_loss`, which makes `total` local to the whole call, so
      line 4 reads a local name that has no value yet. Python stops at line 4, but the cause is the
      assignment on line 5.
    review:
      variants:
        - prompt: |
            This program stops with `UnboundLocalError on line 4: cannot access local variable 'count' where it is not associated with a value`. Why?

            ```python
            count = 0

            def tick():
                count = count + 1

            tick()
            ```
          answer:
            type: choice
            options:
              - { id: zero, label: '`count` is 0, and Python cannot add 1 to a name holding 0' }
              - { id: local, label: 'Assigning `count` in `tick` makes it local, with no value yet' }
              - { id: order, label: '`tick` is called before Python has finished defining it' }
              - { id: unseen, label: 'Names set outside a function can never be read inside one' }
            correct: [local]
          explanation: >-
            Line 4 assigns `count`, so `count` is local to the whole call, and the right side reads
            that local name before it has a value. Without the assignment, `tick` could read the
            main program's `count`.
        - prompt: >-
            A program stops with `ZeroDivisionError on line 12: division by zero`. What does line
            12 tell you?
          answer:
            type: choice
            options:
              - { id: change, label: 'Which line must be changed to mend the bug' }
              - { id: made, label: 'The line where the zero was first worked out' }
              - { id: stopped, label: 'Where Python stopped, which need not be where the cause is' }
              - { id: nothing, label: 'Nothing useful, since the message names no variable' }
            correct: [stopped]
          explanation: >-
            Line 12 is where a division by zero was tried. The zero may have been made anywhere
            earlier, and the line to change may be there, so the line in a message is where to start
            looking, not always where the cause is.

  - id: explore-versions
    phase: explore
    kind: predict
    concept: E1.8/bisection
    title: A million versions
    prompt: >-
      A project has a million versions. The first works, the last is broken, and once a version is
      broken every later one is broken too. At most how many checks does bisection need to find the
      first broken version?
    placement: true
    answer: { type: number, value: 20, tolerance: { abs: 0 } }
    explanation: >-
      Each check halves the gap, and $2^{20} = 1{,}048{,}576$ is more than a million while
      $2^{19} = 524{,}288$ is not, so 20 checks always suffice and some versions need all 20. Since
      $2^{10} \approx 10^3$, a million, a thousand thousands, takes 10 checks and 10 more.
    review:
      variants:
        - prompt: >-
            Bisection over a thousand versions takes at most 10 checks. At most how many does it
            take over a billion versions?
          answer: { type: number, value: 30, tolerance: { abs: 0 } }
          explanation: >-
            A billion is a thousand thousand thousands, and each factor of a thousand adds 10
            checks, since $2^{10} = 1{,}024$: $2^{30}$ is about $1.07 \times 10^9$, more than a
            billion.
        - prompt: >-
            Bisection searches training steps from step 0, known to be good, to step 4,096, known
            to be bad. How many checks does it make?
          answer: { type: number, value: 12, tolerance: { abs: 0 } }
          explanation: >-
            The gap of 4,096 is $2^{12}$, and each check halves it exactly, to 2,048, then 1,024,
            and so on down to 1, which takes 12 checks whatever the first bad step is.
        - prompt: >-
            Each check of a version takes an hour of training. At most how many hours does
            bisection need over 30,000 versions?
          answer: { type: number, value: 15, tolerance: { abs: 0 } }
          explanation: >-
            $2^{14} = 16{,}384$ is less than 30,000 and $2^{15} = 32{,}768$ is more, so 15 checks
            always suffice, and some searches need all 15: 15 hours, against up to 30,000 for
            checking in order.

  - id: explore-fooled
    phase: explore
    kind: predict
    concept: E1.8/hypothesis
    title: Three changes at once
    prompt: Which change mended the run?
    answer:
      type: choice
      options:
        - { id: averaging, label: 'The fix to the averaging, since a bug in the loss is the likeliest cause' }
        - { id: unknown, label: 'There is no telling yet: undo the changes one at a time to find out' }
        - { id: rate, label: 'The smaller learning rate, the usual cure for a loss that will not fall' }
        - { id: batch, label: 'The larger batch, since each step then learns from more examples' }
      correct: [unknown]
    explanation: >-
      Three changes were tested at once, so the result fits many hypotheses: any one of them, two
      together, or one that did harm hidden by the others. Undoing them one at a time, or making
      them one at a time, tests one hypothesis per run.
    review:
      variants:
        - prompt: >-
            Training became slower after four settings were changed together. Which plan finds out
            which setting slowed it?
          answer:
            type: choice
            options:
              - { id: one-at-a-time, label: 'Put the settings back one at a time, timing a run after each' }
              - { id: all-back, label: 'Put all four back at once, and see whether it speeds up again' }
              - { id: likeliest, label: 'Put back the likeliest setting, and keep the other three' }
              - { id: again, label: 'Run again with all four, since a slowdown may not happen twice' }
            correct: [one-at-a-time]
          explanation: >-
            Putting the settings back one at a time makes each run a test of one hypothesis.
            Putting all four back can show that one of them was to blame, but not which, and
            changing only the likeliest one tests only one of the four.
        - prompt: After a change to a program, a test that failed now passes. What has that shown?
          answer:
            type: choice
            options:
              - { id: bug-free, label: 'That the program now has no bugs left, at least in this function' }
              - { id: cause, label: 'That the hypothesis behind the change was the true cause of it' }
              - { id: nothing, label: 'Nothing at all, since a test that passes can never show anything' }
              - { id: this-case, label: 'That the change mended this case, not that the program has no bugs' }
            correct: [this-case]
          explanation: >-
            A passing test shows that the program now works on the inputs the test tries. Other
            inputs may still fail, and the change may have worked for a reason other than the
            hypothesis behind it.

  - id: explore-assert-place
    phase: explore
    kind: predict
    concept: E1.8/assertion
    title: Where the check goes
    prompt: Where in `halvings_to` should the line `assert target > 0, "the target must be above 0"` go?
    placement: true
    answer:
      type: choice
      options:
        - { id: after-return, label: 'After `return count`, as the last line of the body' }
        - { id: before-return, label: 'Between the loop and `return count`' }
        - { id: top, label: 'As the first line of the body, before `lr = 1.0`' }
        - { id: anywhere, label: 'Anywhere in the body, since `target` never changes' }
      correct: [top]
    explanation: >-
      At the top, a bad call fails at once. After `return` the assert never runs, and between the
      loop and the `return` it runs only after 1,075 halvings for a target of 0, and never for a
      negative target, whose loop never ends. The condition is the same anywhere, but where it is
      checked decides when.
    review:
      variants:
        - prompt: |
            What does this program do?

            ```python
            def scale(x, factor):
                assert factor > 0, "factor must be positive"
                return x * factor

            print(scale(2, 3))
            print(scale(2, -1))
            ```
          answer:
            type: choice
            options:
              - { id: right, label: 'It prints `6`, then stops with `AssertionError`' }
              - { id: message, label: 'It prints `6`, then prints the message `factor must be positive`' }
              - { id: both, label: 'It prints `6` and then `-2`, since the assert only warns' }
              - { id: stops-first, label: 'It stops with `AssertionError` before printing anything' }
            correct: [right]
          explanation: >-
            The first call passes its assert and returns 6, which is printed. In the second,
            `factor > 0` is `False`, so the assert stops the program with
            `AssertionError on line 2: factor must be positive` before `x * factor` is worked out.
        - prompt: A function's contract says that `rate` is between 0 and 1. Which line checks it?
          answer:
            type: choice
            options:
              - { id: lower-only, label: '`assert rate > 0, "rate must be between 0 and 1"`' }
              - { id: either, label: '`assert 0 < rate or rate < 1, "rate must be between 0 and 1"`' }
              - { id: right, label: '`assert 0 < rate < 1, "rate must be between 0 and 1"`' }
              - { id: warn, label: '`if rate > 1: print("rate must be between 0 and 1")`' }
            correct: [right]
          explanation: >-
            `0 < rate < 1` is `True` exactly when `rate` is between 0 and 1. `assert rate > 0`
            checks only the lower bound, so a rate of 2 gets through, the `or` is `True` for every
            number, since each is above 0 or below 1, and the `print` lets the program carry on with
            a bad rate, and misses rates of 0 or below.

  # Derive ---------------------------------------------------------------------
  - id: derive-wrong-mean
    phase: derive
    kind: step
    concept: E1.8/hypothesis
    title: The wrong mean, for every n
    prompt: >-
      The Explore phase's `mean_up_to(n)` adds $0 + 1 + \dots + (n - 1)$ and divides by $n$. E1.3's
      `triangle(m)` gives $1 + 2 + \dots + m = \frac{m(m + 1)}{2}$. What does `mean_up_to(n)`
      give, as an expression in $n$?
    answer:
      type: expression
      symbols:
        - { name: n, positive: true, integer: true }
      lhs: '\texttt{mean\_up\_to}(n) ='
      reference: (n - 1)/2
      accept: ['n/2 - 1/2', '(n-1)/2', '0.5*(n - 1)']
      reject: ['(n + 1)/2', 'n*(n - 1)/2', 'n/2', 'n - 1', '(n - 1)/n', '(n**2 - n)/(2*n)', '(n-1)*n/(2*n)', '((n-1)*n/2)/n']
      form:
        maxOps: 3
        message: That is the right value, but it can be written more simply. If it still divides by $n$, cancel the $n$ that the sum and the division share.
    explanation: >-
      The loop adds $0 + 1 + \dots + (n - 1)$, which is `triangle(n - 1)`, $\frac{(n - 1)n}{2}$, and
      dividing by $n$ gives $\frac{n - 1}{2}$: 1.5 at $n = 4$ and 4.5 at $n = 10$, always 1 below
      the right mean, $\frac{n + 1}{2}$.

  - id: derive-checks-left
    phase: derive
    kind: step
    concept: E1.8/bisection
    title: The gap after k checks
    prompt: >-
      Checking any version strictly between `lo` and `hi` keeps `lo` good and `hi` bad, so a search
      could check the version a third of the way from `lo` to `hi` instead of the one midway. Take
      a gap of $N$ that every check splits exactly into thirds. If the first bad version always
      lies in the larger part, what is the gap after $k$ checks?
    answer:
      type: expression
      symbols:
        - { name: N, positive: true }
        - { name: k, positive: true, integer: true }
      lhs: '\text{gap} ='
      reference: N*(2/3)**k
      accept: ['(2/3)**k*N', 'N*2**k/3**k', 'N/(3/2)**k', 'N*(2/3)^k']
      reject: ['N/3**k', 'N*(1/3)**k', 'N/2**k', 'N*(2/3)*k', '2*N/(3*k)', 'N - k*N/3']
    explanation: >-
      A check a third of the way splits the gap into a third and two thirds, and with the first bad
      version in the larger part, one check leaves $\frac{2N}{3}$. Each later check keeps two thirds
      of what is left, so two leave $\frac{4N}{9}$ and $k$ leave $N\left(\frac{2}{3}\right)^k$.

  - id: derive-bisect-proof
    phase: derive
    kind: proof
    concept: E1.8/bisection
    title: Why bisection finds the first bad one
    prompt: >-
      Versions are numbered in order, and every version after a bad one is bad too. Bisection
      starts with `lo` good and `hi` bad. While they are more than 1 apart, it checks the version
      $m$ midway between them, rounded down, and moves `hi` to $m$ if $m$ is bad, or `lo` to $m$ if
      it is good. When it stops, it gives `hi`. Here is a proof that `hi` is then the first bad
      version. Each line follows from the lines above it. Choose the rule that justifies each line.
      A rule may be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: invariant, name: Invariant, label: 'A statement that is true before the first pass of a loop, and that each pass keeps true, is true after every pass, as in E1.2.' }
        - { id: stop, name: The loop stops, label: 'A `while` loop ends at the first check where its test is `False`, as in E1.2.' }
        - { id: accumulator, name: Accumulator, label: 'A name set before a loop and updated by each pass holds, after the loop, the result over all the passes, as in E1.2.' }
        - { id: monotone, name: Bad stays bad, label: 'Every version after a bad version is bad too.' }
        - { id: branch, name: The branch taken, label: 'An `if` runs its block only when its test is `True`, and its `else` block only when the test is `False`.' }
        - { id: middle, name: Midway, label: 'When two whole numbers are more than 1 apart, the whole number midway between them, rounded down, is strictly between them.' }
        - { id: shrink, name: Shrinking, label: 'A whole number that every pass of a loop makes smaller, and that stays above 0, cannot shrink for ever, so the loop ends.' }
      start: '\text{Before the first pass, } \texttt{lo} \text{ is good, } \texttt{hi} \text{ is bad, and } \texttt{lo} < \texttt{hi}.'
      lines:
        - math: '\text{In a pass, } \texttt{hi} - \texttt{lo} > 1 \text{, so } \texttt{lo} < m < \texttt{hi}.'
          rule: middle
        - math: '\text{If } m \text{ is bad, } \texttt{hi} \text{ becomes } m \text{: still bad, and still above } \texttt{lo}.'
          rule: branch
        - math: '\text{If } m \text{ is good, } \texttt{lo} \text{ becomes } m \text{: still good, and still below } \texttt{hi}.'
          rule: branch
        - math: '\text{So after every pass, } \texttt{lo} \text{ is good, } \texttt{hi} \text{ is bad, and } \texttt{lo} < \texttt{hi}.'
          rule: invariant
        - math: '\text{Each pass makes } \texttt{hi} - \texttt{lo} \text{ smaller, as } m \text{ is strictly between them, so the loop ends.}'
          rule: shrink
        - math: '\text{When it ends, its test } \texttt{hi} - \texttt{lo} > 1 \text{ is false, and } \texttt{lo} < \texttt{hi} \text{ still holds, so } \texttt{hi} = \texttt{lo} + 1.'
          rule: stop
        - math: '\text{No version up to } \texttt{lo} \text{ is bad, or } \texttt{lo} \text{ would be bad too, so } \texttt{hi} \text{ is the first bad version.}'
          rule: monotone
    explanation: >-
      Midway puts $m$ strictly between `lo` and `hi`. By The branch taken, each of the two
      branches keeps `lo` good, `hi` bad and `lo` below `hi`, so by the invariant rule that holds
      after every pass. Shrinking shows that the loop ends: `hi - lo` is a whole number that every
      pass makes smaller and that stays above 0. The loop stops says what is true once it has: the
      test `hi - lo > 1` is `False`, and with `lo < hi` that leaves `hi = lo + 1`. Bad stays bad
      then rules out a bad version at or before `lo`, which would make `lo` bad too. Accumulator is
      never needed.

  - id: derive-not-monotone
    phase: derive
    kind: predict
    concept: E1.8/bisection
    title: When bad does not stay bad
    prompt: >-
      Suppose that a later change can mend the script again, so that the versions may run good,
      bad, good, bad. Bisection starts with `lo` good and `hi` bad, as before. What does it find?
    answer:
      type: choice
      options:
        - { id: first, label: 'The first bad version, since nothing in the search changes' }
        - { id: never, label: 'Nothing, since with good and bad mixed the loop never ends' }
        - { id: broke, label: 'A version that broke the script, though not always the first' }
        - { id: random, label: 'Some version at random, since its checks no longer mean anything' }
      correct: [broke]
    explanation: >-
      The invariant, that `lo` is good, `hi` is bad and `lo` is below `hi`, never used the rule
      that bad stays bad, and neither did the proof that the loop ends. So bisection still ends with
      a good version just before a bad one, and the change between them broke the script. Only the
      last line needed bad to stay bad, to rule out an earlier break that a later change mended.

