        def steps_to(target, start, factor):
            """The number of steps that take a value from start to target or below,
            when each step multiplies it by factor. The target must be above 0, and
            the factor between 0 and 1."""
            value = start
            steps = 0
            while value > target:
                value = value * factor
                steps = steps + 1
            return steps


