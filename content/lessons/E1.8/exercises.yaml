  # Explain --------------------------------------------------------------------
  - id: explain-debugging
    phase: explain
    kind: explain
    concept: E1.8/hypothesis
    covers: [E1.8/observation, E1.8/bisection, E1.8/assertion]
    title: Debugging as an experiment, simply
    prompt: >-
      Explain to your friend how to debug as an experiment. Cover what a hypothesis is, how one is
      tested and what rules one out; how to choose an observation, with an example, and why a fix
      that works may say nothing about the cause; what the parts of an error message tell you, and
      whether the line it names is always the one to change; how bisection finds the first bad version, what stays true as it runs, and how many checks it
      needs for a thousand versions and for a million, and why; and what an `assert` does, and why
      the asserts of a contract go at the top of a function.
    answer:
      type: text
      rubric:
        - { id: hypothesis, criterion: 'Says that a hypothesis is a guess at the cause that predicts what the program will do, that it is tested by working out the prediction before running anything, and that one fact it cannot explain rules it out.' }
        - { id: observation, criterion: 'Says that an observation is worth making where the hypotheses predict different things, with an example such as printing a name inside a loop, and that a fix that works under every hypothesis does not show which one was true.' }
        - { id: error, criterion: 'Reads an error message as an observation: its type, the line where Python stopped, which need not be the line of the cause, and its details.' }
        - { id: bisection, criterion: 'Explains bisection: `lo` is known to be good and `hi` known to be bad, checking the version midway and moving one of them to it keeps that true and halves the gap, and when the two are next to each other `hi` is the first bad version.' }
        - { id: count, criterion: 'Gives the number of checks, about 10 for a thousand versions and 20 for a million, because each check halves the gap and $2^{10}$ is about a thousand.' }
        - { id: assertion, criterion: 'Says what `assert` does when its condition is `True` and when it is `False`, and that asserts which check a contract go at the top of the function so that a bad call fails at once, with a message, before any wrong work is done.' }
      reference: >-
        Debugging by changing things until the output looks right can go on for hours, and even when
        it works you do not know why. Treat it as an experiment instead. A hypothesis is a guess at
        the cause of the bug that says what the program will do. Before running anything, work out
        what it predicts, and then look. One fact it cannot explain rules it out, however likely it
        seemed, as a count that went up once after a loop was the only guess that gave 1 even when
        the loop never ran. To test hypotheses, choose an observation where they predict different
        things. Printing a name inside a loop, or stepping through the code, shows values that the
        function's result hides: printing k told apart two guesses about range that gave the same
        mean. A fix that would work under either guess says nothing about which was true, and
        three changes made at once cannot say which one helped, so change one thing at a time. An
        error message is an observation too: its type says what went wrong, the line is where
        Python stopped, which need not be where the cause is, and the details name what was
        involved. For a bug that appeared somewhere in a long history, use bisection. Keep lo, a
        version known to be good, and hi, one known to be bad. Check the version midway between
        them, and move hi to it if it is bad or lo if it is good. lo stays good and hi stays bad,
        the gap halves, and when they are next to each other hi is the first bad version. Each
        check halves the gap, and 2 to the 10 is 1,024, so a thousand versions take about 10
        checks and a million take 20. Finally, assert condition, message does nothing when the
        condition is true and stops the program with AssertionError and the message when it is
        false. Put the asserts of a function's contract at the top, so that a bad call fails at
        once with a clear message, instead of giving a wrong answer or never ending.
      minWords: 100
      maxWords: 400
