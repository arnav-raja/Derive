  - id: explain-halvings
    phase: explain
    kind: explain
    concept: E1.2/loop-invariants
    covers: [E1.2/conditions, E1.2/loops, E1.2/accumulator-pattern]
    title: Choosing, repeating, and knowing what a loop does
    prompt: >-
      Explain to your friend how a program chooses and repeats, and how you can be sure of what a
      loop computes. Cover how `if`, `elif` and `else` choose which block runs, how a `while` loop
      decides whether to run again, how a running total or a count is built up, and why the puzzle's
      loop prints 10, using its invariant.
    answer:
      type: text
      rubric:
        - { id: conditions, criterion: 'Says that a condition is a test whose value is `True` or `False`, that `if` runs its block only when its test is `True`, and that in a chain of `if`, `elif` and `else` only the first block whose test is `True` runs.' }
        - { id: while, criterion: 'Explains that a `while` loop checks its test before every pass, and only then, and stops at the first check where the test is `False`, so something in the loop must move the test towards `False`.' }
        - { id: accumulator, criterion: 'Describes an accumulator, such as a running total or a count: a name set once before the loop and updated on every pass, which after the loop holds the result over all the passes.' }
        - { id: invariant, criterion: 'Names the invariant of the puzzle''s loop, that `lr` times 2 to the power `halvings` stays 1, and explains why each pass keeps it: halving `lr` and doubling the power cancel out.' }
        - { id: answer, criterion: 'Puts the invariant and the failed test together: the loop stops at the first number of halvings h with 2^h at least 1,000, and 2^10 = 1,024 is the first, so it prints 10.' }
      reference: >-
        A program normally runs each line once, from the top, but it can also choose and repeat. To
        choose, it uses a condition, a test such as step < 1000 whose value is True or False. An if
        statement runs its indented block only when its test is True. A chain of if, elif and else
        tries the tests from the top and runs just one block, the first whose test is True, or the
        else block if none is, so when the tests overlap their order matters. To repeat, a while loop
        checks its test before every pass, and only then. If the test is True it runs its block and
        checks again; at the first check where the test is False it stops. So something in the block
        has to move the test towards False, or the loop never ends. A for loop runs its block once
        for each number in a range: range(1, 5) is 1, 2, 3 and 4. A running total is a name set to 0
        before the loop, and each pass adds the next number to it; a count adds 1 whenever a test
        holds. After the loop it holds the result over every pass. In the puzzle, lr starts at 1 and
        halvings at 0, and each pass halves lr and adds 1 to halvings. So lr times 2 to the power
        halvings is 1 before the loop and stays 1, because halving one factor and doubling the other
        cancel out. That is the loop's invariant, and it says lr is 1 over 2 to the power halvings at
        every check. The loop stops at the first check where lr > 0.001 is False, which is the first
        h with 2^h at least 1,000. 2^9 is 512 and 2^10 is 1,024, so it stops after 10 halvings and
        prints 10.
      minWords: 100
      maxWords: 400
