exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-halvings
    phase: puzzle
    kind: predict
    concept: E1.2/loops
    title: How many halvings
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: nine, label: '`9`' }
        - { id: ten, label: '`10`' }
        - { id: eleven, label: '`11`' }
        - { id: never, label: 'Nothing: `lr` never lands exactly on 0.001, so the loop never stops' }
      correct: [ten]
    explanation: >-
      Each pass halves `lr`. After 9 passes it is about 0.00195, still above 0.001, so the loop runs
      once more. After 10 it is about 0.000977, the check `lr > 0.001` gives `False` at last, and the
      program prints 10. The loop never needs `lr` to land exactly on 0.001: it stops as soon as `lr`
      is no longer above it.

  # Recall ---------------------------------------------------------------------
  - id: recall-reassign
    phase: recall
    kind: recall
    concept: E1.1/variables-as-names
    prompt: |
      What does `x` refer to once these three lines have run?

      ```python
      x = 5
      x = x + 3
      x = x * 2
      ```
    answer: { type: number, value: 16, tolerance: { abs: 0 } }
    explanation: >-
      Line 2 works out `x + 3` with `x` as 5 and makes `x` refer to 8. Line 3 works out `x * 2` with
      `x` as 8, so `x` ends as 16.

  - id: recall-remainder
    phase: recall
    kind: recall
    concept: E1.1/values-and-types
    prompt: What is `1050 % 100`?
    answer: { type: number, value: 50, tolerance: { abs: 0 } }
    explanation: '$1{,}050 = 10 \times 100 + 50$, so the remainder, `1050 % 100`, is 50.'

  - id: recall-bool-type
    phase: recall
    kind: recall
    concept: E1.1/values-and-types
    prompt: What is the type of the value of `0.5 + 0.25 == 0.75`?
    answer:
      type: choice
      options:
        - { id: float, label: '`float`' }
        - { id: int, label: '`int`' }
        - { id: str, label: '`str`' }
        - { id: bool, label: '`bool`' }
      correct: [bool]
    explanation: >-
      `==` asks whether two values are equal and answers `True` or `False`, a `bool`. The sum is
      worked out first and compared after; here the answer is `True`, since 0.5, 0.25 and 0.75 are
      all held exactly.

  - id: recall-float-equal
    phase: recall
    kind: recall
    concept: E1.1/floats-are-approximate
    prompt: What does `print(0.1 + 0.2 == 0.3)` show?
    answer:
      type: choice
      options:
        - { id: shows-true, label: '`True`' }
        - { id: shows-false, label: '`False`' }
        - { id: error, label: 'Python stops with an error' }
      correct: [shows-false]
    explanation: >-
      The floats for 0.1 and 0.2 are each a little more than the decimals, and their sum lands one
      float above the float for 0.3. `==` asks for an exact match, so it says `False`.

  # Explore --------------------------------------------------------------------
  - id: explore-boundary
    phase: explore
    kind: predict
    concept: E1.2/conditions
    title: Step 10,000
    placement: true
    prompt: The person types `10000`. What does the script print?
    answer:
      type: choice
      options:
        - { id: warm, label: '`0.01`, from the warm-up formula' }
        - { id: steady, label: '`0.001`' }
        - { id: late, label: '`0.0001`' }
        - { id: nothing, label: 'Nothing, since no test is `True`' }
      correct: [late]
    explanation: >-
      `10000 < 1000` is `False`, and so is `10000 < 10000`, since no number is less than itself. With
      both tests `False`, the `else` block runs and makes `lr` refer to 0.0001.
    review:
      variants:
        - prompt: >-
            In the warm-up schedule, the person types `999`. What does the script print? It runs
            `if step < 1000:` with `lr = 0.001 * step / 1000`, then `elif step < 10000:` with
            `lr = 0.001`, then `else:` with `lr = 0.0001`.
          answer: { type: number, value: 0.000999, tolerance: { rel: 1e-9 } }
          explanation: >-
            `999 < 1000` is `True`, so the first block runs: $0.001 \times 999 / 1{,}000 = 0.000999$.
            The other tests are never tried.
        - prompt: |
            What does this program print?

            ```python
            x = 7
            if x % 2 == 0:
                print("even")
            else:
                print("odd")
            ```
          answer:
            type: choice
            options:
              - { id: even, label: '`even`' }
              - { id: odd, label: '`odd`' }
              - { id: both, label: '`even`, then `odd`' }
              - { id: nothing, label: 'Nothing' }
            correct: [odd]
          explanation: >-
            `7 % 2` is 1, so `7 % 2 == 0` is `False`, and the `else` block prints `odd`. Exactly one
            of the two blocks runs.
        - prompt: |
            What does this program print?

            ```python
            loss = 2.5
            if loss < 1:
                grade = "good"
            elif loss < 3:
                grade = "fair"
            elif loss < 2:
                grade = "close"
            else:
                grade = "poor"
            print(grade)
            ```
          answer:
            type: choice
            options:
              - { id: close, label: '`close`' }
              - { id: poor, label: '`poor`' }
              - { id: fair, label: '`fair`' }
              - { id: good, label: '`good`' }
            correct: [fair]
          explanation: >-
            `2.5 < 1` is `False` and `2.5 < 3` is `True`, so `grade` becomes `"fair"` and the rest of
            the chain is skipped. The `close` block can never run at all: any loss below 2 is also
            below 3, and the test before it catches it first.

  - id: explore-reorder
    phase: explore
    kind: predict
    concept: E1.2/conditions
    title: The tests the other way round
    prompt: The person types `500`. What does the reordered script print?
    answer:
      type: choice
      options:
        - { id: narrow, label: '`0.0005`, since Python picks the narrowest test that fits' }
        - { id: late, label: '`0.0001`' }
        - { id: steady, label: '`0.001`' }
        - { id: both, label: '`0.0005`, since both tests are `True` and the second block runs after the first' }
      correct: [steady]
    explanation: >-
      `500 < 10000` is `True`, so the first block runs and makes `lr` refer to 0.001, and Python
      skips the rest of the chain. Only the first test that is `True` counts, so the warm-up block
      can now never run, for any step.

  - id: explore-logged
    phase: explore
    kind: predict
    concept: E1.2/conditions
    title: When the loss is printed
    prompt: For which of these steps is `step >= 1000 and step % 100 == 0` `True`? Choose every one.
    answer:
      type: choice
      multiple: true
      options:
        - { id: s900, label: '900' }
        - { id: s1000, label: '1,000' }
        - { id: s1050, label: '1,050' }
        - { id: s2300, label: '2,300' }
        - { id: s10000, label: '10,000' }
      correct: [s1000, s2300, s10000]
    explanation: >-
      Both parts must be `True`. 900 is a multiple of 100 but comes before step 1,000, and 1,050 is
      past 1,000 but leaves a remainder of 50. 1,000, 2,300 and 10,000 pass both parts.

  - id: explore-short-circuit
    phase: explore
    kind: predict
    concept: E1.2/conditions
    title: A guard in front
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: error, label: 'Nothing: Python stops with `ZeroDivisionError`' }
        - { id: shows-false, label: '`False`' }
        - { id: shows-true, label: '`True`' }
        - { id: zero, label: '`0`' }
      correct: [shows-false]
    explanation: >-
      `count > 0` is `False`, and `False and` anything is `False`, so Python stops there and never
      works out `100 / count`. The division by zero never happens, and the program prints `False`.
    review:
      variants:
        - prompt: |
            What does this program print?

            ```python
            x = 0
            print(x == 0 or 10 / x > 1)
            ```
          answer:
            type: choice
            options:
              - { id: shows-true, label: '`True`' }
              - { id: shows-false, label: '`False`' }
              - { id: error, label: 'Nothing: Python stops with `ZeroDivisionError`' }
            correct: [shows-true]
          explanation: >-
            `x == 0` is `True`, and `True or` anything is `True`, so Python stops there and never
            works out `10 / x`.
        - prompt: What does `print(not 3 > 5)` show?
          answer:
            type: choice
            options:
              - { id: error, label: 'Python stops with an error' }
              - { id: shows-false, label: '`False`' }
              - { id: shows-true, label: '`True`' }
            correct: [shows-true]
          explanation: >-
            `not` comes after the comparison, so this is `not (3 > 5)`, which is `not False`, which is
            `True`.
        - prompt: What does `print(1 < 2 and 2 < 1 or 3 < 4)` show?
          answer:
            type: choice
            options:
              - { id: shows-false, label: '`False`' }
              - { id: shows-true, label: '`True`' }
            correct: [shows-true]
          explanation: >-
            `and` comes before `or`, so this is `(1 < 2 and 2 < 1) or 3 < 4`, which is
            `False or True`, which is `True`.

  - id: explore-never-ends
    phase: explore
    kind: predict
    concept: E1.2/loops
    title: A loop that steps over its stop
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: zero, label: '`0`' }
        - { id: minus-two, label: '`-2`' }
        - { id: one, label: '`1`' }
        - { id: never, label: 'Nothing: the loop never stops' }
      correct: [never]
    explanation: >-
      `x` goes 10, 7, 4, 1, $-2$, $-5$ and on for ever. It steps over 0 without landing on it, so
      `x != 0` is `True` at every check and the loop never stops.

  - id: explore-halve-count
    phase: explore
    kind: predict
    concept: E1.2/loops
    title: Halving a whole number
    placement: true
    prompt: What does the program print?
    answer: { type: number, value: 6, tolerance: { abs: 0 } }
    explanation: >-
      `n` goes 100, 50, 25, 12, 6, 3, 1, since `//` rounds down: `25 // 2` is 12 and `3 // 2` is 1.
      That is 6 passes, and at the next check `1 > 1` is `False`, so the program prints 6.
    review:
      variants:
        - prompt: |
            What does this program print?

            ```python
            n = 1
            count = 0
            while n < 50:
                n = n * 3
                count = count + 1
            print(count)
            ```
          answer: { type: number, value: 4, tolerance: { abs: 0 } }
          explanation: >-
            `n` goes 1, 3, 9, 27, 81, so the loop makes 4 passes, and at the next check `81 < 50` is
            `False`.
        - prompt: |
            What does this program print?

            ```python
            x = 20
            while x > 0:
                x = x - 6
            print(x)
            ```
          answer: { type: number, value: -4, tolerance: { abs: 0 } }
          explanation: >-
            `x` goes 20, 14, 8, 2, then $-4$. `-4 > 0` is `False`, so the loop stops, and the program
            prints $-4$.
        - prompt: |
            How many times does the block of this loop run?

            ```python
            k = 10
            while k < 10:
                k = k + 1
            ```
          answer: { type: number, value: 0, tolerance: { abs: 0 } }
          explanation: >-
            The test is checked before the first pass, and `10 < 10` is `False`, so the block never
            runs at all.

  - id: explore-range
    phase: explore
    kind: predict
    concept: E1.2/loops
    title: Counting a range
    prompt: How many times does the block of `for k in range(3, 10):` run?
    answer: { type: number, value: 7, tolerance: { abs: 0 } }
    explanation: >-
      `k` takes the values 3, 4, 5, 6, 7, 8 and 9, which is 7 values. The end, 10, is left out, so
      `range(a, b)` always has $b - a$ values.
    review:
      variants:
        - prompt: How many times does the block of `for i in range(10):` run?
          answer: { type: number, value: 10, tolerance: { abs: 0 } }
          explanation: '`range(10)` is 0 up to 9, which is 10 values.'
        - prompt: What is the last value that `k` takes in `for k in range(1, 100):`?
          answer: { type: number, value: 99, tolerance: { abs: 0 } }
          explanation: The end of a range is left out, so `k` runs from 1 up to 99.
        - prompt: >-
            A run of training numbers its steps from 1 to 500. Which range gives exactly those
            steps?
          answer:
            type: choice
            options:
              - { id: r500, label: '`range(500)`' }
              - { id: r1-500, label: '`range(1, 500)`' }
              - { id: r1-501, label: '`range(1, 501)`' }
              - { id: r0-501, label: '`range(0, 501)`' }
            correct: [r1-501]
          explanation: >-
            `range(1, 501)` starts at 1 and leaves out 501, so it ends at 500. `range(500)` is 0 to
            499, `range(1, 500)` stops at 499, and `range(0, 501)` adds a step 0.

  - id: explore-count-multiples
    phase: explore
    kind: predict
    concept: E1.2/accumulator-pattern
    title: Counting multiples of 7
    placement: true
    prompt: What does the program print?
    answer: { type: number, value: 142, tolerance: { abs: 0 } }
    explanation: >-
      `count` grows by 1 for each multiple of 7 from 1 to 1,000: 7, 14, and so on up to
      $142 \times 7 = 994$, since $143 \times 7 = 1{,}001$ is past the end. So the program prints 142,
      which is also `1000 // 7`.
    review:
      variants:
        - prompt: |
            What does this program print?

            ```python
            total = 0
            for k in range(1, 6):
                total = total + k * k
            print(total)
            ```
          answer: { type: number, value: 55, tolerance: { abs: 0 } }
          explanation: '$1 + 4 + 9 + 16 + 25 = 55$.'
        - prompt: |
            What does this program print?

            ```python
            product = 1
            for k in range(1, 5):
                product = product * k
            print(product)
            ```
          answer: { type: number, value: 24, tolerance: { abs: 0 } }
          explanation: >-
            $1 \times 1 \times 2 \times 3 \times 4 = 24$. A product starts at 1, not 0, since
            multiplying by 1 changes nothing.
        - prompt: |
            What does this program print?

            ```python
            for k in range(1, 4):
                total = 0
                total = total + k
            print(total)
            ```
          answer: { type: number, value: 3, tolerance: { abs: 0 } }
          explanation: >-
            Every pass sets `total` back to 0 before adding, so it ends with only the last value, 3.
            A total must be set once, before the loop.

  - id: explore-invariant-product
    phase: explore
    kind: predict
    concept: E1.2/loop-invariants
    title: What every pass keeps
    placement: true
    prompt: >-
      In the puzzle's loop, what is `lr * 2 ** halvings` before the first pass, and after each
      pass?
    answer: { type: number, value: 1, tolerance: { abs: 0 } }
    explanation: >-
      Before the first pass it is $1.0 \times 2^0 = 1$. Each pass halves `lr` and doubles
      `2 ** halvings`, so the product stays 1: $0.5 \times 2 = 1$, then $0.25 \times 4 = 1$, and so
      on, up to $\frac{1}{1{,}024} \times 1{,}024 = 1$ after the last pass.
    review:
      variants:
        - prompt: |
            In this loop, what is `x + y` before the first pass, and after each pass?

            ```python
            x = 10
            y = 0
            while x > 0:
                x = x - 1
                y = y + 1
            ```
          answer: { type: number, value: 10, tolerance: { abs: 0 } }
          explanation: >-
            Each pass takes 1 from `x` and adds 1 to `y`, so `x + y` stays 10 throughout. When the
            loop stops, `x` is 0, so the invariant says that `y` is 10.
        - prompt: |
            In this loop, `total` is `k * k` after the pass for any `k`. What does the program print?

            ```python
            total = 0
            for k in range(1, 11):
                total = total + 2 * k - 1
            print(total)
            ```
          answer: { type: number, value: 100, tolerance: { abs: 0 } }
          explanation: >-
            The last pass is the one for `k` equal to 10, so the invariant says that `total` ends as
            $10 \times 10 = 100$, with no need to add up the odd numbers $1 + 3 + \dots + 19$ one by
            one.
        - prompt: |
            Which of these is true before the first pass of this loop, and after every pass?

            ```python
            n = 0
            s = 0
            while n < 4:
                n = n + 1
                s = s + n
            ```
          answer:
            type: choice
            options:
              - { id: equal, label: '`s == n`' }
              - { id: triangle, label: '`s == n * (n + 1) // 2`' }
              - { id: less, label: '`s < n`' }
              - { id: double, label: '`s == 2 * n`' }
            correct: [triangle]
          explanation: >-
            `n` and `s` go (0, 0), (1, 1), (2, 3), (3, 6), (4, 10), and $\frac{n(n+1)}{2}$ matches
            every pair. `s == n` holds only for the first two, and the others fail at once.

  # Derive ---------------------------------------------------------------------
  - id: derive-halving-proof
    phase: derive
    kind: proof
    concept: E1.2/loop-invariants
    title: Why the loop prints 10
    prompt: >-
      Each line follows from the one before. Choose the rule that justifies each line. A rule may
      be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: invariant, name: Invariant, label: 'A statement that is true before the first pass and that every pass keeps true is true at every check.' }
        - { id: stop, name: The loop stops, label: 'A `while` loop stops at the first check where its test is `False`.' }
        - { id: range-count, name: Counting a range, label: 'A `for` loop over `range(a, b)` makes $b - a$ passes.' }
        - { id: work-out, name: Work it out, label: 'Work out a power, a product or a comparison of known numbers.' }
        - { id: rearrange, name: Rearrange, label: 'Multiply or divide both sides by the same positive number.' }
        - { id: exponent, name: Exponent rule, label: '$2^{h+1} = 2 \times 2^{h}$, so halving one factor of a product and doubling the other leaves the product unchanged.' }
      start: '\text{Before the first pass, } \texttt{lr} = 1 \text{ and } h = 0.'
      lines:
        - math: '\texttt{lr} \times 2^{h} = 1 \times 2^{0} = 1 \text{ before the first pass}'
          rule: work-out
        - math: '\tfrac{\texttt{lr}}{2} \times 2^{h+1} = \texttt{lr} \times 2^{h} \text{, so each pass keeps } \texttt{lr} \times 2^{h} \text{ as it was}'
          rule: exponent
        - math: '\texttt{lr} \times 2^{h} = 1 \text{ at every check}'
          rule: invariant
        - math: '\texttt{lr} = \tfrac{1}{2^{h}} \text{ at every check}'
          rule: rearrange
        - math: '\texttt{lr > 0.001} \text{ is False exactly when } 2^{h} \ge 1{,}000'
          rule: rearrange
        - math: '2^{9} = 512 < 1{,}000 \le 1{,}024 = 2^{10}'
          rule: work-out
        - math: '\text{The loop stops with } h = 10 \text{, and the program prints 10.}'
          rule: stop
    explanation: >-
      The product starts at $1 \times 2^0 = 1$, and each pass keeps it, since
      $\frac{\texttt{lr}}{2} \times 2^{h+1} = \texttt{lr} \times 2^h$. So it is 1 at every check, and
      `lr` is $\frac{1}{2^h}$. The test fails exactly when $2^h \ge 1{,}000$, and the first power of two
      that large is $2^{10} = 1{,}024$, so the loop stops with $h = 10$. The rule for counting a range
      is never needed, since this is a `while` loop.

  - id: derive-decay-invariant
    phase: derive
    kind: step
    concept: E1.2/loop-invariants
    title: The invariant of a shrinking rate
    prompt: >-
      At every check, `lr` is equal to an expression in $a$, $r$ and $h$, the value of `passes`.
      Write it.
    answer:
      type: expression
      symbols:
        - { name: a, positive: true }
        - { name: r, positive: true }
        - { name: h, integer: true }
      lhs: '\texttt{lr} ='
      reference: a*r**h
      accept: ['a*r^h', 'r^h*a', 'a r^h']
      reject: ['a*r', 'a*r^(h - 1)', 'a*r^(h + 1)', 'a*h*r', 'a + h*r', 'r^h', 'a^h*r', 'a/r^h', 'a*(1 - r)^h']
    explanation: >-
      Before the first pass, `lr` is $a = a r^0$. Each pass multiplies `lr` by $r$ and adds 1 to $h$,
      and $a r^h \times r = a r^{h+1}$, so $\texttt{lr} = a r^h$ stays true at every check.

  - id: derive-floor-estimate
    phase: derive
    kind: estimate
    concept: E1.2/loop-invariants
    title: A floor of one billionth
    prompt: >-
      Starting from 1.0 and halving, about how many halvings does it take for the rate to fall to
      $10^{-9}$ or below? Reason from $2^{10} = 1{,}024$. An answer within a factor of 1.2 counts.
    answer: { type: number, value: 30, tolerance: { factor: 1.2 } }
    explanation: >-
      $10^{-9}$ is $10^{-3} \times 10^{-3} \times 10^{-3}$, and each factor of $10^{-3}$ takes about 10
      halvings, so it takes about 30. In fact exactly 30: $2^{30} = 1{,}073{,}741{,}824$ is the first
      power of two past $10^9$, since $2^{29} = 536{,}870{,}912$ falls short.

  - id: derive-sum-step
    phase: derive
    kind: step
    concept: E1.2/accumulator-pattern
    covers: [E1.2/loop-invariants]
    title: The next pass of the total
    prompt: >-
      After the pass for $k$, `total` is $\frac{k(k+1)}{2}$, and the next pass adds $k + 1$. Write the
      new `total` as one fraction with its top factored, in the same shape as $\frac{k(k+1)}{2}$.
    answer:
      type: expression
      symbols:
        - { name: k, integer: true }
      lhs: '\texttt{total} ='
      reference: (k + 1)*(k + 2)/2
      accept: ['(k + 2)(k + 1)/2', '(k+1)*(k+2)/2']
      reject: ['k*(k + 1)/2 + k + 1', '(k^2 + 3*k + 2)/2', 'k*(k + 1)/2', '(k + 1)^2/2', 'k*(k + 1)/2 + 1', '(k + 1)*(k + 2)']
      form:
        factored: true
        message: >-
          That is the right value. Now write it as one fraction with its top factored, like
          $\frac{k(k+1)}{2}$, so that its shape can be compared with the claim.
    explanation: >-
      $\frac{k(k+1)}{2} + (k + 1) = \frac{k(k+1) + 2(k+1)}{2} = \frac{(k+1)(k+2)}{2}$, which is the
      claim with $k + 1$ in place of $k$.

  # Build ----------------------------------------------------------------------
  - id: build-clip
    phase: build
    kind: build
    concept: E1.2/conditions
    title: Clipping a gradient
    prompt: >-
      The script reads one value of a gradient, typed by whoever runs it. Add an `if` chain that
      makes `clipped` refer to 1.0 when `g` is above 1, to -1.0 when `g` is below -1, and to `g`
      itself otherwise. The tests type other gradients too, including -1 and 1 exactly.
    answer:
      type: code
      stdin: ["2.5"]
      starter: |
        g = float(input())    # the person types 2.5

        # Make clipped refer to 1.0 if g is above 1, to -1.0 if g is below -1,
        # and to g itself otherwise.

        print("clipped gradient:", clipped)
      tests: |
        def test_typed():
            """For a gradient of 2.5, clipped is 1."""
            assert clipped == 1, f"For a gradient of 2.5, clipped is {clipped!r}, but anything above 1 becomes 1."

        def test_below():
            """For a gradient of -3, clipped is -1."""
            names, printed = rerun("-3")
            assert names["clipped"] == -1, f"Typing -3, clipped is {names['clipped']!r}, but anything below -1 becomes -1."

        def test_inside():
            """A gradient between -1 and 1 is left alone."""
            for typed in ["0.3", "-0.75", "0"]:
                names, printed = rerun(typed)
                assert names["clipped"] == float(typed), f"Typing {typed}, clipped is {names['clipped']!r}, but a gradient between -1 and 1 is left alone."

        def test_edges():
            """A gradient of exactly 1 or -1 is left as it is."""
            for typed in ["1", "-1"]:
                names, printed = rerun(typed)
                assert names["clipped"] == float(typed), f"Typing {typed}, clipped is {names['clipped']!r}, but {typed} is already inside the range."
      reference: |
        g = float(input())    # the person types 2.5

        if g > 1:
            clipped = 1.0
        elif g < -1:
            clipped = -1.0
        else:
            clipped = g

        print("clipped gradient:", clipped)
      wrong:
        - code: |
            g = float(input())    # the person types 2.5

            if g > 1:
                clipped = 1.0
            else:
                clipped = g

            print("clipped gradient:", clipped)
          why: Clips only from above, so a gradient of -3 passes straight through.
        - code: |
            g = float(input())    # the person types 2.5

            if g > 1:
                clipped = 1.0
            elif g < -1:
                clipped = -1.0

            print("clipped gradient:", clipped)
          why: Has no `else`, so for a gradient between -1 and 1 `clipped` is never set, and the program stops with a `NameError`.
        - code: |
            g = float(input())    # the person types 2.5

            if g > 1:
                clipped = 1.0
            elif g > -1:
                clipped = -1.0
            else:
                clipped = g

            print("clipped gradient:", clipped)
          why: Tests `g > -1` for the lower clip, which is `True` for every gradient inside the range, so they all become -1.
        - code: |
            g = float(input())    # the person types 2.5

            if g > 1:
                clipped = 1.0
            if g < -1:
                clipped = -1.0
            else:
                clipped = g

            print("clipped gradient:", clipped)
          why: >-
            Starts a new chain with the second `if`, so its `else` belongs to that test alone and
