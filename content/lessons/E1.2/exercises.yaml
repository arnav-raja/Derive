  - id: build-steps
    phase: build
    kind: build
    concept: E1.2/loops
    covers: [E1.2/accumulator-pattern]
    title: Steps to a target loss
    prompt: >-
      The loss starts at 4.0, and each step of training multiplies it by 0.9. The script reads a
      target. Write a `while` loop that takes steps for as long as the loss is above the target, so
      that afterwards `steps` is the number of steps taken and `loss` is the loss reached. The tests
      type other targets too.
    answer:
      type: code
      stdin: ["1.0"]
      starter: |
        target = float(input())    # the person types 1.0
        loss = 4.0
        steps = 0

        # While the loss is above the target, take a step: multiply the loss
        # by 0.9 and add 1 to steps.

        print(steps, "steps to a loss of", loss)
      tests: |
        def test_typed():
            """A target of 1.0 takes 14 steps."""
            assert steps == 14, f"For a target of 1.0, steps is {steps}, but it should be 14."
            assert loss <= 1.0, f"loss is {loss}, which is still above the target of 1.0."

        def test_other_targets():
            """Targets of 2.0 and 0.1 take 7 and 36 steps."""
            for typed, expected in [("2.0", 7), ("0.1", 36)]:
                names, printed = rerun(typed)
                assert names["steps"] == expected, f"Typing {typed}, steps is {names['steps']}, but it should be {expected}."

        def test_already_there():
            """A target above 4.0 takes no steps."""
            names, printed = rerun("5")
            assert names["steps"] == 0, f"Typing 5, steps is {names['steps']}, but the loss starts at 4.0, already below the target."
            assert names["loss"] == 4.0, f"Typing 5, loss is {names['loss']}, but with no step taken it should still be 4.0."
      reference: |
        target = float(input())    # the person types 1.0
        loss = 4.0
        steps = 0

        while loss > target:
            loss = loss * 0.9
            steps = steps + 1

        print(steps, "steps to a loss of", loss)
      wrong:
        - code: |
            target = float(input())    # the person types 1.0
            loss = 4.0
            steps = 0

            if loss > target:
                loss = loss * 0.9
                steps = steps + 1

            print(steps, "steps to a loss of", loss)
          why: Uses `if`, which runs its block at most once, so it takes at most one step.
        - code: |
            target = float(input())    # the person types 1.0
            loss = 4.0
            steps = 0

            while loss > target:
                loss = loss * 0.9

            print(steps, "steps to a loss of", loss)
          why: Never adds to `steps`, which stays 0.
        - code: |
            target = float(input())    # the person types 1.0
            loss = 4.0
            steps = 0

            while loss > target:
                steps = 0
                loss = loss * 0.9
                steps = steps + 1

            print(steps, "steps to a loss of", loss)
          why: Sets `steps` back to 0 on every pass, so it ends as 1.
        - code: |
            target = float(input())    # the person types 1.0
            loss = 4.0
            steps = 0

            while loss < target:
                loss = loss * 0.9
                steps = steps + 1

            print(steps, "steps to a loss of", loss)
          why: >-
            Tests `loss < target`, which is `False` at once for a target below 4.0, so no step is
            taken; for a target above 4.0 the loop never stops.
    explanation: >-
      `while loss > target:` checks before every step, so the loop stops at the first check where
      the loss is at or below the target, and a target above 4.0 takes no steps at all.

  - id: build-best-loss
    phase: build
    kind: build
    concept: E1.2/accumulator-pattern
    covers: [E1.2/conditions, E1.2/loops]
    title: The best loss so far
    prompt: >-
      The script reads `n`, the number of steps, then the loss at each step, one per line. Make
      `best` refer to the lowest loss and `best_step` to the step at which it came, counting the
      first step as 1. If the lowest loss comes more than once, keep the earliest step. The tests
      type other losses too.
    answer:
      type: code
      stdin: ["5", "2.31", "1.87", "1.92", "1.64", "1.70"]
      starter: |
        n = int(input())    # the person types 5, then 2.31, 1.87, 1.92, 1.64 and 1.70, one per line

        # Read the loss at each step with float(input()), one step at a time,
        # and keep the lowest loss so far in best and its step in best_step.

        print("best loss", best, "at step", best_step)
      tests: |
        def test_typed():
            """For the five typed losses, the best is 1.64, at step 4."""
            assert best == 1.64, f"best is {best!r}, but the lowest of the five losses is 1.64."
            assert best_step == 4, f"best_step is {best_step!r}, but 1.64 came at step 4."

        def test_first_is_best():
            """When the first loss is the lowest, best_step is 1."""
            names, printed = rerun("3", "0.5", "0.9", "0.7")
            assert names["best"] == 0.5 and names["best_step"] == 1, (
                f"Typing the losses 0.5, 0.9 and 0.7, best is {names['best']!r} and best_step is "
                f"{names['best_step']!r}, not 0.5 and 1."
            )

        def test_last_is_best():
            """When the last loss is the lowest, best_step is n."""
            names, printed = rerun("4", "2.0", "1.5", "1.2", "0.8")
            assert names["best"] == 0.8 and names["best_step"] == 4, (
                f"Typing the losses 2.0, 1.5, 1.2 and 0.8, best is {names['best']!r} and best_step is "
                f"{names['best_step']!r}, not 0.8 and 4."
            )

        def test_tie():
            """A tie keeps the earliest step."""
            names, printed = rerun("4", "1.0", "0.6", "0.9", "0.6")
            assert names["best_step"] == 2, (
                f"Typing the losses 1.0, 0.6, 0.9 and 0.6, best_step is {names['best_step']!r}, but the "
                f"lowest loss, 0.6, came first at step 2."
            )

        def test_one_step():
            """With a single step, that step is the best."""
            names, printed = rerun("1", "3.3")
            assert names["best"] == 3.3 and names["best_step"] == 1, (
                f"Typing a single loss, 3.3, best is {names['best']!r} and best_step is "
                f"{names['best_step']!r}, not 3.3 and 1."
            )
      reference: |
        n = int(input())    # the person types 5, then 2.31, 1.87, 1.92, 1.64 and 1.70, one per line

        best = float(input())
        best_step = 1
        for step in range(2, n + 1):
            loss = float(input())
            if loss < best:
                best = loss
                best_step = step

        print("best loss", best, "at step", best_step)
      wrong:
        - code: |
            n = int(input())    # the person types 5, then 2.31, 1.87, 1.92, 1.64 and 1.70, one per line

            best = float(input())
            best_step = 1
            for step in range(2, n + 1):
                loss = float(input())
                if loss <= best:
                    best = loss
                    best_step = step

            print("best loss", best, "at step", best_step)
          why: Uses `<=`, so a later loss equal to the best replaces it, and a tie keeps the later step.
        - code: |
            n = int(input())    # the person types 5, then 2.31, 1.87, 1.92, 1.64 and 1.70, one per line

            best = float(input())
            best_step = 1
            for step in range(2, n):
                loss = float(input())
                if loss < best:
                    best = loss
                    best_step = step

            print("best loss", best, "at step", best_step)
          why: Its range stops one step early, so the last loss is never read.
        - code: |
            n = int(input())    # the person types 5, then 2.31, 1.87, 1.92, 1.64 and 1.70, one per line

            best = float(input())
            best_step = 1
            for step in range(2, n + 1):
                loss = float(input())
                if loss < best:
                    best = loss

            print("best loss", best, "at step", best_step)
          why: Updates `best` but not `best_step`, which stays at 1.
        - code: |
            n = int(input())    # the person types 5, then 2.31, 1.87, 1.92, 1.64 and 1.70, one per line

            best = 0
            best_step = 0
            for step in range(1, n + 1):
                loss = float(input())
                if loss < best:
                    best = loss
                    best_step = step

            print("best loss", best, "at step", best_step)
          why: Starts `best` at 0, as for a total, but no loss is below 0, so none ever replaces it.
    explanation: >-
      Reading the first loss before the loop gives `best` a real starting value, and the loop from
      step 2 to `n` compares each later loss with it. `<` replaces the best only when a loss is
      strictly lower, so a tie keeps the earlier step.

  - id: build-break-never
    phase: build
    kind: breakit
    concept: E1.2/loops
    title: Waiting for an exact floor
    prompt: Predict what happens after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        lr = 1.0
        halvings = 0
        while lr > 0.001:
            lr = lr / 2
            halvings = halvings + 1
        print(halvings)
      broken: |
        lr = 1.0
        halvings = 0
        while lr != 0.001:
            lr = lr / 2
            halvings = halvings + 1
        print(halvings)
      change: '`lr > 0.001` becomes `lr != 0.001`: keep halving until `lr` is exactly the floor.'
      options:
        - { id: ten, label: 'It still prints `10`', when: "output.strip() == '10'" }
        - { id: nine, label: 'It prints `9`, one fewer', when: "output.strip() == '9'" }
        - { id: other, label: 'It prints some other number', when: "error is None and output.strip() not in ('9', '10')" }
        - { id: never, label: 'The loop never stops, so the program is stopped for running too long', when: "error == 'StepLimit'" }
        - { id: error, label: 'Python stops with some other error', when: "error is not None and error != 'StepLimit'" }
    explanation: >-
      `lr` goes from about 0.00195 straight to about 0.000977, past 0.001 without ever equalling it,
      so `lr != 0.001` stays `True` at every check, and the loop never stops.

  - id: build-sum-fencepost
    phase: build
    kind: debug
    concept: E1.2/loops
    covers: [E1.2/accumulator-pattern]
    title: A total one short
    prompt: >-
      This script should add up the whole numbers from 1 to `n`, and the person types 100. Run it:
      the loop's total is 4,950, but Python's `sum` says 5,050. Fix the loop so that the two agree
      for every `n`. The tests type other values of `n` too, including 0.
    answer:
      type: code
      stdin: ["100"]
      starter: |
        n = int(input())    # the person types 100
        total = 0
        k = 1
        while k < n:
            total = total + k
            k = k + 1
        print("the loop's total:", total)
        print("Python's sum:    ", sum(range(1, n + 1)))
      tests: |
        def test_typed():
            """For n = 100, total is 5,050."""
            assert total == 5050, f"For n = 100, total is {total:,}, but 1 + 2 + ... + 100 is 5,050."

        def test_small():
            """For n = 1 and n = 4, total is 1 and 10."""
            for typed, expected in [("1", 1), ("4", 10)]:
                names, printed = rerun(typed)
                assert names["total"] == expected, f"Typing {typed}, total is {names['total']}, but it should be {expected}."

        def test_zero():
            """For n = 0 there is nothing to add, so total is 0."""
            names, printed = rerun("0")
            assert names["total"] == 0, f"Typing 0, total is {names['total']}, but with nothing to add it should stay 0."
      reference: |
        n = int(input())    # the person types 100
        total = 0
        k = 1
        while k <= n:
            total = total + k
            k = k + 1
        print("the loop's total:", total)
        print("Python's sum:    ", sum(range(1, n + 1)))
      wrong:
        - code: |
            n = int(input())    # the person types 100
            total = 0
            k = 0
            while k < n:
                total = total + k
                k = k + 1
            print("the loop's total:", total)
            print("Python's sum:    ", sum(range(1, n + 1)))
          why: Starts `k` at 0, which adds nothing, and still stops before `n`.
        - code: |
            n = int(input())    # the person types 100
            total = 0
            k = 1
            while k <= n + 1:
                total = total + k
                k = k + 1
            print("the loop's total:", total)
            print("Python's sum:    ", sum(range(1, n + 1)))
          why: Runs one pass too many, adding `n + 1` as well.
        - code: |
            n = int(input())    # the person types 100
            total = 0
            k = 1
            while k <= n:
                k = k + 1
                total = total + k
            print("the loop's total:", total)
            print("Python's sum:    ", sum(range(1, n + 1)))
          why: Moves on to the next `k` before adding, so it adds 2 up to `n + 1` instead of 1 up to `n`.
        - code: |
            n = int(input())    # the person types 100
            total = 1
            k = 2
            while k <= n:
                total = total + k
                k = k + 1
            print("the loop's total:", total)
            print("Python's sum:    ", sum(range(1, n + 1)))
          why: Starts the total at 1, which is wrong when there is nothing to add.
    explanation: >-
      `k < n` stops before the pass for `k` equal to `n`, so `n` itself is never added. `k <= n`
      makes the last pass the one for `n`, and the total is 0 when `n` is 0.

