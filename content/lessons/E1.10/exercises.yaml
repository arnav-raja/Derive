        import random


        class Looks:
            """A sorted list that counts the different items looked at, and stops a search that looks far too often."""

            def __init__(self, items):
                self.items = items
                self.reads = 0
                self.seen = set()

            def __len__(self):
                return len(self.items)

            def __getitem__(self, i):
                assert type(i) is int, "count_between should look at single items, xs[i], not slices of the list."
                self.reads = self.reads + 1
                assert self.reads <= 1000, "count_between looked at items of a list of a million more than 1,000 times. A search by halving finds each end of the range in about 20 looks."
                self.seen.add(i)
                return self.items[i]


        def counted(given, low, high):
            """The count, worked out by looking at every item."""
