            """After adding 3, 11, 19, 27 and 13, bucket 3 holds [3, 11, 19, 27] and bucket 5 holds [13]; 19 is in the set, 35 is not, and len gives 5."""
            t = HashSet()
            for k in [3, 11, 19, 27, 13]:
