            assert t.buckets[3] == [3, 11, 19, 27], f"After adding 3, 11, 19, 27 and 13, bucket 3 holds {t.buckets[3]!r}, not [3, 11, 19, 27]."
            assert t.buckets[5] == [13], f"After adding 3, 11, 19, 27 and 13, bucket 5 holds {t.buckets[5]!r}, not [13]."
            assert len(t) == 5, f"len gives {len(t)!r} after adding five different keys, not 5."
            assert 19 in t, "19 in s gives False, though 19 was added."
            assert 35 not in t, "35 in s gives True, though 35 was never added."


