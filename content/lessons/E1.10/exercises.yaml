  - id: derive-sort-first
    phase: derive
    kind: estimate
    concept: E1.10/binary-search
    covers: [E1.10/merge-sort]
    title: When sorting first pays
    prompt: >-
      A list of a million losses, in no order, is to be searched $m$ times, each time for a loss
      that is in it. Scanning from the start finds a loss after about half a million comparisons,
      on average. Sorting first costs about 20 million comparisons, and then each search takes
      about 20 looks by binary search. About how many searches make sorting first the cheaper? An
      answer within a factor of 1.5 counts.
    answer: { type: number, value: 40, tolerance: { factor: 1.5 } }
    explanation: >-
      $m$ scans cost about $500{,}000\,m$ comparisons, and sorting first about
      $20{,}000{,}000 + 20m$. The two are equal when $m$ is about
      $\frac{20{,}000{,}000}{500{,}000} = 40$, since the $20m$ is tiny beside the rest, so beyond
      about 40 searches sorting first is cheaper.

