      starter: |
        def bisect_left(xs, x):
            """The first slot of the sorted list xs whose item is at least x, or
            len(xs) when there is none."""
            lo = 0
            hi = len(xs)
            while lo < hi:
                mid = (lo + hi) // 2
                if xs[mid] < x:
                    lo = mid
                else:
                    hi = mid
            return lo


        print(bisect_left([10, 20, 30], 25))
      tests: |
        import bisect
        import random


        class Looks:
            """A sorted list that counts the different items looked at, and stops a search that looks far too often."""

            def __init__(self, items):
                self.items = items
                self.reads = 0
                self.seen = set()

            def __len__(self):
                return len(self.items)

            def __getitem__(self, i):
                self.reads = self.reads + 1
                assert self.reads <= 100, "bisect_left looked at items of a list of a million more than 100 times, where halving needs about 20. Check that every pass makes the gap hi - lo smaller."
                self.seen.add(i)
                return self.items[i]


        def test_example():
            """bisect_left([10, 20, 30], 25) is 2, the slot where 25 would go."""
            got = bisect_left([10, 20, 30], 25)
            assert got == 2, f"bisect_left([10, 20, 30], 25) gives {got!r}, not 2."


        def test_against_bisect():
            """On 300 random sorted lists of up to 10 whole numbers from 1 to 6, with many repeats, it agrees with Python's bisect.bisect_left for x from 0 to 7."""
            random.seed(6)
            for trial in range(300):
                given = []
                for k in range(random.randint(0, 10)):
                    given.append(random.randint(1, 6))
                given.sort()
                x = random.randint(0, 7)
                want = bisect.bisect_left(given, x)
                got = bisect_left(given, x)
                assert got == want, f"bisect_left({given}, {x}) gives {got!r}, not {want}."


        def test_edges():
            """An empty list gives 0, x below every item gives 0, x above every item gives len(xs), and x equal to an end gives that end's slot."""
            for given, x, want in (([], 5, 0), ([10, 20, 30], 5, 0), ([10, 20, 30], 35, 3), ([10, 20, 30], 10, 0), ([10, 20, 30], 30, 2), ([10], 5, 0)):
                got = bisect_left(given, x)
                assert got == want, f"bisect_left({given}, {x}) gives {got!r}, not {want}."


        def test_looks():
            """On a sorted list of a million even numbers it gives the right slots, looking at no more than 21 different items each time."""
            given = Looks(list(range(0, 2000000, 2)))
            for x in (-1, 0, 1, 777777, 1999998, 1999999, 3000000):
                given.reads = 0
                given.seen = set()
                got = bisect_left(given, x)
                want = bisect.bisect_left(given.items, x)
                shown = f"{got:,}" if type(got) is int else repr(got)
                assert got == want, f"In the million even numbers from 0 to 1,999,998, bisect_left gives slot {shown} for {x:,}, not {want:,}."
                looked = len(given.seen)
                assert looked <= 21, f"bisect_left looked at {looked:,} different items of a list of a million, more than 21."
      reference: |
