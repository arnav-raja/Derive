      tests: |
        import random


        class Item:
            """A loss with a tag that says where it began, compared by loss alone. Each < is counted, and any other comparison stops the test, since the sort uses only <."""
            count = 0

            def __init__(self, loss, tag):
                self.loss = loss
                self.tag = tag

            def __lt__(self, other):
                Item.count = Item.count + 1
                return self.loss < other.loss

            def __le__(self, other):
                raise AssertionError("Compare items only with <. Write a <= b as not (b < a).")

            def __gt__(self, other):
                raise AssertionError("Compare items only with <. Write a > b as b < a.")

            def __ge__(self, other):
                raise AssertionError("Compare items only with <. Write a >= b as not (a < b).")

            def __repr__(self):
                return repr(self.loss)


        def items(losses):
            """An Item for each loss, tagged 0, 1, 2 and so on, in order."""
            out = []
            for k in range(len(losses)):
                out.append(Item(losses[k], k))
            return out


        def losses_of(given):
            out = []
            for x in given:
                out.append(x.loss)
            return out


        def test_find_runs():
            """find_runs([3, 5, 2, 2, 7, 1]) gives [[3, 5], [2, 2, 7], [1]], and it handles an empty list, one item, a list that only falls, and equal items, which stay in one run."""
            cases = [
                ([3, 5, 2, 2, 7, 1], [[3, 5], [2, 2, 7], [1]]),
                ([], []),
                ([4], [[4]]),
                ([4, 3, 2, 1], [[4], [3], [2], [1]]),
                ([2, 2, 2], [[2, 2, 2]]),
            ]
            for given, want in cases:
                got = find_runs(given)
                assert got == want, f"find_runs({given}) gives {got!r}, not {want}."


        def test_small():
            """run_sort gives [] for an empty list, and [7] for a list holding the one item 7."""
            for losses in ([], [7]):
                got = run_sort(items(losses))
                assert type(got) is list, f"run_sort({losses}) gives {got!r}, not a list."
                assert losses_of(got) == losses, f"run_sort({losses}) gives {losses_of(got)}, not {losses}."


        def test_in_order():
            """A list of 1,000 items already in order is one run, so run_sort gives it back in order after 999 comparisons."""
            given = items(list(range(1000)))
            Item.count = 0
            got = run_sort(given)
            n = Item.count
            assert type(got) is list, f"run_sort gives {got!r}, not a list."
            assert len(got) == 1000, f"For 1,000 items already in order, run_sort gives {len(got):,} items, not 1,000."
            assert losses_of(got) == list(range(1000)), "run_sort gives a list that was already in order back in a different order."
            assert n == 999, f"run_sort made {n:,} comparisons on 1,000 items already in order, not 999: one for each item after the first finds that the whole list is one run, and one run needs no merging."


        def test_sorts():
            """On 300 random lists of 0 to 12 losses, each a whole number from 1 to 4 so that many are equal, run_sort gives the losses in order, each item once, and equal losses in the order they came."""
            random.seed(10)
            for trial in range(300):
                losses = []
                for k in range(random.randint(0, 12)):
                    losses.append(random.randint(1, 4))
                got = run_sort(items(losses))
                assert type(got) is list, f"run_sort({losses}) gives {got!r}, not a list."
                assert losses_of(got) == sorted(losses), f"run_sort({losses}) gives {losses_of(got)}, not {sorted(losses)}."
                tags = []
                for x in got:
                    tags.append(x.tag)
                assert sorted(tags) == list(range(len(losses))), f"run_sort({losses}) does not give back each of the items exactly once."
                for i in range(len(got) - 1):
                    if got[i].loss == got[i + 1].loss:
                        assert got[i].tag < got[i + 1].tag, f"run_sort({losses}) puts two equal losses, {got[i].loss}, the other way round from the order they came in. Of two equal items, merge takes the one from its first list, so merge each pair of runs in the order they lie in the list."


        def test_pairs():
            """On 512 shuffled losses it makes at most 5,120 comparisons: merging the runs in pairs, round after round, keeps the work close to merge sort's."""
            random.seed(4)
            losses = list(range(512))
            random.shuffle(losses)
            Item.count = 0
            got = run_sort(items(losses))
            n = Item.count
            assert losses_of(got) == list(range(512)), "run_sort does not sort 512 shuffled losses."
            assert n <= 5120, f"run_sort made {n:,} comparisons on 512 shuffled losses, more than 5,120. Merging each run into one growing list makes about 43,500, since the growing list is compared again and again: merge the runs in pairs, the first with the second, the third with the fourth and so on, and then the merged runs in the same way."


        def test_new_list():
            """run_sort gives a new list, and leaves the list it was given as it was, even when that list is already in order."""
            given = items([3, 1, 2])
            before = list(given)
            got = run_sort(given)
            assert given == before, "run_sort changed the list it was given. Build new lists, as merge does, and leave the list given as it was."
            assert got is not given, "run_sort gives back the very list it was given, not a new list."
            ordered = items([1, 2, 3])
