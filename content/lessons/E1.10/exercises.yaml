        import random


        class Key:
            """A key with a value and a hash chosen by the test, whose == counts its calls."""
            eqs = 0

            def __init__(self, value, h):
                self.value = value
                self.h = h

            def __hash__(self):
                return self.h

            def __eq__(self, other):
                Key.eqs = Key.eqs + 1
                return isinstance(other, Key) and self.value == other.value

            def __repr__(self):
                return f"Key({self.value})"


        def all_keys(table):
            """Every key in the buckets, in bucket order."""
            out = []
            for b in table.buckets:
                for k in b:
                    out.append(k)
            return out


        def test_starts_empty():
            """A new HashSet has a list of 8 empty buckets, and len 0."""
            t = HashSet()
            assert type(t.buckets) is list and len(t.buckets) == 8, f"A new HashSet's buckets are {t.buckets!r}, not a list of 8 empty lists."
            assert all_keys(t) == [], f"A new HashSet's buckets are {t.buckets!r}, not 8 empty lists."
            assert len(t) == 0, f"len of a new HashSet gives {len(t)!r}, not 0."


