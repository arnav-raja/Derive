        - code: |
            class HashSet:
                def __init__(self):
                    self.buckets = []
                    for k in range(8):
                        self.buckets.append([])
                    self.count = 0

                def add(self, key):
                    self.buckets[hash(key) % len(self.buckets)].append(key)
                    self.count = self.count + 1
                    if self.count > len(self.buckets):
                        old = self.buckets
                        self.buckets = []
                        for k in range(2 * len(old)):
                            self.buckets.append([])
                        for b in old:
                            for k in b:
                                self.buckets[hash(k) % len(self.buckets)].append(k)

                def __contains__(self, key):
                    return key in self.buckets[hash(key) % len(self.buckets)]

                def __len__(self):
                    return self.count
          why: Adds a key again even when an equal key is already in its bucket, so repeats are kept and counted.
    explanation: >-
      `add` works out the key's bucket from its hash, does nothing if an equal key is there, and
      otherwise appends the key and counts it. When the count passes the number of buckets, it makes
      twice as many new, separate buckets and moves every key to the bucket its hash now gives,
      since `hash(key) % m` changes with `m`. `__contains__` works out the same bucket and searches
      only it, which is why a lookup costs about one comparison when the buckets are short, and
      `__len__` gives the count.

