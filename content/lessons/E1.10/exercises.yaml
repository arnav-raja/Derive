exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-sorted-already
    phase: puzzle
    kind: predict
    concept: E1.10/merge-sort
    title: A list already in order
    prompt: What will `Loss.count` be once `sorted` has finished with the 1,000 losses?
    answer:
      type: choice
      options:
        - { id: none, label: '0, since a list already in order needs no comparisons' }
        - { id: pass, label: '999, one for each loss after the first' }
        - { id: halvings, label: 'About 10,000, some 10 for each loss' }
        - { id: pairs, label: '499,500, one for each pair of losses' }
      correct: [pass]
    explanation: >-
      To know that the list is in order, `sorted` must compare each loss with the one before it,
      since a pair of neighbours it never compared could be the wrong way round. It walks along the
      list doing exactly that, finds the whole list in order after 999 comparisons, and has nothing
      left to do.

  # Recall ---------------------------------------------------------------------
  - id: recall-halves
    phase: recall
    kind: recall
    concept: E1.5/call-stack
    prompt: |
      E1.5 added up a list by halving it:

      ```python
      def total(xs):
          if len(xs) == 0:
              return 0
          if len(xs) == 1:
              return xs[0]
          h = len(xs) // 2
          return total(xs[:h]) + total(xs[h:])
      ```

      While `total` adds up a list of 8 numbers, how many calls of `total` are in progress at once,
      at most?
    answer:
      type: choice
      options:
        - { id: three, label: '3' }
        - { id: four, label: '4' }
        - { id: eight, label: '8' }
        - { id: fifteen, label: '15' }
      correct: [four]
    explanation: >-
      The calls in progress at once are a chain, each with a list half as long as its caller's: 8
      numbers, 4, 2 and 1, so 4 calls. The call for the second half of a list starts only after the
      call for the first half has returned. In all, `total` makes 15 calls, but never more than 4 at
      once.

  - id: recall-invariant
    phase: recall
    kind: recall
    concept: E1.2/loop-invariants
    prompt: |
      `xs` is a list of numbers with at least one number in it.

      ```python
      best = xs[0]
      i = 1
      while i < len(xs):
          if xs[i] > best:
              best = xs[i]
          i = i + 1
      ```

      Which statement is true before the first pass, and after every pass?
    answer:
      type: choice
      options:
        - { id: whole, label: '`best` is the largest number in the whole of `xs`' }
        - { id: next, label: '`best` is the number in `xs[i]`' }
        - { id: right, label: '`best` is the largest of `xs[0]` to `xs[i - 1]`' }
        - { id: above, label: '`best` is larger than every number after slot `i`' }
      correct: [right]
    explanation: >-
      Before the first pass `i` is 1 and `best` is `xs[0]`, the largest of the one number
      `xs[0]`. Each pass keeps the larger of `best` and `xs[i]`, then adds 1 to `i`, so the
      statement stays true. When the loop ends, `i` is `len(xs)`, and it says that `best` is the
      largest number in the list. Before then, numbers after slot `i - 1` have not been looked at.

  - id: recall-unhashable
    phase: recall
    kind: recall
    concept: E1.7/special-methods
    prompt: |
      What happens when this program runs?

      ```python
      class Config:
          def __init__(self, lr, batch):
              self.lr = lr
              self.batch = batch

          def __eq__(self, other):
              return self.lr == other.lr and self.batch == other.batch

      seen = set()
      seen.add(Config(0.01, 32))
      print(len(seen))
      ```
    answer:
      type: choice
      options:
        - { id: one, label: 'It prints 1' }
        - { id: zero, label: 'It prints 0, since the config was not kept' }
        - { id: attribute, label: 'It stops with `AttributeError`' }
        - { id: right, label: 'It stops with `TypeError`' }
      correct: [right]
    explanation: >-
      A set needs a `__hash__` to know where to keep a value. Once a class defines `__eq__`,
      Python takes away the `__hash__` it would otherwise give the class, so `seen.add` stops with
      `TypeError: cannot use 'Config' as a set element (unhashable type: 'Config')`.

  - id: recall-strong
    phase: recall
    kind: recall
    concept: M1.9/strong-induction
    prompt: >-
      A proof by strong induction that $P(n)$ holds for every whole number $n \ge 1$ proves $P(1)$.
      In its step, what may it suppose in order to prove $P(k + 1)$?
    answer:
      type: choice
      options:
        - { id: one, label: '$P(k)$ alone, and no other case' }
        - { id: every, label: '$P(n)$ for every whole number $n$' }
        - { id: next, label: '$P(k + 1)$ itself, as a hypothesis' }
        - { id: right, label: 'Every case from $P(1)$ up to $P(k)$' }
      correct: [right]
    explanation: >-
      Strong induction's step may suppose every case from the first up to $k$, which is what a
      function that calls itself on half its argument needs: the half can be any earlier case.
      Supposing $P(k + 1)$, or every $P(n)$, would assume what is to be proved.

  - id: recall-doubling
    phase: recall
    kind: recall
    concept: M1.6/geometric-series
    prompt: Write $1 + 2 + 4 + \dots + 2^{k - 1}$, the sum of the first $k$ powers of 2, without dots.
    answer:
      type: expression
      symbols:
        - { name: k, positive: true, integer: true }
      lhs: '1 + 2 + 4 + \dots + 2^{k - 1} ='
      reference: 2**k - 1
      accept: ['2^k - 1', '-1 + 2**k', '(2**k) - 1', '2*2**(k-1) - 1']
      reject: ['2**k', '2**(k-1)', '2**(k+1) - 1', '2**k + 1', '2**(k - 1) - 1', 'k**2 - 1', '2*k - 1']
    explanation: >-
      Call the sum $S$. Doubling it gives $2 + 4 + \dots + 2^k$, which shares every term with $S$
      but the last, so $2S - S = 2^k - 1$. For $k = 3$, $1 + 2 + 4 = 7$.

  # Explore --------------------------------------------------------------------
  - id: explore-merge-count
    phase: explore
    kind: predict
    concept: E1.10/merge-sort
    title: Two merges
    prompt: >-
      How many comparisons does merging `[1, 2, 3, 4]` with `[5, 6, 7, 8]` make, and how many does
      merging `[1, 3, 5, 7]` with `[2, 4, 6, 8]` make?
    placement: true
    answer:
      type: choice
      options:
        - { id: same, label: '8 and 8, one for each item' }
        - { id: seven, label: '7 and 7, one for each item but the last' }
        - { id: right, label: '4 and 7' }
        - { id: swapped, label: '7 and 4' }
      correct: [right]
    explanation: >-
      Merging `[1, 2, 3, 4]` with `[5, 6, 7, 8]` compares each of 1, 2, 3 and 4 with 5 and moves
      it, and then the first list is used up, so 5 to 8 follow with no more comparisons: 4. When
      the items take turns, as 1, 2, 3, ... do between the second pair of lists, every item but the
      last is moved by a comparison: 7.
    review:
      variants:
        - prompt: Merging two sorted lists of 5 items each makes at most how many comparisons?
          answer:
            type: choice
            options:
              - { id: five, label: '5' }
              - { id: right, label: '9' }
              - { id: ten, label: '10' }
              - { id: product, label: '25' }
            correct: [right]
          explanation: >-
            Each comparison moves one item, and once 9 of the 10 items have moved, one list is used
            up and the last item follows without a comparison, so at most 9.
        - prompt: >-
            When the front items of the two lists are equal, which one does this lesson's `merge`
            move first?
          answer:
            type: choice
            options:
              - { id: second, label: 'The one from the second list' }
              - { id: right, label: 'The one from the first list' }
              - { id: both, label: 'Both of them, in one step' }
              - { id: neither, label: 'Neither: it stops with an error' }
            correct: [right]
          explanation: >-
            `merge` moves an item from the second list only when `b[j] < a[i]`, which is false for
            equal items, so the item from the first list moves first.
        - prompt: How many comparisons does merging `[4, 8]` with `[1, 2, 3, 9]` make?
          answer:
            type: choice
            options:
              - { id: two, label: '2' }
              - { id: four, label: '4' }
              - { id: right, label: '5' }
              - { id: six, label: '6' }
            correct: [right]
          explanation: >-
            4 is compared with 1, 2, 3 and 9, which moves 1, 2, 3 and then 4, and 8 is compared
            with 9, which moves 8. The first list is then used up, and 9 follows: 5 comparisons.

  - id: explore-sort-count
    phase: explore
    kind: predict
    concept: E1.10/merge-sort
    title: Sorting 1,024 losses
    prompt: About how many comparisons does `merge_sort` make on a list of 1,024 losses in a random order?
    placement: true
    answer:
      type: choice
      options:
        - { id: thousand, label: 'About 1,000, one for each loss' }
        - { id: right, label: 'About 9,000, under 10 for each loss' }
        - { id: hundred, label: 'About 100,000, some 100 for each loss' }
        - { id: pairs, label: '523,776, one for each pair of losses' }
      correct: [right]
    explanation: >-
      1,024 is $2^{10}$, so the list is halved 10 times on the way down to single items, and on
      the way back up each of the 10 levels of merges moves every loss once, with fewer than 1,024
      comparisons. That is under 10,240 in all, and about 8,950 for a random order.
    review:
      variants:
        - prompt: A sort that picks the smallest item left, again and again, sorts 1,000 items. How many comparisons does it make?
          answer:
            type: choice
            options:
              - { id: pass, label: '999' }
              - { id: levels, label: 'About 10,000' }
              - { id: right, label: '499,500' }
              - { id: square, label: '1,000,000' }
            correct: [right]
          explanation: >-
            Finding the smallest of $k$ items takes $k - 1$ comparisons, so the sort makes
            $999 + 998 + \dots + 1 = \frac{1{,}000 \times 999}{2} = 499{,}500$, whatever the order.
        - prompt: While `merge_sort` sorts a million items, how many of its calls are in progress at once, at most?
          answer:
            type: choice
            options:
              - { id: all, label: '1,000,000, one for each item' }
              - { id: pairs, label: '500,000, one for each pair' }
              - { id: limit, label: 'About 1,000, as many as Python allows' }
              - { id: right, label: 'About 20, one for each halving' }
            correct: [right]
          explanation: >-
            The calls in progress at once are a chain, each with half its caller's list: a million
            items, half a million, and so on down to one, which is 21 calls.
        - prompt: Merge sort sorts a list of $2^{20}$ items, just over a million. How many levels of merges does it make?
          answer:
            type: choice
            options:
              - { id: thousand, label: '1,000' }
              - { id: all, label: '1,048,576' }
              - { id: right, label: '20' }
              - { id: ten, label: '10' }
            correct: [right]
          explanation: >-
            Each level of merges doubles the length of the runs, from 1 item to $2^{20}$, so there
            are 20 levels, each of fewer than $2^{20}$ comparisons.

  - id: explore-stable
    phase: explore
    kind: predict
    concept: E1.10/merge-sort
    title: Models with equal losses
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: reversed, label: "`['d', 'e', 'b', 'c', 'a']`" }
        - { id: mixed, label: "`['d', 'b', 'e', 'c', 'a']`" }
        - { id: first-tie, label: "`['d', 'e', 'b', 'a', 'c']`" }
        - { id: right, label: "`['d', 'b', 'e', 'a', 'c']`" }
      correct: [right]
    explanation: >-
      By loss, `d` (0.25) comes first, then the two models with 0.27, then the two with 0.31.
      Whenever two equal losses meet in a merge, the one from the first list moves first, and the
      first list always holds models from earlier in the list given, so `b` stays ahead of `e`,
      and `a` ahead of `c`.
    review:
      variants:
        - prompt: >-
            A stable sort is given models, each with a name and a loss, and sorts them by loss.
            Two of them, `p` and `q`, have the same loss, and `p` comes first in the list it is
            given. Where are they after sorting?
          answer:
            type: choice
            options:
              - { id: right, label: '`p` and then `q`, in the order they came' }
              - { id: swapped, label: '`q` and then `p`, since a sort turns ties round' }
              - { id: halves, label: 'Either way, depending on where the halves split' }
              - { id: random, label: 'Either way, as Python picks one at random' }
            correct: [right]
          explanation: >-
            A stable sort keeps equal items in the order they came, wherever the halves split, so
            `p` stays ahead of `q`.
        - prompt: >-
            In `merge`, the test `if b[j] < a[i]:` is changed to `if not (a[i] < b[j]):`, which
            moves the item from the second list when the two are equal. What changes in what
            `merge_sort` gives?
          answer:
            type: choice
            options:
              - { id: right, label: 'Equal items can come out the other way round' }
              - { id: nothing, label: 'Nothing at all, for any list' }
              - { id: order, label: 'The losses no longer come out in order' }
              - { id: error, label: 'It stops with an error at the first tie' }
            correct: [right]
          explanation: >-
            The losses still come out in order, since an equal item may go first either way, but
            of two equal items the later one now moves first, so the sort is no longer stable.
        - prompt: >-
            Models are sorted by name, and the result is sorted again by loss with a stable sort.
            Which models end up in order of name?
          answer:
            type: choice
            options:
              - { id: all, label: 'All of them' }
              - { id: none, label: 'None of them, since the second sort undoes the first' }
              - { id: right, label: 'Models with equal losses, among themselves' }
              - { id: ends, label: 'Only the first and the last models' }
            correct: [right]
          explanation: >-
            The second sort puts the models in order of loss, and, being stable, keeps models with
            equal losses in the order the first sort left them, which is by name.

  - id: explore-three
    phase: explore
    kind: predict
    concept: E1.10/comparison-bound
    title: Sorting three items
    prompt: >-
      A sort is given 3 different numbers, in any of their 6 orders, and learns about them only by
      comparing two of them at a time. What is the fewest comparisons in which it can promise to
      sort every one of the 6 orders?
    placement: true
    answer:
      type: choice
      options:
        - { id: two, label: '2' }
        - { id: right, label: '3' }
        - { id: five, label: '5' }
        - { id: six, label: '6' }
      correct: [right]
    explanation: >-
      Two comparisons can come out in only 4 ways, yes and yes, yes and no, no and yes, or no and
      no, so two of the 6 orders give the same answers, and the sort moves both in the same way,
      which leaves one of them out of order. Three are enough: compare the first two, then the
      third with the larger of them, and if the third is not the largest, with the smaller.
    review:
      variants:
        - prompt: >-
            A sort that only compares is given 4 different items, which have 24 orders. What is the
            fewest comparisons that can be enough for every order?
          answer:
            type: choice
            options:
              - { id: three, label: '3' }
              - { id: four, label: '4' }
              - { id: right, label: '5' }
              - { id: six, label: '6' }
            correct: [right]
          explanation: >-
            4 comparisons give at most $2^4 = 16$ different sets of answers, fewer than 24, while 5
            give 32, and merge sort sorts 4 items in at most 5.
        - prompt: Each comparison is answered yes or no. How many orders can 10 comparisons tell apart, at most?
          answer:
            type: choice
            options:
              - { id: twenty, label: '20' }
              - { id: hundred, label: '100' }
              - { id: right, label: '1,024' }
              - { id: factorial, label: '3,628,800' }
            correct: [right]
          explanation: >-
            Each comparison doubles the number of ways the answers can come out, so 10 comparisons
            can come out in $2^{10} = 1{,}024$ ways, and can tell apart at most that many orders.
        - prompt: Why can no sort that only compares always sort 3 different items in 2 comparisons?
          answer:
            type: choice
            options:
              - { id: twice, label: 'It would have to compare some pair twice' }
              - { id: right, label: 'Two answers come out only 4 ways, for 6 orders' }
              - { id: neighbours, label: 'A comparison can only check two neighbours' }
              - { id: each-pair, label: 'Every pair of the 3 items must be compared' }
            correct: [right]
          explanation: >-
            Two orders that give the same answers are moved the same way, and only one of them can
            end in order. Every pair need not be compared: when $a < b$ and $b < c$, the sort knows
            $a < c$ without asking.

  - id: explore-search
    phase: explore
    kind: predict
    concept: E1.10/binary-search
    title: Two searches
    prompt: What does the program print?
    placement: true
    answer:
      type: choice
      options:
        - { id: right, label: '`3 1`' }
        - { id: before, label: '`2 1`' }
        - { id: last, label: '`3 2`' }
        - { id: none, label: '`None 1`' }
      correct: [right]
    explanation: >-
      0.25 is not in the list. The items less than 0.25 fill slots 0 to 2, so the first item that
      is at least 0.25 is 0.3, in slot 3, where 0.25 would go. 0.2 is in slots 1 and 2, and the
      search gives the first of them, since every slot before 1 holds an item less than 0.2.
    review:
      variants:
        - prompt: What does `first_at_least([5, 8, 8, 13], 9)` give?
          answer:
            type: choice
            options:
              - { id: two, label: '2' }
              - { id: right, label: '3' }
              - { id: four, label: '4' }
              - { id: none, label: '`None`' }
            correct: [right]
          explanation: >-
            5, 8 and 8 are less than 9, in slots 0 to 2, so the first item that is at least 9 is
            13, in slot 3.
        - prompt: A sorted list holds a million items. At most how many of them does `first_at_least` look at?
          answer:
            type: choice
            options:
              - { id: one, label: '1' }
              - { id: thousand, label: '1,000' }
              - { id: half, label: '500,000' }
              - { id: right, label: '20' }
            correct: [right]
          explanation: >-
            Each look halves the stretch between `lo` and `hi`, and a stretch of about a million
            slots halves to 1 in 20 steps, since $2^{20}$ is just over a million.
        - prompt: What does `first_at_least(xs, x)` give when `x` is larger than every item of `xs`?
          answer:
            type: choice
            options:
              - { id: last, label: '`len(xs) - 1`, the last slot' }
              - { id: right, label: '`len(xs)`, just past the last slot' }
              - { id: minus, label: '-1, to say that it is not there' }
              - { id: none, label: '`None`, to say that it is not there' }
            correct: [right]
          explanation: >-
            Every item is less than `x`, so `lo` moves up to the last slot and `hi` never moves from
            the imagined slot `len(xs)`, which is where `x` would go.

  - id: explore-bucket
    phase: explore
    kind: predict
    concept: E1.10/hash-tables
    title: Looking up 35
    prompt: >-
      A table of 8 buckets holds the keys 3, 11, 19, 27 and 13. How many keys does looking up 35,
      which is not there, compare it with?
    placement: true
    answer:
      type: choice
      options:
        - { id: zero, label: '0' }
        - { id: one, label: '1' }
        - { id: right, label: '4' }
        - { id: five, label: '5' }
      correct: [right]
    explanation: >-
      `35 % 8` is 3, so the lookup goes to bucket 3, which holds 3, 11, 19 and 27, since each of
      them leaves 3 when divided by 8. It compares 35 with all four, finds none equal, and says it
      is not there. 13 is in bucket 5 and is never looked at.
    review:
      variants:
        - prompt: A table has 8 buckets, and a small whole number is its own hash. Which bucket does 21 go in?
          answer:
            type: choice
            options:
              - { id: two, label: '2' }
              - { id: three, label: '3' }
              - { id: right, label: '5' }
              - { id: itself, label: '21' }
            correct: [right]
          explanation: '`21 % 8` is 5, since $21 = 2 \times 8 + 5$, so 21 goes in bucket 5.'
        - prompt: A table holds 1,000 keys spread evenly over 1,024 buckets. About how many keys does a lookup compare with?
          answer:
            type: choice
            options:
              - { id: right, label: 'About 1' }
              - { id: ten, label: 'About 10' }
              - { id: half, label: 'About 500' }
              - { id: all, label: '1,000' }
            correct: [right]
          explanation: >-
            Spread evenly, 1,000 keys in 1,024 buckets leave fewer than one key in a bucket on
            average, and a lookup compares only with the keys in its own bucket.
        - prompt: >-
            A table starts with 8 buckets and doubles them whenever a new key would make its keys
            outnumber them. How many buckets does it have once 20 keys are in it?
          answer:
            type: choice
            options:
              - { id: sixteen, label: '16' }
              - { id: twenty, label: '20' }
              - { id: right, label: '32' }
              - { id: sixty-four, label: '64' }
            correct: [right]
          explanation: >-
            The 9th key makes 16 buckets, and the 17th makes 32, which is enough for keys 18 to 32.

  - id: explore-changed-key
    phase: explore
    kind: predict
    concept: E1.10/hash-tables
    title: A key that changes
    prompt: What does the program print?
    placement: true
    answer:
      type: choice
      options:
        - { id: c-found, label: '`True True False`' }
        - { id: old-found, label: '`False False True`' }
        - { id: right, label: '`False False False`' }
        - { id: all, label: '`True True True`' }
      correct: [right]
    explanation: >-
      `c` sits in the slot for the hash of `(0.01, 32)`, and the set keeps that hash beside it.
      `c in seen` and `Config(0.01, 64) in seen` both work out the hash of `(0.01, 64)`, which
      differs from the hash kept beside `c`, and Python compares hashes before it calls
      `__eq__`, so neither finds `c`. `Config(0.01, 32) in seen` has the right hash, but the
      config there now has batch 64, so `__eq__` says they differ.
    review:
      variants:
        - prompt: >-
            A class's `__eq__` compares `self.name` and `self.step`, and nothing else. Which
            `__hash__` agrees with it?
          answer:
            type: choice
            options:
              - { id: extra, label: '`return hash((self.name, self.step, self.loss))`' }
              - { id: loss, label: '`return hash(self.loss)`' }
              - { id: step-loss, label: '`return hash((self.step, self.loss))`' }
              - { id: right, label: '`return hash((self.name, self.step))`' }
            correct: [right]
          explanation: >-
            Two equal objects have the same `name` and `step`, but may differ in `loss`, so a hash
            that looks at `loss` could give them different hashes. A hash of exactly the fields
            that `__eq__` compares always agrees.
        - prompt: Why can a tuple be a key of a dict, while a list cannot?
          answer:
            type: choice
            options:
              - { id: shorter, label: 'A tuple is usually shorter than a list' }
              - { id: sorted, label: 'A tuple keeps its items sorted' }
              - { id: right, label: 'A tuple cannot change once it is made' }
              - { id: empty, label: 'A list has no items that can be hashed' }
            correct: [right]
          explanation: >-
            A key that changed while it was stored would sit in the slot for its old hash, where
            no lookup would find it. A tuple cannot change, so Python can hash it, and refuses to
            hash a list, which can.

  # Derive ---------------------------------------------------------------------
  - id: derive-sorts
    phase: derive
    kind: proof
    concept: E1.10/merge-sort
    title: Merge sort sorts every list
    prompt: >-
      Here is a proof by strong induction on $n$, the length of the list, that `merge_sort` sorts
      every list. Each line follows from the lines above it. Choose the rule that justifies each
      line. A rule may be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: merging, name: Merging, label: 'Given two lists that are each in order, `merge` gives one list in order that holds the items of both, each as many times.' }
        - { id: conclude, name: Strong induction, label: 'If $P(0)$ and $P(1)$ hold, and for every $n \ge 2$ the cases $P(0)$ to $P(n - 1)$ together give $P(n)$, then $P(n)$ holds for every whole number $n$.' }
        - { id: base, name: Base cases, label: '`merge_sort` gives a list of 0 or 1 items back as it is, and such a list is in order.' }
        - { id: slices, name: The two slices, label: '`xs[:h]` and `xs[h:]` together hold the items of `xs`, each as many times.' }
        - { id: hypothesis, name: The hypothesis, label: 'In the step for $n$, $P(m)$ may be assumed for every $m < n$.' }
        - { id: halves, name: Shorter halves, label: 'When $n \ge 2$, `h`, which is `n // 2`, is at least 1 and less than $n$, so `xs[:h]` and `xs[h:]` each have fewer than $n$ items.' }
        - { id: invariant, name: Loop invariant, label: 'A statement that is true before the first pass of a loop, and that each pass keeps true, is true after every pass.' }
        - { id: equal-halves, name: Equal halves, label: 'When $n$ is even, `xs[:h]` and `xs[h:]` each have $\frac{n}{2}$ items.' }
      start: 'P(n)\text{: for every list } \texttt{xs} \text{ of } n \text{ items, } \texttt{merge\_sort(xs)} \text{ gives the items of } \texttt{xs} \text{, each as many times, in order.}'
      lines:
        - math: 'P(0) \text{ and } P(1) \text{: a list of 0 or 1 items is given back as it is, and is in order.}'
          rule: base
        - math: '\text{Take } n \ge 2 \text{. Then } \texttt{xs[:h]} \text{ and } \texttt{xs[h:]} \text{ are both shorter than } n \text{.}'
          rule: halves
        - math: '\text{So } \texttt{merge\_sort} \text{ gives the items of each half in order.}'
          rule: hypothesis
        - math: '\texttt{merge} \text{ of the two gives one list in order, with the items of both halves.}'
          rule: merging
        - math: '\text{The halves hold the items of } \texttt{xs} \text{, so } \texttt{merge\_sort(xs)} \text{ gives the items of } \texttt{xs} \text{ in order: } P(n) \text{.}'
          rule: slices
        - math: 'P(n) \text{ holds for every whole number } n \text{.}'
          rule: conclude
    explanation: >-
      Lists of 0 and 1 items are the base cases. For $n \ge 2$, both halves are shorter than $n$,
      so the hypothesis says that `merge_sort` sorts them; merging two sorted lists gives a sorted
      list of the items of both; and the halves together hold the items of the list, so the
      result is the list in order. Strong induction then gives every length. The loop invariant
      rule is not needed here: it is what proves `merge` itself right.
      Equal halves holds only when $n$ is even, so it cannot give line 2, which must hold for
      every $n \ge 2$.

  - id: derive-merges
    phase: derive
    kind: step
    concept: E1.10/merge-sort
    title: How many merges
    prompt: >-
      How many merges does `merge_sort` make on a list of $n$ items, for any whole number
      $n \ge 1$ and any order of the items? M1.9's count of the numbers and the operations in a
      tree may help.
    answer:
      type: expression
      symbols:
        - { name: n, positive: true, integer: true }
      lhs: '\text{merges} ='
      reference: n - 1
      accept: ['-1 + n', '(n - 1)']
      reject: ['n', 'n + 1', 'n/2', '2*n - 1', 'n - 2', 'n**2', '2*n']
    explanation: >-
      The calls form a tree whose leaves are the calls on one item, $n$ of them, and each call on
      two or more items joins the trees of its two halves with one merge. M1.9 proved by
      structural induction that a tree in which each operation joins two parts has one more number
      than operations, so this tree has one more leaf than merges: $n - 1$ merges. Or count runs:
      there are $n$ runs of one item to begin with, each merge turns two runs into one, and one
      run is left at the end.

  - id: derive-worst
    phase: derive
    kind: step
    concept: E1.10/merge-sort
    covers: [E1.10/comparison-bound]
    title: The worst case, exactly
    prompt: >-
      Work out $W(1)$, $W(2)$, $W(3)$ and $W(4)$ from the recurrence, guess a closed form for
      $W(k)$ that fits them and $W(0) = 0$, and check it in the recurrence, as M1.9 did. Setting
      each value beside $k \times 2^k$, the bound from the levels, may help. What is $W(k)$?
    answer:
      type: expression
      symbols:
        - { name: k, integer: true }
      lhs: 'W(k) ='
      reference: (k - 1)*2**k + 1
      accept: ['k*2**k - 2**k + 1', '2**k*(k - 1) + 1', '1 + (k - 1)*2^k', 'k*2^k - (2^k - 1)']
      reject: ['k*2**k', '(k - 1)*2**k', 'k*2**k - 1', '2**k - 1', 'k*2**k + 1', '(k + 1)*2**k - 1', 'k*2**(k - 1)', '(k - 1)*2**k - 1']
    explanation: >-
      $W(1) = 2 \times 0 + 2 - 1 = 1$, $W(2) = 2 + 3 = 5$, $W(3) = 10 + 7 = 17$ and
      $W(4) = 34 + 15 = 49$. Each is one more than a multiple of its power of 2:
      $0 \times 2 + 1$, $1 \times 4 + 1$, $2 \times 8 + 1$ and $3 \times 16 + 1$, which suggests
      $W(k) = (k - 1)2^k + 1$, and $W(0) = -1 + 1 = 0$ fits too. If it holds for $k$, then
      $W(k + 1) = 2\big((k - 1)2^k + 1\big) + 2^{k + 1} - 1 = (k - 1)2^{k + 1} + 2^{k + 1} + 1 = k \times 2^{k + 1} + 1$,
      the formula for $k + 1$, so by induction it holds for every $k$.

  - id: derive-bound
    phase: derive
    kind: proof
    concept: E1.10/comparison-bound
    title: The fewest comparisons
    prompt: >-
      Here is a proof that a sort that only compares, and always finishes within $k$ comparisons
      on lists of $n$ different items, must have $2^k \ge n!$. Each line follows from the lines
      above it. Choose the rule that justifies each line. A rule may be used more than once or not
      at all.
    answer:
      type: steps
      rules:
        - { id: one-order, name: One way to sort, label: 'Moving the items of two different orders of the same items in the same way leaves them in two different orders, so at most one of them ends in order.' }
        - { id: invariant, name: Invariant, label: 'A statement that is true before the first comparison, and that each comparison keeps true, is true after every comparison, as with a loop in E1.2.' }
        - { id: multiply, name: Multiply both sides, label: 'Both sides of an inequality may be multiplied by the same positive number, and $2^j \le 2^k$ when $j \le k$.' }
        - { id: two-answers, name: Two answers, label: 'A comparison of two different items has one of two answers, yes or no, and which one depends only on the order of the items.' }
        - { id: pairs, name: Pairs, label: '$n$ items make $\frac{n(n - 1)}{2}$ pairs, as E1.4 counted.' }
        - { id: same-moves, name: 'Same answers, same moves', label: 'A sort that learns only by comparing makes the same moves for two lists that give the same answers to its comparisons.' }
        - { id: larger-part, name: The larger part, label: 'When a collection is split into two parts, one of the parts holds at least half of it.' }
        - { id: orders, name: Orders, label: '$n$ different things can be put in $n!$ orders, as M1.6 counted.' }
      start: '\text{Before its first comparison, all } n! \text{ orders of the } n \text{ items are possible.}'
      lines:
        - math: '\text{Each comparison splits the orders still possible into two groups: those for which its answer is yes, and those for which it is no.}'
          rule: two-answers
        - math: '\text{Give each comparison the answer of the larger group, so at least half of the orders still possible stay possible.}'
          rule: larger-part
        - math: '\text{So after } j \text{ comparisons, at least } \frac{n!}{2^j} \text{ orders are still possible.}'
          rule: invariant
        - math: '\text{Any two orders still possible gave the same answers, so the sort has moved their items in the same way.}'
          rule: same-moves
        - math: '\text{So the sort cannot finish while two orders are possible: when it does, after } j \le k \text{ comparisons, } \frac{n!}{2^j} \le 1 \text{.}'
          rule: one-order
        - math: '\text{So } n! \le 2^j \le 2^k \text{.}'
          rule: multiply
    explanation: >-
      Each comparison has two answers, and answering with the larger group keeps at least half of
      the possible orders possible, so by the invariant at least $\frac{n!}{2^j}$ remain after $j$
      comparisons. Orders still possible gave the same answers, so they were moved the same way,
      and at most one of them can end in order: the sort cannot finish until one order is left, so
      $\frac{n!}{2^j} \le 1$ when it does, and multiplying by $2^j$ gives $n! \le 2^j \le 2^k$.
      Pairs and Orders are not needed, since the $n!$ orders are given before the first line.

  - id: derive-ten
    phase: derive
    kind: predict
    concept: E1.10/comparison-bound
    title: Ten items
    prompt: >-
      By the bound just proved, a sort that only compares needs at least $k$ comparisons on some
      order of 10 different items, where $2^k$ is the first power of 2 that is at least
      $10! = 3{,}628{,}800$. What is that $k$?
    answer: { type: number, value: 22, tolerance: { abs: 0 } }
