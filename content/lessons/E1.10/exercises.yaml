  - id: explain-algorithms
    phase: explain
    kind: explain
    concept: E1.10/merge-sort
    covers: [E1.10/comparison-bound, E1.10/binary-search, E1.10/hash-tables]
    title: Sorting, searching and sets, simply
    prompt: >-
      Explain to your friend why sorting a million losses does not take a million times a million
      steps, and how a set really finds a key. Cover how merging two sorted lists works and what it
      costs; how merge sort uses it, and how many comparisons it makes for a million items; why no
      sort that only compares can do much better; how binary search finds a place in a sorted list,
      in how many looks, and why; and how a set uses hashes and buckets to find a key without
      looking at every key, with an example, what must be true of the hashes of equal keys and why,
      and how the set stays fast as it grows.
    answer:
      type: text
      rubric:
        - { id: merging, criterion: 'Explains how two sorted lists are merged, and how many comparisons a merge makes for the items it moves.' }
        - { id: merge-sort, criterion: 'Explains how merge sort uses merging, and works out about how many comparisons it makes for a million items, against the slow way.' }
        - { id: bound, criterion: 'Explains why no sort that only compares can do much better, from the number of orders and the answers each comparison can give.' }
        - { id: search, criterion: 'Explains how binary search finds a place in a sorted list, and how many looks a million items need, and why.' }
        - { id: hashing, criterion: 'Explains how a set uses a hash and buckets to find a key without looking at every key, with an example.' }
        - { id: rules, criterion: 'Says what must be true of the hashes of equal keys and why, and how the set stays fast as more keys are added.' }
      reference: >-
        Sorting a million losses does not need a million times a million steps, because of merging.
        Two lists that are each in order can be merged into one: compare their front items, move the
        smaller to the result, and repeat, and when one list runs out the rest of the other follows.
        Each comparison moves one item, so merging costs at most one comparison per item. Merge sort
        splits a list in half, sorts each half the same way, and merges the halves. A million items
        halve about 20 times down to single items, and each of the 20 levels of merges costs at most
        a million comparisons, so the whole sort takes under 20 million comparisons, where picking
        the smallest item left, again and again, takes about 500 billion. No sort that only compares
        can do much better. A million items can be in an astronomical number of orders, a million
        factorial, and the sort must end up treating each of them differently. Each comparison has
        only two answers, so k comparisons can tell apart at most 2 to the power k orders, and some
        list needs enough comparisons for 2 to the k to reach the number of orders. For 1,000 items
        that is 8,530 comparisons, close to what merge sort and Python's own sort make. Once a list
        is sorted, binary search finds where a value belongs: look at the middle item, and if it is
        less than the value, the answer is in the upper half, otherwise in the lower half. Each look
        halves the stretch, so a million items need only 20 looks, since 2 to the 20 is about a
        million. A set is cleverer still: it does not search at all, and it certainly does not check
        every key at once. It keeps a row of buckets, and works out from each key a number, its
        hash, and puts the key in the bucket given by the remainder when the hash is divided by the
        number of buckets. With 8 buckets, the number 11 has hash 11 and goes in bucket 3. To look a
        key up, the set works out the same bucket and compares the key only with the few keys there.
        That only works if equal keys always have equal hashes, or a lookup would search the wrong
        bucket, so a class that defines equality must define its hash from the same fields, and a
        key must not change while it is in the set. As keys are added, the set doubles its buckets
        whenever a new key would make the keys outnumber them, moving every key to its new bucket,
        so the buckets stay
        about one key long, and all the moving averages out to fewer than two moves per key.
      minWords: 120
      maxWords: 500
