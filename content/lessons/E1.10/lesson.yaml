code: E1.10
title: "Algorithms: sorting, searching and hashing"
course: E1
status: ready
summary: >-
  Python's sorted is given 1,000 losses that are already in order. How many comparisons does it
  make? Sorting by merging, proved right by induction and costed by a recurrence; the fewest
  comparisons any sort can manage; searching a sorted list by halving; and hashing, which finds a
  key by working out where it must be.
sittings: 2
minutes:
  puzzle: 10
  recall: 10
  explore: 45
  derive: 40
  build: 60
  explain: 25
concepts:
  taught:
    - id: E1.10/merge-sort
      name: Merge sort
      summary: >-
        Merging two sorted lists takes the smaller of their front items again and again, and makes
        at most one comparison for each item it places but the last, so fewer than the two lengths
        added. *Merge sort* splits a list in halves, sorts each half with the same function and
        merges them; strong induction on the length proves that it sorts. A list of $2^k$ items is
        split through $k$ levels, each level's merges make fewer than $2^k$ comparisons, and the
        worst case is $(k - 1)2^k + 1$: just under 20 million for a million items, against
        499,999,500,000 for a sort that picks the smallest item left each time. Merging takes from
        the first list when two items are equal, so equal items keep their order, which makes the
        sort *stable*.
      usedBy: [L4.10, E9.3]
    - id: E1.10/comparison-bound
      name: The fewest comparisons
      summary: >-
        A sort that learns about the order of its items only by comparing two at a time must tell
        apart all $n!$ orders of $n$ different items. Each comparison has two outcomes, so $k$
        comparisons tell apart at most $2^k$ orders, and some order needs at least $k$ comparisons,
        where $2^k$ is the first power of 2 that reaches $n!$: 22 for 10 items, and 8,530 for
        1,000, against Python's 8,650 or so on a shuffled list. No sort that only compares can do
        much better than merge sort.
      usedBy: [M11.3, M11.4]
    - id: E1.10/binary-search
      name: Binary search
      summary: >-
        A sorted list is searched by halving the stretch that must hold the answer, as E1.8's
        bisection halved the versions. To find the first slot whose item is at least $x$, `lo`
        starts at $-1$ and `hi` at the length of the list, as if slots sat just before and just
        after it, and every item up to `lo` stays less than $x$ while every item from `hi` on stays
        at least $x$. Each look at the item midway moves `lo` or `hi` to it. The invariant proves
        the answer right, and a million items take 20 looks. Python's `bisect` module does this,
        and two searches count the items of a sorted list that lie in a range.
      usedBy: [L4.10, M11.3]
    - id: E1.10/hash-tables
      name: Hash tables
      summary: >-
        A hash table keeps its keys in buckets and puts each key in the bucket given by its *hash*,
        a whole number worked out from the key, taken modulo the number of buckets, so that a lookup
        searches one short bucket instead of every key. Python's sets and dictionaries are hash
        tables. Equal keys must have equal hashes,
        though unequal keys may share one, so a class that defines `__eq__` needs a `__hash__`
        worked out from the fields that `__eq__` compares, and a key must not change while it is
        stored. Moving to twice as many buckets whenever a new key would make the keys outnumber
        them keeps the buckets short, and the moves cost fewer than 2 for each key added.
      usedBy: [E9.3, L4.2, E8.5]
