links:
  requires:
    - lesson: E1.4
      bridge: >-
        E1.4 found that `x in xs` on a list checks the items one by one, while a set finds a key by
        working out where it is from the key itself, a fact it took on trust, and that removing
        repeats from $n$ different documents with a list makes $\frac{n(n - 1)}{2}$ comparisons. This lesson opens the set up,
        with hashing, and sorts a million items in under 20 million comparisons instead of 500
        billion.
    - lesson: E1.5
      bridge: >-
        E1.5's `total` split its list in halves, so that 512 numbers took 1,023 calls but never
        more than 10 in progress at once. Merge sort splits the same way, sorts each half with
        itself and merges them, so a million items need calls only about 20 deep.
    - lesson: E1.7
      bridge: >-
        E1.7 found that a class which defines `__eq__` loses the `__hash__` that sets and
        dictionary keys need, and left a list to do the search. This lesson shows what the hash is
        for and gives such a class a `__hash__` that agrees with its `__eq__`; and `<` calls
        `__lt__`, so a class can count the comparisons a sort makes.
  buildsOn:
    - lesson: M1.9
      bridge: >-
        M1.9 proved `power` right by strong induction on its argument and solved recurrences by
        guessing a closed form and proving it. Merge sort is proved right by strong induction on
        the length of its list, and its worst case, $W(k + 1) = 2W(k) + 2^{k + 1} - 1$, is solved
        the same way.
    - lesson: E1.9
      bridge: >-
        E1.9 tested a sort by its properties: its output is in order and holds the same items, on
        random lists from a range narrow enough to make ties. The Build phase's tests check its
        sort, its search and its set in the same way, against Python's own `sorted`, `bisect` and
        `set`.
  applies:
    - lesson: E1.8
      bridge: >-
        E1.8's bisection kept `lo` good and `hi` bad and halved the gap between them. Binary
        search is bisection on the question "is this item at least $x$?", which a sorted list
        answers no for a first stretch of items and yes for the rest.
    - lesson: M1.6
      bridge: >-
        M1.6 counted the $n!$ orders of $n$ things and summed geometric series. The orders give
        the least number of comparisons a sort can need, and the series $1 + 2 + 4 + \dots$
        counts the moves a hash table makes as it doubles.
  foreshadows:
    - lesson: M11.3
      bridge: >-
        Arithmetic coding's decoder finds each symbol by a binary search of the running totals of
        the symbols' chances, and the count of yes or no answers needed to tell $N$ things apart,
        which bounds sorting here, bounds the length of any code there.
    - lesson: E9.3
      bridge: >-
        Finding repeated documents among billions compares hashes instead of documents: equal
        documents have equal hashes, so only documents whose hashes are equal need comparing. E9.3
        builds on this with MinHash, which makes documents that are nearly the same likely to have
        equal hashes too.
    - lesson: L4.10
      bridge: >-
        A model picks its next token by adding up the tokens' chances in order and searching the
        running totals for a random number between 0 and 1, a binary search that picks each token
        with exactly its chance.
