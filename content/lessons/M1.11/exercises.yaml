  - id: debug-rotate
    phase: build
    kind: debug
    concept: M1.11/rotation
    title: A turn that shrinks
    prompt: >-
      `rotate` should turn the point `(x, y)` anticlockwise about the origin through `angle`, in
      radians, by the Derive phase's rule. A quarter turn should take `(1, 0)` to `(0, 1)` and
      `(3, 1)` to `(-1, 3)`, but run it and see what it gives. Find the bug and fix it.
    answer:
      type: code
      starter: |
        import math


        def rotate(x, y, angle):
            """(x, y) turned anticlockwise about the origin through angle, in radians."""
            c = math.cos(angle)
            s = math.sin(angle)
            x = x * c - y * s
            y = x * s + y * c
            return x, y


        print(rotate(1, 0, math.pi / 2))   # a quarter turn: should be about (0, 1)
        print(rotate(3, 1, math.pi / 2))   # should be about (-1, 3)
      tests: |
        import math


        def show(point):
            """A point with each coordinate to 6 significant figures, and rounding's tiny leftovers as 0."""
            return "(" + ", ".join(f"{0.0 if abs(v) < 1e-12 else v:.6g}" for v in point) + ")"


        def test_quarter_turn():
            """A quarter turn takes (1, 0) to (0, 1)."""
            got = rotate(1, 0, math.pi / 2)
            assert close(got[0], 0, abs_tol=1e-9) and close(got[1], 1), f"rotate(1, 0, math.pi / 2) gave {show(got)}, not (0, 1)."


        def test_three_one():
            """A quarter turn takes (3, 1) to (-1, 3)."""
            got = rotate(3, 1, math.pi / 2)
            assert close(got[0], -1) and close(got[1], 3), f"rotate(3, 1, math.pi / 2) gave {show(got)}, not (-1, 3)."


        def test_keeps_distance():
            """Turning keeps a point's distance from the origin."""
            for x, y in [(1, 0), (3, 1), (-2, 5), (0.5, -0.25)]:
                for angle in [0.3, 1, 2.5, -1.2, 4]:
                    got = rotate(x, y, angle)
                    before = math.hypot(x, y)
                    after = math.hypot(got[0], got[1])
                    assert close(after, before), f"rotate({x}, {y}, {angle}) gave {show(got)}, {after:.6g} from the origin, but ({x}, {y}) is {before:.6g} from it."


        def test_two_turns():
            """Turning by one angle and then by another is turning by their sum."""
            for a, b in [(0.4, 0.9), (1, -2), (2.5, 2.5)]:
                first = rotate(2, 1, a)
                twice = rotate(first[0], first[1], b)
                once = rotate(2, 1, a + b)
                assert close(twice[0], once[0], abs_tol=1e-9) and close(twice[1], once[1], abs_tol=1e-9), f"Turning (2, 1) by {a} and then by {b} gave {show(twice)}, but turning it by {a + b} at once gave {show(once)}."
      reference: |
        import math


        def rotate(x, y, angle):
            """(x, y) turned anticlockwise about the origin through angle, in radians."""
            c = math.cos(angle)
            s = math.sin(angle)
            return x * c - y * s, x * s + y * c


        print(rotate(1, 0, math.pi / 2))
        print(rotate(3, 1, math.pi / 2))
      wrong:
        - code: |
            import math


            def rotate(x, y, angle):
                c = math.cos(angle)
                s = math.sin(angle)
                x = x * c - y * s
                y = x * s + y * c
                return x, y
          why: >-
            The bug left in: the second line works out the new y from the new x, which has already
            replaced the old one, so a quarter turn sends $(1, 0)$ to about $(0, 0)$.
        - code: |
            import math


            def rotate(x, y, angle):
                c = math.cos(angle)
                s = math.sin(angle)
                y = x * s + y * c
                x = x * c - y * s
                return x, y
          why: >-
            The two lines swapped: now the new x is worked out from the new y, so the bug has moved
            instead of going, and a quarter turn sends $(1, 0)$ to $(-1, 1)$.
        - code: |
            import math


            def rotate(x, y, angle):
                c = math.cos(angle)
                s = math.sin(angle)
                return x * c + y * s, -x * s + y * c
          why: >-
            The signs of the sine terms are swapped, which turns clockwise: distances are kept and
            two turns still add up, but a quarter turn sends $(1, 0)$ to $(0, -1)$.
        - code: |
            import math


            def rotate(x, y, angle):
                c = math.cos(math.radians(angle))
                s = math.sin(math.radians(angle))
                return x * c - y * s, x * s + y * c
          why: >-
            The angle is already in radians, and converting it again as if it were degrees turns
            through about a fifty-seventh of the angle.
    explanation: >-
      The line `x = x * c - y * s` replaces the old `x` before the next line uses it, so the new
      `y` is made from the new `x`. Working both out from the old values, in one `return` or with
      new names such as `new_x` and `new_y`, mends it.

  - id: build-rotate-about
    phase: build
    kind: build
    concept: M1.11/rotation
    title: Turning about any centre
    prompt: >-
      `rotate`, mended, turns about the origin only. Write `rotate_about(x, y, cx, cy, angle)`,
      which turns the point `(x, y)` anticlockwise through `angle` about the centre `(cx, cy)`: move
      the centre to the origin by taking `(cx, cy)` from the point, turn with `rotate`, and move
      back.
    answer:
      type: code
      starter: |
        import math


        def rotate(x, y, angle):
            """(x, y) turned anticlockwise about the origin through angle, in radians."""
            c = math.cos(angle)
            s = math.sin(angle)
            return x * c - y * s, x * s + y * c


        def rotate_about(x, y, cx, cy, angle):
            """(x, y) turned anticlockwise about the point (cx, cy) through angle, in radians."""
            return x, y


        print(rotate_about(2, 1, 1, 1, math.pi / 2))   # should be about (1, 2)
      tests: |
        import math


        def show(point):
            """A point with each coordinate to 6 significant figures, and rounding's tiny leftovers as 0."""
            return "(" + ", ".join(f"{0.0 if abs(v) < 1e-12 else v:.6g}" for v in point) + ")"


        def test_example():
            """A quarter turn of (2, 1) about (1, 1) gives (1, 2)."""
            got = rotate_about(2, 1, 1, 1, math.pi / 2)
            assert close(got[0], 1) and close(got[1], 2), f"rotate_about(2, 1, 1, 1, math.pi / 2) gave {show(got)}, not (1, 2)."


        def test_centre_stays():
            """The centre itself does not move."""
            for cx, cy in [(1, 1), (-3, 2), (0.5, -4)]:
                got = rotate_about(cx, cy, cx, cy, 1.1)
                assert close(got[0], cx, abs_tol=1e-9) and close(got[1], cy, abs_tol=1e-9), f"Turning the centre ({cx}, {cy}) about itself gave {show(got)}: the centre should stay where it is."


        def test_keeps_distance():
            """Every point keeps its distance from the centre."""
            for x, y, cx, cy in [(2, 1, 1, 1), (5, -1, -2, 3), (0, 0, 4, 4)]:
                for angle in [0.5, 2, -2.7]:
                    got = rotate_about(x, y, cx, cy, angle)
                    before = math.hypot(x - cx, y - cy)
                    after = math.hypot(got[0] - cx, got[1] - cy)
                    assert close(after, before), f"rotate_about({x}, {y}, {cx}, {cy}, {angle}) gave {show(got)}, {after:.6g} from the centre, but ({x}, {y}) is {before:.6g} from it."


        def test_quarter_and_half_turns():
            """Quarter and half turns about a centre land where they should."""
            for x, y, cx, cy, angle, words, want in [(5, -1, -2, 3, math.pi / 2, "math.pi / 2", (2, 10)), (0, 0, 4, 4, math.pi, "math.pi", (8, 8)), (1, 6, 2, -1, -math.pi / 2, "-math.pi / 2", (9, 0))]:
                got = rotate_about(x, y, cx, cy, angle)
                assert close(got[0], want[0], abs_tol=1e-9) and close(got[1], want[1], abs_tol=1e-9), f"rotate_about({x}, {y}, {cx}, {cy}, {words}) gave {show(got)}, not {show(want)}."


        def test_turns_by_the_angle():
            """Seen from the centre, the point turns anticlockwise through exactly the angle."""
            for x, y, cx, cy, angle in [(5, -1, -2, 3, 0.7), (1, 6, 2, -1, 3), (0, 0, 4, 4, -2)]:
                got = rotate_about(x, y, cx, cy, angle)
                before = (x - cx, y - cy)
                after = (got[0] - cx, got[1] - cy)
                size = math.hypot(*before) * math.hypot(*after)
                assert size > 0, f"rotate_about({x}, {y}, {cx}, {cy}, {angle}) gave the centre itself, {show(got)}."
                turned = math.atan2((before[0] * after[1] - before[1] * after[0]) / size, (before[0] * after[0] + before[1] * after[1]) / size)
                assert close(turned, angle, abs_tol=1e-9), f"Seen from the centre ({cx}, {cy}), rotate_about({x}, {y}, {cx}, {cy}, {angle}) turned the point through {turned:.6g} radians, not {angle}."
      reference: |
        import math


        def rotate(x, y, angle):
            """(x, y) turned anticlockwise about the origin through angle, in radians."""
            c = math.cos(angle)
            s = math.sin(angle)
            return x * c - y * s, x * s + y * c


        def rotate_about(x, y, cx, cy, angle):
            """(x, y) turned anticlockwise about the point (cx, cy) through angle, in radians."""
            u, v = rotate(x - cx, y - cy, angle)
            return u + cx, v + cy


