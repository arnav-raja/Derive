  - id: explain-rotation
    phase: explain
    kind: explain
    concept: M1.11/rotation
    covers: [M1.11/radians, M1.11/sine-and-cosine, M1.11/law-of-cosines]
    title: Turning, simply
    prompt: >-
      Explain to your friend why `math.sin(30)` printed `-0.9880316240928618`, what a radian is,
      what to type to get the sine of 30 degrees, and what that prints. Then explain what
      $\cos\theta$ and $\sin\theta$ really are, what multiplying both coordinates by $\cos\theta$
      does to a point and why that is not a way to turn it, and how to turn $(x, y)$ through
      $\theta$, with the reason the rule works. Last, explain when squaring two sides of a triangle
      and adding gives the square of the third, what gives it otherwise, and why. Give an example
      for each.
    answer:
      type: text
      rubric:
        - { id: radians, criterion: 'Says what a radian is, that `math.sin` reads its angle in radians, and how to give it 30 degrees instead, with the value that gives.' }
        - { id: thirty, criterion: 'Says why `math.sin(30)` is close to $-1$: where an angle of 30 radians ends up on the circle.' }
        - { id: coordinates, criterion: 'Says what $\cos\theta$ and $\sin\theta$ are, as the coordinates of a point on the circle of radius 1, with an example.' }
        - { id: shrink, criterion: 'Says what multiplying both coordinates by $\cos\theta$ really does to a point, with an example where it plainly fails to turn it.' }
        - { id: rule, criterion: 'Gives the rule for turning $(x, y)$ through $\theta$, says why it holds, for example from where $(1, 0)$ and $(0, 1)$ go, and works an example.' }
        - { id: cosines, criterion: 'Says that squaring and adding gives the third side only when the two sides meet at a right angle, gives the law of cosines for any angle with where it comes from, and works an example.' }
      reference: >-
        Python's sine is fine: it measures angles in another unit. Draw a circle of radius 1 about
        the corner of an angle, and measure the angle by the length of the arc it cuts from that
        circle: that is the angle in radians. A whole turn cuts the whole circle, $2\pi$ long, so
        $360°$ is $2\pi$ radians. `math.sin` reads radians, so `math.sin(30)` is the sine of 30
        radians, $\frac{30}{2\pi} \approx 4.77$ turns. Four whole turns change nothing, and the 0.77
        of a turn left, about $279°$, ends near the bottom of the circle, where the height is close to
        $-1$. For 30 degrees, convert first: `math.sin(math.radians(30))` takes $\frac{\pi}{6}$, about
        0.524, and prints `0.49999999999999994`, which is $\frac{1}{2}$ up to the rounding of floats.
        So what are sine and cosine? Put the circle of radius 1 at the origin, start at $(1, 0)$, and
        go anticlockwise along it through $\theta$. The point you reach is
        $(\cos\theta, \sin\theta)$: the cosine is its first coordinate and the sine its second. At
        $30°$ it is $\left(\frac{\sqrt{3}}{2}, \frac{1}{2}\right)$. Now turning. Multiplying both
        coordinates by $\cos\theta$ keeps the point on its line through the origin and only scales
        it, which matches a turn only for a whole or a half turn: a quarter turn should take $(1, 0)$
        to $(0, 1)$, but $\cos 90° = 0$, so your plan gives $(0, 0)$. Instead, think of $(x, y)$ as a route: $x$ along the first axis,
        then $y$ along the second. Turn the whole picture and the route turns with it. The direction
        $(1, 0)$ turns to $(\cos\theta, \sin\theta)$ and $(0, 1)$, a quarter turn further on, to
        $(-\sin\theta, \cos\theta)$, so the turned point is
        $(x\cos\theta - y\sin\theta,\; x\sin\theta + y\cos\theta)$. A quarter turn of $(3, 1)$
        gives $(0 - 1, 3 + 0) = (-1, 3)$: 3 up and 1 to the left. Last, squaring two sides and adding
        gives the square of the third only when the two sides meet at a right angle. If they meet
        at an angle $C$, put that corner at the origin with side $a$ along the first axis, ending at
        $(a, 0)$; side $b$ ends at $(b\cos C, b\sin C)$. Pythagoras on the gaps between those ends
        gives $c^2 = (b\cos C - a)^2 + (b\sin C)^2 = a^2 + b^2 - 2ab\cos C$, since
        $\cos^2 C + \sin^2 C = 1$. At a right angle the cosine is 0, and squaring and adding is
        right. Sides 3 and 5 at $60°$ give $c^2 = 9 + 25 - 15 = 19$, so $c$ is about 4.36, not the
        5.83 your way gives.
      minWords: 120
      maxWords: 550
    explanation: >-
      A strong answer says that `math.sin` takes radians, the arc an angle cuts from a circle of
      radius 1, so 30 is about 4.77 turns and ends near the bottom of the circle; converts $30°$ to
      $\frac{\pi}{6}$ with `math.radians`; gives $(\cos\theta, \sin\theta)$ as the point reached by
      turning $(1, 0)$ through $\theta$; shows that multiplying by $\cos\theta$ only scales a point
      along its line, so a quarter turn of $(1, 0)$ gives $(0, 0)$; builds the rule from where
      $(1, 0)$ and $(0, 1)$ go, with an example such as $(3, 1)$ turned to $(-1, 3)$; and says that
      squaring and adding needs a right angle, deriving $c^2 = a^2 + b^2 - 2ab\cos C$ from the
      coordinates of the two far ends.
