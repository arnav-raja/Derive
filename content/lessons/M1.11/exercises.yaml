  - id: build-polar
    phase: build
    kind: build
    concept: M1.11/sine-and-cosine
    covers: [M1.11/rotation]
    title: A point's distance and angle
    prompt: >-
      Write `polar(x, y)`, which gives two values: the distance `r` of the point `(x, y)` from the
      origin, and the angle, in radians from $-\pi$ to $\pi$, that turns `(1, 0)` towards it. The
      tests turn `(r, 0)` through that angle, which must give back `(x, y)`.
    answer:
      type: code
      starter: |
        import math


        def polar(x, y):
            """The distance of (x, y) from the origin, and its angle in radians from -pi to pi."""
            return 0, 0


        print(polar(1, 1))     # should be about (1.414, 0.785), the square root of 2 and pi / 4
        print(polar(-1, -1))   # should be about (1.414, -2.356)
      tests: |
        import math


        def show(point):
            """A pair with each number to 6 significant figures, and rounding's tiny leftovers as 0."""
            return "(" + ", ".join(f"{0.0 if abs(v) < 1e-12 else v:.6g}" for v in point) + ")"


        def turn(x, y, angle):
            """The tests' own turn about the origin."""
            return x * math.cos(angle) - y * math.sin(angle), x * math.sin(angle) + y * math.cos(angle)


        def test_distance():
            """The distance is the square root of x squared plus y squared."""
            for x, y in [(3, 4), (-5, 12), (-2, -7), (1, 1)]:
                got = polar(x, y)
                assert close(got[0], math.hypot(x, y)), f"polar({x}, {y}) gave the distance {got[0]:.6g}, not {math.hypot(x, y):.6g}."


        def test_four_quarters():
            """The angle is right in every quarter of the plane."""
            for x, y, angle, words in [(1, 1, math.pi / 4, "pi / 4"), (-1, 1, 3 * math.pi / 4, "3 pi / 4"), (-1, -1, -3 * math.pi / 4, "-3 pi / 4"), (1, -1, -math.pi / 4, "-pi / 4")]:
                got = polar(x, y)
                if close(got[1], math.degrees(angle)):
                    assert False, f"polar({x}, {y}) gave the angle {got[1]:.6g}, which is {words} in degrees; the angle should be in radians."
                why = ""
                if close(abs(got[1] - angle), math.pi):
                    why = f" The angle {got[1]:.6g} points the opposite way: check which quarter of the plane ({x}, {y}) is in."
                elif close(abs(got[1] - angle), 2 * math.pi):
                    why = f" The angle {got[1]:.6g} points the right way, but the angle should be from -pi to pi."
                assert close(got[1], angle), f"polar({x}, {y}) gave the angle {got[1]:.6g}, not {words}, about {angle:.6g}.{why}"


        def test_on_the_axes():
            """Points on the axes have the angles 0, pi / 2, pi (or -pi, the same angle) and -pi / 2."""
            for x, y, angle, words in [(2, 0, 0, "0"), (0, 2, math.pi / 2, "pi / 2"), (-2, 0, math.pi, "pi"), (0, -2, -math.pi / 2, "-pi / 2")]:
                try:
                    got = polar(x, y)
                except ZeroDivisionError:
                    axis = "second axis, where x is 0" if x == 0 else "first axis, where y is 0"
                    assert False, f"polar({x}, {y}) stopped with a ZeroDivisionError, a division by 0: ({x}, {y}) is on the {axis}, and its angle is {words}."
                if x < 0 and close(got[1], -math.pi):
                    continue
                assert close(got[1], angle, abs_tol=1e-9), f"polar({x}, {y}) gave the angle {got[1]:.6g}, not {words}."


        def test_round_trip():
            """Turning (r, 0) through the angle gives back the point."""
            for x, y in [(3, 4), (-5, 12), (-0.5, -0.25), (7, -1)]:
                r, angle = polar(x, y)
                back = turn(r, 0, angle)
                assert close(back[0], x, abs_tol=1e-9) and close(back[1], y, abs_tol=1e-9), f"polar({x}, {y}) gave {show((r, angle))}, and turning ({r:.6g}, 0) through {angle:.6g} gives {show(back)}, not ({x}, {y})."
      reference: |
        import math


        def polar(x, y):
            """The distance of (x, y) from the origin, and its angle in radians from -pi to pi."""
            return math.hypot(x, y), math.atan2(y, x)


        print(polar(1, 1))
        print(polar(-1, -1))
      wrong:
        - code: |
            import math


            def polar(x, y):
                return math.hypot(x, y), math.atan(y / x)
          why: >-
            `math.atan(y / x)` sees only the slope, which is the same for $(1, 1)$ and $(-1, -1)$,
            so it gives angles between $-\frac{\pi}{2}$ and $\frac{\pi}{2}$ only, and it divides by 0
            for a point on the second axis.
        - code: |
            import math


            def polar(x, y):
                return math.hypot(x, y), math.atan2(x, y)
          why: >-
            The arguments of `math.atan2` are the wrong way round: it takes $y$ first.
        - code: |
            import math


            def polar(x, y):
                return x**2 + y**2, math.atan2(y, x)
          why: >-
            The distance is the square root of $x^2 + y^2$, not $x^2 + y^2$ itself.
        - code: |
            import math


            def polar(x, y):
                return math.hypot(x, y), math.degrees(math.atan2(y, x))
          why: >-
            The angle is in degrees, but the function promises radians, and turning by it as
            radians lands somewhere else.
    explanation: >-
      `math.hypot(x, y)` is $\sqrt{x^2 + y^2}$, and `math.atan2(y, x)` is the angle of the point
      itself, so turning $(r, 0)$ through it reaches $(r\cos\theta, r\sin\theta) = (x, y)$. A
      point's distance and angle are called its *polar coordinates*.

  - id: build-cosine-schedule
    phase: build
    kind: build
    concept: M1.11/sine-and-cosine
    covers: [M1.11/radians]
    title: The puzzle's schedule
    prompt: >-
      Write `cosine_lr(step, total, top, bottom)`, the learning rate at `step` of a run of `total`
      steps, which follows the puzzle's wheel from `top` at step 0 down to `bottom` at the last
      step. After `step` of the `total` steps the wheel has turned through that fraction of half a
      turn, and the rate is the fraction $\frac{1 + \cos\theta}{2}$ of the way from `bottom` up to
      `top`, where $\theta$ is the angle turned.
    answer:
      type: code
      starter: |
        import math


        def cosine_lr(step, total, top, bottom):
            """The learning rate at step, of total steps, falling along a cosine from top to bottom."""
            return top


        print(cosine_lr(0, 10000, 0.001, 0))       # should be 0.001
        print(cosine_lr(2500, 10000, 0.001, 0))    # the puzzle's step
        print(cosine_lr(10000, 10000, 0.001, 0))   # should be about 0
      tests: |
        import math


        def test_start_and_end():
            """The rate is top at step 0 and bottom at the last step."""
            for total, top, bottom in [(10000, 0.001, 0), (500, 0.003, 0.0003), (8, 1, 0.5)]:
                first = cosine_lr(0, total, top, bottom)
                last = cosine_lr(total, total, top, bottom)
                assert close(first, top), f"cosine_lr(0, {total}, {top}, {bottom}) gave {first:.6g}, not top, {top}."
                hint = " At the last step the wheel has turned half a turn, math.pi radians, where the cosine is -1." if last > bottom else " The rate should never fall below bottom."
                assert close(last, bottom, abs_tol=1e-12), f"cosine_lr({total}, {total}, {top}, {bottom}) gave {last:.6g}, not bottom, {bottom}.{hint}"


        def test_halfway():
            """Halfway through, the rate is halfway between top and bottom."""
            for total, top, bottom in [(10000, 0.001, 0), (500, 0.003, 0.0003)]:
                got = cosine_lr(total // 2, total, top, bottom)
                want = (top + bottom) / 2
                assert close(got, want), f"cosine_lr({total // 2}, {total}, {top}, {bottom}) gave {got:.6g}, not {want:.6g}, halfway between top and bottom."


        def test_never_rises():
            """The rate never goes up from one step to the next."""
            before = cosine_lr(0, 1000, 0.002, 0.0002)
            for step in range(1, 1001):
                now = cosine_lr(step, 1000, 0.002, 0.0002)
                assert now <= before + 1e-15, f"The rate rose from {before:.6g} at step {step - 1:,} to {now:.6g} at step {step:,}."
                before = now


        def test_cosine_shape():
            """It stays above a straight line from top to bottom for the first half, and below it for the second."""
            for step in [100, 2500, 4900]:
                got = cosine_lr(step, 10000, 0.001, 0)
                line = 0.001 * (1 - step / 10000)
                assert got > line, f"At step {step:,} of 10,000 the rate is {got:.6g}, not above the straight line's {line:.6g}: a cosine schedule falls slowly at first."
            for step in [5100, 7500, 9900]:
                got = cosine_lr(step, 10000, 0.001, 0)
                line = 0.001 * (1 - step / 10000)
                assert got < line, f"At step {step:,} of 10,000 the rate is {got:.6g}, not below the straight line's {line:.6g}: a cosine schedule falls fast in the middle."
      reference: |
        import math


        def cosine_lr(step, total, top, bottom):
            """The learning rate at step, of total steps, falling along a cosine from top to bottom."""
            angle = math.pi * step / total
            return bottom + (top - bottom) * (1 + math.cos(angle)) / 2


        print(cosine_lr(0, 10000, 0.001, 0))
        print(cosine_lr(2500, 10000, 0.001, 0))
        print(cosine_lr(10000, 10000, 0.001, 0))
      wrong:
        - code: |
            import math


            def cosine_lr(step, total, top, bottom):
                return bottom + (top - bottom) * (1 + math.cos(step / total)) / 2
          why: >-
            The angle is the fraction of the run, not that fraction of half a turn, $\pi$ radians,
            so the wheel turns through only 1 radian and the rate ends well above `bottom`.
        - code: |
            import math


            def cosine_lr(step, total, top, bottom):
                return bottom + (top - bottom) * (1 + math.cos(180 * step / total)) / 2
          why: >-
            Half a turn written as 180 degrees, but `math.cos` takes radians, so the angle runs to
            180 radians and the rate goes up and down many times.
        - code: |
            import math


            def cosine_lr(step, total, top, bottom):
                return bottom + (top - bottom) * (1 - math.cos(math.pi * step / total)) / 2
          why: >-
            $1 - \cos\theta$ in place of $1 + \cos\theta$ follows the mark's height from the top,
            so the rate starts at `bottom` and climbs to `top`.
        - code: |
            import math


            def cosine_lr(step, total, top, bottom):
                return top * (1 + math.cos(math.pi * step / total)) / 2
          why: >-
            It falls from `top` to 0 and ignores `bottom`, which is right only when `bottom` is 0.
    explanation: >-
      The angle after `step` steps is $\pi \cdot \frac{\text{step}}{\text{total}}$, and the rate is
      `bottom` plus the fraction $\frac{1 + \cos\theta}{2}$ of `top - bottom`. At the puzzle's step
      2,500 that is $0.001 \times \frac{1 + \cos\frac{\pi}{4}}{2} \approx 0.000854$.

