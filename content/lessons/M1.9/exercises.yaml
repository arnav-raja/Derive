  - id: debug-power
    phase: build
    kind: debug
    concept: M1.9/strong-induction
    covers: [M1.9/structural-induction]
    title: A power by halving
    prompt: >-
      `power(x, n)` should give $x^n$ for every whole number `n`, by halving `n`: for even `n`,
      $x^n$ is $x^{n/2} \times x^{n/2}$. For 2 to the powers 0 to 5 it prints 1, 2, 4, 4, 16 and 8.
      Find the first `n` for which it goes wrong, and which case of its proof's step fails there,
      then mend the function; once the tests pass, the answer says whether you were right. The
      tests also try `power(3, 5000)`.
    answer:
      type: code
      starter: |
        def power(x, n):
            """x to the power n, for a whole number n, worked out from x to the power n // 2."""
            if n == 0:
                return 1
            half = power(x, n // 2)
            if n % 2 == 0:
                return half * half
            return half * x

        for n in range(6):
            print(n, power(2, n))
      tests: |
        def test_small():
            """power(x, n) is x^n for every integer x from -3 to 3 and every n from 0 to 12."""
            for x in range(-3, 4):
                for k in range(13):
                    got = power(x, k)
                    assert got == x ** k, f"power({x}, {k}) gives {got!r}, not {x ** k:,}."

        def test_odd():
            """Odd powers come out right: power(2, 3) is 8 and power(2, 5) is 32."""
            for k, right in ((3, 8), (5, 32), (7, 128), (9, 512)):
                got = power(2, k)
                assert got == right, f"power(2, {k}) gives {got!r}, not {right}."

        def test_fraction():
            """power(0.5, 10) is 0.0009765625, which is 0.5^10 exactly."""
            got = power(0.5, 10)
            assert got == 0.0009765625, f"power(0.5, 10) gives {got!r}, not 0.0009765625."

        def test_large():
            """power(3, 5000) is 3^5000, a number with 2,386 digits, which halving reaches in a chain of 14 calls."""
            got = power(3, 5000)
            assert got == 3 ** 5000, "power(3, 5000) is not 3 to the power 5,000."
      reference: |
