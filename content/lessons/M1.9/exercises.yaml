  # Explain --------------------------------------------------------------------
  - id: explain-induction
    phase: explain
    kind: explain
    concept: M1.9/induction
    covers: [M1.9/strong-induction, M1.9/recurrences, M1.9/structural-induction]
    title: Tiles, stamps and programs, simply
    prompt: >-
      Explain to your friend how the puzzle is settled for a grid 1,024 by 1,024 without trying a
      single grid of that size: the base case, the step and its tile across the centre, and why the
      two together reach 1,024. Say why each part is needed, with an example of an argument that
      goes wrong without it. Then explain how a recurrence counts the tiles and how induction proves
      its closed form, why the stamps from 12 rupees up need four base cases, and why proving a
      recursive function right, such as `total` or `power`, is the same kind of argument.
    answer:
      type: text
      rubric:
        - { id: base-step, criterion: 'Gives the base case, a grid 2 by 2 less one square is one tile, and the step: the tile across the centre leaves four grids half as wide, each with one square gone, which the claim for the smaller width covers.' }
        - { id: chain, criterion: 'Says why the two reach 1,024 without any grid of that size being tried: from the base case, nine steps each double the width; or a smallest width that failed would have to follow one that worked.' }
        - { id: both-needed, criterion: 'Says why each part is needed, with an example of each: a step with no base case can carry a false claim, as for $n^2 + n$ being odd, and a step that fails for one $k$ breaks the chain, as from one model to two. Other correct examples count.' }
        - { id: recurrence, criterion: 'Gets the count of tiles from $T(1) = 1$ and $T(k + 1) = 4T(k) + 1$, gives or checks $T(n) = \frac{4^n - 1}{3}$, and finds $T(10) = 349{,}525$.' }
        - { id: strong, criterion: 'Explains strong induction with the stamps: the step makes $k + 1$ from $k - 3$, four amounts back, so 12, 13, 14 and 15 are all base cases.' }
        - { id: programs, criterion: 'Says that trusting a recursive function, by its base case and then each call on the assumption that the smaller calls are right, is a proof by induction on the size of its argument.' }
      reference: >-
        Start small. A grid 2 by 2 with one square cut out is exactly one tile: that is the base
        case. Now suppose that every grid of some width, with one square cut out anywhere, can be
        covered, and take a grid twice as wide. Split it into four quarters. The cut square is in
        one of them. Put one tile across the centre, with one square in each of the other three
        quarters. Now every quarter is a grid of the smaller width with one square gone, and each
        can be covered: that is the step. From 2 by 2, nine steps, each doubling the width, reach
        1,024 by 1,024, and no grid of that size is ever tried. Put another way, if some width
        failed, the smallest that failed would be twice a width that worked, and the step rules
        that out. Both parts are needed. The step for "$n^2 + n$ is odd" is perfectly valid, since
        adding $2(k + 1)$ keeps a number odd, but no case starts the chain, and in fact $n^2 + n$
        is always even. And one bad step breaks everything: the argument that any number of models
        give the same answer fails only at the step from one model to two, where the two groups
        share no model, and that is enough for the whole chain to fall. The count of tiles follows
        the same pattern. Write $T(n)$ for the tiles that cover a grid $2^n$ wide less one square:
        $T(1) = 1$, and the step gives $T(k + 1) = 4T(k) + 1$, four quarters and the centre tile.
        The first values, 1, 5, 21 and 85, suggest $T(n) = \frac{4^n - 1}{3}$, and induction
        proves it: it is 1 at $n = 1$, and $4 \times \frac{4^k - 1}{3} + 1 = \frac{4^{k+1} - 1}{3}$.
        So $T(10) = \frac{1{,}048{,}576 - 1}{3} = 349{,}525$. With stamps of 4 and 5 rupees, an
        amount $k + 1$ can be made from $k - 3$ and one more 4, so the step leans four amounts back,
        and needs four base cases: 12, 13, 14 and 15, each made by hand. That is strong induction,
        which may assume every case below. Finally, a recursive function is trusted the same way:
        check the base case, then check each call on the assumption that the smaller calls it makes
        are right. That is induction on the size of the argument, the length of the list for
        `total`, or strong induction on $n$ for `power`, which leans on $n$ halved; for a tree, it
        is induction from the leaves up.
      minWords: 120
      maxWords: 500
    explanation: >-
      A strong answer gives the base case, one tile, and the step, the tile across the centre that
      leaves four grids half as wide, and says why the two reach 1,024: nine doublings, or no
      smallest failure. It shows a step with no base case carrying a false claim, and a single
      failed step, from one model to two, breaking the chain. It finds the count from
      $T(k + 1) = 4T(k) + 1$, proves $T(n) = \frac{4^n - 1}{3}$, explains the four base cases of
      the stamps, and sees the trust in a recursive function as induction on the size of its
      argument.
