code: M1.10
title: "Counting: permutations, combinations and the binomial theorem"
course: M1
status: ready
summary: >-
  A script fits one model for every set of features that can be made from 30, from none of them to
  all 30, at one second a fit. How long does it run? Choices made in steps and in cases, orders and
  ordered choices, choices with no order and Pascal's triangle, and the binomial theorem, proved by
  counting and again by induction.
sittings: 2
minutes:
  puzzle: 10
  recall: 10
  explore: 45
  derive: 40
  build: 55
  explain: 25
concepts:
  taught:
    - id: M1.10/counting-rules
      name: Counting by steps and by cases
      summary: >-
        A choice made in steps, where each step has the same number of options whatever was chosen
        before it, can be made in as many ways as the product of those numbers: 5 learning rates,
        4 batch sizes and 3 depths make 60 runs. Cases that cannot happen together add. Cases that
        overlap must not simply be added, since a code with two 0s would be counted twice, and it
        is often quicker to count what is not wanted and take it away: $10^4 - 9^4 = 3{,}439$ codes
        of 4 digits have at least one 0.
      usedBy: [M4.1, L4.1]
    - id: M1.10/permutations
      name: Permutations
      summary: >-
        An ordered choice of $k$ things from $n$ different things, such as a podium of 3 from 10
        models, can be made in $n(n - 1) \cdots (n - k + 1) = \frac{n!}{(n - k)!}$ ways, 720 for the
        podium. With $k = n$ these are the $n!$ orders of all $n$ things, which needs $0! = 1$, the
        one order of nothing. That $n$ things have $n!$ orders is proved by induction: taking out
        the last thing leaves an order of the rest and one of the places it sat in.
      usedBy: [M4.1, E2.5]
    - id: M1.10/combinations
      name: Combinations
      summary: >-
        A choice of $k$ things from $n$ with no order is a subset, and there are
        $\binom{n}{k} = \frac{n!}{k!\,(n - k)!}$ of them: the ordered choices, divided by the $k!$
        orders of each set, so $\binom{10}{3} = \frac{720}{6} = 120$. Choosing $k$ is choosing the
        $n - k$ left out, so $\binom{n}{k} = \binom{n}{n - k}$. Pascal's rule,
        $\binom{n}{k} = \binom{n - 1}{k - 1} + \binom{n - 1}{k}$, splits the sets by whether they
        hold the last thing, and builds Pascal's triangle. A set of $n$ things has $2^n$ subsets.
      usedBy: [M4.1, M4.5]
    - id: M1.10/binomial-theorem
      name: The binomial theorem
      summary: >-
        $(a + b)^n = \sum_{k=0}^{n} \binom{n}{k} a^{n-k} b^k$. Multiplying out takes $a$ or $b$
        from each bracket, and $\binom{n}{k}$ of the $2^n$ products take $b$ from exactly $k$
        brackets. Induction proves it again, with Pascal's rule in the step. With $a = b = 1$ it
        counts all $2^n$ subsets, and with $a = 1$ and $b = -1$ it shows that a set has as many
        subsets with an even number of elements as with an odd number.
      usedBy: [M4.5, M4.6]
  used:
    - M1.9/induction
    - M1.8/proof
    - M1.8/direct-proof
    - M1.7/sets
    - M1.6/product-notation
    - M1.6/arithmetic-series
    - M1.6/sigma-notation
