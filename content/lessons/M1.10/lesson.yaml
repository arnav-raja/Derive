    - M1.2/equivalence
    - M1.2/exponent-rules
    - M1.1/powers-of-ten
    - M1.1/fermi-estimation
    - E1.5/base-and-recursive-case
    - E1.5/recursive-structures
    - E1.4/lists
    - E1.4/aliasing-and-mutation
    - E1.4/cost-of-operations
    - E1.3/defining-functions
    - E1.2/loops
