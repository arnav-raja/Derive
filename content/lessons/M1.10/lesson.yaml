    - E1.1/floats-are-approximate
links:
  requires:
    - lesson: M1.9
      bridge: >-
        M1.9 proved claims about every whole number with a base case and a step. Counting makes
        such claims: $n$ things have $n!$ orders, and $(a + b)^n$ multiplies out by the binomial
        theorem. This lesson proves both by induction on $n$, and the binomial theorem's step
        uses Pascal's rule.
  anotherViewOf:
    - lesson: E1.4
      bridge: >-
        E1.4 counted the comparisons that checking each of $n$ different documents against those
        kept makes, $\frac{n(n - 1)}{2}$, by adding $0 + 1 + \dots + (n - 1)$. They are the pairs of
        documents, $\binom{n}{2}$: the $n(n - 1)$ ordered pairs, with each pair counted once in each
        order.
  applies:
    - lesson: M1.7
      bridge: >-
        M1.7's sets are what this lesson counts: a combination is a subset, a set of $n$ things has
        $2^n$ subsets, and when two cases overlap, $|A \cup B| = |A| + |B| - |A \cap B|$ stops the
        elements they share from being counted twice.
  foreshadows:
    - lesson: M4.1
      bridge: >-
        When every outcome is equally likely, a probability is the number of outcomes wanted over
        the number of all of them. M4.1 counts them with this lesson's rules, and checks the counts
        against simulation.
    - lesson: M4.5
      bridge: >-
        $k$ successes in $n$ independent trials can happen in $\binom{n}{k}$ ways, each with chance
        $p^k (1 - p)^{n - k}$. M4.5 calls this count of successes a binomial random variable, and
        the binomial theorem shows that its chances add up to 1.
