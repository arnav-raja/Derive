  - id: explain-counting
    phase: explain
    kind: explain
    concept: M1.10/combinations
    covers: [M1.10/counting-rules, M1.10/permutations, M1.10/binomial-theorem]
    title: Sets of features, simply
    prompt: >-
      Explain to your friend why $10 \times 9 \times 8$ counts each set of 3 features more than
      once, how many times, and how many sets there really are. Then explain why choosing 3
      features to try gives as many sets as choosing 7, why Pascal's rule holds and how it builds
      the counts row by row, why 10 features have $2^{10}$ sets of every size in all, and why the
      same counts are the numbers in front of the terms of $(a + b)^n$ multiplied out. Give an
      example for each.
    answer:
      type: text
      rubric:
        - { id: ordered, criterion: 'Says what $10 \times 9 \times 8$ counts, and which rule gives that count.' }
        - { id: overcount, criterion: 'Says how many times $10 \times 9 \times 8$ counts each set of 3 features, and why, and how many sets there are.' }
        - { id: symmetry, criterion: 'Says why choosing 3 features to try gives as many sets as choosing 7.' }
        - { id: pascal, criterion: 'Says why Pascal''s rule holds and how it builds each row of the triangle from the row above, with an example.' }
        - { id: subsets, criterion: 'Says why 10 features have $2^{10}$ sets of every size in all.' }
        - { id: binomial, criterion: 'Says why the numbers in front of the terms of $(a + b)^n$ multiplied out are the same counts, with an example.' }
      reference: >-
        Your 720 counts something real, but not sets. The product rule says that if a first step can
        be done in 10 ways, then a second in 9 ways whatever the first was, then a third in 8, the
        three steps together can be done in $10 \times 9 \times 8 = 720$ ways. So 720 counts the ways
        to pick a first feature, a second and a third: ordered choices, like podiums. A set has no
        order, though. The set of size, age and location turns up as size, then age, then location;
        as size, then location, then age; and so on, once for each order of its 3 features. Three
        things have $3 \times 2 \times 1 = 3! = 6$ orders, by the product rule again, so every set
        is counted 6 times, and there are $\frac{720}{6} = 120$ sets. In general there are
        $\binom{n}{k} = \frac{n(n - 1) \cdots (n - k + 1)}{k!}$ sets of $k$ things from $n$.
        Choosing the 3 to try is the same as choosing the 7 to leave out, since each choice fixes
        the other, so there are $\binom{10}{7} = 120$ sets of 7 as well. The counts can also be
        built without any division. Fix one feature, say age. A set of 3 either holds age, with 2
        more from the other 9, in $\binom{9}{2} = 36$ ways, or leaves it out, with all 3 from the
        other 9, in $\binom{9}{3} = 84$ ways. No set is both, so $\binom{10}{3} = 36 + 84 = 120$.
        That is Pascal's rule: each count is the sum of two in the row above, which builds the
        triangle row by row from the 1 at the top. Now count the sets of every size at once: each
        of the 10 features is either in or out, 2 choices each, so there are $2^{10} = 1{,}024$
        sets, from the empty set to all ten, and row 10 of the triangle adds up to 1,024. Finally,
        multiplying out $(a + b)^3 = (a + b)(a + b)(a + b)$ takes $a$ or $b$ from each bracket. The
        products with $b$ from exactly one bracket are $baa$, $aba$ and $aab$, one for each choice of
        that bracket, so $a^2 b$ comes $\binom{3}{1} = 3$ times, and
        $(a + b)^3 = a^3 + 3a^2 b + 3ab^2 + b^3$, with row 3 of the triangle in front of the terms.
        In general the number in front of $a^{n - k} b^k$ is $\binom{n}{k}$, which is the binomial
        theorem.
      minWords: 120
      maxWords: 500
    explanation: >-
      A strong answer shows that 720 counts ordered choices, by the product rule, and that each set
      of 3 turns up once for each of its $3! = 6$ orders, so there are 120 sets. It pairs the 3
      chosen with the 7 left out, so $\binom{10}{3} = \binom{10}{7}$; splits the sets by one
      feature, $36 + 84 = 120$, which is Pascal's rule; counts all $2^{10} = 1{,}024$ sets by in or
      out for each feature; and finds $\binom{n}{k}$ in front of $a^{n - k} b^k$ by counting the
      brackets that give $b$.
