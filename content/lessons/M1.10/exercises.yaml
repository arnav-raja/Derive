  - id: breakit-float-choose
    phase: build
    kind: breakit
    concept: M1.10/combinations
    title: A count in floats
    prompt: Predict what happens after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        import math

        def choose(n, k):
            """n choose k, from the factorial formula."""
            return math.factorial(n) // (math.factorial(k) * math.factorial(n - k))

        count = choose(100, 50)
        print(count)
        print(count == math.comb(100, 50))
      broken: |
        import math

        def choose(n, k):
            """n choose k, from the factorial formula."""
            return math.factorial(n) / (math.factorial(k) * math.factorial(n - k))

        count = choose(100, 50)
        print(count)
        print(count == math.comb(100, 50))
      change: '`choose` divides with `/` instead of `//`.'
      options:
        - { id: same, label: 'It prints the same two lines', when: "error is None and type(count) is int and count == base['count']" }
        - { id: close, label: 'It prints a float close to the count, then `False`', when: "error is None and type(count) is float and count != base['count']" }
        - { id: dot-zero, label: 'It prints the same count with `.0` on the end, then `True`', when: "error is None and type(count) is float and count == base['count']" }
        - { id: overflow, label: 'Python stops with an error: the factorials are too big for a float', when: 'error is not None' }
    explanation: >-
      It prints `1.008913445455642e+29`, then `False`. `/` always gives a float, and a float keeps
      about 16 significant figures, while $\binom{100}{50}$ has 30 digits, so the float nearest to
      the count is wrong from its 16th digit on. There is no error: Python divides two ints with
      `/` by finding the quotient exactly and rounding it to the nearest float, and a number near
      $10^{29}$ is well inside the range of floats. Counts are whole numbers, and `//` keeps them
      exact.

