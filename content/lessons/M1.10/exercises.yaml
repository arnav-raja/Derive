exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-feature-sets
    phase: puzzle
    kind: predict
    concept: M1.10/counting-rules
    title: Every set of 30 features
    prompt: >-
      A script fits one model for every set of features that can be made from 30 candidates, from
      no features at all up to all 30, at one second a fit. About how long does it run?
    answer:
      type: choice
      options:
        - { id: pairs, label: 'About 7 minutes' }
        - { id: square, label: 'About 15 minutes' }
        - { id: years, label: 'About 34 years' }
        - { id: universe, label: 'Far longer than the universe has existed' }
      correct: [years]
    explanation: >-
      Each of the 30 features is in a set or out of it, 2 choices each, so there are
      $2^{30} = 1{,}073{,}741{,}824$ sets, and that many seconds is about 34 years. About 7 minutes
      is the 435 pairs of features, about 15 minutes is every pair taken in both orders,
      $30 \times 29 = 870$ fits, and far longer than the universe has existed is what every order of
      all 30 would take.

  # Recall ---------------------------------------------------------------------
  - id: recall-factorials
    phase: recall
    kind: recall
    concept: M1.6/product-notation
    prompt: What is $\dfrac{8!}{6!}$?
    answer: { type: number, value: 56, tolerance: { abs: 0 } }
    explanation: >-
      Every factor from 6 down to 1 is on both the top and the bottom, so they cancel, and
      $\frac{8!}{6!} = 8 \times 7 = 56$.

  - id: recall-union
    phase: recall
    kind: recall
    concept: M1.7/sets
    prompt: Of 40 images in a dataset, 25 show a cat, 18 show a dog, and 10 show both. How many show a cat or a dog, or both?
    answer: { type: number, value: 33, tolerance: { abs: 0 } }
    explanation: >-
      $|A \cup B| = |A| + |B| - |A \cap B| = 25 + 18 - 10 = 33$. Adding 25 and 18 counts the 10
      images that show both twice, so they are taken away once. The other 7 images show neither.

  - id: recall-pairs-sum
    phase: recall
    kind: recall
    concept: M1.6/arithmetic-series
    prompt: What is $1 + 2 + 3 + \dots + 29$?
    answer: { type: number, value: 435, tolerance: { abs: 0 } }
    explanation: >-
      $\frac{n(n + 1)}{2}$ with $n = 29$ gives $\frac{29 \times 30}{2} = 435$. Pairing gives the
      same: $1 + 29$, $2 + 28$ and so on make 14 pairs of 30, which is 420, and the middle term,
      15, is left over.

  - id: recall-induction-step
    phase: recall
    kind: recall
    concept: M1.9/induction
    prompt: A proof by induction of a claim $P(n)$, for every whole number $n \ge 0$, has proved $P(0)$. What else must it prove?
    answer:
      type: choice
      options:
        - { id: step, label: 'That for every $k \ge 0$, if $P(k)$ is true, then $P(k + 1)$ is true' }
        - { id: one-more, label: 'That $P(1)$ is true as well, so that the chain has started' }
        - { id: backwards, label: 'That for every $k \ge 1$, if $P(k)$ is true, then $P(k - 1)$ is true' }
        - { id: every, label: 'That $P(n)$ is true for every $n \ge 0$, using $P(0)$' }
      correct: [step]
    explanation: >-
      The inductive step: for every $k \ge 0$, $P(k)$ gives $P(k + 1)$. Then $P(0)$ gives $P(1)$,
      which gives $P(2)$, and so on for every $n$. One more case proves only one more case, a step
      that runs backwards carries nothing forward from $P(0)$, and assuming $P(n)$ for every $n$
      assumes the claim itself.

  - id: recall-cube
    phase: recall
    kind: recall
    concept: M1.2/equivalence
    prompt: Which of these is equal to $(a + b)^3$ for all numbers $a$ and $b$?
    answer:
      type: choice
      options:
        - { id: cubes, label: '$a^3 + b^3$' }
        - { id: twos, label: '$a^3 + 2a^2 b + 2ab^2 + b^3$' }
        - { id: ones, label: '$a^3 + a^2 b + ab^2 + b^3$' }
        - { id: right, label: '$a^3 + 3a^2 b + 3ab^2 + b^3$' }
      correct: [right]
    explanation: >-
      $(a + b)^3 = (a + b)(a^2 + 2ab + b^2) = a^3 + 2a^2 b + ab^2 + a^2 b + 2ab^2 + b^3$, which
      collects to $a^3 + 3a^2 b + 3ab^2 + b^3$. A check at $a = b = 1$: $2^3 = 8$, and
      $1 + 3 + 3 + 1 = 8$, while the other choices add up to 2, 6 and 4.

  # Explore --------------------------------------------------------------------
  - id: explore-grid-search
    phase: explore
    kind: predict
    concept: M1.10/counting-rules
    title: A grid search
    prompt: >-
      A grid search trains one model for every way of picking one of 5 learning rates, one of 4
      batch sizes and one of 3 numbers of layers. How many models does it train?
    answer: { type: number, value: 60, tolerance: { abs: 0 } }
    explanation: >-
      Each of the 5 learning rates goes with each of the 4 batch sizes, making 20 pairs, and each
      pair goes with each of the 3 numbers of layers: $5 \times 4 \times 3 = 60$.
    placement: true
    review:
      variants:
        - prompt: A password is 2 capital letters, each from A to Z, followed by 3 digits, each from 0 to 9. How many different passwords are there?
          answer: { type: number, value: 676000, tolerance: { abs: 0 } }
          explanation: >-
            Five steps: 26 choices for each letter and 10 for each digit, whatever came before, so
            $26 \times 26 \times 10 \times 10 \times 10 = 676{,}000$.
        - prompt: >-
            A choice is made in 4 steps, with 3 options at each step, but which 3 options a step
            offers depends on what was chosen before it. In how many ways can the choice be made?
          answer:
            type: choice
            options:
              - { id: sum, label: '12, three options at each of 4 steps' }
              - { id: product, label: '81, by the product rule' }
              - { id: unknown, label: 'It cannot be known without the list of options at each step' }
              - { id: power, label: '64, four options at each of 3 steps' }
            correct: [product]
          explanation: >-
            The product rule needs only the number of options at each step to stay the same
            whatever came before, not the options themselves, so $3 \times 3 \times 3 \times 3 = 81$.
            Adding the options would count the steps, not the ways to make all of them.
        - prompt: A search tries one optimiser at 6 learning rates, and a second optimiser at the same 6 rates, each with 3 strengths of momentum. How many models does it train?
          answer: { type: number, value: 24, tolerance: { abs: 0 } }
          explanation: >-
            Two cases that cannot happen together, so they add: 6 runs with the first optimiser,
            and $6 \times 3 = 18$ with the second, by the product rule, which makes $6 + 18 = 24$.

  - id: explore-at-least-one
    phase: explore
    kind: predict
    concept: M1.10/counting-rules
    title: Codes with a 0
    prompt: How many of the 10,000 codes of 4 digits, from 0000 to 9999, have at least one 0?
    answer: { type: number, value: 3439, tolerance: { abs: 0 } }
    explanation: >-
      The codes with no 0 have 9 choices for each digit, $9^4 = 6{,}561$ of them, so
      $10{,}000 - 6{,}561 = 3{,}439$ have at least one 0. Four places for the 0 times 1,000 for the
      rest gives 4,000, which counts a code once for every 0 it has: 0012 twice, and 0000 four
      times.
    review:
      variants:
        - prompt: How many strings of 5 bits, each 0 or 1, have at least one 1?
          answer: { type: number, value: 31, tolerance: { abs: 0 } }
          explanation: >-
            There are $2^5 = 32$ strings, and only one, 00000, has no 1, so 31 have at least one.
        - prompt: How many codes of 3 digits, each from 0 to 9, have at least two digits the same?
          answer: { type: number, value: 280, tolerance: { abs: 0 } }
          explanation: >-
            Count the codes whose digits are all different instead: $10 \times 9 \times 8 = 720$.
            The other $1{,}000 - 720 = 280$ codes have at least two digits the same.
        - prompt: >-
            Each 4-digit code with a 0 is counted once for each of the sets "0 in place 1", "0 in
            place 2", "0 in place 3" and "0 in place 4" that it is in. How many times is the code
            0705 counted?
          answer: { type: number, value: 2, tolerance: { abs: 0 } }
          explanation: >-
            0705 has a 0 in place 1 and another in place 3, so it is in two of the four sets and is
            counted twice. That is why adding the four sets, 4,000 codes, overcounts the 3,439 codes
            with at least one 0.

  - id: explore-podium
    phase: explore
    kind: predict
    concept: M1.10/permutations
    title: Gold, silver and bronze
    prompt: Ten models are tested on a benchmark. In how many different ways can gold, silver and bronze go to three of them?
    answer: { type: number, value: 720, tolerance: { abs: 0 } }
    explanation: >-
      Any of the 10 can take gold, any of the 9 others silver, and any of the 8 left bronze:
      $10 \times 9 \times 8 = 720$. Which 8 are left depends on who took gold and silver, but there
      are always 8, which is all the product rule needs.
    placement: true
    review:
      variants:
        - prompt: In how many different orders can 5 different jobs be run, one after another?
          answer: { type: number, value: 120, tolerance: { abs: 0 } }
          explanation: >-
            Any of the 5 first, any of the 4 left second, and so on: $5! = 120$.
        - prompt: Why is $0!$ taken to be 1?
          answer:
            type: choice
            options:
              - { id: zero, label: 'It is really 0, but calling it 1 avoids dividing by 0 in $\frac{n!}{(n - k)!}$ at $k = n$' }
              - { id: fits, label: 'There is one way to put nothing in order, and it keeps $\frac{n!}{(n - k)!}$ right at $k = n$' }
              - { id: habit, label: 'It is a convention with no reason behind it, kept because textbooks have always used it' }
            correct: [fits]
          explanation: >-
            There is exactly one order of nothing, the empty order, and $0! = 1$ makes
            $\frac{n!}{(n - n)!} = n!$, the orders of all $n$ things, and keeps
            $(n + 1)! = (n + 1) \times n!$ true at $n = 0$.
        - prompt: A playlist plays 4 different songs, chosen from 8, one after another. How many different playlists are there?
          answer: { type: number, value: 1680, tolerance: { abs: 0 } }
          explanation: >-
            Order matters, so it is an ordered choice of 4 from 8: $8 \times 7 \times 6 \times 5 = 1{,}680$,
            which is $\frac{8!}{4!}$.

  - id: explore-sets-of-three
    phase: explore
    kind: predict
    concept: M1.10/combinations
    title: Sets of three features
    prompt: How many different sets of 3 features can be chosen from 10, if a set has no order?
    answer: { type: number, value: 120, tolerance: { abs: 0 } }
    explanation: >-
      The 720 ordered choices of 3 from 10 count each set once for each of its $3! = 6$ orders, so
      there are $\frac{720}{6} = 120$ sets.
    placement: true
    review:
      variants:
        - prompt: How many different pairs can be made from 8 models, if a pair has no order?
          answer: { type: number, value: 28, tolerance: { abs: 0 } }
          explanation: >-
            $8 \times 7 = 56$ ordered pairs, and each pair is counted in both of its orders, so
            $\binom{8}{2} = \frac{56}{2} = 28$.
        - prompt: How many sets of 4 features can be chosen from 6?
          answer: { type: number, value: 15, tolerance: { abs: 0 } }
          explanation: >-
            $\binom{6}{4} = \frac{6 \times 5 \times 4 \times 3}{4!} = \frac{360}{24} = 15$, or
            $\binom{6}{2} = 15$, by choosing the 2 left out.
        - prompt: The 720 podiums of 3 from 10 models are divided by 6 to count the sets of 3. Why 6?
          answer:
            type: choice
            options:
              - { id: half, label: 'Each set appears twice, once each way round, and 3 sets of 2 make 6' }
              - { id: members, label: 'A set of 3 can be split into 6 smaller sets' }
              - { id: left, label: 'There are 6 ways to choose which 7 models are left out' }
              - { id: orders, label: 'Each set of 3 is one podium in each of its $3! = 6$ orders' }
            correct: [orders]
          explanation: >-
            Each set of 3 models makes one podium for each order of its three members, and 3 things
            have $3 \times 2 \times 1 = 6$ orders, so every set is counted 6 times among the 720.

  - id: explore-leave-out
    phase: explore
    kind: predict
    concept: M1.10/combinations
    title: Twenty-eight of thirty
    prompt: In how many ways can 28 of 30 features be chosen, with no order?
    answer: { type: number, value: 435, tolerance: { abs: 0 } }
    explanation: >-
      Choosing the 28 to keep is the same as choosing the 2 to leave out, so
      $\binom{30}{28} = \binom{30}{2} = \frac{30 \times 29}{2} = 435$.
    review:
      variants:
        - prompt: What is $\binom{20}{18}$?
          answer: { type: number, value: 190, tolerance: { abs: 0 } }
          explanation: >-
            Choosing 18 is choosing the 2 left out: $\binom{20}{2} = \frac{20 \times 19}{2} = 190$.
        - prompt: What is $\binom{100}{99}$?
          answer: { type: number, value: 100, tolerance: { abs: 0 } }
          explanation: >-
            Choosing 99 of 100 is choosing the 1 left out, in 100 ways.
        - prompt: Why is $\binom{n}{k}$ equal to $\binom{n}{n - k}$?
          answer:
            type: choice
            options:
              - { id: formula, label: 'Because $n - k$ and $k$ add up to $n$, and that is all a count depends on' }
              - { id: symmetric, label: 'Because every row of numbers is the same read backwards, which needs no reason' }
              - { id: pairing, label: 'Each set of $k$ chosen goes with exactly one set of $n - k$ left out' }
            correct: [pairing]
          explanation: >-
            Sending each set of $k$ to the $n - k$ it leaves out pairs the two collections off one
            to one, with nothing left over, so they are the same size. The triangle's rows read the
            same backwards because of this, not the other way round.

  - id: explore-with-last
    phase: explore
    kind: predict
    concept: M1.10/combinations
    title: With the last feature, or without
    prompt: Of the 10 ways to choose 2 of the 5 features numbered 1 to 5, how many include feature 5?
    answer: { type: number, value: 4, tolerance: { abs: 0 } }
    explanation: >-
      A set of 2 with feature 5 has one more feature, any of the other 4: $\binom{4}{1} = 4$. The
      other $\binom{4}{2} = 6$ sets take both features from features 1 to 4, and $4 + 6 = 10$, the
      two entries above $\binom{5}{2}$ in the triangle.
    placement: true
    review:
      variants:
        - prompt: Of the $\binom{6}{2} = 15$ ways to choose 2 of 6 features, numbered 1 to 6, how many leave feature 6 out?
          answer: { type: number, value: 10, tolerance: { abs: 0 } }
          explanation: >-
            They choose both features from features 1 to 5: $\binom{5}{2} = 10$. The other
            $\binom{5}{1} = 5$ sets hold feature 6.
        - prompt: Row 6 of Pascal's triangle is 1, 6, 15, 20, 15, 6, 1. What is $\binom{7}{3}$?
          answer: { type: number, value: 35, tolerance: { abs: 0 } }
          explanation: >-
            By Pascal's rule, $\binom{7}{3} = \binom{6}{2} + \binom{6}{3} = 15 + 20 = 35$.
        - prompt: Which of these is equal to $\binom{9}{3}$?
          answer:
            type: choice
            options:
              - { id: rule, label: '$\binom{8}{2} + \binom{8}{3}$' }
              - { id: same-k, label: '$\binom{8}{3} + \binom{8}{4}$' }
              - { id: double, label: '$2 \times \binom{8}{3}$' }
              - { id: mixed, label: '$\binom{9}{2} + \binom{8}{3}$' }
            correct: [rule]
          explanation: >-
            The sets of 3 from 9 either hold the last thing, with 2 more from the other 8, or leave
            it out, with all 3 from the other 8: $\binom{8}{2} + \binom{8}{3} = 28 + 56 = 84$. The
            pair one place to the right, $\binom{8}{3} + \binom{8}{4} = 126$, is $\binom{9}{4}$.

  - id: explore-row-sum
    phase: explore
    kind: predict
    concept: M1.10/combinations
    title: A whole row
    prompt: What do the numbers in row 10 of Pascal's triangle add up to?
    answer: { type: number, value: 1024, tolerance: { abs: 0 } }
    explanation: >-
      Row 10 counts the subsets of 10 things of each size, so together it counts all of them, and
      each of the 10 things is in or out, so there are $2^{10} = 1{,}024$.
    review:
      variants:
        - prompt: How many subsets does a set of 8 things have, with the empty set and the whole set included?
          answer: { type: number, value: 256, tolerance: { abs: 0 } }
          explanation: >-
            Each of the 8 things is in or out of a subset, 2 choices each: $2^8 = 256$.
        - prompt: How many strings of 6 digits, each 0 or 1, have exactly 2 ones?
          answer: { type: number, value: 15, tolerance: { abs: 0 } }
          explanation: >-
            A string is fixed by the places of its 2 ones, a set of 2 of the 6 places:
            $\binom{6}{2} = 15$.
        - prompt: A row of Pascal's triangle adds up to 4,096. Which row is it?
          answer: { type: number, value: 12, tolerance: { abs: 0 } }
          explanation: >-
            Row $n$ adds up to $2^n$, and $2^{12} = 4{,}096$, so it is row 12.

  - id: explore-coefficient
    phase: explore
    kind: predict
    concept: M1.10/binomial-theorem
    title: The number in front
    prompt: When $(a + b)^5$ is multiplied out and like terms are collected, what number is in front of $a^2 b^3$?
    answer: { type: number, value: 10, tolerance: { abs: 0 } }
    explanation: >-
      Each product takes $a$ or $b$ from each of the 5 brackets, and a product equal to $a^2 b^3$
      takes $b$ from 3 of them. There are $\binom{5}{3} = 10$ ways to choose those 3 brackets.
    placement: true
    review:
      variants:
        - prompt: When $(x + y)^6$ is multiplied out, what number is in front of $x^4 y^2$?
          answer: { type: number, value: 15, tolerance: { abs: 0 } }
          explanation: >-
            Choose the 2 brackets that give $y$: $\binom{6}{2} = 15$.
        - prompt: When $(1 + x)^4$ is multiplied out, what number is in front of $x^2$?
          answer: { type: number, value: 6, tolerance: { abs: 0 } }
          explanation: >-
            $(1 + x)^4 = 1 + 4x + 6x^2 + 4x^3 + x^4$, row 4 of the triangle: $\binom{4}{2} = 6$
            ways to choose the brackets that give $x$.
        - prompt: When $(a + b)^7$ is multiplied out, what do the numbers in front of its terms add up to?
          answer: { type: number, value: 128, tolerance: { abs: 0 } }
          explanation: >-
            Put $a = b = 1$: every term becomes its number in front, and $(1 + 1)^7 = 2^7 = 128$.

  # Derive ---------------------------------------------------------------------
  - id: derive-orders
    phase: derive
    kind: proof
    concept: M1.10/permutations
    title: Orders, by induction
    prompt: >-
      Here is a proof by induction that $n$ different things have exactly $n!$ orders, for every
      whole number $n \ge 1$. Each line follows from the lines above it. Choose the rule that
      justifies each line. A rule may be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: product-rule, name: Product rule, label: 'A choice made in two steps, with $a$ options for the first and $b$ for the second whatever the first was, can be made in $ab$ ways.' }
        - { id: work-out, name: Work it out, label: 'A statement about particular numbers can be checked directly.' }
        - { id: sum-rule, name: Cases add, label: 'Two cases that cannot happen together can be made in as many ways as the two counts added.' }
        - { id: one-to-one, name: Pair them off, label: 'Two collections whose members pair off one to one, with nothing left over on either side, have the same number of members.' }
        - { id: hypothesis, name: Inductive hypothesis, label: 'In the step, $P(k)$ may be assumed, for the one $k$ that the step starts from.' }
        - { id: divide, name: Divide by the orders, label: 'Dividing the ordered choices of $k$ things by $k!$, the orders of each set, counts the sets.' }
        - { id: induction, name: Induction, label: 'If $P(1)$ is true, and $P(k)$ gives $P(k + 1)$ for every $k \ge 1$, then $P(n)$ is true for every $n \ge 1$.' }
        - { id: factorial, name: Factorials, label: '$m \times (m - 1)! = m!$ for every whole number $m \ge 1$, since both are the product of the whole numbers from 1 to $m$.' }
      start: 'P(n):\ n \text{ different things have exactly } n! \text{ orders}'
      lines:
        - math: 'P(1):\ \text{one thing has 1 order, and } 1! = 1'
          rule: work-out
        - math: '\text{There are as many orders of things 1 to } k + 1 \text{ as pairs (an order of things 1 to } k\text{, one of } k + 1 \text{ places for thing } k + 1\text{)}'
          rule: one-to-one
        - math: '\text{Things 1 to } k \text{ have } k! \text{ orders, if } P(k) \text{ is true}'
          rule: hypothesis
        - math: '\text{There are } (k + 1) \times k! \text{ such pairs}'
          rule: product-rule
        - math: '\text{So there are } (k + 1) \times k! = (k + 1)! \text{ orders of } k + 1 \text{ things, which is } P(k + 1)'
          rule: factorial
        - math: 'P(n) \text{ is true for every whole number } n \ge 1'
          rule: induction
    explanation: >-
      Line 1 is the base case, worked out. Taking thing $k + 1$ out of an order, and putting it back
      in its place, pairs the orders of $k + 1$ things one to one with the pairs of an order of $k$
      things and a place, so the two collections are the same size. The hypothesis counts the
      orders of $k$ things, and the product rule counts the pairs, since every order has $k + 1$
      places whatever it is. $(k + 1) \times k!$ is $(k + 1)!$, and induction gives every $n$.
      Cases add and dividing by the orders are never needed.

  - id: derive-choose
    phase: derive
    kind: step
    concept: M1.10/combinations
    title: Choosing, with factorials
    prompt: >-
      Each set of $k$ things turns up $k!$ times among the $\frac{n!}{(n - k)!}$ ordered choices of
      $k$ things from $n$. Write $\binom{n}{k}$ in terms of $n$ and $k$, with factorials. Type
      $n!$ as `n!`, and put a `*` between two factorials that multiply.
    answer:
      type: expression
      symbols:
        - { name: n, integer: true, positive: true }
        - { name: k, integer: true, positive: true }
      lhs: '\binom{n}{k} ='
      reference: factorial(n)/(factorial(k)*factorial(n - k))
      accept: ['n!/(k!*(n-k)!)', 'n!/(k!(n-k)!)', 'n!/((n-k)!*k!)', 'n!/k!/(n-k)!', '(n!/(n-k)!)/k!', 'factorial(n)/(factorial(k)*factorial(n-k))']
      reject: ['n!/(n-k)!', 'n!/k!', 'n!*k!/(n-k)!', 'n!/(k!*(n-k))', '(n-k)!/(n!*k!)', 'n!/(k!*n!)', 'k!/(n!*(n-k)!)', '(n-k)!*k!/n!']
      form:
        forbid: ['binomial(n, k)', 'binomial(n, n - k)']
        message: That is the count itself, written another way. Write it with factorials only.
    explanation: >-
      Dividing the ordered choices by the $k!$ orders of each set:
      $\binom{n}{k} = \frac{n!}{(n - k)!} \div k! = \frac{n!}{k!\,(n - k)!}$.

  - id: derive-pascal-top
    phase: derive
    kind: step
    concept: M1.10/combinations
    title: Pascal's rule, by algebra
    prompt: >-
      Write the top, $(n - 1)! \times k + (n - 1)! \times (n - k)$, as a single factorial. Type
      $n!$ as `n!`.
    answer:
      type: expression
      symbols:
        - { name: n, integer: true, positive: true }
        - { name: k, integer: true, positive: true }
      lhs: '(n - 1)! \times k + (n - 1)! \times (n - k) ='
      reference: factorial(n)
      accept: ['n!', 'factorial(n)', '(n)!']
      reject: ['(n-1)!', '(n+1)!', 'k!*(n-k)!', 'n!*(n-1)!', '(n-1)!*(n-k)', 'k!', '(n-k)!', '(n-1)!*k']
      form:
        maxOps: 1
        message: That is the right value, but not yet as simple as it can be. Simplify what multiplies $(n - 1)!$, and anything inside a factorial, and write what is left as one factorial.
    explanation: >-
      $(n - 1)! \times k + (n - 1)! \times (n - k) = (n - 1)! \times (k + n - k) = (n - 1)! \times n = n!$.
      So the sum is $\frac{n!}{k!\,(n - k)!} = \binom{n}{k}$.

  - id: derive-binomial
    phase: derive
    kind: proof
    concept: M1.10/binomial-theorem
    covers: [M1.10/combinations]
    title: The binomial theorem, by induction
    prompt: >-
      Here is a proof by induction of the binomial theorem, the statement $P(n)$ below, for every
      whole number $n \ge 0$, with $\binom{n}{j}$ counted as 0 when $j < 0$ or $j > n$. Each line
      follows from the lines above it. Choose the rule that justifies each line. A rule may be used
      more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: pascal, name: "Pascal's rule", label: '$\binom{k + 1}{j} = \binom{k}{j - 1} + \binom{k}{j}$, for every $j$ from 0 to $k + 1$.' }
        - { id: every-n, name: True for every n, label: 'The theorem is true for every whole number $n$, so it is true for $n = k + 1$.' }
        - { id: shift, name: Shift the counter, label: 'A sum keeps its value when its counter runs one higher and each term is written with $j - 1$ in place of $j$.' }
        - { id: work-out, name: Work it out, label: 'A statement about particular numbers can be checked directly, using $x^0 = 1$ and $\binom{0}{0} = 1$.' }
        - { id: induction, name: Induction, label: 'If $P(0)$ is true, and $P(k)$ gives $P(k + 1)$ for every $k \ge 0$, then $P(n)$ is true for every $n \ge 0$.' }
        - { id: hypothesis, name: Inductive hypothesis, label: 'In the step, $P(k)$ may be assumed, for the one $k$ that the step starts from.' }
        - { id: multiply-out, name: Multiply out, label: 'Multiplying a sum by $a + b$ multiplies each of its terms by $a$ and by $b$, and adds the results.' }
        - { id: powers, name: Powers, label: '$x^{k + 1} = x \times x^k$, by the rules for powers.' }
        - { id: join, name: Add term by term, label: 'Two sums over the same counter add term by term, and a term whose number in front is 0 may be put in or left out.' }
        - { id: symmetry, name: Choosing what is left out, label: '$\binom{k}{j} = \binom{k}{k - j}$, since choosing $j$ things is choosing the $k - j$ left out.' }
      start: 'P(n):\ (a + b)^n = \sum_{j=0}^{n} \binom{n}{j} a^{n-j} b^j'
      lines:
        - math: 'P(0):\ (a + b)^0 = 1 \text{ and } \binom{0}{0} a^0 b^0 = 1'
          rule: work-out
        - math: '(a + b)^{k+1} = (a + b)(a + b)^k'
          rule: powers
        - math: '= (a + b) \sum_{j=0}^{k} \binom{k}{j} a^{k-j} b^j \text{, if } P(k) \text{ is true}'
          rule: hypothesis
        - math: '= \sum_{j=0}^{k} \binom{k}{j} a^{k+1-j} b^j + \sum_{j=0}^{k} \binom{k}{j} a^{k-j} b^{j+1}'
          rule: multiply-out
        - math: '= \sum_{j=0}^{k} \binom{k}{j} a^{k+1-j} b^j + \sum_{j=1}^{k+1} \binom{k}{j-1} a^{k+1-j} b^j'
          rule: shift
        - math: '= \sum_{j=0}^{k+1} \left( \binom{k}{j} + \binom{k}{j-1} \right) a^{k+1-j} b^j'
          rule: join
        - math: '= \sum_{j=0}^{k+1} \binom{k+1}{j} a^{k+1-j} b^j \text{, which is } P(k + 1)'
          rule: pascal
        - math: 'P(n) \text{ is true for every whole number } n \ge 0'
          rule: induction
    explanation: >-
      Line 1 is the base case, worked out. The step writes $(a + b)^{k+1}$ as $(a + b)$ times
      $(a + b)^k$, uses the hypothesis for $(a + b)^k$, and multiplies out, which raises the power
      of $a$ in the first sum and of $b$ in the second. Shifting the second sum's counter makes
      both sums' terms $a^{k+1-j} b^j$, and the two sums join term by term, since the terms they
      lack, at $j = k + 1$ in the first and $j = 0$ in the second, have 0 in front. Pascal's rule
      turns each bracket into $\binom{k+1}{j}$, which is $P(k + 1)$, and induction gives every $n$.
      "True for every n" is never needed, and would assume the theorem being proved.

  - id: derive-even-sets
    phase: derive
    kind: step
    concept: M1.10/binomial-theorem
    title: Even and odd
    prompt: >-
      Write $E(n)$ for the number of subsets of $n$ things that have an even number of elements,
      the empty set included. Write $E(n)$ in terms of $n$, for any whole number $n \ge 1$.
    answer:
      type: expression
      symbols:
        - { name: n, integer: true, positive: true }
      lhs: 'E(n) ='
      reference: 2**(n - 1)
      accept: ['2^(n-1)', '2**n/2', '2^n/2', '(2^n)/2', '2^(n - 1)', '1/2*2^n']
      reject: ['2^n', 'n/2', '2^(n-2)', '2^n - 1', 'n*2^(n-1)', '2^(n+1)', '2^(n-1) + 1', 'n', '2^n/n']
    explanation: >-
      All the subsets: $\sum_j \binom{n}{j} = 2^n$. Even sizes take odd sizes away:
      $\sum_j (-1)^j \binom{n}{j} = 0$. Adding the two counts every even subset twice and every
      odd one not at all, so $2E(n) = 2^n$, and $E(n) = 2^{n-1}$.

  - id: derive-captain
    phase: derive
    kind: proof
    concept: M1.10/combinations
    covers: [M1.10/counting-rules]
    title: Counting twice
    prompt: >-
      Prove that $k\binom{n}{k} = n\binom{n - 1}{k - 1}$ for whole numbers $1 \le k \le n$, by
      counting the ways to choose a team of $k$ people from $n$, with one of the $k$ as its
      captain, in two different orders. Say why the two counts must be equal. Then check the
      identity with the formula $\binom{n}{k} = \frac{n!}{k!\,(n - k)!}$.
    answer:
      type: text
      rubric:
        - { id: members-first, criterion: 'Counts the teams with a captain by choosing the members first and then the captain, and names the rule that gives the count. A table with a row for each team and a mark for each of its possible captains, counted row by row, also does.' }
        - { id: captain-first, criterion: 'Counts them by choosing the captain first and then the rest of the team, saying how many people are left to choose from. Counting the same marks person by person also does.' }
        - { id: same-thing, criterion: 'Says why the two counts must be equal.' }
        - { id: algebra, criterion: 'Checks the identity with the formula $\binom{n}{k} = \frac{n!}{k!\,(n - k)!}$, by any correct algebra that shows both sides equal.' }
      reference: >-
        Count the teams of $k$ people with a captain, chosen from $n$ people. First way: choose the
        $k$ members, in $\binom{n}{k}$ ways, and then choose the captain from among those $k$, in
        $k$ ways whatever the team is, so by the product rule there are $k\binom{n}{k}$ teams with a
        captain. Second way: choose the captain first, from all $n$ people, in $n$ ways, and then
        the other $k - 1$ members from the $n - 1$ people who are left, in $\binom{n - 1}{k - 1}$
        ways whatever the captain was, so there are $n\binom{n - 1}{k - 1}$. Each team with a
        captain is counted exactly once in each way, since the first way finds it from its members
        and its captain, and the second from its captain and its other members. Both count the same
        collection, so $k\binom{n}{k} = n\binom{n - 1}{k - 1}$. Check with factorials:
        $k\binom{n}{k} = \frac{k \times n!}{k!\,(n - k)!} = \frac{n!}{(k - 1)!\,(n - k)!}$, since
        $k! = k \times (k - 1)!$, and
        $n\binom{n - 1}{k - 1} = \frac{n \times (n - 1)!}{(k - 1)!\,(n - k)!} = \frac{n!}{(k - 1)!\,(n - k)!}$,
        since $(n - 1) - (k - 1) = n - k$ and $n \times (n - 1)! = n!$. For example, with $n = 5$
        and $k = 2$: $2 \times 10 = 20 = 5 \times 4$.
      minWords: 50
      maxWords: 300
    explanation: >-
      Members first: $\binom{n}{k}$ teams, each with $k$ choices of captain, which makes
      $k\binom{n}{k}$. Captain first: $n$ choices, then $\binom{n - 1}{k - 1}$ ways to fill the
      rest of the team, which makes $n\binom{n - 1}{k - 1}$. Both count every team with a captain
      exactly once, so they are equal, and with factorials both sides are
      $\frac{n!}{(k - 1)!\,(n - k)!}$.

