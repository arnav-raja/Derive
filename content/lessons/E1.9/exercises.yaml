  # Explain --------------------------------------------------------------------
  - id: explain-testing
    phase: explain
    kind: explain
    concept: E1.9/properties
    covers: [E1.9/unit-tests, E1.9/test-cases, E1.9/shrinking]
    title: What a thousand passing tests show
    prompt: >-
      Explain to your friend what their 1,000 passing random tests do and do not show. Cover what a
      unit test is, and why a suite is run after every change; how to choose the cases a test
      tries, and where its expected value must come from; what passing tests prove, and how
      mutants judge a suite; what a property is, with an example; why random numbers from a wide
      range can miss a case such as two equal numbers, with the count of pairs that explains it,
      and how the range and the seed should be chosen; and what shrinking does with an input that
      fails.
    answer:
      type: text
      rubric:
        - { id: unit-test, criterion: 'Says that a unit test calls a function with an input chosen beforehand and asserts what it should give, and that a suite is run after every change, so that a regression, a change that breaks what used to work, is caught at once.' }
        - { id: cases, criterion: 'Says that the cases should include edges, such as an empty input, one item, repeated items and both sides of a boundary, and that the expected value must come from somewhere other than the code, such as working it out by hand or a slower, simpler version.' }
        - { id: limits, criterion: 'Says that passing tests show only that the code worked on the inputs tried, never that it has no bugs, and that a suite can be judged by whether its tests catch mutants, small bugs put in on purpose.' }
        - { id: property, criterion: 'Explains a property as a statement that should hold for every input, with an example, such as that a sort''s result is in order and has the same items as its input.' }
        - { id: random, criterion: 'Explains that 10 numbers make 45 pairs, so random numbers from a wide range, such as 1 to a million, almost never repeat, that a narrower range makes repeats common, and that a fixed seed lets a failure be run again.' }
        - { id: shrinking, criterion: 'Says that shrinking takes items out of a failing input, or makes its numbers smaller, keeping each change only if the input still fails, to leave a small input, such as two equal numbers, that shows the bug plainly.' }
      reference: >-
        Your 1,000 passing tests show that the function worked on those 1,000 inputs, and nothing
        more. A unit test calls a function with an input chosen beforehand and asserts what it
        should give, and a suite of them is run after every change, so that a regression, a change
        that breaks something that used to work, is caught while the change is fresh. The cases are
        worth choosing with care, because bugs gather at edges: an empty list, one item, two items,
        repeated items, and the values on each side of every boundary, such as an odd length and an
        even one for a median. The expected value must come from somewhere other than the code, by
        working it out by hand or from a slower, simpler version that is easy to trust, because a
        value copied from the code's own output only checks that the code still does what it did,
        bug and all. Even then, as Dijkstra said, testing shows the presence of bugs, not their
        absence. A good way to judge a suite is to put small bugs in on purpose, mutants, such as
        changing a less-than into a less-than-or-equal, and see whether the tests catch them: a
        mutant that survives points at a case nobody tried. Random tests check a property, a
        statement that should hold for every input. For a sort, the result is in order and has the
        same items as the input, each as many times. But random numbers can miss the case that
        matters. A list of 10 numbers has 45 pairs, and if each number is from 1 to a million, each
        pair is equal about once in a million, so a list has a repeat about 45 times in a million.
        A sort that drops one of two equal numbers passes 1,000 such tests almost every time. With
        numbers from 1 to 10 instead, most lists have a repeat, so choose a range narrow enough to
        reach such cases, and fix the seed, so that a failure can be run again exactly. When a test
        fails on a long input, shrink it: take items out one at a time, or make numbers smaller,
        and keep each change only if the input still fails. A list like 7, 3, 9, 3, 5 shrinks to
        3, 3, which shows the bug at a glance: two equal numbers.
      minWords: 120
      maxWords: 500
