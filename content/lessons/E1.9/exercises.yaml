exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-ties
    phase: puzzle
    kind: predict
    concept: E1.9/properties
    title: A hundred random lists
    prompt: How many of the 100 lists will show the bug?
    answer:
      type: choice
      options:
        - { id: half, label: 'About half of them, some 50 lists' }
        - { id: tenth, label: 'About one in ten, some 10 lists' }
        - { id: one, label: 'About one of them, a single list' }
        - { id: none, label: 'Most likely none of them at all' }
      correct: [none]
    explanation: >-
      A list shows the bug only when two of its losses are equal. Its 10 losses make 45 pairs, each
      equal about once in a million, so a list holds a repeat about 45 times in a million, and the
      100 lists together about 4,500 times in a million, about once in 220 runs of the test. Most
      likely no list shows the bug, and the test passes.

  # Recall ---------------------------------------------------------------------
  - id: recall-assert
    phase: recall
    kind: recall
    concept: E1.8/assertion
    prompt: |
      What happens when this program runs?

      ```python
      loss = -0.5
      assert loss >= 0, "loss must not be negative"
      print("done")
      ```
    answer:
      type: choice
      options:
        - { id: warns, label: 'It prints the message, then `done`, and carries on' }
        - { id: right, label: 'It stops with `AssertionError` and the message' }
        - { id: done, label: 'It prints `done`, since the assert only warns' }
        - { id: skipped, label: 'It prints `done`, since asserts are skipped' }
      correct: [right]
    explanation: >-
      `-0.5 >= 0` is `False`, so the assert stops the program with `AssertionError` and its
      message, and `print("done")` never runs. Python skips asserts only when it is run with the
      option `-O`.

  - id: recall-print-return
    phase: recall
    kind: recall
    concept: E1.3/defining-functions
    prompt: |
      What happens when this program runs?

      ```python
      def double(x):
          print(x * 2)

      assert double(3) == 6, "double(3) should be 6"
      print("checked")
      ```
    answer:
      type: choice
      options:
        - { id: passes, label: 'It prints `6`, and then `checked`' }
        - { id: before, label: 'It stops with `AssertionError` before printing anything' }
        - { id: right, label: 'It prints `6`, then stops with `AssertionError`' }
        - { id: prints-true, label: 'It prints `6`, then `True`, then `checked`' }
      correct: [right]
    explanation: >-
      The call `double(3)` runs first and prints 6, but it reaches no `return`, so its value is
      `None`. `None == 6` is `False`, so the assert stops the program before `checked` is printed.

  - id: recall-set
    phase: recall
    kind: recall
    concept: E1.4/dicts-and-sets
    prompt: What does `len(set([4, 2, 4, 4, 1]))` give?
    answer: { type: number, value: 3, tolerance: { abs: 0 } }
    explanation: >-
      A set holds each value once, so the set holds 4, 2 and 1, and its `len` is 3.

  - id: recall-alias
    phase: recall
    kind: recall
    concept: E1.4/aliasing-and-mutation
    prompt: |
      What number does this program print?

      ```python
      a = [3, 1, 2]
      b = a
      b.append(0)
      print(len(a))
      ```
    answer: { type: number, value: 4, tolerance: { abs: 0 } }
    explanation: >-
      `b = a` makes `b` a second name for the same list, so appending through `b` changes the list
      that `a` refers to, which then has 4 slots.

  - id: recall-count
    phase: recall
    kind: recall
    concept: E1.2/accumulator-pattern
    prompt: |
      What number does this program print?

      ```python
      results = {"empty": "pass", "one": "FAIL", "two": "pass", "repeat": "FAIL"}
      failed = 0
      for name in results:
          if results[name] == "FAIL":
              failed = failed + 1
      print(failed)
      ```
    answer: { type: number, value: 2, tolerance: { abs: 0 } }
    explanation: >-
      The loop visits the four keys, and adds 1 to `failed` for each of the two whose value is
      `"FAIL"`.

  # Explore --------------------------------------------------------------------
  - id: explore-runner
    phase: explore
    kind: predict
    concept: E1.9/unit-tests
    title: Three tests, one runner
    prompt: What does the runner print?
    placement: true
    answer:
      type: choice
      options:
        - { id: all-pass, label: '`positive pass`, `negative pass` and `one pass`' }
        - { id: stops, label: '`positive pass` and `negative FAIL`, and no more' }
        - { id: error, label: '`positive pass`, then it stops with `AssertionError`' }
        - { id: right, label: '`positive pass`, `negative FAIL` and `one pass`' }
      correct: [right]
    explanation: >-
      `largest` starts `best` at 0, and no number in `[-5, -2, -8]` is above 0, so it gives 0 and
      the assert in `test_negative` fails. The `except` block prints `negative FAIL`, and the loop
      goes on to `test_one`, which passes, since 7 is above 0.
    review:
      variants:
        - prompt: >-
            A runner calls three tests in turn, each inside `try` with `except AssertionError`, and
            prints each name with pass or FAIL. The first test passes, the second fails its assert,
            and the third stops with `TypeError`. What does the runner print?
          answer:
            type: choice
            options:
              - { id: fail, label: 'All three lines, the last of them `third FAIL`' }
              - { id: right, label: '`first pass`, `second FAIL`, then `TypeError` stops it' }
              - { id: assertion, label: '`first pass`, and then `AssertionError` stops it' }
              - { id: pass, label: '`first pass`, `second FAIL` and then `third pass`' }
            correct: [right]
          explanation: >-
            `except AssertionError` catches only an `AssertionError`, so the second test's failure
            is reported and the loop goes on, but the third test's `TypeError` is not caught and
            stops the runner.
        - prompt: >-
            A suite passed yesterday. Today, after one change to a helper function, two tests of
            other functions, which use the helper, fail. What is this called?
          answer:
            type: choice
            options:
              - { id: mutant, label: 'A mutant, a bug that was put in on purpose' }
              - { id: property, label: 'A property, a rule that fails for every input' }
              - { id: right, label: 'A regression, a change that broke what worked' }
              - { id: oracle, label: 'An oracle, a source of the expected values' }
            correct: [right]
          explanation: >-
            A change that breaks something that used to work is a regression, and catching it at
            once, while the change is fresh, is why a suite runs after every change.
        - prompt: >-
            `tests` is a dictionary that maps each test's name to the test, a function that takes
            no arguments. Which line runs the test named `"even"`?
          answer:
            type: choice
            options:
              - { id: lookup, label: '`tests["even"]`' }
              - { id: right, label: '`tests["even"]()`' }
              - { id: call-dict, label: '`tests("even")`' }
              - { id: call-name, label: '`"even"()`' }
            correct: [right]
          explanation: >-
            `tests["even"]` looks up the function, a value like any other, without calling it, and
            the brackets after it call the function, which runs the test. A dictionary and a string
            cannot be called.

  - id: explore-median-cases
    phase: explore
    kind: predict
    concept: E1.9/test-cases
    title: Four tests of a median
    prompt: Which of the four tests fails?
    placement: true
    answer:
      type: choice
      options:
        - { id: one, label: '`test_one`' }
        - { id: odd, label: '`test_odd`' }
        - { id: even, label: '`test_even`' }
        - { id: repeat, label: '`test_repeat`' }
      correct: [even]
    explanation: >-
      For `[4, 1, 3, 2]`, `s` is `[1, 2, 3, 4]` and `len(s) // 2` is 2, so the function gives
      `s[2]`, which is 3, where the median is the mean of 2 and 3, which is 2.5. For an odd number
      of items, `len(s) // 2` is the middle slot, slot 0 of 1 and slot 1 of 3, and the middle of
      `[2, 2, 9]` is 2.
    review:
      variants:
        - prompt: >-
            `clip(x)` should give 0 for `x` below 0, `x` itself from 0 to 100, and 100 for `x` above
            100. Which inputs test its boundaries best?
          answer:
            type: choice
            options:
              - { id: middle, label: '5, 50 and 95, all well inside' }
              - { id: right, label: '-1, 0, 100 and 101, each side of each end' }
              - { id: far, label: '-1,000 and 1,000, far outside both ends' }
              - { id: ends, label: '0 and 100, the two ends themselves' }
            correct: [right]
          explanation: >-
            Bugs gather where the code changes what it does, so a test should try the values on
            each side of every boundary: -1 and 0 at the bottom, 100 and 101 at the top. Inputs well
            inside or far outside never reach a slip such as `<` written for `<=`.
        - prompt: >-
            `dedupe(xs)` should give the items of a list with repeats taken out, keeping the first
            of each. Which input does a test of it most need?
          answer:
            type: choice
            options:
              - { id: distinct, label: '`[1, 2, 3]`, whose items all differ' }
              - { id: longer, label: '`[5, 6, 7, 8, 9]`, a longer list' }
              - { id: unsorted, label: '`[3, 1, 2]`, which is out of order' }
              - { id: right, label: '`[2, 1, 2, 2]`, with an item repeated' }
            correct: [right]
          explanation: >-
            Repeats are what the function exists to handle, and the other three lists have none, so
            a `dedupe` that did nothing at all would pass all of them.
        - prompt: >-
            A suite for `average(xs)` tries `[2, 4]`, `[1, 2, 3]` and `[10, 20, 30, 40]`. Which of
            these edges has it left untried?
          answer:
            type: choice
            options:
              - { id: two, label: 'A list of two numbers' }
              - { id: right, label: 'A list of one number' }
              - { id: even, label: 'A list of even length' }
              - { id: odd, label: 'A list of odd length' }
            correct: [right]
          explanation: >-
            `[2, 4]` has two numbers and an even length, and `[1, 2, 3]` an odd length, but no list
            has just one number, where a loop runs once and many slips show.

  - id: explore-copied-expected
    phase: explore
    kind: predict
    concept: E1.9/test-cases
    title: An expected value from the code
    prompt: What does this test do, now and once the median is mended?
    answer:
      type: choice
      options:
        - { id: catches, label: 'It catches the bug now, since it tries an even length' }
        - { id: backwards, label: 'It fails now, and passes once the median is mended' }
        - { id: right, label: 'It passes now, and fails once the median is mended' }
        - { id: always, label: 'It passes now and later, whatever the median does' }
      correct: [right]
    explanation: >-
      The function gives 3, so the test passes now. Mended, it gives 2.5, and the test fails: it
      protects the bug instead of the fix.
    review:
      variants:
        - prompt: >-
            A test of `celsius(f)`, which turns degrees Fahrenheit into degrees Celsius, tries
            `celsius(212)`. Which expected value can it trust most?
          answer:
            type: choice
            options:
              - { id: copied, label: 'The value that `celsius(212)` printed when last run' }
              - { id: twice, label: 'The value that a second call of `celsius(212)` gives' }
              - { id: any, label: 'Any value, since a test needs only to run without error' }
              - { id: right, label: '100, since water boils at 212 °F, which is 100 °C' }
            correct: [right]
          explanation: >-
            A known fact, worked out without the code, can catch a bug in it. A value from the
            code itself, run once or twice, agrees with the code whether it is right or not.
        - prompt: >-
            A fast `fast_sum(xs)` is checked against `slow_sum(xs)`, a plain loop that adds the
            items one by one, on many lists. Why is the slow version a good source of expected
            values?
          answer:
            type: choice
            options:
              - { id: right, label: 'It is simple enough to trust, and shares no code with the fast one' }
              - { id: slower, label: 'It is slower, and a slower function is always the more accurate' }
              - { id: same, label: 'It gives what the fast one gives, so the test will always pass' }
              - { id: later, label: 'It was written later, so it has been changed fewer times' }
            correct: [right]
          explanation: >-
            An oracle must be easy to trust and independent of the code it checks. A plain loop is
            easy to read and get right, and shares none of the fast version's tricks, so a
            disagreement points at the fast one.

  - id: explore-mutant
    phase: explore
    kind: predict
    concept: E1.9/test-cases
    title: A mutant that survives
    prompt: Which one new test would catch the changed function?
    answer:
      type: choice
      options:
        - { id: below, label: '`assert count_below([2, 4], 5) == 2`' }
        - { id: right, label: '`assert count_below([5], 5) == 0`' }
        - { id: above, label: '`assert count_below([5, 6, 7], 1) == 0`' }
        - { id: all, label: '`assert count_below([1, 2, 3], 10) == 3`' }
      correct: [right]
    explanation: >-
      The two functions differ only on a number equal to the limit, so only a test with such a
      number can tell them apart: for `[5]` with the limit 5, `x < limit` counts nothing, and
      `x <= limit` counts the 5. Every number in the other tests is clearly above or below its
      limit.
    review:
      variants:
        - prompt: >-
            `is_adult(age)` gives `age >= 18`, and its tests try the ages 30 and 5. Which mutant do
            the tests fail to kill?
          answer:
            type: choice
            options:
              - { id: right, label: '`age > 18`' }
              - { id: below, label: '`age < 18`' }
              - { id: digits, label: '`age >= 81`' }
              - { id: at-most, label: '`age <= 18`' }
            correct: [right]
          explanation: >-
            `age > 18` differs from `age >= 18` only at 18, which neither test tries. The others
            give the wrong answer for 30, and `age < 18` and `age <= 18` for 5 as well.
        - prompt: >-
            A suite kills 9 of 10 mutants of a function. The survivor changed a line that runs only
            when the list it is given is empty. What does the survivor suggest?
          answer:
            type: choice
            options:
              - { id: wrong, label: 'That the function is wrong for an empty list' }
              - { id: perfect, label: 'That the suite is as strong as it can be' }
              - { id: expected, label: 'That one test has a wrong expected value' }
              - { id: right, label: 'That no test tries an empty list at all' }
            correct: [right]
          explanation: >-
            A mutant survives when no test reaches the line it changed with an input that shows the
            change, so the likely gap is a missing case: the empty list.

  - id: explore-sort-property
    phase: explore
    kind: predict
    concept: E1.9/properties
    title: Which property breaks
    prompt: Which of these checks gives `False`?
    placement: true
    answer:
      type: choice
      options:
        - { id: order-distinct, label: '`in_order(sort_losses([3, 1, 2]))`' }
        - { id: same-distinct, label: '`same_items([3, 1, 2], sort_losses([3, 1, 2]))`' }
        - { id: order-repeat, label: '`in_order(sort_losses([2, 1, 2]))`' }
        - { id: right, label: '`same_items([2, 1, 2], sort_losses([2, 1, 2]))`' }
      correct: [right]
    explanation: >-
      `sort_losses([2, 1, 2])` makes the set of 1 and 2 and sorts it into `[1, 2]`, which is in
      order. But 2 appears twice in `[2, 1, 2]` and once in `[1, 2]`, so the counts differ and
      `same_items` gives `False`. With no repeats, as in `[3, 1, 2]`, both properties hold.
    review:
      variants:
        - prompt: >-
            `reverse(xs)` should give the items of `xs` in the opposite order. Which is a property,
            true for every list `xs`?
          answer:
            type: choice
            options:
              - { id: example, label: '`reverse([1, 2, 3]) == [3, 2, 1]`' }
              - { id: right, label: '`reverse(reverse(xs)) == xs`' }
              - { id: differs, label: '`reverse(xs) != xs`' }
              - { id: nonempty, label: '`len(reverse(xs)) > 0`' }
            correct: [right]
          explanation: >-
            Reversing twice gives back the list, whatever it is. The first is one example, not a
            rule for every list; `reverse(xs) != xs` fails for `[7]`, and `len(reverse(xs)) > 0`
            fails for `[]`.
        - prompt: >-
            A broken sort gives `[]` for every list. Which of the two properties of a sort, in
            order and same items, does it break?
          answer:
            type: choice
            options:
              - { id: neither, label: 'Neither of them, for any list at all' }
              - { id: order, label: 'Only in order, for every list it is given' }
              - { id: both, label: 'Both of them, for every list it is given' }
              - { id: right, label: 'Only same items, for each list but `[]`' }
            correct: [right]
          explanation: >-
            `[]` is always in order, so only same items can catch this sort, and it does for every
            list with an item in it. That is why a sort needs both properties.
        - prompt: >-
            Which of these is a property of `largest(xs)`, true for every list `xs` with at least
            one number?
          answer:
            type: choice
            options:
              - { id: last, label: '`largest(xs) == xs[-1]`, the last item of the list' }
              - { id: positive, label: '`largest(xs) > 0`, since the largest is above 0' }
              - { id: right, label: '`largest(xs)` is in `xs`, and no item is above it' }
              - { id: example, label: '`largest([3, 9, 4]) == 9`, for this one list' }
            correct: [right]
          explanation: >-
            The largest number is one of the list's numbers, with none above it, whatever the list.
            The last number need not be the largest, the largest need not be above 0, and one
            example is not a rule for every list.

  - id: explore-small-range
    phase: explore
    kind: predict
    concept: E1.9/properties
    title: A narrow range
    prompt: Of 100 lists made by `random_list(5, 10)`, about how many have a repeat?
    placement: true
    answer:
      type: choice
      options:
        - { id: five, label: 'About 5 of them' }
        - { id: thirty, label: 'About 30 of them' }
        - { id: right, label: 'About 70 of them' }
        - { id: all, label: 'All 100 of them' }
      correct: [right]
    explanation: >-
      The second number misses the first 9 times in 10, the third misses both of those 8 times in
      10, the fourth 7 in 10 and the fifth 6 in 10, so all five differ only about
      $0.9 \times 0.8 \times 0.7 \times 0.6 \approx 0.3$ of the time. About 70 lists in 100 have a
      repeat.
    review:
      variants:
        - prompt: >-
            A random test makes lists of 3 numbers, each from 1 to 1,000. About how often does a
            list have two equal numbers?
          answer:
            type: choice
            options:
              - { id: one, label: 'About 1 time in 1,000' }
              - { id: right, label: 'About 3 times in 1,000' }
              - { id: tenths, label: 'About 3 times in 10' }
              - { id: million, label: 'About 1 time in a million' }
            correct: [right]
          explanation: >-
            3 numbers make 3 pairs, and each pair is equal about once in 1,000, so a list has a
            repeat about 3 times in 1,000.
        - prompt: Why does a property-based test start its random numbers from a fixed seed?
          answer:
            type: choice
            options:
              - { id: more-random, label: 'So that its numbers are more random than without one' }
              - { id: every, label: 'So that it tries every possible input exactly once' }
              - { id: right, label: 'So that a failure it finds can be run again, as it was' }
              - { id: never, label: 'So that it never fails twice on the same input' }
            correct: [right]
          explanation: >-
            The same seed makes the same numbers, so a failing run can be repeated, studied and
            checked again once the bug is mended.
        - prompt: >-
            A test of a function that merges two lists of numbers makes each list from random
            numbers between 1 and 1,000,000,000. Which case will it almost never try?
          answer:
            type: choice
            options:
              - { id: lengths, label: 'Two lists of different lengths' }
              - { id: large, label: 'A number above a thousand' }
              - { id: several, label: 'A list of more than one number' }
              - { id: right, label: 'Two lists that share a value' }
            correct: [right]
          explanation: >-
            With a billion values to choose from, two numbers are equal only about once in a
            billion pairs, so a shared value, where a merge must decide which to put first, almost
            never turns up. A narrower range would reach it often.

  - id: explore-shrink-result
    phase: explore
    kind: predict
    concept: E1.9/shrinking
    title: Shrinking a failing list
    prompt: What does `shrink(fails, [7, 3, 9, 3, 5])` give?
    placement: true
    answer:
      type: choice
      options:
        - { id: middle, label: '`[3, 9, 3]`' }
        - { id: right, label: '`[3, 3]`' }
        - { id: tail, label: '`[3, 3, 5]`' }
        - { id: single, label: '`[3]`' }
      correct: [right]
    explanation: >-
      Every list the shrinker keeps still has a repeat, and it takes out, one at a time, each item
      that the repeat does not need: the 7, the 9 and the 5. Taking out either 3 would leave no
      repeat, so neither 3 ever goes, and the shrinker never reaches `[3]`, which has no repeat.
    review:
      variants:
        - prompt: >-
            A property fails for every list whose sum is above 10. What does the Explore phase's
            `shrink` give for `[4, 1, 5, 2, 3]`?
          answer:
            type: choice
            options:
              - { id: shorter, label: '`[4, 5, 2]`' }
              - { id: ten, label: '`[5, 2, 3]`' }
              - { id: right, label: '`[1, 5, 2, 3]`' }
              - { id: same, label: '`[4, 1, 5, 2, 3]`' }
            correct: [right]
          explanation: >-
            Taking out the 4 leaves a sum of 11, which still fails. After that, taking out any one
            of 1, 5, 2 or 3 leaves a sum of 10 or less, so the shrinker keeps each of them and ends
            with `[1, 5, 2, 3]`. `[4, 5, 2]` is a shorter failing list, which this shrinker never
            reaches, since it took the 4 out first.
        - prompt: Why does `shrink` keep a step only when the smaller input still fails?
          answer:
            type: choice
            options:
              - { id: sooner, label: 'So that it ends sooner, after fewer calls' }
              - { id: right, label: 'So that its result still shows the bug' }
              - { id: shortest, label: 'So that its result is the shortest there is' }
              - { id: twice, label: 'So that it never tries one list twice' }
            correct: [right]
          explanation: >-
            A step that made the property pass would throw the bug away. Keeping only failing
            inputs means that whatever the shrinker ends with still breaks the property, though it
            need not be the shortest input that does.
        - prompt: >-
            The Explore phase's `shrink` is given a failing list of 8 numbers. How many times does
            it call `fails`?
          answer: { type: number, value: 8, tolerance: { abs: 0 } }
          explanation: >-
            Every pass calls `fails` once and either takes an item out or moves `i` on, so
            `len(xs) - i` falls by 1 a pass, from 8 to 0: exactly 8 passes, and 8 calls.

  # Derive ---------------------------------------------------------------------
  - id: derive-pairs
    phase: derive
    kind: step
    concept: E1.9/properties
    title: How long a list must be
    prompt: >-
      A list holds $n$ numbers, each a whole number from 1 to $N$ picked at random. As E1.3 and
      E1.4 counted, it holds $\frac{n(n - 1)}{2}$ pairs, about $\frac{n^2}{2}$ for a long list.
      Taking the pairs as $\frac{n^2}{2}$, about how many numbers must the list hold for it to hold
      one equal pair on average?
    answer:
      type: expression
      symbols:
        - name: N
          positive: true
          integer: true
      lhs: n \approx
      reference: sqrt(2*N)
      accept:
        - (2*N)**0.5
        - sqrt(2)*sqrt(N)
        - (2*N)^(1/2)
        - 2**0.5*N**0.5
      reject:
        - sqrt(N)
        - 2*N
        - sqrt(N/2)
        - N/2
        - 2*sqrt(N)
        - N**2/2
        - (1 + sqrt(1 + 8*N))/2
    explanation: >-
      Each pair is equal about once in $N$, as each pair of the puzzle's losses was equal about once
      in a million, so $\frac{n^2}{2}$ pairs hold about $\frac{n^2}{2N}$ equal pairs on average.
      That is 1 when $n^2 = 2N$, at $n = \sqrt{2N}$: about 1,414 numbers for a range up to
      1,000,000, and about 27 people for birthdays.

  - id: derive-range
    phase: derive
    kind: estimate
    concept: E1.9/properties
    title: A range for ties
    prompt: >-
      The lists have 10 numbers each, and each number is a whole number from 1 to $N$, picked at
      random. About what $N$ makes about 1 list in 10 have two equal numbers? An answer within a
      factor of 1.3 counts.
    answer: { type: number, value: 450, tolerance: { factor: 1.3 } }
    explanation: >-
      10 numbers make 45 pairs, and each pair is equal about once in $N$, so a list holds
      $\frac{45}{N}$ equal pairs on average, which is close to the chance of a repeat while it is
      small. $\frac{45}{N} = \frac{1}{10}$ gives $N = 450$.

  - id: derive-equivalent
    phase: derive
    kind: predict
    concept: E1.9/test-cases
    title: A mutant that no test can kill
    prompt: >-
      Each of these mutants of `largest` changes one line. Which of them can no test kill, whatever
      list of whole numbers, with at least one number, it tries?
    answer:
      type: choice
      options:
        - { id: right, label: '`if x >= best:` in place of `if x > best:`' }
        - { id: zero, label: '`best = 0` in place of `best = xs[0]`' }
        - { id: smallest, label: '`if x < best:` in place of `if x > best:`' }
        - { id: last, label: '`return x` in place of `return best`' }
      correct: [right]
    explanation: >-
      `x >= best` and `x > best` differ only when `x` equals `best`, and then, for whole numbers,
      `best = x` gives `best` the value it already had, so the two functions give the same result
      for every list of whole numbers.
      `best = 0` gives 0 for `[-5, -2]`, `x < best` gives the smallest number, such as 1 for
      `[1, 2]`, and `return x` gives the last number, such as 1 for `[2, 1]`.

  - id: derive-shrink-proof
    phase: derive
    kind: proof
    concept: E1.9/shrinking
    title: Why the shrinker ends with a failing input
    prompt: >-
      `shrink(fails, xs)` is called with a list `xs` of $n$ items for which `fails(xs)` is `True`.
      Here is a proof that it makes exactly $n$ passes, and gives a list for which `fails` is still
      `True`. Each line follows from the lines above it. Choose the rule that justifies each line.
      A rule may be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: stop, name: The loop stops, label: 'A `while` loop ends at the first check where its test is `False`, as in E1.2.' }
        - { id: accumulator, name: Accumulator, label: 'A name set before a loop and updated by each pass holds, after the loop, the result over all the passes, as in E1.2.' }
        - { id: invariant, name: Invariant, label: 'A statement that is true before the first pass of a loop, and that each pass keeps true, is true after every pass, as in E1.2.' }
        - { id: slice, name: Taking out one slot, label: 'When `i` is a slot of `xs`, `xs[:i] + xs[i + 1:]` is `xs` without slot `i`, so it has one item fewer.' }
        - { id: middle, name: Midway, label: 'When two whole numbers are more than 1 apart, the whole number midway between them, rounded down, is strictly between them.' }
        - { id: branch, name: The branch taken, label: 'An `if` runs its block only when its test is `True`, and its `else` block only when the test is `False`.' }
        - { id: falling, name: A falling whole number, label: 'A whole number that every pass of a loop makes smaller, and that is above 0 whenever a pass begins, cannot fall for ever, so the loop ends, as in E1.8.' }
      start: '\text{Before the first pass, } \texttt{fails(xs)} \text{ is True, } i = 0 \text{, and } \texttt{xs} \text{ has } n \text{ items.}'
      lines:
        - math: '\text{In a pass, } i < \texttt{len(xs)} \text{, so } \texttt{smaller} \text{ is } \texttt{xs} \text{ without slot } i \text{, one item shorter.}'
          rule: slice
        - math: '\text{If } \texttt{fails(smaller)} \text{ is True, } \texttt{xs} \text{ becomes } \texttt{smaller} \text{, which fails, and } i \text{ stays as it was.}'
          rule: branch
        - math: '\text{If not, } i \text{ rises by 1, and } \texttt{xs} \text{, which fails, is kept.}'
          rule: branch
        - math: '\text{So after every pass, and so when the loop ends, } \texttt{fails(xs)} \text{ is True.}'
          rule: invariant
        - math: '\text{Either way, } \texttt{len(xs)} - i \text{ falls by exactly 1, and it is at least 1 when a pass begins, so the loop ends.}'
          rule: falling
        - math: '\text{When it ends, } i < \texttt{len(xs)} \text{ is false, so } \texttt{len(xs)} - i \text{, which no pass takes below 0, is 0.}'
          rule: stop
        - math: '\text{It began at } n \text{ and every pass took exactly 1 from it, so after the loop it is } n \text{ minus the number of passes. That is 0, so there were exactly } n \text{ passes.}'
          rule: accumulator
    explanation: >-
      Taking out one slot makes `smaller` one item shorter. By The branch taken, a pass either
      keeps `smaller`, which fails, or keeps `xs`, which fails, so by the invariant rule
      `fails(xs)` is `True` after every pass, and so when the loop ends. Either way
      `len(xs) - i` falls by exactly 1, since the list loses an item while `i` stays, or `i` rises
      while the list stays, and A falling whole number shows that the loop ends. The loop stops
      says what is true then: the test is `False`, so `len(xs) - i` is 0. It began at $n$ and every
      pass took exactly 1 from it, so, as with an accumulator, after the loop it is $n$ minus the
      number of passes. That is 0, so there were exactly $n$ passes. Midway is never needed.

