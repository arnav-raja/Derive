                assert median([1, 2, 1]) == 1


            print("test_median written")
          why: Expects 3 for `[4, 1, 3, 2]`, a value copied from a wrong median, so it fails the right one.
    explanation: >-
      Each case stands for an edge, and each kills a mutant: a list out of order, `[3, 1, 2]`, for
      B, the median that never sorts; an even length whose two middle values have a mean that is
      not whole, `[4, 1, 3, 2]`, for A, the upper middle value, and C, which rounds down; a repeated
