      starter: |
        def largest(xs):
            best = 0
            for x in xs:
                if x > best:
                    best = x
            return best


        def test_positive():
            assert largest([3, 9, 4]) == 9


        def test_negative():
            assert largest([-5, -2, -8]) == -2, "test_negative fails here, and its AssertionError has stopped the whole program"


        def test_one():
            assert largest([7]) == 7


        def run_tests(tests):
            """The names of the tests that fail with AssertionError, in order. tests
            maps each name to a test, a function that takes no arguments."""
            return []


        tests = {"positive": test_positive, "negative": test_negative, "one": test_one}
        print(run_tests(tests))
      tests: |
        def suite(results):
            """A suite of tests named a, b, c and so on, in order: the test for True passes, and the test for False fails with AssertionError. Gives the suite, and the list of the names of the tests in the order they are called."""
            called = []
            tests = {}
            for k in range(len(results)):
                name = "abcdefgh"[k]
                def test(name=name, ok=results[k]):
                    called.append(name)
                    assert ok, "test " + name + " fails"
                tests[name] = test
            return tests, called

        def run(tests):
            """run_tests(tests), with a message that says what went wrong if a test's AssertionError escapes from it."""
            try:
                return run_tests(tests)
            except AssertionError:
                raise AssertionError("run_tests stopped with the AssertionError of a failing test, so the tests after it never ran.") from None

        def test_reports_the_failure():
            """Given the tests a, b and c, of which only b fails, it gives ["b"]."""
            tests, called = suite([True, False, True])
            got = run(tests)
            assert got == ["b"], f"With only b failing, run_tests gives {got!r}, not ['b']."

        def test_goes_on():
            """After a test fails, the tests after it still run: when a fails, b and c are called too."""
            tests, called = suite([False, True, True])
            got = run(tests)
            assert called == ["a", "b", "c"], f"The tests called were {called!r}, not ['a', 'b', 'c']."
            assert got == ["a"], f"With only a failing, run_tests gives {got!r}, not ['a']."

        def test_all_fail():
            """When every test fails, it gives every name, in order."""
            tests, called = suite([False, False, False, False])
            got = run(tests)
            assert got == ["a", "b", "c", "d"], f"With all four tests failing, run_tests gives {got!r}, not ['a', 'b', 'c', 'd']."

        def test_all_pass():
            """When every test passes, it gives an empty list."""
            tests, called = suite([True, True, True])
            got = run(tests)
            assert got == [], f"With every test passing, run_tests gives {got!r}, not []."

        def test_each_once():
            """It calls every test exactly once, in the order of the dictionary."""
            tests, called = suite([True, False, True, False, True])
            run(tests)
            assert called == ["a", "b", "c", "d", "e"], f"The tests called, in order, were {called!r}, not each of ['a', 'b', 'c', 'd', 'e'] once, in that order."

        def test_no_tests():
            """An empty suite gives an empty list."""
            got = run({})
            assert got == [], f"run_tests of an empty dictionary gives {got!r}, not []."
