        import random


        def random_list():
            """A list of 5 whole numbers, each from 1 to 10."""
            xs = []
            for k in range(5):
                xs.append(random.randint(1, 10))
            return xs


        def sort_losses(xs):
            return sorted(set(xs))


        def counts(xs):
            c = {}
            for x in xs:
                c[x] = c.get(x, 0) + 1
            return c


        def sorts_right(xs):
            """True when sort_losses gives xs in order, with the same items."""
            ys = sort_losses(xs)
            return ys == sorted(ys) and counts(ys) == counts(xs)


        def check(prop, make, trials):
            """The first of up to trials inputs from make() for which prop is False,
            or None if prop holds for every one of them."""
            return None


        random.seed(1)
        print(check(sorts_right, random_list, 100))
