        import math


        def mean(xs):
            total = 0
            for x in xs:
                total = total + x
            return total / len(xs)


        def test_mean():
            assert math.isclose(mean([0.1, 0.2]), 0.15)


        try:
            test_mean()
            print("pass")
        except AssertionError:
            print("FAIL")
