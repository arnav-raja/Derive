  - id: debug-shrink
    phase: build
    kind: debug
    concept: E1.9/shrinking
    title: A shrinker that keeps too much
    prompt: >-
      This `shrink` should take out the items of a failing list one at a time, keeping each removal
      whose list still fails, as the Explore phase's did. But for `[1, 2, 1, 1]`, with `fails` true
      when a list has a repeat, it gives `[2, 1, 1]`, though `[1, 1]` still fails. Debug it as an
      experiment, as in E1.8: write a hypothesis and its prediction in the two comments at the top,
      make the observation that tests it, and then mend the function. The tests try other lists and
      properties too.
    answer:
      type: code
      starter: |
        # Hypothesis:
        # If it is right, printing i and xs on every pass of shrink(fails, [1, 2, 1, 1]) will show:

        def fails(xs):
            """True when xs has a repeat, which is when sort_losses gets it wrong."""
            return len(set(xs)) < len(xs)


        def shrink(fails, xs):
            """Takes the items of xs out one at a time, keeping each removal whose
            list still fails. fails(xs) must be True to begin with."""
            i = 0
            while i < len(xs):
                smaller = xs[:i] + xs[i + 1:]
                if fails(smaller):
                    xs = smaller
                i = i + 1
            return xs


        print(shrink(fails, [1, 2, 1, 1]))
