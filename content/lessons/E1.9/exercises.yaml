        def counter():
            """A stand-in for make that gives 1, then 2, then 3 and so on, and the list of the inputs it has given."""
            given = []
            def make():
                given.append(len(given) + 1)
                return given[-1]
            return make, given

        def test_uses_its_arguments():
            """It gets every input from make and asks prop about it, the two functions it is given, not functions of the script."""
            lists = []
            def make():
                lists.append([len(lists) + 1])
                return lists[-1]
            asked = []
            def prop(xs):
                asked.append(xs)
                return True
            check(prop, make, 3)
            assert lists, "check never called make, the function it is given for making inputs: every input should be what make() gives."
            assert asked, "check never called prop, the property it is given: whether an input breaks the property should be what prop says about it."

        def test_finds_failure():
            """With the inputs 1, 2, 3 and so on, and a property that fails only for 3, it gives 3, after making exactly 3 inputs."""
            make, given = counter()
            got = check(lambda x: x != 3, make, 10)
            assert got == 3 and given == [1, 2, 3], f"check gives {got!r} after making the inputs {given}, where it should give 3, the first input for which the property is False, after making just [1, 2, 3]."

        def test_first_failure():
            """When the property fails for 3 and for 5, it gives 3, the first."""
            make, given = counter()
            got = check(lambda x: x != 3 and x != 5, make, 10)
            assert got == 3, f"With the property failing for 3 and 5, check gives {got!r}, not 3."

        def test_none_when_all_pass():
            """When the property holds for every input, it gives None, after making exactly trials inputs."""
            make, given = counter()
            got = check(lambda x: True, make, 7)
            assert got is None, f"check gives {got!r}, not None, though the property held for every input."
            assert len(given) == 7, f"The number of inputs check made is {len(given)}, not 7, the number of trials."

        def test_trials_limit():
            """It makes no more than trials inputs: a failure at the 20th input is not reached in 10 trials."""
            make, given = counter()
            got = check(lambda x: x != 20, make, 10)
            assert len(given) <= 10, f"check made {len(given)} inputs, more than the 10 trials it was given."
            assert got is None, f"check gives {got!r}, not None, though the property held for all 10 inputs it should make."

        def test_gives_the_input():
            """It gives the input itself, the very list that make gave, not True or False."""
            lists = []
            def make():
                lists.append([len(lists)])
                return lists[-1]
            got = check(lambda xs: xs[0] != 2, make, 10)
            assert got == [2], f"check gives {got!r}, not [2], the input for which the property is False."
            assert got is lists[2], "check gives a list equal to the failing input, but not the very list that make gave for it."

        def test_prop_once():
            """It asks the property about each input once, in order."""
            asked = []
            def prop(x):
                asked.append(x)
                return x != 4
            make, given = counter()
            check(prop, make, 10)
            assert asked == [1, 2, 3, 4], f"The property was asked about {asked}, not [1, 2, 3, 4]."

        def test_zero_trials():
            """With 0 trials it makes no input, and gives None."""
            make, given = counter()
            got = check(lambda x: False, make, 0)
            assert given == [] and got is None, f"With 0 trials, check should make no input and give None, but the number of inputs it made is {len(given)}, and it gave {got!r}."
