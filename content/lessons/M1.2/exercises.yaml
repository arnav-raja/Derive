  - id: build-commute-float
    phase: build
    kind: breakit
    concept: M1.2/field-axioms
    title: Swapping two numbers
    prompt: Predict what happens to `left` after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        left = (0.1 + 0.2) + 0.3
        right = 0.1 + (0.2 + 0.3)
        print(left, right, left == right)
      broken: |
        left = (0.2 + 0.1) + 0.3
        right = 0.1 + (0.2 + 0.3)
        print(left, right, left == right)
      change: >-
        In the line for `left`, `0.1 + 0.2` becomes `0.2 + 0.1`: the same two numbers, swapped.
      options:
        - { id: now-equal, label: '`left` changes, and now equals `right`', when: "left != base['left'] and left == right" }
        - { id: still-differs, label: '`left` changes, but still differs from `right`', when: "left != base['left'] and left != right" }
        - { id: unchanged, label: '`left` is unchanged', when: "left == base['left']" }
        - { id: error, label: 'Python stops with an error', when: 'error is not None' }
    explanation: >-
      `left` is unchanged. A single addition is rounded once, from its exact sum, and $0.1 + 0.2$ and
      $0.2 + 0.1$ have the same exact sum. Swapping cannot change a rounded result; regrouping can,
      because it changes which sums are rounded.

  - id: build-sympy-check
    phase: build
    kind: build
    concept: M1.2/equivalence
    title: Equivalence by machine
    prompt: >-
      Replace each `None` with the difference of the two expressions in its comment, multiplied out
      by `expand`, as in the example.
    answer:
      type: code
      starter: |
        from sympy import symbols, expand

        x = symbols("x")

        # expand multiplies out every bracket and collects like terms.
        # Two expressions are equivalent when their difference expands to 0.
        example = expand((x - 1)*(x + 1) - (x**2 - 1))
        print("example:", example)

        # Replace each None. In Python, x^2 is written x**2, and every
        # product needs a *, so 3(x + 4) is 3*(x + 4).
        trees = None   # 3(x + 4) and 3x + 12
        slip = None    # (x + 1)^2 and x^2 + 1
        built = None   # x(x - 1)(x - 2) + x and x

        print("trees:", trees)
        print("slip:", slip)
        print("built:", built)
      tests: |
        def test_trees():
            """trees is the difference of 3(x + 4) and 3x + 12, multiplied out."""
            assert trees is not None, "Replace None with expand(...) of the difference."
            want = expand(3*(x + 4) - (3*x + 12))
            assert trees == want or trees == -want, f"trees is {trees}, which is not that difference multiplied out."

        def test_slip():
            """slip is the difference of (x + 1)^2 and x^2 + 1, multiplied out."""
            assert slip is not None, "Replace None with expand(...) of the difference."
            want = expand((x + 1)**2 - (x**2 + 1))
            assert slip == want or slip == -want, f"slip is {slip}, which is not that difference multiplied out."

        def test_built():
            """built is the difference of x(x - 1)(x - 2) + x and x, multiplied out."""
            assert built is not None, "Replace None with expand(...) of the difference."
            want = expand(x*(x - 1)*(x - 2) + x - x)
            assert built == want or built == -want, f"built is {built}, which is not that difference multiplied out."
      reference: |
        from sympy import symbols, expand

        x = symbols("x")

        example = expand((x - 1)*(x + 1) - (x**2 - 1))
        print("example:", example)

        trees = expand(3*(x + 4) - (3*x + 12))
        slip = expand((x + 1)**2 - (x**2 + 1))
        built = expand(x*(x - 1)*(x - 2) + x - x)

        print("trees:", trees)
        print("slip:", slip)
        print("built:", built)
      wrong:
        - code: |
            from sympy import symbols, expand

            x = symbols("x")

            example = expand((x - 1)*(x + 1) - (x**2 - 1))
            print("example:", example)

            trees = expand(3*(x + 4) - (3*x + 12))
            slip = (x + 1)**2 - (x**2 + 1)
            built = expand(x*(x - 1)*(x - 2) + x - x)

            print("trees:", trees)
            print("slip:", slip)
            print("built:", built)
          why: Leaves the difference for slip unexpanded, so it is not yet visibly 0 or not 0.
        - code: |
            from sympy import symbols, expand

            x = symbols("x")

            example = expand((x - 1)*(x + 1) - (x**2 - 1))
            print("example:", example)

            trees = expand(3*(x + 4) - 3*x + 12)
            slip = expand((x + 1)**2 - (x**2 + 1))
            built = expand(x*(x - 1)*(x - 2) + x - x)

            print("trees:", trees)
            print("slip:", slip)
            print("built:", built)
          why: Without brackets round 3x + 12, only 3x is subtracted and the 12 is added, giving 24.
        - code: |
            from sympy import symbols, expand

            x = symbols("x")

            example = expand((x - 1)*(x + 1) - (x**2 - 1))
            print("example:", example)

            trees = expand(3*(x + 4) - (3*x + 12))
            slip = expand((x + 1)**2 - (x**2 + 1))
            built = expand(x*(x - 1)*(x - 2) - x)

            print("trees:", trees)
            print("slip:", slip)
            print("built:", built)
          why: Drops the + x from the first expression, so it compares the product with x rather than 0.
    explanation: >-
      `trees` is 0, `slip` is $2x$ and `built` is $x^3 - 3x^2 + 2x$. Only the first pair is
      equivalent. SymPy reached each answer by applying the rules, so each is a proof, not a check
      at a few values.

  # Explain --------------------------------------------------------------------
  - id: explain-rules-not-conventions
    phase: explain
    kind: explain
    concept: M1.2/field-axioms
    covers: [M1.2/expression-trees, M1.2/equivalence, M1.2/solving-equations, M1.2/exponent-rules]
    title: Explain it to a friend
    prompt: >-
      A friend says: "The rules of algebra are just conventions. A negative times a negative is
      positive, and $2^0 = 1$, because someone decided so. And the computer's `False` shows the rules
      are not even true." Explain to your friend what an expression really is and which few rules
      algebra rests on. Show why $(-1)(-1) = 1$ and $2^0 = 1$ are not arbitrary, and say what the
      computer's `False` really shows. Then say what makes two expressions the same, and what makes a
      step in solving an equation safe.
    answer:
      type: text
      rubric:
        - id: trees
          criterion: >-
            Describes an expression as a tree whose shape is fixed by the order of operations and
            brackets, with evaluation working up from the leaves.
        - id: forced
          criterion: >-
            Shows that $(-1)(-1) = 1$ follows from the rules, for example from $(-1)(-1) + (-1) =
            (-1)\big((-1) + 1\big) = 0$, and that $2^0 = 1$ is the only value that keeps $a^m \times
            a^n = a^{m+n}$ true.
        - id: computer
          criterion: >-
            Explains that the computer rounds after every operation, which can break the grouping rule
            but never the order rule, so the `False` is about rounded numbers, not ordinary ones.
        - id: same
          criterion: >-
            Says that two expressions are the same when they agree for every value of their letters,
            that one disagreement refutes this, and that only a chain of rules proves it.
        - id: safe
          criterion: >-
            Says that a step in solving is safe when it can be undone, and names one that is not, such
            as squaring both sides or dividing by something that might be 0.
        - id: plain
          criterion: >-
            Is simple enough for the friend to follow, and explains any term such as "associativity"
            the first time it is used.
      reference: >-
        An expression is not just a string of symbols: it has a shape, a tree. In $3 + 4 \times 2$ the
        multiplication sits below the addition, so it is done first, and brackets change the tree and
        with it the value. Algebra rests on a few rules about adding and multiplying. The order of two
        numbers in a sum or product does not matter (commutativity), nor does the grouping of a chain
        (associativity); a bracket can be multiplied out (distributivity); adding 0 or multiplying by
        1 changes nothing; and every number has a negative that cancels it. Every step of algebra has
        to be one of these, which is why its results hold for every number. $(-1)(-1) = 1$ is not a
        convention, because the rules force it: $(-1)(-1) + (-1) = (-1)(-1) + (-1)(1) =
        (-1)\big((-1) + 1\big) = (-1)(0) = 0$, and adding 1 to both sides gives $(-1)(-1) = 1$. Any
        other answer would break the distributive law. $2^0 = 1$ is a definition, but the only one
        that works: multiplying powers adds their exponents, so $2^0 \times 2^3 = 2^3$, and only 1
        leaves $2^3$ unchanged. The computer's `False` is real, but it is about rounded numbers. A
        computer keeps about 16 significant figures and rounds after every operation, so the two
        groupings round different intermediate results. That can break associativity but never
        commutativity, because $a + b$ and $b + a$ have the same exact sum and so round to the same
        value. Ordinary numbers obey the rules exactly. Two expressions are the same when they agree
        for every value of their letters. One value where they disagree, such as $a = b = 1$ for
        $(a + b)^2$ and $a^2 + b^2$, disproves it; agreeing values only suggest it; a chain of rules
        proves it. A step in solving an equation is safe when it can be undone, such as adding the
        same number to both sides. Squaring both sides can add solutions, and dividing by $x$ can lose
        the solution $x = 0$.
      minWords: 100
      maxWords: 450
