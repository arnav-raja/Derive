  - id: build-sympy-check
    phase: build
    kind: build
    concept: M1.2/equivalence
    title: Equivalence by machine
    prompt: >-
      Replace each `None` with the difference of the two expressions in its comment, multiplied out
      by `expand`, as in the example. Either way round will do, but put the second expression in
      brackets, as the example does.
    answer:
      type: code
      starter: |
        # The first line loads SymPy, a library: ready-made Python for algebra.
        from sympy import symbols, expand

        x = symbols("x")   # x is now a letter that SymPy keeps as algebra, not a number

        # expand multiplies out every bracket and collects like terms.
        # Two expressions are equivalent when their difference expands to 0.
        example = expand((x - 1)*(x + 1) - (x**2 - 1))
        print("example:", example)

        # Replace each None. In Python, x^2 is written x**2, and every
        # product needs a *, so 3(x + 4) is 3*(x + 4).
        trees = None   # 3(x + 4) and 3x + 12
        slip = None    # (x + 1)^2 and x^2 + 1
        built = None   # x(x - 1)(x - 2) + x and x

        print("trees:", trees)
        print("slip:", slip)
        print("built:", built)
      tests: |
        from sympy import sympify

        def _check(name, got, values):
            assert got is not None, f"Replace None in {name} with expand(...) of the difference."
            got = sympify(got)
            assert got == expand(got), f"{name} is not multiplied out yet. Put the whole difference inside expand(...)."
            at = [got.subs(x, v) for v in (2, 3, 7)]
            assert at in (values, [-v for v in values]), f"{name} is {got}, which is not the difference of the two expressions. Is the second one in brackets?"

        def test_trees():
            """trees is the difference of 3(x + 4) and 3x + 12, multiplied out."""
            _check("trees", trees, [0, 0, 0])

        def test_slip():
            """slip is the difference of (x + 1)^2 and x^2 + 1, multiplied out."""
            _check("slip", slip, [4, 6, 14])

        def test_built():
            """built is the difference of x(x - 1)(x - 2) + x and x, multiplied out."""
            _check("built", built, [0, 6, 210])
      reference: |
        from sympy import symbols, expand

        x = symbols("x")

        example = expand((x - 1)*(x + 1) - (x**2 - 1))
        print("example:", example)

        trees = expand(3*(x + 4) - (3*x + 12))
        slip = expand((x + 1)**2 - (x**2 + 1))
        built = expand(x*(x - 1)*(x - 2) + x - x)

        print("trees:", trees)
        print("slip:", slip)
        print("built:", built)
      wrong:
