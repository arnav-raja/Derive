links:
  requires:
    - lesson: E1.3
      bridge: >-
        A method is one of E1.3's functions, written inside a class: its parameters are new names,
        its own names are local to each call, and it ends at its `return`. What is new is `self`,
        the object the method was called on, through which the method reads and changes that
        object.
    - lesson: E1.4
      bridge: >-
        E1.4 found that Python keeps every value as an object, that names refer to objects, and that
        `is` asks whether two names refer to the same one. A class makes objects of a new kind,
        whose attributes change in place as a list's slots do, and two names for one object see the
        same changes.
  applies:
    - lesson: M1.1
      bridge: >-
        M1.1 estimated a quantity from rough factors, judged by the factor it might be off by. The
        Derive phase estimates the memory that a graph of Python objects would need for a network's
        numbers, and finds the factor by which keeping numbers in arrays saves it.
    - lesson: M1.3
      bridge: >-
        M1.3 composed functions, applying the inner one first. Layers that are called like functions
        compose the same way: `g(f(x))` runs `f` first, and a list of layers applied in turn is a
        composition of them.
  foreshadows:
    - lesson: M6.5
      bridge: >-
        An expression worked out with objects whose `+` and `*` remember their inputs leaves behind
        its whole tree. M6.5 calls that tree a computational graph, and finds every derivative of
        the result by walking it backwards.
    - lesson: L3.4
      bridge: >-
        This lesson's `Value` keeps a number and the values it was made from. L3.4 gives it a
        gradient and a backward step, and builds from it an autograd engine that trains a small
        network.
    - lesson: E5.4
      bridge: >-
        Every layer of a PyTorch model is a subclass of `Module`, whose `__call__` does some
        bookkeeping and then runs the layer's own `forward`, as this lesson's `Layer` did. E5.4 looks
        at modules, the parameters they own, the state they keep, and the hooks that run around
        `forward`.
skills: [1, 2]
