    answer:
      type: code
      starter: |
        class EarlyStop:
            """Watches a run's losses, given one at a time, and says when to stop. A loss is a
            new best when it is lower than every loss before it, and the first loss always is."""

            def __init__(self, patience):
                """A new watcher, which has seen no losses yet."""


            def step(self, loss):
                """Takes the next loss. Returns True when the losses since the last new best, not
                counting the best itself, number patience or more, and False otherwise."""


        stopper = EarlyStop(2)
        for loss in [1.0, 0.8, 0.9, 0.85, 0.7]:
            print(loss, stopper.step(loss))
      tests: |
        def answers(patience, losses):
            """What step returns for each of the losses in turn, given to a new EarlyStop."""
            stopper = EarlyStop(patience)
            got = []
            for loss in losses:
                got.append(stopper.step(loss))
            return got

        def test_script():
            """The script's run: patience 2, and the losses 1.0, 0.8, 0.9, 0.85, 0.7."""
            got = answers(2, [1.0, 0.8, 0.9, 0.85, 0.7])
            assert got == [False, False, False, True, False], f"With patience 2 and the losses [1.0, 0.8, 0.9, 0.85, 0.7], step gave {got}, not [False, False, False, True, False]. 0.9 and 0.85 are two losses in a row after the best, 0.8, and 0.7 is a new best."

        def test_patience_one():
            """With patience 1, the first loss after a new best that is no new best stops the run."""
            got = answers(1, [3.0, 2.0, 2.5])
            assert got == [False, False, True], f"With patience 1 and the losses [3.0, 2.0, 2.5], step gave {got}, not [False, False, True]."

        def test_improving():
            """A run whose loss falls every time never stops."""
            got = answers(1, [5.0, 4.0, 3.0, 2.0, 1.0])
            assert got == [False, False, False, False, False], f"With patience 1 and the losses [5.0, 4.0, 3.0, 2.0, 1.0], each one a new best, step gave {got}, not False every time."

        def test_against_the_best():
            """A loss is compared with the best so far, not with the loss just before it."""
            got = answers(2, [1.0, 3.0, 2.0])
            assert got == [False, False, True], f"With patience 2 and the losses [1.0, 3.0, 2.0], step gave {got}, not [False, False, True]: 2.0 is lower than 3.0, but not lower than the best, 1.0."

        def test_equal_is_no_best():
            """A loss equal to the best so far is not a new best."""
            got = answers(1, [1.0, 1.0])
            assert got == [False, True], f"With patience 1 and the losses [1.0, 1.0], step gave {got}, not [False, True]: the second 1.0 is not lower than the best, so it is no new best."

        def test_count_starts_again():
            """A new best starts the count again."""
            got = answers(3, [5.0, 6.0, 7.0, 4.0, 5.0, 6.0, 7.0])
            assert got == [False, False, False, False, False, False, True], f"With patience 3 and the losses [5.0, 6.0, 7.0, 4.0, 5.0, 6.0, 7.0], step gave {got}, not False six times and then True. 4.0 is a new best, so the count starts again after it, and only the third loss after it reaches 3."

        def test_after_stop():
            """After saying True, a watcher goes on counting, and a new best still starts the count again."""
            got = answers(1, [1.0, 2.0, 3.0, 0.5])
            assert got == [False, True, True, False], f"With patience 1 and the losses [1.0, 2.0, 3.0, 0.5], step gave {got}, not [False, True, True, False]."

        def test_large_first():
            """The first loss is a new best, however large it is."""
            got = answers(1, [5000000.0, 6000000.0])
            assert got == [False, True], f"With patience 1 and the losses [5000000.0, 6000000.0], step gave {got}, not [False, True]: the first loss is always a new best."

        def test_two_watchers():
            """Two watchers keep their own best losses and their own counts."""
            a = EarlyStop(1)
            b = EarlyStop(1)
            got = [a.step(1.0), b.step(5.0), a.step(2.0), b.step(4.0)]
            assert got == [False, False, True, False], f"With two watchers of patience 1, a given 1.0 and then 2.0, and b given 5.0 and then 4.0 in between, the four calls gave {got}, not [False, False, True, False]. Each watcher should keep its own best and its own count."

        def test_true_or_false():
            """step returns True or False."""
            got = EarlyStop(1).step(1.0)
            assert got is False, f"step gave {got!r} for a first loss, not False: it should return True or False."
      reference: |
        class EarlyStop:
            """Watches a run's losses, given one at a time, and says when to stop. A loss is a
            new best when it is lower than every loss before it, and the first loss always is."""

            def __init__(self, patience):
