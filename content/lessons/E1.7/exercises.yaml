  - id: explain-search
    phase: explain
    kind: explain
    concept: E1.7/special-methods
    covers: [E1.7/classes-and-instances, E1.7/methods-and-self, E1.7/attribute-lookup]
    title: Classes, and the search that trained twice
    prompt: >-
      Explain to your friend what a class is and what calling one does, what `self` is in a method
      and why `m.add(3)` can change `m`, why the puzzle's search trained every config twice and how
      `__eq__` mends it, how Python turns operators such as `+` into method calls, and in what
      order, and where Python looks when it reads an attribute.
    answer:
      type: text
      rubric:
        - { id: class, criterion: 'Says that a class is a new type of value, and that calling it makes a new object, an instance, runs `__init__` with `self` referring to it, so that lines such as `self.lr = lr` give it attributes, and gives back the object.' }
        - { id: self, criterion: 'Explains that a method is a function written in the class, that `m.add(3)` is the call `Meter.add(m, 3)` with `self` referring to the object `m` refers to, and that a method changes its object only through `self`, since a name it assigns without `self.` is local to the call.' }
        - { id: puzzle, criterion: 'Explains the puzzle: without `__eq__`, `==` asks whether two names refer to one object, as `is` does, so two configs made separately are never equal and `in tried` never finds one; an `__eq__` that compares the settings mends it.' }
        - { id: operators, criterion: 'Says that Python turns operators into method calls, `a + b` into `a.__add__(b)` and `a * b` into `a.__mul__(b)`, made in the order of the expression''s tree, and that such a method should return a new object and leave its inputs alone.' }
        - { id: lookup, criterion: 'Describes how an attribute is read: the object''s own attributes first, then its class, then the class it is built on, while assigning always gives the object an attribute of its own; so a list kept in the class is shared by every instance, and a lookup through `self` starts from the object''s own class.' }
      reference: >-
        A class is a new type of value, written in the program. Calling it, as in Config(0.01, 32),
        makes a new, empty object of that type, an instance, then runs the class's __init__ with
        self referring to the new object, and gives the object back. Lines such as self.lr = lr in
        __init__ give the object its attributes, names kept inside it, which a.lr reads later.
        A method is a function written in the class. m.add(3) finds add in m's class and calls it
        as Meter.add(m, 3), so self is a second name for m's object, and self.total = ... changes
        that object, which keeps its attributes from one call to the next. A name assigned without
        self. is only a local name of the call and is gone when it returns. The puzzle's search
        kept a list of the configs it had tried and skipped any config already in it. But in
        compares with ==, and a class that does not say what == means gets the test that is
        asks, whether two names refer to the same object. Every config was made by its own call,
        so none was ever equal to one already tried, and each was trained again. A method
        __eq__ that compares the learning rates and the batch sizes mends it, since a == b is
        worked out as a.__eq__(b). Operators work the same way: a + b calls a.__add__(b) and a * b
        calls a.__mul__(b), with the object on the left as self. In a + b * c the calls follow
        the expression's tree, so __mul__ runs first and its result is the other value of
        __add__, and each should return a new object rather than change its inputs. Reading an
        attribute looks in the object's own attributes first, then in its class, then in the
        class that class is built on. Assigning always gives the object an attribute of its own.
        So a list kept in the class is shared by every instance that appends to it, and inside a
        method that a subclass inherits, self.forward finds the subclass's own forward.
      minWords: 100
      maxWords: 400
