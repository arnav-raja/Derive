    answer:
      type: code
      starter: |
        class Double:
            def __call__(self, x):
                return 2 * x


        class AddOne:
            def __call__(self, x):
                return x + 1


        class Sequential:
            """A layer made of the layers in a list, which it applies in turn: the first to the
            input, the next to what the first gives, and so on. With no layers, it gives back its
            input as it was."""

            def __init__(self, layers):
                """Keeps a copy of the list layers as self.layers, so that a later change to the
                caller's list does not change the model."""


            def __call__(self, x):
                """What the last layer gives, once each layer has been applied in turn to x."""


        model = Sequential([Double(), AddOne()])
        print(model(5))   # AddOne()(Double()(5)), which is 11
      tests: |
        class Count:
            """A layer that adds 1, and counts how many times it has been called."""

            def __init__(self):
                self.calls = 0

            def __call__(self, x):
                self.calls = self.calls + 1
                return x + 1

        def test_order():
            """The first layer in the list is applied first."""
            got = Sequential([Double(), AddOne()])(5)
            assert got == 11, f"Sequential([Double(), AddOne()])(5) is {got!r}, not 11: Double should give 10, and AddOne then 11."
            got = Sequential([AddOne(), Double()])(5)
            assert got == 12, f"Sequential([AddOne(), Double()])(5) is {got!r}, not 12: AddOne should give 6, and Double then 12."

        def test_three():
            """Each layer is applied to what the layer before it gave."""
            got = Sequential([AddOne(), Double(), AddOne()])(1)
            assert got == 5, f"Sequential([AddOne(), Double(), AddOne()])(1) is {got!r}, not 5: 1 becomes 2, then 4, then 5."

        def test_empty():
            """With no layers, the input comes back as it was."""
            got = Sequential([])(7)
            assert got == 7, f"Sequential([])(7) is {got!r}, not 7."

        def test_functions():
            """A plain function is a layer too."""
            got = Sequential([abs, AddOne()])(-3)
            assert got == 4, f"Sequential([abs, AddOne()])(-3) is {got!r}, not 4: abs(-3) is 3, and AddOne gives 4."

        def test_nested():
            """A Sequential can be called with one argument, so it can be a layer of another."""
            inner = Sequential([Double(), Double()])
            got = Sequential([inner, AddOne()])(1)
            assert got == 5, f"With inner = Sequential([Double(), Double()]), Sequential([inner, AddOne()])(1) is {got!r}, not 5."

        def test_each_once():
            """Each call of the model calls each of its layers once."""
            c = Count()
            model = Sequential([c, Double()])
            model(1)
            model(1)
            assert c.calls == 2, f"After two calls of the model, its first layer had been called {c.calls} times, not 2."

        def test_own_copy():
            """A later change to the caller's list leaves the model as it was."""
            layers = [Double()]
            model = Sequential(layers)
            layers.append(AddOne())
            got = model(5)
            assert got == 10, f"After model = Sequential(layers) and then layers.append(AddOne()), model(5) is {got!r}, not 10: the model should keep a copy of the list, which the caller's change does not reach."
            assert len(model.layers) == 1, f"model.layers holds {len(model.layers)} layers, not 1."

        def test_separate():
            """Two models keep their own layers."""
            first = Sequential([Double()])
            second = Sequential([AddOne()])
            a = first(5)
            b = second(5)
            assert a == 10 and b == 6, f"Sequential([Double()])(5) is {a!r} and Sequential([AddOne()])(5) is {b!r}, not 10 and 6: each model should keep its own list of layers."
