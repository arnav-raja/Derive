  - id: build-break-hash
    phase: build
    kind: breakit
    concept: E1.7/special-methods
    title: A set of configs
    prompt: >-
      E1.4 found that a set answers `in` far faster than a list, by working out from the value
      itself where to look, so two equal values must always lead to the same place. Predict what
      happens after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        class Config:
            def __init__(self, lr, batch):
                self.lr = lr
                self.batch = batch

            def __eq__(self, other):
                return self.lr == other.lr and self.batch == other.batch

        configs = [Config(0.01, 32), Config(0.1, 32), Config(0.01, 32), Config(0.1, 64), Config(0.1, 32)]
        tried = []
        for c in configs:
            if c not in tried:
                tried.append(c)
        print(len(tried), "configs trained")
      broken: |
        class Config:
            def __init__(self, lr, batch):
                self.lr = lr
                self.batch = batch

            def __eq__(self, other):
                return self.lr == other.lr and self.batch == other.batch

        configs = [Config(0.01, 32), Config(0.1, 32), Config(0.01, 32), Config(0.1, 64), Config(0.1, 32)]
        tried = set()
        for c in configs:
            if c not in tried:
                tried.add(c)
        print(len(tried), "configs trained")
      change: '`tried` becomes a set, `tried = set()`, and `tried.append(c)` becomes `tried.add(c)`.'
      options:
        - { id: same, label: 'It prints `3 configs trained`, as before', when: "error is None and len(tried) == 3" }
        - { id: all, label: 'It prints `5 configs trained`, since a set does not use `__eq__`', when: "error is None and len(tried) == 5" }
        - { id: first, label: 'Python stops with an error at the first config, before any is trained', when: "error is not None and len(tried) == 0" }
        - { id: other, label: 'Something else happens', when: "(error is None and len(tried) not in (3, 5)) or (error is not None and len(tried) != 0)" }
    explanation: >-
      `c not in tried` on a set needs a number worked out from `c`, from a method named
      `__hash__`, so as to know where to look. Python gives a class without `__eq__` such a method,
      worked out from the object itself, but once a class defines `__eq__` it takes that method
      away, since two equal configs would give different numbers and the set would miss one. So
      the first `in` stops Python with `TypeError: cannot use 'Config' as a set element (unhashable
      type: 'Config')`, before any config is trained.

  - id: build-value
    phase: build
    kind: build
    concept: E1.7/special-methods
    covers: [E1.7/classes-and-instances]
    title: A value that remembers
    prompt: >-
      Write `Value`, whose objects hold a number and remember the values they were made from, as in
      Derive. The tests make values, add and multiply them, and look at what each result keeps and
      what each input is left as.
    answer:
      type: code
      starter: |
        class Value:
            """A number, data, with the list parents of the values it was made from."""

            def __init__(self, data, parents=None):
                """A new value holding data. Called without parents, it has none: a new, empty
                list of its own."""


            def __add__(self, other):
                """A new value holding self's data plus other's, with the parents [self, other].
                self and other are left as they were."""


            def __mul__(self, other):
                """A new value holding self's data times other's, with the parents [self, other].
                self and other are left as they were."""


            def __repr__(self):
                """Value(data), such as Value(6)."""


        a = Value(2)
        b = Value(3)
        c = a * b + a
        print(c, c.parents)   # Value(8) [Value(6), Value(2)]
      tests: |
        def test_add():
            """+ makes a value holding the sum."""
            c = Value(2) + Value(3)
            assert c.data == 5, f"(Value(2) + Value(3)).data is {c.data!r}, not 5."

        def test_mul():
            """* makes a value holding the product."""
            c = Value(2) * Value(3)
            assert c.data == 6, f"(Value(2) * Value(3)).data is {c.data!r}, not 6."

        def test_parents():
            """A result's parents are the two values it was made from themselves, left one first."""
            a = Value(2)
            b = Value(3)
            for c in [a + b, a * b]:
                assert len(c.parents) == 2, f"A result of a + b or a * b has {len(c.parents)} parents, not 2."
                assert c.parents[0] is a and c.parents[1] is b, "The parents of a + b and of a * b should be a list of a and then b themselves, not copies of them."

        def test_new_object():
            """+ and * make a new value."""
            a = Value(2)
            b = Value(3)
            for c in [a + b, a * b]:
                assert c is not a and c is not b, "a + b and a * b should each be a new value, not a or b itself."

        def test_inputs_unchanged():
            """+ and * leave the values they combine as they were."""
            a = Value(2)
            b = Value(3)
            a + b
            a * b
            assert a.data == 2 and b.data == 3, f"After a + b and a * b with a = Value(2) and b = Value(3), a.data is {a.data!r} and b.data is {b.data!r}, not 2 and 3."
            assert a.parents == [] and b.parents == [], f"After a + b and a * b, a.parents is {a.parents!r} and b.parents is {b.parents!r}, not [] and []."

        def test_no_parents():
            """A value made without parents has an empty list of its own."""
            x = Value(1)
            y = Value(2)
            assert x.parents == [], f"Value(1).parents is {x.parents!r}, not []."
            assert x.parents is not y.parents, "Value(1).parents and Value(2).parents are one and the same list. A default value is made once, when the def line runs, and shared by every call, as E1.4 found."

        def test_given_parents():
            """parents passed in are kept as they are."""
            p = [Value(1)]
            v = Value(5, p)
