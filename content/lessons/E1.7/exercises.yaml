exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-equal-configs
    phase: puzzle
    kind: predict
    concept: E1.7/special-methods
    title: Two equal configs
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: all-true, label: '`True True True`' }
        - { id: last-false, label: '`True True False`' }
        - { id: error, label: 'Nothing: Python stops with an error, since it cannot compare two configs' }
        - { id: all-false, label: '`False False False`' }
      correct: [last-false]
    explanation: >-
      `a.lr == b.lr` compares two floats, 0.01 and 0.01, and `a.batch == b.batch` two ints, 32 and
      32, so both are `True`. But `a == b` is `False`: nothing in `Config` says when two configs are
      equal, so Python asks only whether `a` and `b` are one and the same object, and the two calls
      of `Config` made two.

  # Recall ---------------------------------------------------------------------
  - id: recall-alias
    phase: recall
    kind: recall
    concept: E1.4/aliasing-and-mutation
    prompt: |
      What does this program print?

      ```python
      a = [1, 2]
      b = a
      b.append(3)
      print(len(a))
      ```
    answer: { type: number, value: 3, tolerance: { abs: 0 } }
    explanation: >-
      `b = a` makes `b` a second name for the same list, so `b.append(3)` changes the one list that
      both names refer to, and `a` has three slots.

  - id: recall-is-equal
    phase: recall
    kind: recall
    concept: E1.4/aliasing-and-mutation
    prompt: |
      What does this program print?

      ```python
      x = [1, 2]
      y = [1, 2]
      print(x == y, x is y)
      ```
    answer:
      type: choice
      options:
        - { id: both-true, label: '`True True`' }
        - { id: both-false, label: '`False False`' }
        - { id: right, label: '`True False`' }
        - { id: wrong-way, label: '`False True`' }
      correct: [right]
    explanation: >-
      The two lists hold equal values, so `==` gives `True`, but each was made by a list written out
      in brackets, so they are two objects, and `is` gives `False`.

  - id: recall-none
    phase: recall
    kind: recall
    concept: E1.3/defining-functions
    prompt: |
      What does this program print?

      ```python
      def setup(x):
          y = x * 2

      print(setup(5))
      ```
    answer:
      type: choice
      options:
        - { id: none, label: '`None`' }
        - { id: ten, label: '`10`' }
        - { id: five, label: '`5`' }
        - { id: error, label: 'Nothing: Python stops with an error, since `setup` has no `return`' }
      correct: [none]
    explanation: >-
      `setup` works out `y` but never reaches a `return`, so the value of the call is `None`, and
      `print` shows `None`. `y` was a local name, gone when the call ended.

  - id: recall-local
    phase: recall
    kind: recall
    concept: E1.3/scope
    prompt: |
      What does this program print?

      ```python
      total = 0

      def add(x):
          total = x

      add(5)
      print(total)
      ```
    answer: { type: number, value: 0, tolerance: { abs: 0 } }
    explanation: >-
      `total = x` inside `add` makes a local name of the call's own, which never touches the main
      program's `total`, so that is still 0.

  - id: recall-tree
    phase: recall
    kind: recall
    concept: E1.1/evaluation-order
    prompt: In `x - y * z`, which operation does Python work out first?
    answer:
      type: choice
      options:
        - { id: left, label: '`x - y`' }
        - { id: whole, label: 'Neither: Python works out the whole expression in one step' }
        - { id: times, label: '`y * z`' }
      correct: [times]
    explanation: >-
      `*` comes before `-` in Python's order, so the tree of `x - y * z` is $x - (y \times z)$, and
      Python works it out from the leaves: the product first, then the difference.

  # Explore --------------------------------------------------------------------
  - id: explore-own-attributes
    phase: explore
    kind: predict
    concept: E1.7/classes-and-instances
    title: An attribute for one config
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: shared, label: '`0.9 0.9`' }
        - { id: none, label: '`0.9 None`' }
        - { id: error-set, label: 'Nothing: Python stops with an error at `a.momentum = 0.9`, since `__init__` gave the config no `momentum`' }
        - { id: error-read, label: 'Nothing: Python stops with an error when it reaches `b.momentum`' }
      correct: [error-read]
    explanation: >-
      `a.momentum = 0.9` gives the object that `a` refers to an attribute it did not have, and gives
      `b`'s object nothing. Working out the arguments of `print`, Python reads `a.momentum`, 0.9,
      then `b.momentum`, which `b`'s object does not have, so it stops with `AttributeError: 'Config'
      object has no attribute 'momentum'` before `print` runs.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            class Point:
                def __init__(self, x, y):
                    self.x = x
                    self.y = y

            p = Point(1, 2)
            q = Point(3, 4)
            p.x = 10
            print(p.x + q.x)
            ```
          answer: { type: number, value: 13, tolerance: { abs: 0 } }
          explanation: 'Setting `p.x` changes only the object that `p` refers to, so `p.x` is 10 while `q.x` is still 3.'
        - prompt: |
            What does this print?

            ```python
            class Box:
                def __init__(self, size):
                    self.size = size
                    print("made", size)

            a = Box(2)
            b = Box(5)
            print(a.size * b.size)
            ```
          answer:
            type: choice
            options:
              - { id: product, label: '`10` alone' }
              - { id: none, label: '`made 2`, then `made 5`, then `None`' }
              - { id: right, label: '`made 2`, then `made 5`, then `10`' }
            correct: [right]
          explanation: >-
            Each call of `Box` runs `__init__`, which prints its line, and then gives back the new
            object, whatever `__init__` returns, so `a.size` is 2 and `b.size` is 5.

  - id: explore-alias-object
    phase: explore
    kind: predict
    concept: E1.7/classes-and-instances
    title: Three names, two configs
    placement: true
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: copy, label: '`0.01 0.01`' }
        - { id: right, label: '`0.1 0.01`' }
        - { id: all, label: '`0.1 0.1`' }
      correct: [right]
    explanation: >-
      `b = a` copies nothing, so `a` and `b` are two names for one object, and setting its `lr`
      through `b` shows through `a`. `c` was made by a call of its own, so it is another object,
      which nothing changed.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            class Counter:
                def __init__(self):
                    self.n = 0

            def bump(c):
                c.n = c.n + 1

            k = Counter()
            bump(k)
            bump(k)
            print(k.n)
            ```
          answer: { type: number, value: 2, tolerance: { abs: 0 } }
          explanation: 'The parameter `c` is a second name for the object that `k` refers to, so each call of `bump` changes that object''s `n`.'
        - prompt: |
            What does this print?

            ```python
            class Config:
                def __init__(self, lr):
                    self.lr = lr

            a = Config(0.1)
            b = Config(0.1)
            c = b
            c.lr = 0.5
            print(a.lr, b.lr, a is b, b is c)
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`0.1 0.5 False True`' }
              - { id: all-same, label: '`0.5 0.5 True True`' }
              - { id: copy, label: '`0.1 0.1 False False`' }
              - { id: equal-is, label: '`0.1 0.5 True True`' }
            correct: [right]
          explanation: >-
            `c = b` makes `c` a second name for `b`'s object, so `c.lr = 0.5` changes that object.
            `a` was made by a call of its own, so it is another object, with an `lr` of its own.

  - id: explore-forgot-self
    phase: explore
    kind: predict
    concept: E1.7/methods-and-self
    title: A method without self
    placement: true
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: works, label: '`8 2`' }
        - { id: last, label: '`5 1`' }
        - { id: error, label: 'Nothing: Python stops with an error, since `total` and `count` are not attributes' }
        - { id: right, label: '`0 0`' }
      correct: [right]
    explanation: >-
      `total` and `count`, written without `self.`, are names of each call's own, as in E1.3: they
      are given 3 and 1 in the first call and 5 and 1 in the second, and are gone when each call
      returns. Nothing assigns `self.total` or `self.count`, so the object's attributes stay 0.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            class Steps:
                def __init__(self):
                    self.n = 0

                def tick(self):
                    self.n = self.n + 1
                    return self.n

            s = Steps()
            s.tick()
            s.tick()
            print(s.tick())
            ```
          answer: { type: number, value: 3, tolerance: { abs: 0 } }
          explanation: 'Each call of `tick` adds 1 to the object''s own `n`, which it keeps from one call to the next, so the third call returns 3.'
        - prompt: |
            What happens when this runs?

            ```python
            class Meter:
                def __init__(self):
                    self.total = 0

                def add(loss):
                    self.total = self.total + loss

            m = Meter()
            m.add(3)
            print(m.total)
            ```
          answer:
            type: choice
            options:
              - { id: three, label: 'It prints `3`' }
              - { id: error, label: 'Python stops with an error at `m.add(3)`' }
              - { id: zero, label: 'It prints `0`' }
            correct: [error]
          explanation: >-
            `m.add(3)` passes the object as the first argument and 3 as the second, but `add` has
            only one parameter, so Python stops with `TypeError: Meter.add() takes 1 positional
            argument but 2 were given`. A method's first parameter is the object, which is why it is
            called `self`.
        - prompt: |
            What does this print?

            ```python
            class Best:
                def __init__(self):
                    self.low = 100

                def see(self, x):
                    if x < self.low:
                        low = x

            b = Best()
            b.see(5)
            b.see(50)
            print(b.low)
            ```
          answer: { type: number, value: 100, tolerance: { abs: 0 } }
          explanation: '`low = x` makes a local name of the call, gone when it returns. Only `self.low = x` would change the object, so `b.low` is still 100.'

  - id: explore-eq
    phase: explore
    kind: predict
    concept: E1.7/special-methods
    title: Configs with __eq__
    placement: true
    prompt: With this `Config`, which of these are `True`? Choose every one that is.
    answer:
      type: choice
      multiple: true
      options:
        - { id: eq, label: '`a == b`' }
        - { id: is, label: '`a is b`' }
        - { id: in, label: '`a in [b]`' }
        - { id: ne, label: '`a != b`' }
      correct: [eq, in]
    explanation: >-
      `a == b` calls `a.__eq__(b)`, which compares the settings, so it is `True`, and `in` compares
      by `==`, so `a in [b]` is `True` too. `is` still asks whether `a` and `b` are one object, and
      they are two, so `a is b` is `False`. Python works out `a != b` as the opposite of `a == b`,
      so it is `False`.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            class Card:
                def __init__(self, rank):
                    self.rank = rank

            x = Card(7)
            y = Card(7)
            print(x == y, x == x)
            ```
          answer:
            type: choice
            options:
              - { id: both-true, label: '`True True`' }
              - { id: both-false, label: '`False False`' }
              - { id: right, label: '`False True`' }
            correct: [right]
          explanation: >-
            `Card` has no `__eq__`, so `==` asks whether the two names refer to one object: `x` and
            `y` are two objects, while `x` is itself.
        - prompt: |
            What does this print?

            ```python
            class Card:
                def __init__(self, rank):
                    self.rank = rank

                def __eq__(self, other):
                    return self.rank == other.rank

            hand = [Card(3), Card(9)]
            print(Card(9) in hand, Card(5) in hand)
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`True False`' }
              - { id: identity, label: '`False False`' }
              - { id: all, label: '`True True`' }
            correct: [right]
          explanation: >-
            `in` compares the new `Card(9)` with each card in `hand` by `==`, which calls `__eq__`
            and compares ranks, so the second card matches. No card has rank 5.

  - id: explore-call-order
    phase: explore
    kind: predict
    concept: E1.7/special-methods
    title: Which method runs first
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: written, label: '`add 2 3`, then `mul 5 4`, then `20`' }
        - { id: self-wrong, label: '`mul 3 4`, then `add 12 2`, then `14`' }
        - { id: no-lines, label: '`14` alone, since `+` and `*` do not call the methods by name' }
        - { id: right, label: '`mul 3 4`, then `add 2 12`, then `14`' }
      correct: [right]
    explanation: >-
      E1.1's tree puts `b * c` below `+`, so `b.__mul__(c)` runs first and prints `mul 3 4`, giving
      a new `Num` holding 12. Then `a.__add__` is called, with `a`, on the left, as `self` and the
      new `Num` as `other`, and prints `add 2 12`. `d` holds 14.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            class Num:
                def __init__(self, v):
                    self.v = v

                def __add__(self, other):
                    print("add", self.v, other.v)
                    return Num(self.v + other.v)

                def __mul__(self, other):
                    print("mul", self.v, other.v)
                    return Num(self.v * other.v)

            d = (Num(2) + Num(3)) * Num(4)
            print(d.v)
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`add 2 3`, then `mul 5 4`, then `20`' }
              - { id: mul-first, label: '`mul 3 4`, then `add 2 12`, then `14`' }
              - { id: no-lines, label: '`20` alone' }
            correct: [right]
          explanation: 'The brackets put `+` below `*` in the tree, so `__add__` runs first, giving a `Num` holding 5, which `__mul__` then multiplies by 4.'
        - prompt: |
            What does this print?

            ```python
            class Vec:
                def __init__(self, x):
                    self.x = x

                def __add__(self, other):
                    return Vec(self.x + other.x)

            a = Vec(1)
            b = a + Vec(2)
            print(a.x, b.x, a is b)
            ```
          answer:
            type: choice
            options:
              - { id: changed, label: '`3 3 True`' }
              - { id: changed-copy, label: '`3 3 False`' }
              - { id: right, label: '`1 3 False`' }
            correct: [right]
          explanation: '`__add__` makes a new `Vec` and changes neither of the two it adds, so `a.x` is still 1, and `b` refers to the new object.'

  - id: explore-class-list
    phase: explore
    kind: predict
    concept: E1.7/attribute-lookup
    title: A list in the class
    placement: true
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: own, label: '`[0.9]`' }
        - { id: empty, label: '`[]`' }
        - { id: right, label: '`[0.9, 0.7]`' }
        - { id: error, label: 'Nothing: Python stops with an error, since `a` has no attribute `losses`' }
      correct: [right]
    explanation: >-
      Neither run has an attribute `losses` of its own, so `self.losses` finds the class's list, the
      same list in both calls, and `append` changes it in place. `a.losses` finds that list too,
      holding both losses.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            class Log:
                def __init__(self):
                    self.items = []

                def add(self, x):
                    self.items.append(x)

            a = Log()
            b = Log()
            a.add(1)
            b.add(2)
            print(a.items)
            ```
          answer:
            type: choice
            options:
              - { id: shared, label: '`[1, 2]`' }
              - { id: right, label: '`[1]`' }
              - { id: empty, label: '`[]`' }
            correct: [right]
          explanation: '`__init__` runs for each new log and gives it a list of its own, so `a.add(1)` and `b.add(2)` append to two different lists.'
        - prompt: |
            What does this print?

            ```python
            class Run:
                count = 0

                def start(self):
                    self.count = self.count + 1

            a = Run()
            b = Run()
            a.start()
            a.start()
            b.start()
            print(a.count, b.count, Run.count)
            ```
          answer:
            type: choice
            options:
              - { id: shared, label: '`3 3 3`' }
              - { id: class-too, label: '`2 1 3`' }
              - { id: error, label: 'Nothing: Python stops with an error, since a run has no `count` of its own' }
              - { id: right, label: '`2 1 0`' }
            correct: [right]
          explanation: >-
            The first `self.count` that each run reads is the class's 0, and the assignment then
            gives that run a `count` of its own. After that, each run reads its own. Nothing assigns
            the class's `count`, so it stays 0.

  - id: explore-layers
    phase: explore
    kind: predict
    concept: E1.7/attribute-lookup
    title: Layers that share a call
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: outer-first, label: '`calling add one`, then `calling double`, then `12`' }
        - { id: right, label: '`calling double`, then `calling add one`, then `11`' }
        - { id: lines-wrong, label: '`calling add one`, then `calling double`, then `11`' }
        - { id: error, label: 'Nothing: Python stops with an error, since `Layer` has no `name` and no `forward`' }
      correct: [right]
    explanation: >-
      `g(f(5))` works out its argument first, so `f(5)` runs first. `Double` has no `__call__` of
      its own, so `Layer`'s is found, and in it `self` is the `Double`, whose `name` is `"double"`
      and whose `forward` gives 10. Then `g(10)` prints `calling add one` and gives 11.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            class Schedule:
                base = 0.1

                def lr(self, step):
                    return self.base * self.factor(step)

                def factor(self, step):
                    return 1

            class Halving(Schedule):
                def factor(self, step):
                    return 0.5 ** step

            print(Schedule().lr(3), Halving().lr(3))
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`0.1 0.0125`' }
              - { id: base, label: '`0.1 0.1`' }
              - { id: error, label: 'Nothing: Python stops with an error, since `Halving` has no `lr` and no `base`' }
            correct: [right]
          explanation: >-
            A `Halving` finds `lr` and `base` in its base class, but `self.factor(step)` is looked up
            from the object's own class, so it gives $0.5^3 = 0.125$, and $0.1 \times 0.125 = 0.0125$.
        - prompt: |
            What does this print?

            ```python
            class Scale:
                def __init__(self, k):
                    self.k = k

                def __call__(self, x):
                    return self.k * x

            half = Scale(0.5)
            triple = Scale(3)
            print(triple(half(8)))
            ```
          answer: { type: number, value: 12, tolerance: { abs: 0 } }
          explanation: '`half(8)` calls `half.__call__(8)`, which gives 4.0, and then `triple(4.0)` gives 12.0.'

  # Derive ---------------------------------------------------------------------
  - id: derive-lookup-proof
    phase: derive
    kind: proof
    concept: E1.7/attribute-lookup
    title: Why the count and the list differ
    prompt: >-
      Here is why the program prints `2 0 [0.9, 0.7]`. Each line follows from the program and the
      lines above it. Choose the rule that justifies each line. A rule may be used more than once or
      not at all.
    answer:
      type: steps
      rules:
        - { id: in-place, name: Changed in place, label: 'A list changed in place shows the change through every name and attribute that refers to it.' }
        - { id: own, name: Own first, label: 'Reading `obj.name` takes the object''s own attribute, when it has one.' }
        - { id: base, name: The base, label: 'When neither an object nor its class has an attribute, reading it looks in the base of the class.' }
        - { id: assign, name: Assigning, label: 'Assigning `obj.name = v` gives the object an attribute of its own, or changes the one it has, and changes nothing else.' }
        - { id: class, name: Then the class, label: 'When an object has no attribute of that name, reading `obj.name` takes its class''s.' }
      start: '\texttt{a} \text{ and } \texttt{b} \text{ refer to two new runs, with no attributes of their own.}'
      lines:
        - math: '\text{In the first call, } \texttt{self.count} \text{ on the right of line 6 is the class''s } \texttt{count}\text{, 0}'
          rule: class
        - math: '\text{Line 6 gives the run that } \texttt{a} \text{ refers to a } \texttt{count} \text{ of its own, 1, and the class''s } \texttt{count} \text{ stays 0}'
          rule: assign
        - math: '\text{In the second call, } \texttt{self.count} \text{ is that run''s own } \texttt{count}\text{, 1}'
          rule: own
        - math: '\text{So line 6 makes the run''s own } \texttt{count} \text{ 2, and } \texttt{Run.count} \text{ is still 0}'
          rule: assign
        - math: '\text{In both calls, } \texttt{self.losses} \text{ is the class''s list, since the run has no } \texttt{losses} \text{ of its own}'
          rule: class
        - math: '\text{Both appends change that one list, so } \texttt{b.losses}\text{, which is the class''s list too, is } \texttt{[0.9, 0.7]}'
          rule: in-place
    explanation: >-
      The first read of `self.count` finds nothing on the run and falls back to the class's 0. The
      assignment on line 6 then gives the run a `count` of its own, which every later read finds
      first, while the class's `count` is never assigned. `self.losses` is never assigned at all, so
      every read finds the class's one list, and both appends change it. No class here is built on
      another, so the rule about a base is not needed.

  - id: derive-tolerance
    phase: derive
    kind: step
    concept: E1.7/special-methods
    title: How far equal can stretch
    prompt: >-
      With `a == b` and `b == c` both `True`, how far apart can the learning rates $x$ and $z$ be?
      Write the largest that $\lvert x - z \rvert$ can be, as an expression in $t$.
    answer:
      type: expression
      symbols:
        - { name: t, positive: true }
      lhs: '\lvert x - z \rvert \le'
      reference: 2*t
      accept: ['2t', 't + t', 't*2']
      reject: ['t', '0', 't^2', '3*t', 't/2', '4*t', '2']
    explanation: >-
      `a == b` says that $\lvert x - y \rvert \le t$, and `b == c` that $\lvert y - z \rvert \le t$.
      Going from $x$ to $z$ by way of $y$ covers at most $t + t$, so $\lvert x - z \rvert \le 2t$,
      and $x = y - t$ with $z = y + t$ reaches it.

