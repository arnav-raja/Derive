misconceptions:
  - id: slope-upside-down
    belief: A slope is the step divided by the rise.
    why: >-
      The slope says how much the output changes for each unit of input, so the change in output goes
      on top. Upside down, the training runs would give half an hour per billion tokens instead of 2.
    cue: An answer of $n/2 + 4$ for the training time, or a slope of 0.5 where 2 is right.
  - id: intercept-is-first-point
    belief: The intercept is the height of the first point given.
    why: >-
      The intercept is the height at $x = 0$. It equals the first point's height only when that point
      sits at $x = 0$, as the freezing point does on the Celsius scale.
    cue: An answer of $2n + 5$ for the training time.
  - id: everything-steady
    belief: Every rule changes at a steady rate, so the next rise is the same as the last one.
    why: >-
      Only linear rules have steady rises. The squares rise by 1, 3, 5, 7: a curve's rate depends on
      where it is measured.
    cue: Predicting 74 for the next value after 52 in Explore's table, by repeating the last rise of 22.
  - id: square-splits
    belief: $(x + h)^2 = x^2 + h^2$.
    why: >-
      Multiplying out gives $x^2 + 2hx + h^2$. The middle term, $2hx$, is what lets a squared bracket
      match the $x$ term of a quadratic.
    cue: Choosing $x^2 + 9$ for $(x + 3)^2$, or trying to match $x^2 - 10x$ with $x^2 + 25$.
  - id: bracket-not-halved
    belief: The number in the bracket is the number in front of $x$.
    why: >-
      $(x + h)^2$ has $2h$ in front of $x$, so $h$ must be half of that number.
    cue: An answer of $(x - 10)^2 - 69$ for $x^2 - 10x + 31$.
  - id: leftover-added
    belief: When completing the square, the bracket's extra number is added on, not taken away.
    why: >-
      $(x - 5)^2$ already brings $+25$ with it, so to get back to $+31$ only 6 more is needed. Adding
      25 again overshoots.
    cue: An answer of $(x - 5)^2 + 56$, which adds the 25 a second time instead of taking it away.
  - id: vertex-sign
    belief: The vertex of $ax^2 + bx + c$ is at $x = b/(2a)$.
    why: >-
      The bracket is $x + \tfrac{b}{2a}$, and it is 0 when $x = -\tfrac{b}{2a}$. With $b = -6$ and
      $a = 1$ the vertex is at $+3$.
    cue: A vertex on the wrong side, such as $-3$ for $x^2 - 6x + 11$.
  - id: slash-two-a
    belief: In Python, `/ 2*a` divides by $2a$.
    why: >-
      Python works through `*` and `/` from left to right, so `/ 2*a` divides by 2 and then
      multiplies by `a`. Only brackets, `/ (2*a)`, divide by $2a$.
    cue: Code that writes `/ 2*a` or `/ 4*a`, which agrees with the right formula when $a$ is 1 or $-1$ and fails the other cases.
  - id: middle-always-best
    belief: The best single guess is the middle value, whatever the score.
    why: >-
      Under squared error the best guess is the mean; the middle value, the median, is best under the
      absolute error. Different scores choose different guesses.
    cue: Choosing 3 in the puzzle, or answering 2.5 for the data with the wild value.

exercises:
  derive-line-through:
    rungs:
      - What do the two runs tell you about how many extra hours each extra billion tokens costs?
      - >-
        The worked example above found the Fahrenheit rule the same way: the slope first, from the
        rise and the step, then the number at the start.
      - Going from 2 to 6 billion tokens added how many hours? And how many billions of tokens is that step?
      - >-
        If your answer is a number times $n$ plus a number, its shape is right. Check it at both runs:
        it must give 5 at $n = 2$ and 13 at $n = 6$. If it is wrong at both by the same amount, the
        trouble is in the number at the start; otherwise it is in the slope.
      - >-
        For a phone plan, 3 GB cost ₹250 and 7 GB cost ₹450. The slope is
        $(450 - 250) \div (7 - 3) = 50$ rupees per GB, and $250 = 50 \times 3 + c$ gives $c = 100$, so
        the cost is $50g + 100$.
    notes: >-
      $n/2 + 4$ divides the step by the rise. $2n + 5$ takes the first run's time as the intercept.
      $13n/6$ or $2.5n$ assumes the line passes through 0. $4n - 3$ divides the rise of 8 by 2 instead
      of by the step of 4.
  derive-chord-square:
    rungs:
      - What does the top of the fraction, $v^2 - u^2$, have in common with the bottom, $v - u$?
      - >-
        M1.2 multiplied out brackets with the distributive law. Multiply out $(v - u)(v + u)$ and
        compare it with the top.
      - >-
        Try $u = 1$ and $v = 3$: the top is 8 and the bottom is 2. Can you write 8 as 2 times
        something that appears in a later line?
      - >-
        If your rule for the first line is right, the trouble is in a later line. Compare each later
        line with the one before it and say in words what changed: did something disappear, or only
        move?
      - >-
        To show that $\dfrac{6p + 6}{p + 1} = 6$ when $p \ne -1$, write the top as $6(p + 1)$ by the
        distributive law, then cancel the factor $p + 1$, which is not 0.
    notes: >-
      Choosing Square root anywhere treats $v^2 - u^2$ as if it were $(v - u)^2$. Split a fraction is
      the wrong rule for the first line: it would give $\dfrac{v^2}{v - u} - \dfrac{u^2}{v - u}$,
      which is not what that line shows.
  derive-general-rate:
    rungs:
      - What is $f(v) - f(u)$ before you divide? Write it out and see what cancels.
      - The proof just above showed that $v^2 - u^2$ has the factor $v - u$.
      - >-
        Try numbers first: work out the rate from $u = 1$ to $v = 2$ straight from $f$. Whatever
        formula you find must give that number there.
      - >-
        Take the three terms of $f$ one at a time: each leaves its own part in
        $\dfrac{f(v) - f(u)}{v - u}$. The parts of your answer that match are right, and the one that
        does not shows where to look.
      - >-
        For $g(x) = 2x^2 + x$: $g(v) - g(u) = 2(v^2 - u^2) + (v - u) = (v - u)\big(2(v + u) + 1\big)$,
        so the rate from $u$ to $v$ is $2(u + v) + 1$.
    notes: >-
      $3(u + v)$ drops the $-2$ from the $x$ term. $3(u + v) + 5$ keeps the 5, which cancels in
      $f(v) - f(u)$. $6(u + v) - 2$ doubles the 3, as if the rate were $2p(u + v)$. An unsimplified
      fraction is equal but has not taken the step.
  derive-complete-square:
    rungs:
      - What is half of the number in front of $x$?
      - The worked example above did $x^2 + 8x + 20$, where half of 8 gave the bracket $(x + 4)^2$.
      - >-
        Start with a smaller one: $x^2 - 2x + 3$. Half of $-2$ is $-1$, and $(x - 1)^2 = x^2 - 2x + 1$.
        What is left over?
      - >-
        Your answer has the right form, a squared bracket plus a number. Multiply it out and compare it
        with $x^2 - 10x + 31$ term by term: the terms that match are right, and the first that does
        not shows where to look.
      - >-
        $x^2 + 6x + 14$: half of 6 is 3, $(x + 3)^2 = x^2 + 6x + 9$, and $14 - 9 = 5$, so
        $x^2 + 6x + 14 = (x + 3)^2 + 5$.
    notes: >-
      $(x - 10)^2 - 69$ uses the whole $-10$ instead of half of it. $(x - 5)^2 + 56$ adds the 25 a
      second time, and $(x - 5)^2 + 31$ never takes it away. $(x + 5)^2 + 6$ has the wrong sign in the bracket,
      which gives $+10x$.
  derive-general-square:
    rungs:
      - In the examples with numbers, how did the number in the bracket relate to the number in front of $x$?
      - >-
        Each example above halved the number in front of $x$: 8 gave $x + 4$, and $-10$ gave
        $x - 5$.
      - >-
        Try $b = 6$ first: complete the square for $x^2 + 6x + c$ as you did with numbers. Then ask
        where each number in your answer came from, in terms of 6.
      - >-
        Your answer has the right form, a squared bracket plus a part without $x$. Multiply it out and
        compare it with $x^2 + bx + c$ term by term: the terms that match are right, and the first
        that does not shows where to look.
      - >-
        For $x^2 - 3x + c$: half of $-3$ is $-\tfrac{3}{2}$, and
        $\big(x - \tfrac{3}{2}\big)^2 = x^2 - 3x + \tfrac{9}{4}$, so the quadratic is
        $\big(x - \tfrac{3}{2}\big)^2 + c - \tfrac{9}{4}$.
    notes: >-
      $(x + b)^2 + c - b^2$ forgets to halve. $(x + \tfrac{b}{2})^2 + c$ forgets that the square brings
      $\tfrac{b^2}{4}$ with it. $-\tfrac{b^2}{2}$ squares the half wrongly.
  derive-mean-best:
    rungs:
      - The number in front of $w^2$ is 3, not 1. What can you do with it before completing the square?
      - >-
        The Steps above took $a$ out of the first two terms, $ax^2 + bx = a\big(x^2 + \tfrac{b}{a}x\big)$,
        before completing the square inside the bracket.
      - >-
        Try $2w^2 - 8w + 10$ first: it is $2(w^2 - 4w) + 10$, and $w^2 - 4w = (w - 2)^2 - 4$. What
        does that make the whole expression?
      - >-
        Your answer has the right form, a number times a squared bracket plus a number. Multiply it
        out and compare it with $3w^2 - 24w + 62$ term by term: the terms that match are right, and
        the first that does not shows where to look.
      - >-
        $2w^2 + 12w + 5 = 2(w^2 + 6w) + 5 = 2\big((w + 3)^2 - 9\big) + 5 = 2(w + 3)^2 - 13$.
    notes: >-
      $3(w - 4)^2 + 62$ forgets that the bracket brings $3 \times 16 = 48$ with it. $3(w - 4)^2 - 34$
      takes away 48 twice, adding nothing back. $(w - 4)^2 + 14$ drops the 3 in front. $3(w - 12)^2$
      halves $-24$ before taking out the 3, and $3(w - 8)^2$ takes out the 3 but does not halve.
  derive-mean-general:
    rungs:
      - >-
        The 3 in front of $w^2$ comes first, as in the last step. What is left in the bracket when you
        take 3 out of $3w^2 - 2Sw$?
      - >-
        Just before, $3w^2 - 24w + 62$ became $3(w^2 - 8w) + 62$, and half of $-8$ went into the
        bracket.
      - >-
        Try the puzzle's values first, where $S = 12$ and $Q = 62$: your answer must turn into the
        completed square of the last step. Which part of your answer gives its 4, and which its 14?
      - >-
        Your answer has the right form, 3 times a squared bracket plus a part without $w$. Multiply it
        out and compare it with $3w^2 - 2Sw + Q$ term by term: the terms that match are right, and the
        first that does not shows where to look.
      - >-
        $2w^2 - 2Tw + R = 2\big(w^2 - Tw\big) + R = 2\big(w - \tfrac{T}{2}\big)^2 + R - \tfrac{T^2}{2}$,
        since $\big(w - \tfrac{T}{2}\big)^2 = w^2 - Tw + \tfrac{T^2}{4}$.
    notes: >-
      $3(w - S)^2 + Q - 3S^2$ halves $-2S$ before taking out the 3. $3\big(w - \tfrac{S}{3}\big)^2 + Q$
      forgets that the bracket brings $\tfrac{S^2}{3}$ with it. $\big(w - \tfrac{S}{3}\big)^2 + Q - \tfrac{S^2}{9}$
      drops the 3 in front. $Q - \tfrac{S^2}{9}$ for the part without $w$ forgets that the 3 multiplies
      the number taken away inside the bracket.
  build-line:
    rungs:
      - What two numbers decide a line, and which of them can you work out from the two points straight away?
      - >-
        Derive found the training-time line in two steps: the slope from the rise and the step, then
        the intercept from one point.
      - >-
        For the points (2, 5) and (6, 13) the slope is 2. Which arithmetic on the four numbers gives 2?
        Now write that with the names `x1`, `y1`, `x2` and `y2`.
      - >-
        `slope` and `intercept` both give numbers now, which is right. Print `slope(2, 5, 6, 13)` and
        compare it with the slope Derive found for the training runs: if they agree, the trouble is in
        `intercept`; if not, it is in `slope`.
      - >-
        A trip counter reads 150 km at 2 hours and 330 km at 5 hours. `(330 - 150) / (5 - 2)` gives 60
        km per hour, and going back two hours at that rate, `150 - 60 * 2` gives 30, the reading when
        the clock read 0.
    notes: >-
      A slope of 0.5 for the training runs divides the step by the rise. An intercept equal to `y1`
      forgets to go back to x = 0. `y2 - y1 / (x2 - x1)` is missing the brackets on the top. The tests
      stop at the first point that fails, so a learner sees one miss at a time.
  build-roots-bug:
    rungs:
      - Which line does the arithmetic, and in what order does Python do its parts?
      - M1.2's Build said that a chain of `*` and `/` with no brackets is worked from the left.
      - Work out `8 / 2*2` by hand, the way Python does. Is it 2 or 8?
      - >-
        The tops of the two fractions are right, and so is `d`. The trouble is on the return line, in
        what each top is divided by: work out by hand what that line does, in the order Python works.
      - >-
        To share ₹600 among 3 groups of 4 people, each person gets `600 / (3*4)`, which is 50. Without
        the brackets, `600 / 3*4` is 800, because Python divides by 3 and then multiplies by 4.
    notes: >-
      (4.0, 8.0) for the doubled equation is the bug itself: divided by 2, then multiplied by 2. Signs
      flipped, such as (-2.0, -1.0), mean `b` was used where the formula has `-b`. The same number
      twice means both lines use the same sign before `d`.
  build-vertex:
    rungs:
      - What did Derive find for the $x$ of the vertex of $ax^2 + bx + c$?
      - >-
        Derive's Steps took $a$ out of the first two terms and completed the square; the vertex was
        where the bracket is 0.
      - >-
        For $x^2 - 6x + 11$ the vertex is at 3. Which formula in $a$, $b$ and $c$ gives 3 when $a = 1$,
        $b = -6$ and $c = 11$?
      - >-
        Explore found the bottom of $x^2 - 6x + 11$, so check what `vertex` prints for it first. If
        that is right, the trouble shows only when $a$ is not 1: work out by hand what your return line
        gives for $a = 2$ and $b = 8$, in the order Python works.
      - >-
        For $y = 2x^2 - 8x + 1$, the vertex is at $x = 8 \div (2 \times 2) = 2$, and the height there
        is $2 \times 4 - 16 + 1 = -7$.
    notes: >-
      A vertex that is right when $a$ is 1 or $-1$ but wrong otherwise means `/ 2*a`. A vertex on the
      wrong side has lost the minus sign. A vertex twice as far from 0 as it should be has not been
      halved. `vertex_height` equal to `c` gives the height at x = 0.
  build-sympy-quadratic:
    rungs:
      - What expression, set equal to 0, is each equation, and which letter should it be solved for?
      - >-
        In M1.3, `solve` found $x$ in an equation whose answer kept another letter, `y`. Here the
        letters $a$, $b$ and $c$ stay in the answer in the same way.
      - Do `doubled` first, since it has only numbers in it. Run the program and look at what it prints.
      - >-
        If `doubled` gives the right solutions, that line is right. The trouble is in the line that
        sets `formula`: compare what you put inside `solve( )` with the example line, part by part.
      - To solve $3x^2 - 12 = 0$ for $x$, write `solve(3*x**2 - 12, x)`, which gives `[-2, 2]`.
    notes: >-
      A list holding `(-b*x - c)/x**2` means the expression was solved for `a`. Solutions without `a`
      mean the `a` in front of `x**2` is missing. A single number for `doubled` means only the first
      solution was kept.

novice:
  - Why square the misses instead of just adding them up?
  - If the mean is the best single guess, why would anyone use the median?
  - Does every parabola have a lowest point?
  - Why does half of the number in front of $x$ go in the bracket, and not the whole of it?
  - What is the rate of change of $x^2$ at a single point, when $a$ and $b$ are the same?
