  # Explain --------------------------------------------------------------------
  - id: explain-bowls
    phase: explain
    kind: explain
    concept: M1.4/completing-the-square
    covers: [M1.4/linear-functions, M1.4/average-rate-of-change, M1.4/quadratics]
    title: Explain it to a friend
    prompt: >-
      A friend says: "To find the lowest point of a curve, you have to draw it carefully or try lots of
      values." Explain to your friend how completing the square finds the lowest point of a quadratic
      exactly, with an example. Then explain why, under squared error, the best single guess is the
      mean. Finish by explaining how the rate of change of a straight line differs from that of a
      quadratic.
    answer:
      type: text
      rubric:
        - id: square
          criterion: Completes the square for an example quadratic and reads off its lowest point.
        - id: never-negative
          criterion: >-
            Explains why the completed square shows the lowest point: a square is never negative, so
            the smallest value comes where the bracket is 0.
        - id: mean
          criterion: >-
            Explains why the mean is the best single guess under squared error, using the fact that
            the squared error is a quadratic in the guess.
        - id: rates
          criterion: >-
            Explains that a line changes at the same rate between any two points, while a quadratic's
            average rate of change depends on the two points chosen.
        - id: plain
          criterion: >-
            Is simple enough for the friend to follow, and explains any term such as "vertex" or
            "average rate of change" the first time it is used.
      reference: >-
        Drawing or trying values only gets you close. Completing the square gets the lowest point
        exactly. Take $x^2 - 6x + 11$. Half of the $-6$ is $-3$, and $(x - 3)^2$ multiplies out to
        $x^2 - 6x + 9$, so $x^2 - 6x + 11$ is the same as $(x - 3)^2 + 2$. Now look at that form. A
        square is never negative, so $(x - 3)^2$ is at least 0, and it is exactly 0 only when $x = 3$.
        So the whole thing is at least 2, and it equals 2 at $x = 3$: the lowest point, called the
        vertex, is $(3, 2)$, with no drawing and no guessing. The same works for any quadratic, and
        with letters it gives the vertex of $ax^2 + bx + c$ at $x = -b/(2a)$. Now the guessing game.
        If a model must give one number $w$ for the data 2, 3 and 7, and is scored by adding the squares
        of its misses, the score is $(2 - w)^2 + (3 - w)^2 + (7 - w)^2$. Multiplied out, that is
        $3w^2 - 24w + 62$, a quadratic in $w$, and completing the square turns it into
        $3(w - 4)^2 + 14$. The lowest score is 14, at $w = 4$, which is the mean of the three. With any
        data, the score is (number of values) times $w^2$, minus twice their sum times $w$, plus a
        number, so its lowest point is the sum divided by the number of values: always the mean.
        Finally, rates. A straight line, such as a GPU bill of ₹150 an hour plus ₹200 set-up, rises by
        the same amount for every extra hour, so the change in output divided by the change in input,
        the average rate of change, is the same between any two points: 150 rupees per hour. A
        quadratic is different. For $x^2$, the rate from 1 to 3 is 4, but from 10 to 20 it is 30: the
        average rate of change depends on which two points you pick, which is why its graph curves
        instead of running straight.
      minWords: 100
      maxWords: 500
