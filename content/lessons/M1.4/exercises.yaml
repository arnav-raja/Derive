    answer:
      type: code
      starter: |
        def vertex(a, b, c):
            return None    # the x of the lowest or highest point of a x^2 + b x + c

        def lowest(a, b, c):
            return None    # the height of a x^2 + b x + c at that x

        print(vertex(1, -6, 11), lowest(1, -6, 11))   # Explore's bowl, x^2 - 6x + 11
      tests: |
        # close(a, b) is True when a and b agree to about nine significant figures.
        CASES = [(1, -6, 11), (2, 8, -3), (-1, 4, 0), (0.5, -3, 2)]

        def height(a, b, c, x):
            return a * x**2 + b * x + c

        def test_answers():
            """vertex and lowest each give a number, not None."""
