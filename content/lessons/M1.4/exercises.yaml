    concept: M1.4/quadratics
    title: A formula with a bug
    prompt: >-
      `roots` should give the two solutions of $ax^2 + bx + c = 0$ by the quadratic formula. It gets the
      first equation right, but not the second, which is the same equation doubled. Find the bug and
      fix it.
    answer:
      type: code
      starter: |
        import math

        def roots(a, b, c):
            d = math.sqrt(b**2 - 4*a*c)
            return (-b - d) / 2*a, (-b + d) / 2*a

        print(roots(1, -3, 2))   # x^2 - 3x + 2 = 0 has the solutions 1 and 2
        print(roots(2, -6, 4))   # 2x^2 - 6x + 4 = 0 is the same equation doubled
      tests: |
        # close(a, b) is True when a and b agree to about nine significant figures.
        def test_simple():
            """x^2 - 3x + 2 = 0 has the solutions 1 and 2."""
            got = sorted(roots(1, -3, 2))
            assert close(got[0], 1) and close(got[1], 2), f"roots(1, -3, 2) gave {got}, not 1 and 2."

        def test_doubled():
            """2x^2 - 6x + 4 = 0, the same equation doubled, has the same solutions."""
            got = sorted(roots(2, -6, 4))
            assert close(got[0], 1) and close(got[1], 2), f"roots(2, -6, 4) gave {got}, not 1 and 2."

        def test_each_solves():
            """Each answer makes a x^2 + b x + c equal to 0, for several equations."""
            for a, b, c in [(3, 1, -2), (0.5, -1, -4), (-1, 0, 9), (4, -4, 1)]:
                for x in roots(a, b, c):
                    value = a * x**2 + b * x + c
                    assert close(value, 0, abs_tol=1e-9), f"roots({a}, {b}, {c}) gave {x}, where a x^2 + b x + c is {value}, not 0."
      reference: |
