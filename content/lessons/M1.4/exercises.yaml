    answer:
      type: code
      starter: |
        from sympy import symbols, solve

        a, b, c, x = symbols("a b c x")

        # solve(expression, x) gives the list of every x that makes the expression 0.
        example = solve(x**2 - 9, x)
        print("example:", example)

        formula = None    # a x^2 + b x + c = 0, with a, b and c left as letters
        doubled = None    # 2x^2 - 6x + 4 = 0

        print("formula:", formula)
        print("doubled:", doubled)
      tests: |
        from sympy import simplify

        def test_formula():
            """formula is the list of solutions of a x^2 + b x + c = 0, with the letters left in."""
            assert formula is not None, "Replace the None in formula with a call of solve."
            assert isinstance(formula, list) and len(formula) == 2, f"formula is {formula}, not a list of two solutions."
            for r in formula:
                assert r.has(a) and r.has(b) and r.has(c), f"{r} does not have all of a, b and c in it."
                assert simplify(a*r**2 + b*r + c) == 0, f"{r} does not solve a x^2 + b x + c = 0."

        def test_doubled():
            """doubled is the list of solutions of 2x^2 - 6x + 4 = 0."""
            assert doubled is not None, "Replace the None in doubled with a call of solve."
            assert isinstance(doubled, list) and len(doubled) == 2, f"doubled is {doubled}, not a list of two solutions."
            for r in doubled:
                assert 2*r**2 - 6*r + 4 == 0, f"{r} does not solve 2x^2 - 6x + 4 = 0."
      reference: |
        from sympy import symbols, solve

        a, b, c, x = symbols("a b c x")

        example = solve(x**2 - 9, x)
        print("example:", example)

        formula = solve(a*x**2 + b*x + c, x)
        doubled = solve(2*x**2 - 6*x + 4, x)

        print("formula:", formula)
        print("doubled:", doubled)
