        flop_per_second = 1e14
        seconds_per_year = 365.25 * 24 * 60 * 60

        seconds = flop / flop_per_second
        years = seconds / seconds_per_year    # your own conversion

        # Replace None: give seconds its unit, then let SymPy convert it.
        library_years = None

        print(years)
        print(library_years)
      tests: |
        from sympy.physics.units import julian_year

        def test_in_julian_years():
            """library_years is a quantity measured in julian_year."""
            assert library_years is not None, "library_years is still None."
            assert hasattr(library_years, "has") and library_years.has(julian_year), f"library_years is {library_years}, which is not measured in julian_year."

        def test_agrees():
            """SymPy's answer agrees with your own years."""
            value = float(library_years / julian_year)
            assert close(value, years), f"SymPy gives {value} Julian years, but your years is {years}."
      reference: |
        from sympy.physics.units import convert_to, second, julian_year

        flop = 3.15e23
        flop_per_second = 1e14
        seconds_per_year = 365.25 * 24 * 60 * 60

        seconds = flop / flop_per_second
        years = seconds / seconds_per_year

        library_years = convert_to(seconds * second, julian_year)

        print(years)
        print(library_years)
      wrong:
        - code: |
            from sympy.physics.units import convert_to, second, julian_year

            flop = 3.15e23
            flop_per_second = 1e14
            seconds_per_year = 365.25 * 24 * 60 * 60

            seconds = flop / flop_per_second
            years = seconds / seconds_per_year

            library_years = convert_to(seconds, julian_year)

            print(years)
            print(library_years)
          why: >-
            Converts a bare number. With no unit attached, SymPy has nothing to convert, and the
            number comes back unchanged.
        - code: |
            from sympy.physics.units import convert_to, second, julian_year

            flop = 3.15e23
            flop_per_second = 1e14
            seconds_per_year = 365.25 * 24 * 60 * 60

            seconds = flop / flop_per_second
            years = seconds / seconds_per_year

            library_years = convert_to(seconds * second, second)

            print(years)
            print(library_years)
          why: Converts into seconds rather than Julian years, so the answer is still measured in seconds.
        - code: |
            from sympy.physics.units import convert_to, second, julian_year

            flop = 3.15e23
            flop_per_second = 1e14
            seconds_per_year = 365.25 * 24 * 60 * 60

            seconds = flop / flop_per_second
            years = seconds / seconds_per_year

            library_years = convert_to(flop * second, julian_year)

            print(years)
            print(library_years)
          why: Treats the FLOP count as a number of seconds, which is $10^{14}$ times too many.
    explanation: >-
      SymPy agrees with your conversion: about 99.8 Julian years. Because it keeps each unit with its
      number, its answer says what it is measured in, which a plain Python number never does.

  - id: build-tropical-year
    phase: build
    kind: breakit
    concept: M1.1/fermi-estimation
    title: Which year?
    prompt: Predict what happens to `years` after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        from sympy.physics.units import convert_to, second, julian_year

        seconds = 3.15e23 / 1e14
        in_years = convert_to(seconds * second, julian_year)
        years = float(in_years / julian_year)
        print(in_years)
      broken: |
        from sympy.physics.units import convert_to, second, year

        seconds = 3.15e23 / 1e14
        in_years = convert_to(seconds * second, year)
        years = float(in_years / year)
        print(in_years)
      change: >-
        `julian_year`, exactly 365.25 days, becomes SymPy's `year`, the tropical year of 365.24219
        days: the time from one spring to the next.
      options:
        - { id: more, label: '`years` changes by more than 0.1%', when: 'abs(years / base["years"] - 1) > 0.001' }
        - { id: less, label: '`years` changes, but by less than 0.1%', when: '0 < abs(years / base["years"] - 1) <= 0.001' }
        - { id: same, label: '`years` stays exactly the same', when: 'years == base["years"]' }
        - { id: error, label: Python stops with an error, when: 'error is not None' }
    explanation: >-
      It changes by about 0.002%, from 99.8175 to 99.8196 years, because the two years differ by
      about 11 minutes. Next to a chip speed known only to within a factor of 2, that difference does
      not matter at all. Part of estimating well is knowing which differences are too small to matter.

  # Explain --------------------------------------------------------------------
  - id: explain-training-time
    phase: explain
    kind: explain
    concept: M1.1/units-as-algebra
    covers: [M1.1/powers-of-ten, M1.1/dimensional-analysis, M1.1/fermi-estimation]
    title: Explain it to a friend
    prompt: >-
      A friend says: "If one chip does $10^{14}$ FLOP a second and training needs $3.15 \times
      10^{23}$ FLOP, just multiply the two to get the time." Explain to them why that cannot be right,
      how the units lead to the correct formula, and how to check "about a century" in your head. Then
      say how far you would trust an answer like this, and which number you would most want to pin
      down.
    answer:
      type: text
      rubric:
        - id: units
          criterion: >-
            Treats units like symbols that multiply, divide and cancel, and uses that to show that FLOP
            times FLOP per second cannot be a time.
        - id: formula
          criterion: >-
            Gets time = compute ÷ speed from the units, and turns seconds into years by dividing by the
            number of seconds in a year.
        - id: powers
          criterion: >-
            Does the arithmetic with powers of ten, for example $10^{23} \div 10^{14} = 10^{9}$, with a
            year of about $3 \times 10^{7}$ seconds.
        - id: trust
          criterion: >-
            Judges the answer by the factor it might be off by, and names the least certain input, such
            as the speed the chip really sustains.
        - id: plain
          criterion: >-
            Writes plainly for a friend who has never met these ideas, and says what a FLOP is before
            relying on it.
      reference: >-
        A FLOP is one arithmetic operation, such as one multiplication of two numbers, and training
        GPT-3 takes about $3.15 \times 10^{23}$ of them. Units behave like letters in algebra, so you can multiply, divide and cancel them. Multiplying
        FLOP by FLOP per second gives FLOP squared per second, which is not a length of time, so the
        multiplication cannot be right whatever the numbers are. To get seconds, the FLOP must cancel:
        divide the compute by the speed. FLOP divided by FLOP per second is FLOP times seconds per FLOP,
        which is seconds. That gives $3.15 \times 10^{23} \div 10^{14}$, and dividing powers of ten
        subtracts the exponents, so it is $3.15 \times 10^{9}$ seconds. A year is about $\pi \times
        10^{7}$, roughly $3 \times 10^{7}$ seconds, and dividing by it leaves about $10^{2}$, so about
        a century. I would trust this to within a factor of 2 or so. The compute formula is itself
        approximate, and the shakiest number is the speed: a chip rarely sustains its quoted peak, and
        if it ran at half the speed the answer would double.
      minWords: 60
      maxWords: 350
