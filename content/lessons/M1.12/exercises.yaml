    explanation: >-
      `rope` multiplies by `cmath.exp(1j * position * theta)`, a number of length 1 at angle
      `position * theta`, and `score` is `(q * k.conjugate()).real`, since
      $(a + bi)(c - di) = (ac + bd) + (bc - ad)i$. For words at positions $m$ and $n$ the score is the
      real part of $q e^{im\theta} \times \overline{k e^{in\theta}} = q\bar k e^{i(m - n)\theta}$, so
      it depends on the positions only through $m - n$, how far apart the words are.

  - id: breakit-cube-root
    phase: build
    kind: breakit
    concept: M1.12/polar-form
    covers: [M1.12/complex-numbers]
    title: The cube root of −8
    prompt: >-
      The working program takes the cube root of 8 by raising it to the power $\frac{1}{3}$. The
      changed program does the same to $-8$, whose cube root among the real numbers is $-2$.
      Predict what the changed program prints, then run both.
    answer:
      type: breakit
      code: |
        value = 8 ** (1 / 3)
        print(value)
      broken: |
        value = (-8) ** (1 / 3)
        print(value)
      change: The number 8 becomes $-8$, whose real cube root is $-2$.
      options:
        - { id: minus-two, label: 'It prints `-2.0`', when: "error is None and value == -2" }
        - { id: two, label: 'It prints `2.0`', when: "error is None and value == 2" }
        - { id: complex, label: 'It prints a complex number that is not $-2$', when: "error is None and isinstance(value, complex) and value != -2" }
        - { id: error, label: 'It stops with an error', when: "error is not None" }
    explanation: >-
      It prints `(1.0000000000000002+1.7320508075688772j)`. $-8$ has three cube roots, at the angles
      $60°$, $180°$ and $300°$, each with length 2: $1 + \sqrt{3}i$, $-2$ and $1 - \sqrt{3}i$. To
      raise $-8$ to the power $\frac{1}{3}$, Python takes its length, 8, to the power $\frac{1}{3}$
      and its angle, $180°$, times $\frac{1}{3}$, which gives the root at $60°$,
      $2(\cos 60° + i\sin 60°) = 1 + \sqrt{3}i$. `math.cbrt(-8)` gives the real cube root, `-2.0`.

