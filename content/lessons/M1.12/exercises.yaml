  - id: derive-divide
    phase: derive
    kind: step
    concept: M1.12/complex-numbers
    title: One over a complex number
    prompt: >-
      Multiply the top and the bottom of $\frac{1}{a + bi}$ by a number that makes the bottom real.
      What is the real part of $\frac{1}{a + bi}$, written with $a$ and $b$?
    answer:
      type: expression
      symbols:
        - { name: a }
        - { name: b }
      reference: a/(a**2 + b**2)
      lhs: '\text{real part} ='
      accept: ['a/(b**2 + a**2)', 'a*(a**2 + b**2)**(-1)']
      reject:
        - '1/a'
        - 'a/(a**2 - b**2)'
        - '1/(a**2 + b**2)'
        - 'a/(a + b)'
        - 'a/sqrt(a**2 + b**2)'
    explanation: >-
      $(a + bi)(a - bi) = a^2 - abi + abi - b^2i^2 = a^2 + b^2$, a real number, so
      $\frac{1}{a + bi} = \frac{a}{a^2 + b^2} - \frac{b}{a^2 + b^2}i$. For $1 + 2i$ it gives
      $\frac{1}{5} - \frac{2}{5}i$, and `1 / (1 + 2j)` prints `(0.2-0.4j)`.
    review:
      variants:
        - prompt: What is the imaginary part of $\frac{1}{a + bi}$, written with $a$ and $b$?
          answer:
            type: expression
            symbols:
              - { name: a }
              - { name: b }
            reference: -b/(a**2 + b**2)
            accept: ['-b*(a**2 + b**2)**(-1)']
            reject: ['b/(a**2 + b**2)', '-1/b', '-b/(a**2 - b**2)']
          explanation: >-
            $\frac{a - bi}{a^2 + b^2}$ has imaginary part $-\frac{b}{a^2 + b^2}$.
        - prompt: What is the real part of $\frac{1}{3 + 4i}$?
          answer: { type: number, value: 0.12, tolerance: { abs: 0.0005 } }
