exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-eighth-power
    phase: puzzle
    kind: predict
    concept: M1.12/polar-form
    title: The eighth power
    prompt: What does `print((1 + 1j) ** 8)` show?
    answer:
      type: choice
      options:
        - { id: linear, label: '`(1+8j)`' }
        - { id: right, label: '`(16+0j)`' }
        - { id: axis, label: '`(0+16j)`' }
        - { id: lengths, label: '`(256+0j)`' }
      correct: [right]
    explanation: >-
      Square three times. $(1 + i)^2 = 1 + 2i + i^2 = 1 + 2i - 1 = 2i$, then $(2i)^2 = 4i^2 = -4$,
      and $(-4)^2 = 16$. So $(1 + i)^8 = 16$, which Python prints as `(16+0j)`: 16, with nothing
      along $i$. `(1+8j)` treats the eighth power as eight times the $i$ part, `(256+0j)` is $2^8$,
      from taking $i$ as 1, or the length of $1 + i$ as 2, and `(0+16j)` slips a factor of $i$ on
      the way.

  # Recall ---------------------------------------------------------------------
  - id: recall-expand
    phase: recall
    kind: recall
    concept: M1.2/equivalence
    prompt: Which of these is equal to $(a + b)(c + d)$ for all numbers $a$, $b$, $c$ and $d$?
    answer:
      type: choice
      options:
        - { id: pairs, label: '$ac + bd$' }
        - { id: neighbours, label: '$ab + ac + bd + cd$' }
        - { id: right, label: '$ac + ad + bc + bd$' }
        - { id: twice, label: '$ac + 2ad + bd$' }
      correct: [right]
    explanation: >-
      Each term of the first bracket times each term of the second: $a$ times $c$ and $d$, then $b$
      times $c$ and $d$. With $a = b = c = d = 1$ the brackets give $2 \times 2 = 4$, and so does
      $ac + ad + bc + bd$, while $ac + bd$ gives 2.

  - id: recall-no-real
    phase: recall
    kind: recall
    concept: M1.4/quadratics
    prompt: How many real numbers $x$ solve $x^2 + 4x + 5 = 0$?
    answer: { type: number, value: 0, tolerance: { abs: 0 } }
    explanation: >-
      None. $b^2 - 4ac = 16 - 20 = -4$ is negative. Completing the square,
      $x^2 + 4x + 5 = (x + 2)^2 + 1$, which is at least 1 for every real $x$, so it is never 0.

  - id: recall-quarter-turn
    phase: recall
    kind: recall
    concept: M1.11/rotation
    prompt: Turning the plane a quarter turn anticlockwise about the origin takes the point $(x, y)$ to which point?
    answer:
      type: choice
      options:
        - { id: swap, label: '$(y, x)$' }
        - { id: clockwise, label: '$(y, -x)$' }
        - { id: half, label: '$(-x, -y)$' }
        - { id: right, label: '$(-y, x)$' }
      correct: [right]
    explanation: >-
      The turn through $\theta$ takes $(x, y)$ to
      $(x\cos\theta - y\sin\theta,\; x\sin\theta + y\cos\theta)$, and a quarter turn has
      $\cos\theta = 0$ and $\sin\theta = 1$, so $(x, y)$ goes to $(-y, x)$: $(2, 5)$ goes to
      $(-5, 2)$.

  - id: recall-exponent
    phase: recall
    kind: recall
    concept: M1.2/exponent-rules
    prompt: $2^5 \times 2^3 = 2^n$. What is $n$?
    answer: { type: number, value: 8, tolerance: { abs: 0 } }
    explanation: >-
      $2^5$ is five 2s multiplied together and $2^3$ is three more, so the product is eight 2s:
      $2^{5 + 3} = 2^8 = 256$. Multiplying powers of the same base adds the exponents.

  - id: recall-angle-point
    phase: recall
    kind: recall
    concept: M1.11/sine-and-cosine
    prompt: Turning $(1, 0)$ anticlockwise about the origin through $60°$ reaches which point?
    answer:
      type: choice
      options:
        - { id: right, label: '$\left(\frac{1}{2}, \frac{\sqrt{3}}{2}\right)$' }
        - { id: swapped, label: '$\left(\frac{\sqrt{3}}{2}, \frac{1}{2}\right)$' }
        - { id: forty-five, label: '$\left(\frac{1}{\sqrt{2}}, \frac{1}{\sqrt{2}}\right)$' }
        - { id: halves, label: '$\left(\frac{1}{2}, \frac{1}{2}\right)$' }
      correct: [right]
    explanation: >-
      Turning $(1, 0)$ through $\theta$ reaches $(\cos\theta, \sin\theta)$, and
      $\cos 60° = \frac{1}{2}$, $\sin 60° = \frac{\sqrt{3}}{2}$. $\left(\frac{\sqrt{3}}{2}, \frac{1}{2}\right)$
      is the point at $30°$, and $\left(\frac{1}{2}, \frac{1}{2}\right)$ is not on the circle of
      radius 1 at all.

  # Explore --------------------------------------------------------------------
  - id: explore-times-i
    phase: explore
    kind: predict
    concept: M1.12/complex-numbers
    title: Times i
    prompt: Multiply out $i(3 + i)$, putting $-1$ for $i^2$. What do you get?
    answer:
      type: choice
      options:
        - { id: plus, label: '$1 + 3i$' }
        - { id: dropped, label: '$3i$' }
        - { id: right, label: '$-1 + 3i$' }
        - { id: swapped, label: '$3 - i$' }
      correct: [right]
    explanation: >-
      $i \times 3 + i \times i = 3i + i^2 = 3i - 1$, so $i(3 + i) = -1 + 3i$, and `1j * (3 + 1j)`
      prints `(-1+3j)`. $1 + 3i$ takes $i^2$ as 1, $3i$ drops the $i^2$ term, and $3 - i$ swaps the
      two parts.
    placement: true
    review:
      variants:
        - prompt: Multiply out $i(2 - 5i)$, putting $-1$ for $i^2$.
          answer:
            type: choice
            options:
              - { id: plus, label: '$-5 + 2i$' }
              - { id: right, label: '$5 + 2i$' }
              - { id: swapped, label: '$2 + 5i$' }
              - { id: dropped, label: '$2i$' }
            correct: [right]
          explanation: >-
            $i \times 2 - 5i \times i = 2i - 5i^2 = 2i + 5$, so $i(2 - 5i) = 5 + 2i$.
        - prompt: What is $i^4$?
          answer: { type: number, value: 1, tolerance: { abs: 0 } }
          explanation: >-
            $i^4 = i^2 \times i^2 = (-1) \times (-1) = 1$: four quarter turns make a whole turn.
        - prompt: Multiplying a complex number $a + bi$ by $i$ does what to the point $(a, b)$?
          answer:
            type: choice
            options:
              - { id: mirror, label: 'It mirrors it in the first axis, to $(a, -b)$' }
              - { id: swap, label: 'It swaps its two coordinates, to $(b, a)$' }
              - { id: stretch, label: 'It doubles its distance from 0, to $(2a, 2b)$' }
              - { id: right, label: 'It turns it a quarter turn anticlockwise about 0' }
            correct: [right]
          explanation: >-
            $i(a + bi) = ai + bi^2 = -b + ai$, the point $(-b, a)$, which is $(a, b)$ turned a
            quarter turn anticlockwise about 0.

  - id: explore-product
    phase: explore
    kind: predict
    concept: M1.12/complex-numbers
    title: Two brackets
    prompt: Multiply out $(1 + 2i)(3 - i)$. What is it?
    answer:
      type: choice
      options:
        - { id: added, label: '$4 + i$' }
        - { id: plus-one, label: '$1 + 5i$' }
        - { id: ends, label: '$5$' }
        - { id: right, label: '$5 + 5i$' }
      correct: [right]
    explanation: >-
      $1 \times 3 + 1 \times (-i) + 2i \times 3 + 2i \times (-i) = 3 - i + 6i - 2i^2 = 3 + 5i + 2 = 5 + 5i$,
      and `(1 + 2j) * (3 - 1j)` prints `(5+5j)`. $4 + i$ adds the two numbers, $1 + 5i$ takes $i^2$
      as 1, and 5 keeps only the first and last terms.
    review:
      variants:
        - prompt: Multiply out $(2 + i)(2 - i)$.
          answer: { type: number, value: 5, tolerance: { abs: 0 } }
          explanation: >-
            $4 - 2i + 2i - i^2 = 4 + 1 = 5$. A number times its conjugate is a real number, the square
            of its length.
        - prompt: Multiply out $(1 + i)(1 + i)$.
          answer:
            type: choice
            options:
              - { id: plus-one, label: '$2 + 2i$' }
              - { id: zero, label: '$0$' }
              - { id: right, label: '$2i$' }
              - { id: ends-plus, label: '$2$' }
            correct: [right]
          explanation: >-
            $1 + i + i + i^2 = 1 + 2i - 1 = 2i$.

  - id: explore-length
    phase: explore
    kind: predict
    concept: M1.12/complex-numbers
    title: How long is the product?
    prompt: >-
      $|1 + 2i| = \sqrt{5} \approx 2.236$ and $|3 - i| = \sqrt{10} \approx 3.162$, and their product
      is $5 + 5i$. What is $|5 + 5i|$, to two decimal places?
    answer: { type: number, value: 7.07, tolerance: { abs: 0.01 } }
    explanation: >-
      $|5 + 5i| = \sqrt{25 + 25} = \sqrt{50} \approx 7.07$, and `abs(5 + 5j)` prints
      `7.0710678118654755`. That is $\sqrt{5} \times \sqrt{10} = \sqrt{50}$, the product of the two
      lengths, not their sum, about 5.40.
    review:
      variants:
        - prompt: What is $|3 + 4i| \times |3 - 4i|$?
          answer: { type: number, value: 25, tolerance: { abs: 0 } }
          explanation: >-
            Each has length $\sqrt{9 + 16} = 5$, so the product is 25, which is also
            $(3 + 4i)(3 - 4i) = 9 + 16 = 25$.
        - prompt: $|z| = 2$ and $|w| = 3$. What is $|zw|$?
          answer: { type: number, value: 6, tolerance: { abs: 0 } }
          explanation: >-
            Multiplying multiplies the lengths: $|zw| = |z||w| = 6$, whatever the angles.

  - id: explore-angle-sum
    phase: explore
    kind: predict
    concept: M1.12/polar-form
    title: The angle of a product
    prompt: >-
      $1 + i$ is at angle $45°$ from the first axis, and $\sqrt{3} + i$ is at angle $30°$. At what
      angle is their product?
    answer:
      type: choice
      options:
        - { id: difference, label: '$15°$' }
        - { id: right, label: '$75°$' }
        - { id: product, label: '$1{,}350°$' }
        - { id: unknown, label: 'It cannot be known without their lengths' }
      correct: [right]
    explanation: >-
      $(1 + i)(\sqrt{3} + i) = \sqrt{3} + i + \sqrt{3}i + i^2 = (\sqrt{3} - 1) + (\sqrt{3} + 1)i$,
      about $0.732 + 2.732i$, and its angle is $75°$, which is $45° + 30°$: the angles add. $15°$ is
      their difference, and $1{,}350°$ their product.
    placement: true
    review:
      variants:
        - prompt: $z$ is at angle $100°$ and $w$ at angle $-40°$. At what angle is $zw$?
          answer: { type: number, value: 60, tolerance: { abs: 0 }, unit: degrees }
          explanation: >-
            Multiplying adds the angles: $100° + (-40°) = 60°$.
        - prompt: $z$ has length 2 and angle $30°$. What are the length and angle of $z^2$?
          answer:
            type: choice
            options:
              - { id: double, label: 'Length 4 and angle $30°$' }
              - { id: right, label: 'Length 4 and angle $60°$' }
              - { id: added, label: 'Length 2 and angle $60°$' }
              - { id: squared, label: 'Length 4 and angle $900°$' }
            correct: [right]
          explanation: >-
            $z^2 = z \times z$ multiplies the lengths, $2 \times 2 = 4$, and adds the angles,
            $30° + 30° = 60°$.
        - prompt: >-
            `cmath.polar(1 + 1j)` gives `(1.4142135623730951, 0.7853981633974483)`. What does
            `cmath.polar((1 + 1j) ** 2)` give, to three decimal places?
          answer:
            type: choice
            options:
              - { id: same-angle, label: '`(2.0, 0.785)`' }
              - { id: double-length, label: '`(2.828, 1.571)`' }
              - { id: squared-angle, label: '`(2.0, 0.617)`' }
              - { id: right, label: '`(2.0, 1.571)`' }
            correct: [right]
          explanation: >-
            Squaring squares the length, $\sqrt{2}^2 = 2$, and doubles the angle,
            $2 \times \frac{\pi}{4} = \frac{\pi}{2} \approx 1.571$: $(1 + i)^2 = 2i$, and
            `cmath.polar(2j)` gives `(2.0, 1.5707963267948966)`. `(2.0, 0.785)` keeps the angle,
            `(2.828, 1.571)` doubles the length, and `(2.0, 0.617)` squares the angle.
        - prompt: What does multiplying two complex numbers do to their lengths and their angles?
          answer:
            type: choice
            options:
              - { id: both-add, label: 'It adds the lengths and adds the angles' }
              - { id: both-multiply, label: 'It multiplies the lengths and multiplies the angles' }
              - { id: right, label: 'It multiplies the lengths and adds the angles' }
              - { id: swapped, label: 'It adds the lengths and multiplies the angles' }
            correct: [right]
          explanation: >-
            Multiplying by $r(\cos\theta + i\sin\theta)$ stretches by $r$ and turns through $\theta$,
            so the lengths multiply and the angles add.

  - id: explore-cube-roots
    phase: explore
    kind: predict
    concept: M1.12/polar-form
    title: Solving z³ = 1
    prompt: Among the complex numbers, how many $z$ have $z^3 = 1$?
    answer: { type: number, value: 3, tolerance: { abs: 0 } }
    explanation: >-
      Three. Cubing cubes the length and triples the angle, so $z$ must have length 1 and an angle
      that, taken three times, makes a whole number of turns: $0°$, $120°$ or $240°$. Those are 1
      and $-\frac{1}{2} \pm \frac{\sqrt{3}}{2}i$.
    review:
      variants:
        - prompt: How many complex numbers $z$ have $z^4 = 1$?
          answer: { type: number, value: 4, tolerance: { abs: 0 } }
          explanation: >-
            Four: $1$, $i$, $-1$ and $-i$, at $0°$, $90°$, $180°$ and $270°$, since four times each
            angle is a whole number of turns.
        - prompt: Which of these is a solution of $z^3 = 1$?
          answer:
            type: choice
            options:
              - { id: minus-one, label: '$-1$' }
              - { id: i, label: '$i$' }
              - { id: right, label: '$-\frac{1}{2} + \frac{\sqrt{3}}{2}i$' }
              - { id: half, label: '$\frac{1}{2} + \frac{1}{2}i$' }
            correct: [right]
          explanation: >-
            $-\frac{1}{2} + \frac{\sqrt{3}}{2}i$ has length 1 and angle $120°$, and three times
            $120°$ is $360°$, so its cube is 1. $(-1)^3 = -1$ and $i^3 = -i$.

  - id: explore-compound
    phase: explore
    kind: predict
    concept: M1.12/eulers-formula
    title: Interest paid more often
    prompt: >-
      A year's interest of 100% turns 1 rupee into 2. Paid as two half-yearly payments of 50%, it
      gives $1.5^2 = 2.25$ rupees. Paid as $n$ payments of $\frac{100}{n}$% each, the year ends with
      $\left(1 + \frac{1}{n}\right)^n$ rupees. What happens to that as $n$ grows into the millions?
    answer:
      type: choice
      options:
        - { id: grows, label: 'It grows without limit, since each extra payment adds a little more' }
        - { id: back, label: 'It falls back towards 2, since each payment gets so small' }
        - { id: right, label: 'It settles on a number between 2.7 and 2.8' }
        - { id: three, label: 'It settles on 3, a third more than paying once' }
      correct: [right]
    explanation: >-
      12 payments give $\left(1 + \frac{1}{12}\right)^{12} \approx 2.613$, 365 give about 2.7146,
      1,000 give 2.7169 and a million give 2.7182805. Each extra payment adds less than the one
      before, and the total settles on $e = 2.718281828\ldots$, the number M1.5 named as the base of
      the natural logarithm.
    review:
      variants:
        - prompt: >-
            To two decimal places, what is $\left(1 + \frac{1}{n}\right)^n$ when $n$ is a million?
          answer: { type: number, value: 2.72, tolerance: { abs: 0.005 } }
          explanation: >-
            It is 2.7182805, close to $e = 2.71828\ldots$, which is where it settles as $n$ grows.
        - prompt: >-
            A year's interest of 200%, paid in $n$ parts, gives $\left(1 + \frac{2}{n}\right)^n$. Where
            does that settle as $n$ grows?
          answer:
            type: choice
            options:
              - { id: double, label: '$2e$, about 5.44' }
              - { id: right, label: '$e^2$, about 7.39' }
              - { id: three, label: '3, as paying once gives' }
              - { id: grows, label: 'Nowhere: it grows without limit' }
            correct: [right]
          explanation: >-
            $\left(1 + \frac{x}{n}\right)^n$ settles on $e^x$, so 200% gives $e^2 \approx 7.39$; a
            thousand parts already give 7.374.

  - id: explore-euler
    phase: explore
    kind: predict
    concept: M1.12/eulers-formula
    title: Interest at an imaginary rate
    prompt: >-
      Put $i\pi$ in place of the 1 in $\left(1 + \frac{1}{n}\right)^n$:
      $\left(1 + \frac{i\pi}{n}\right)^n$, with $n = 1{,}000$. Near which number is it?
    answer:
      type: choice
      options:
        - { id: right, label: 'Near $-1$' }
        - { id: linear, label: 'Near $1 + \pi i$' }
        - { id: real, label: 'Near $e^{\pi}$, about 23' }
        - { id: one, label: 'Near 1' }
      correct: [right]
    explanation: >-
      `(1 + 1j * math.pi / 1000) ** 1000` prints `(-1.004946973864266+1.0386493134192283e-05j)`,
      close to $-1$. Each factor $1 + \frac{i\pi}{1{,}000}$ is a hair longer than 1 and points
      a little above the first axis, so multiplying by it turns a little and barely stretches; 1,000
      such turns add up to almost exactly half a turn.
    placement: true
    review:
      variants:
        - prompt: What is $e^{i\pi/3} \times e^{i\pi/3} \times e^{i\pi/3}$?
          answer: { type: number, value: -1, tolerance: { abs: 0 } }
          explanation: >-
            Each factor turns through $\frac{\pi}{3}$, so together they turn through $\pi$, half a
            turn from 1: $e^{i\pi/3}e^{i\pi/3}e^{i\pi/3} = e^{i\pi} = -1$.
        - prompt: What is $e^{i\pi/2}$?
          answer:
            type: choice
            options:
              - { id: right, label: '$i$' }
              - { id: real, label: '$e^{\pi/2}$, about 4.81' }
              - { id: linear, label: '$1 + \frac{\pi}{2}i$' }
              - { id: half, label: '$-1$' }
            correct: [right]
          explanation: >-
            $e^{i\theta}$ is the point at angle $\theta$ on the circle of radius 1, and $\frac{\pi}{2}$
            is a quarter turn, so $e^{i\pi/2} = \cos\frac{\pi}{2} + i\sin\frac{\pi}{2} = i$.
            `cmath.exp(1j * math.pi / 2)` prints `(6.123233995736766e-17+1j)`.

  # Derive ---------------------------------------------------------------------
  - id: derive-turn
    phase: derive
    kind: step
    concept: M1.12/polar-form
    covers: [M1.12/complex-numbers]
    title: Multiplying is turning
    prompt: >-
      Multiply out $(x + iy)(\cos\theta + i\sin\theta)$, putting $-1$ for $i^2$. What is its
      imaginary part, the number that multiplies $i$? Type $\sin\theta$ as `sin(theta)`, with its
      brackets.
    answer:
      type: expression
      symbols:
        - { name: x }
        - { name: y }
        - { name: theta }
      reference: x*sin(theta) + y*cos(theta)
      lhs: '\text{imaginary part} ='
      accept: ['sin(theta)*x + cos(theta)*y', 'y*cos(theta) + x*sin(theta)']
      reject:
        - 'x*sin(theta) - y*cos(theta)'
        - 'x*cos(theta) - y*sin(theta)'
        - 'x*sin(theta) + y*sin(theta)'
        - 'y*cos(theta)'
        - 'x*sin(theta)'
    explanation: >-
      $(x + iy)(\cos\theta + i\sin\theta) = x\cos\theta + ix\sin\theta + iy\cos\theta + i^2y\sin\theta
      = (x\cos\theta - y\sin\theta) + i(x\sin\theta + y\cos\theta)$. Its two parts are M1.11's turn of
      $(x, y)$ through $\theta$, so multiplying by $\cos\theta + i\sin\theta$ turns the plane through
      $\theta$ about 0.
    review:
      variants:
        - prompt: >-
            What is the real part of $(x + iy)(\cos\theta + i\sin\theta)$? Type $\cos\theta$ as
            `cos(theta)`, with its brackets.
          answer:
            type: expression
            symbols:
              - { name: x }
              - { name: y }
              - { name: theta }
            reference: x*cos(theta) - y*sin(theta)
            accept: ['cos(theta)*x - sin(theta)*y']
            reject: ['x*cos(theta) + y*sin(theta)', 'x*sin(theta) + y*cos(theta)', 'x*cos(theta)']
          explanation: >-
            The terms without $i$ are $x\cos\theta$ and $i^2y\sin\theta = -y\sin\theta$.
        - prompt: What is the real part of $(3 + i)(\cos 90° + i\sin 90°)$?
          answer: { type: number, value: -1, tolerance: { abs: 0 } }
          explanation: >-
            $\cos 90° + i\sin 90° = i$, and $i(3 + i) = -1 + 3i$: $(3, 1)$ turned a quarter turn.
        - prompt: What does multiplying by $\cos\theta + i\sin\theta$ do to the plane?
          answer:
            type: choice
            options:
              - { id: stretch, label: 'It stretches it away from 0 by $\cos\theta$' }
              - { id: right, label: 'It turns it through $\theta$ about 0' }
              - { id: slide, label: 'It slides it along the first axis by $\theta$' }
              - { id: mirror, label: 'It mirrors it in the line at angle $\theta$' }
            correct: [right]
          explanation: >-
            Its real and imaginary parts are M1.11's rule for turning $(x, y)$ through $\theta$, and
            the number has length 1, so it turns without stretching.

  - id: derive-product
    phase: derive
    kind: step
    concept: M1.12/polar-form
    title: Two turns in one line
    prompt: >-
      Multiply out $(\cos\alpha + i\sin\alpha)(\cos\beta + i\sin\beta)$. What is its real part,
      written with $\cos\alpha$, $\sin\alpha$, $\cos\beta$ and $\sin\beta$? Type $\cos\alpha$ as
      `cos(alpha)`, with its brackets.
    answer:
      type: expression
      symbols:
        - { name: alpha }
        - { name: beta }
      reference: cos(alpha)*cos(beta) - sin(alpha)*sin(beta)
      lhs: '\text{real part} ='
      accept: ['cos(beta)*cos(alpha) - sin(beta)*sin(alpha)', '-sin(alpha)*sin(beta) + cos(alpha)*cos(beta)']
      reject:
        - 'cos(alpha)*cos(beta) + sin(alpha)*sin(beta)'
        - 'cos(alpha)*cos(beta)'
        - 'sin(alpha)*cos(beta) + cos(alpha)*sin(beta)'
        - 'cos(alpha) + cos(beta)'
        - 'cos(alpha + beta)'
      form:
        forbid: ['cos(alpha + beta)', 'sin(alpha + beta)']
        message: That is equal, but this step asks for the product multiplied out, with the cosines and sines of $\alpha$ and $\beta$ on their own.
    explanation: >-
      $\cos\alpha\cos\beta + i\cos\alpha\sin\beta + i\sin\alpha\cos\beta + i^2\sin\alpha\sin\beta$ has
      real part $\cos\alpha\cos\beta - \sin\alpha\sin\beta$. Multiplying by $\cos\beta + i\sin\beta$
      turns the point at angle $\alpha$ on through $\beta$, to the point at angle $\alpha + \beta$,
      whose real part is $\cos(\alpha + \beta)$. So
      $\cos(\alpha + \beta) = \cos\alpha\cos\beta - \sin\alpha\sin\beta$, in one line.
    review:
      variants:
        - prompt: >-
            What is the imaginary part of $(\cos\alpha + i\sin\alpha)(\cos\beta + i\sin\beta)$,
