    answer:
      type: code
      starter: |
        import cmath


        def rope(q, position, theta):
            """The pair q, as a complex number, turned anticlockwise through position * theta radians."""
            return q


        def score(q, k):
            """The score of the pairs q = a + bi and k = c + di: a * c + b * d."""
            return 0


        print(rope(1, 2, 0.5))          # should be about (0.540302+0.841471j), the point at angle 1
        print(score(3 + 1j, 2 + 5j))    # should be 11.0, as 3 * 2 + 1 * 5 = 11
      tests: |
        import math


        def show(z):
            """A number as Python writes a complex number, each part to 6 significant figures."""
            z = complex(z)
            re = 0.0 if abs(z.real) < 1e-12 else z.real
            im = 0.0 if abs(z.imag) < 1e-12 else z.imag
            return f"({re:.6g}{'-' if im < 0 else '+'}{abs(im):.6g}j)"


        def turned(q, angle):
            """The tests' own turn of the pair q through angle, by M1.11's rule."""
            x, y = q.real, q.imag
            return complex(x * math.cos(angle) - y * math.sin(angle), x * math.sin(angle) + y * math.cos(angle))


        def number(x):
            """A score as Python would print it, to 6 significant figures: a complex score as a complex number."""
            if isinstance(x, complex):
                return show(x)
            try:
                return f"{float(x):.6g}"
            except (TypeError, ValueError):
                return repr(x)


        def test_position_zero():
            """At position 0 nothing turns."""
            for q in [3 + 1j, -2 + 0.5j]:
                got = rope(q, 0, 0.1)
                assert close(got, q, abs_tol=1e-12), f"rope({show(q)}, 0, 0.1) gave {show(got)}, not {show(q)}: at position 0 the angle is 0."


        def test_turns():
            """rope turns q through position times theta."""
            for q, position, theta in [(1 + 0j, 2, 0.5), (3 + 1j, 5, 0.1), (-2 + 2j, 7, 0.25)]:
                got = rope(q, position, theta)
                want = turned(q, position * theta)
                assert close(got, want, abs_tol=1e-9), f"rope({show(q)}, {position}, {theta}) gave {show(got)}, not {show(want)}, the pair turned through {position} * {theta} radians."


        def test_score():
            """score is a * c + b * d for q = a + bi and k = c + di."""
            for q, k in [(3 + 1j, 2 + 5j), (1 - 2j, -4 + 0.5j), (0.5 + 0.5j, 0.5 - 0.5j)]:
                got = score(q, k)
                want = q.real * k.real + q.imag * k.imag
                assert close(got, want, abs_tol=1e-12), f"score({show(q)}, {show(k)}) gave {number(got)}, not {want:.6g}."


        def test_only_the_gap_matters():
            """Moving two words along by the same number of places leaves their score as it was."""
            q, k, theta = 3 + 1j, 2 - 1j, 0.3
            for m, n in [(5, 2), (10, 3), (0, 4)]:
                near = score(rope(q, m, theta), rope(k, n, theta))
                far = score(rope(q, m + 100, theta), rope(k, n + 100, theta))
                assert close(near, far, abs_tol=1e-9), f"Words at positions {m} and {n} score {number(near)}, but at positions {m + 100} and {n + 100}, the same distance apart, they score {number(far)}."
      reference: |
        import cmath


        def rope(q, position, theta):
            """The pair q, as a complex number, turned anticlockwise through position * theta radians."""
            return q * cmath.exp(1j * position * theta)


        def score(q, k):
            """The score of the pairs q = a + bi and k = c + di: a * c + b * d."""
            return (q * k.conjugate()).real


