  - id: debug-roots
    phase: build
    kind: debug
    concept: M1.12/complex-numbers
    title: Roots that are always complex
    prompt: >-
      `roots` should give both solutions of $ax^2 + bx + c = 0$, as complex numbers when
      $b^2 - 4ac$ is negative. It gets $x^2 + 4x + 5 = 0$ right, but run it and see what it gives for
      $x^2 - 3x + 2 = 0$, whose solutions are 1 and 2. Find the bug and fix it.
    answer:
      type: code
      starter: |
        import math


        def roots(a, b, c):
            """The two solutions of ax² + bx + c = 0, complex when b² - 4ac is negative."""
            d = math.sqrt(abs(b**2 - 4*a*c)) * 1j
            return (-b - d) / (2*a), (-b + d) / (2*a)


        print(roots(1, 4, 5))    # should be about ((-2-1j), (-2+1j))
        print(roots(1, -3, 2))   # should be about (1, 2)
      tests: |
        def show(z):
            """A number as Python writes a complex number, each part to 6 significant figures."""
            z = complex(z)
            re = 0.0 if abs(z.real) < 1e-12 else z.real
            im = 0.0 if abs(z.imag) < 1e-12 else z.imag
            return f"({re:.6g}{'-' if im < 0 else '+'}{abs(im):.6g}j)"


        def written(a, b, c):
            """ax² + bx + c as it is written on paper, such as 2x² - 7x + 3 or x² - 9."""
            text = ("" if a == 1 else str(a)) + "x²"
            for k, name in [(b, "x"), (c, "")]:
                if k != 0:
                    size = "" if abs(k) == 1 and name else str(abs(k))
                    text += (" - " if k < 0 else " + ") + size + name
            return text


        def both(got, p, q):
            """True when the two numbers in got are p and q, in either order."""
            return (close(got[0], p, abs_tol=1e-9) and close(got[1], q, abs_tol=1e-9)) or (close(got[0], q, abs_tol=1e-9) and close(got[1], p, abs_tol=1e-9))


        def test_complex_roots():
            """x² + 4x + 5 = 0 has the solutions -2 - i and -2 + i."""
            got = roots(1, 4, 5)
            assert both(got, -2 - 1j, -2 + 1j), f"roots(1, 4, 5) gave {show(got[0])} and {show(got[1])}, not (-2-1j) and (-2+1j). Here b² - 4ac is -4, which is negative."


        def test_real_roots():
            """x² - 3x + 2 = 0 has the solutions 1 and 2."""
            got = roots(1, -3, 2)
            assert both(got, 1, 2), f"roots(1, -3, 2) gave {show(got[0])} and {show(got[1])}, not 1 and 2. Here b² - 4ac is 1, which is positive."


        def test_one_root():
            """x² - 2x + 1 = 0 has the one solution 1, given twice."""
            got = roots(1, -2, 1)
            assert both(got, 1, 1), f"roots(1, -2, 1) gave {show(got[0])} and {show(got[1])}, not 1 twice."


        def test_put_back():
            """Each solution, put back into ax² + bx + c, gives 0."""
            for a, b, c in [(1, 2, 5), (2, -7, 3), (1, 0, 4), (3, 1, -2), (1, 0, -9), (2, 2, 1)]:
                for x in roots(a, b, c):
                    value = a * x**2 + b * x + c
                    assert close(value, 0, abs_tol=1e-9), f"roots({a}, {b}, {c}) gave {show(x)}, but {written(a, b, c)} is {show(value)} there, not 0."
      reference: |
        import cmath


        def roots(a, b, c):
            """The two solutions of ax² + bx + c = 0, complex when b² - 4ac is negative."""
            d = cmath.sqrt(b**2 - 4*a*c)
            return (-b - d) / (2*a), (-b + d) / (2*a)


        print(roots(1, 4, 5))
        print(roots(1, -3, 2))
      wrong:
        - code: |
            import math


            def roots(a, b, c):
                d = math.sqrt(abs(b**2 - 4*a*c)) * 1j
                return (-b - d) / (2*a), (-b + d) / (2*a)
          why: >-
            The bug left in: multiplying by `1j` is right only when $b^2 - 4ac$ is negative, so every
            equation with real solutions gets complex ones, $1.5 \pm 0.5i$ for $x^2 - 3x + 2 = 0$.
        - code: |
            import math


            def roots(a, b, c):
                d = math.sqrt(b**2 - 4*a*c)
                return (-b - d) / (2*a), (-b + d) / (2*a)
          why: >-
            `math.sqrt` works only with real numbers, so it stops with a `ValueError` whenever
            $b^2 - 4ac$ is negative.
        - code: |
            import cmath


            def roots(a, b, c):
                d = cmath.sqrt(abs(b**2 - 4*a*c))
                return (-b - d) / (2*a), (-b + d) / (2*a)
          why: >-
            Keeping `abs` throws away the sign of $b^2 - 4ac$, so the complex solutions come out
            real: $-3$ and $-1$ for $x^2 + 4x + 5 = 0$.
        - code: |
            import cmath


            def roots(a, b, c):
                d = cmath.sqrt(b**2 - 4*a*c) * 1j
                return (-b - d) / (2*a), (-b + d) / (2*a)
          why: >-
            Multiplying every square root by `1j` turns it a quarter turn: the imaginary root of a
            negative number becomes real, and the real root of a positive one imaginary, so
            $x^2 + 4x + 5 = 0$ gets $-1$ and $-3$, and $x^2 - 3x + 2 = 0$ gets $1.5 \pm 0.5i$.
    explanation: >-
      `cmath.sqrt` takes the square root of any number, real or complex: `cmath.sqrt(-4)` is `2j`
      and `cmath.sqrt(1)` is `(1+0j)`. With it the one formula serves every quadratic, and the
      answers come back as complex numbers, whose imaginary parts are 0 when the solutions are
      real.

  - id: build-turn-about
    phase: build
    kind: build
    concept: M1.12/eulers-formula
    covers: [M1.12/polar-form]
    title: Turning about any centre, in one line
    prompt: >-
      M1.11's `rotate_about` turned a point about a centre in three moves. With points held as
      complex numbers it takes one line. Write `turn_about(z, centre, angle)`, which turns the point
      `z` anticlockwise about the point `centre` through `angle`, in radians. A quarter turn of
      `2 + 1j` about `1 + 1j` gives `1 + 2j`.
    answer:
      type: code
      starter: |
        import cmath
        import math


        def turn_about(z, centre, angle):
            """z turned anticlockwise about centre through angle, in radians, with points as complex numbers."""
            return z


        print(turn_about(2 + 1j, 1 + 1j, math.pi / 2))   # should be about (1+2j)
      tests: |
        import math


        def show(z):
            """A number as Python writes a complex number, each part to 6 significant figures."""
            z = complex(z)
            re = 0.0 if abs(z.real) < 1e-12 else z.real
            im = 0.0 if abs(z.imag) < 1e-12 else z.imag
            return f"({re:.6g}{'-' if im < 0 else '+'}{abs(im):.6g}j)"


        def turned(z, centre, angle, words):
            """What turn_about gives, once it is checked to be one number."""
            got = turn_about(z, centre, angle)
            assert isinstance(got, (int, float, complex)), f"turn_about({show(z)}, {show(centre)}, {words}) gave {repr(got)}, which is not one number: it should give the turned point as one complex number."
            return got


        def test_example():
            """A quarter turn of 2 + i about 1 + i gives 1 + 2i."""
            got = turned(2 + 1j, 1 + 1j, math.pi / 2, "math.pi / 2")
            assert close(got, 1 + 2j, abs_tol=1e-9), f"turn_about(2+1j, 1+1j, math.pi / 2) gave {show(got)}, not (1+2j)."


        def test_centre_stays():
            """The centre does not move."""
            for centre in [1 + 1j, -2 + 3j, 0.5 - 4j]:
                for angle in [0.7, 2, -1.3]:
                    got = turned(centre, centre, angle, angle)
                    assert close(got, centre, abs_tol=1e-9), f"turn_about({show(centre)}, {show(centre)}, {angle}) moved the centre to {show(got)}."


        def test_keeps_distance():
            """A turn keeps the point's distance from the centre."""
            for z, centre in [(3 + 1j, 1 + 1j), (-2 + 5j, 1 - 1j), (0.5 + 0.25j, -3 + 2j)]:
                for angle in [0.3, 1, 2.5, -1.2, 4]:
                    got = turned(z, centre, angle, angle)
                    assert close(abs(got - centre), abs(z - centre)), f"turn_about({show(z)}, {show(centre)}, {angle}) gave {show(got)}, {abs(got - centre):.6g} from the centre, but {show(z)} is {abs(z - centre):.6g} from it."


        def test_turns_by_the_angle():
            """The point turns anticlockwise about the centre through the angle in radians."""
            for z, centre, angle, words, want in [(3 + 1j, 1 + 1j, math.pi, "math.pi", -1 + 1j), (1 + 3j, 1 + 1j, math.pi / 2, "math.pi / 2", -1 + 1j), (4 + 0j, 0j, math.pi / 2, "math.pi / 2", 4j)]:
                got = turned(z, centre, angle, words)
                assert close(got, want, abs_tol=1e-9), f"turn_about({show(z)}, {show(centre)}, {words}) gave {show(got)}, not {show(want)}."
      reference: |
        import cmath
        import math


        def turn_about(z, centre, angle):
            """z turned anticlockwise about centre through angle, in radians, with points as complex numbers."""
            return centre + (z - centre) * cmath.exp(1j * angle)


        print(turn_about(2 + 1j, 1 + 1j, math.pi / 2))
      wrong:
        - code: |
            import cmath


            def turn_about(z, centre, angle):
                return z * cmath.exp(1j * angle)
          why: >-
            It ignores the centre and turns about 0, so the centre itself moves.
        - code: |
            import cmath


            def turn_about(z, centre, angle):
                return (z - centre) * cmath.exp(1j * angle)
          why: >-
            It moves the centre to 0 and turns, but never moves back, so every answer is off by the
            centre and the centre lands on 0.
        - code: |
            import cmath


            def turn_about(z, centre, angle):
                return centre + (z - centre) * cmath.exp(angle)
          why: >-
            Without the `1j`, `cmath.exp(angle)` is the real number $e^{\text{angle}}$, which stretches
            away from the centre instead of turning.
        - code: |
            import cmath
            import math


            def turn_about(z, centre, angle):
                return centre + (z - centre) * cmath.exp(1j * math.radians(angle))
          why: >-
            The angle is already in radians, and converting it again as if it were degrees turns
            about 57 times too little.
    explanation: >-
      Taking `centre` away moves the centre to 0; multiplying by `cmath.exp(1j * angle)`, which is
      $\cos(\text{angle}) + i\sin(\text{angle})$ by Euler's formula, turns about 0; and adding
      `centre` back moves it home: `centre + (z - centre) * cmath.exp(1j * angle)`.
      `cmath.rect(1, angle)` gives the same number, and so does
      `complex(math.cos(angle), math.sin(angle))`.

  - id: build-rope
