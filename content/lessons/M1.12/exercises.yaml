  - id: explain-euler
    phase: explain
    kind: explain
    concept: M1.12/eulers-formula
    covers: [M1.12/complex-numbers, M1.12/polar-form]
    title: Imaginary, simply
    prompt: >-
      Explain to your friend what the numbers $a + bi$ are, how they add and multiply, and what
      multiplying by $i$ does, with an example. Then explain why multiplying two complex numbers
      multiplies their lengths and adds their angles, with an example. Then say what the number $e$
      is, from interest paid more and more often, what $\left(1 + \frac{i\theta}{n}\right)^n$ does
      as $n$ grows and why it ends at $\cos\theta + i\sin\theta$, and what $e^{i\theta}$ therefore
      means. Last, explain why $e^{i\pi} = -1$, though 2.718 multiplied by itself is never negative,
      with numbers or Python to show it.
    answer:
      type: text
      rubric:
        - { id: points, criterion: 'Says that $a + bi$ is the point $(a, b)$, with $i^2 = -1$, and that complex numbers add part by part, with an example.' }
        - { id: times-i, criterion: 'Says that multiplying by $i$ turns a point a quarter turn about 0, and shows it on an example such as $i(3 + i) = -1 + 3i$.' }
        - { id: multiply, criterion: 'Says that multiplying multiplies lengths and adds angles, gives a reason, such as that multiplying by $\cos\theta + i\sin\theta$ is the turn through $\theta$, and works an example.' }
        - { id: e, criterion: 'Says what $e$ is: where $\left(1 + \frac{1}{n}\right)^n$, a year of interest at 100% paid in $n$ parts, settles as $n$ grows, about 2.718.' }
        - { id: steps, criterion: 'Explains $\left(1 + \frac{i\theta}{n}\right)^n$ as $n$ small turns of about $\frac{\theta}{n}$ each that stretch by almost nothing, so that it ends at the point at angle $\theta$ on the circle of radius 1, $\cos\theta + i\sin\theta$.' }
        - { id: pi, criterion: 'Says that $e^{i\theta}$ means where $\left(1 + \frac{i\theta}{n}\right)^n$ settles, not 2.718 multiplied by itself, and why $e^{i\pi} = -1$: half a turn from 1 along the circle of radius 1, with the numbers or Python as evidence.' }
      reference: >-
        Take the plane and call the point $(a, b)$ the number $a + bi$. The real numbers are the first
        axis, and $i$ is the point $(0, 1)$. Adding is adding the parts, $(2 + i) + (1 + 3i) = 3 + 4i$:
        lay the second arrow on the end of the first. Multiplying is multiplying out the brackets, with
        one new rule, $i^2 = -1$. That rule has a picture: $i(3 + i) = 3i + i^2 = -1 + 3i$, and
        $(-1, 3)$ is $(3, 1)$ turned a quarter turn. Multiplying by $i$ always turns a quarter turn
        about 0, and doing it twice turns half a turn, which takes 1 to $-1$: that is all
        $i^2 = -1$ says. Nothing mystical, just a number that turns. Now any number of length 1 at
        angle $\theta$ is $\cos\theta + i\sin\theta$, and multiplying $x + iy$ by it gives
        $(x\cos\theta - y\sin\theta) + i(x\sin\theta + y\cos\theta)$, which is exactly the point
        $(x, y)$ turned through $\theta$. A number of length $r$ is $r$ times such a number, so
        multiplying by it stretches by $r$ and turns by $\theta$: lengths multiply and angles add.
        For example $(1 + i)(\sqrt{3} + i)$ has length $\sqrt{2} \times 2$ and angle
        $45° + 30° = 75°$. Next, $e$. Interest of 100% a year paid once turns 1 rupee into 2; paid
        in $n$ parts it gives $\left(1 + \frac{1}{n}\right)^n$, which settles on
        $e = 2.71828\ldots$ as $n$ grows: a thousand parts give 2.7169. In the same way $e^x$ is
        where $\left(1 + \frac{x}{n}\right)^n$ settles. So for $e^{i\theta}$, look at
        $\left(1 + \frac{i\theta}{n}\right)^n$. Each factor is a tiny step from 1 straight up: its
        length is barely more than 1 and its angle is a little under $\frac{\theta}{n}$. Multiplying
        by it turns a little and hardly stretches. Do that $n$ times and you turn through almost
        exactly $\theta$, while the length grows only by about $\frac{\theta^2}{2n}$, which vanishes
        as $n$ grows. So the limit is the point at angle $\theta$ on the circle of radius 1:
        $e^{i\theta} = \cos\theta + i\sin\theta$. That is what $e^{i\theta}$ means: not 2.718
        multiplied by itself $i\theta$ times, which would mean nothing, but where these products
        settle, and it keeps the rule for powers, $e^{i\alpha}e^{i\beta} = e^{i(\alpha + \beta)}$.
        With $\theta = \pi$ that is half a turn from 1, so
        $e^{i\pi} = -1$; Python's `(1 + 1j * math.pi / 1000) ** 1000` is already
        $-1.005 + 0.00001i$.
      minWords: 120
      maxWords: 550
    explanation: >-
      A strong answer draws $a + bi$ as the point $(a, b)$; adds part by part; shows that
      multiplying by $i$ turns a quarter turn, as $i(3 + i) = -1 + 3i$ turns $(3, 1)$ to $(-1, 3)$;
      explains why lengths multiply and angles add from the turn by $\cos\theta + i\sin\theta$, with
      an example such as $(1 + i)(\sqrt{3} + i)$ at $75°$; builds $e$ from compound interest; and
      explains $\left(1 + \frac{i\theta}{n}\right)^n$ as $n$ small turns that add up to $\theta$ and
      stretch by almost nothing, so that $e^{i\theta} = \cos\theta + i\sin\theta$ and $e^{i\pi} = -1$;
      and it says that $e^{i\theta}$ means where those products settle, not 2.718 multiplied by itself,
      which answers the friend's worry that no power of 2.718 can be negative.
