  - id: derive-roots
    phase: derive
    kind: proof
    concept: M1.12/polar-form
    title: Every solution of zⁿ = 1
    prompt: >-
      Here is a proof that every solution of $z^n = 1$, for a whole number $n$ of at least 1, is one
      of the numbers at the angles $\frac{2\pi k}{n}$ on the circle of radius 1. Each line follows from the
      lines above it. Choose the rule that justifies each line. A rule may be used more than once
      or not at all.
    answer:
      type: steps
      rules:
        - { id: turns, name: Whole turns, label: 'Two angles give the same point of the circle of radius 1 exactly when they differ by a whole number of turns, $2\pi k$ for a whole number $k$.' }
        - { id: conjugate, name: Conjugates, label: 'A complex number times its conjugate is the square of its length: $(a + bi)(a - bi) = a^2 + b^2$.' }
        - { id: products, name: Products, label: 'Multiplying complex numbers multiplies their lengths and adds their angles.' }
        - { id: both-sides, name: Both sides, label: 'Both sides of an equation can be divided by the same number, if it is not 0.' }
        - { id: lengths, name: Equal lengths, label: 'Equal complex numbers have equal lengths, and the length of 1 is 1.' }
        - { id: positive-root, name: Positive roots, label: 'The only positive number whose $n$th power is 1 is 1.' }
      start: '\text{Let } z = r(\cos\theta + i\sin\theta) \text{, with length } r > 0 \text{, be a solution of } z^n = 1.'
      lines:
        - math: 'z^n = r^n(\cos n\theta + i\sin n\theta)'
          rule: products
        - math: 'r^n = 1'
          rule: lengths
        - math: 'r = 1'
          rule: positive-root
        - math: '\text{With } r = 1 \text{, line 1 says } \cos n\theta + i\sin n\theta = 1 \text{, so } n\theta = 2\pi k \text{ for a whole number } k'
          rule: turns
        - math: '\theta = \frac{2\pi k}{n}'
          rule: both-sides
        - math: '\text{The points for } k = 0, 1, \ldots, n - 1 \text{ differ, and } k + n \text{ gives the point of } k'
          rule: turns
    explanation: >-
      $z^n$ is $n$ copies of $z$ multiplied together, so it has length $r^n$ and angle $n\theta$. It
      equals 1, so its length is 1, which forces $r = 1$, and its angle $n\theta$ is a whole number of
      turns, $2\pi k$. Dividing by $n$ gives $\theta = \frac{2\pi k}{n}$, and the angles for
      $k = 0$ to $n - 1$ are the different ones: $k = n$ is a whole turn on from $k = 0$. Every one of
      them is a solution, since $n$ times its angle is a whole number of turns. So $z^n = 1$ has
      exactly $n$ solutions, evenly spaced round the circle of radius 1, one of them 1. The
      conjugates rule is not needed.
    review:
      variants:
        - prompt: How many complex numbers $z$ have $z^6 = 1$?
          answer: { type: number, value: 6, tolerance: { abs: 0 } }
          explanation: >-
            Six, at the angles $\frac{2\pi k}{6}$, every $60°$ round the circle of radius 1.
        - prompt: >-
            The solutions of $z^8 = 1$ sit round the circle of radius 1. How many degrees apart are
            neighbouring solutions?
          answer: { type: number, value: 45, tolerance: { abs: 0 }, unit: degrees }
          explanation: >-
            Eight solutions share the whole turn evenly: $\frac{360°}{8} = 45°$.
        - prompt: Where do the solutions of $z^n = 1$ lie?
          answer:
            type: choice
            options:
              - { id: line, label: 'On the first axis, spread out between $-1$ and 1' }
              - { id: two, label: 'Only at 1 and $-1$, whatever the whole number $n$ is' }
              - { id: spiral, label: 'On a spiral that winds out from 0, one per power' }
              - { id: right, label: 'Evenly spaced round the circle of radius 1, one at 1' }
            correct: [right]
          explanation: >-
            Each has length 1 and an angle $\frac{2\pi k}{n}$, so they are $n$ points a whole turn
            divided by $n$ apart, starting at 1.

  - id: derive-drift
    phase: derive
    kind: estimate
    concept: M1.12/eulers-formula
    title: How far the length drifts
    prompt: >-
      Each factor $1 + \frac{i\theta}{n}$ has length $\sqrt{1 + \frac{\theta^2}{n^2}}$. Take
      $\theta = 2\pi$, a whole turn, and $n = 500$. For a small number $\epsilon$,
      $\sqrt{1 + \epsilon}$ is about $1 + \frac{\epsilon}{2}$, and a product of $n$ numbers that are
      each $1 + \delta$ is about $1 + n\delta$ when $n\delta$ is small (when it is not, the rule fails:
      $\left(1 + \frac{1}{n}\right)^n$, with $n\delta = 1$, settles on $e$, not 2). Without a
      calculator, estimate by how much the length of $\left(1 + \frac{2\pi i}{500}\right)^{500}$ is
      more than 1. For a length of 1.5, you would type 0.5.
    answer: { type: number, value: 0.0403, tolerance: { factor: 1.5 } }
    explanation: >-
      Each factor's length is about $1 + \frac{1}{2}\left(\frac{2\pi}{500}\right)^2 = 1 + \frac{2\pi^2}{250{,}000}$,
      and with $\pi^2 \approx 10$ that is $1 + 0.00008$. Five hundred of them multiply to about
      $1 + 500 \times 0.00008 = 1.04$, so the product is about 0.04 longer than 1, and Python gives
      0.0403. In general the gap is about $\frac{\theta^2}{2n}$, which shrinks to 0 as $n$ grows.
    review:
      variants:
        - prompt: >-
            Estimate by how much the length of $\left(1 + \frac{i\pi}{n}\right)^n$ is more than 1,
            for $n = 5{,}000$.
          answer: { type: number, value: 0.000987, tolerance: { factor: 1.5 } }
          explanation: >-
            The gap is about $\frac{\theta^2}{2n} = \frac{\pi^2}{10{,}000} \approx \frac{10}{10{,}000} = 0.001$,
            and Python gives 0.000987.
        - prompt: >-
            As $n$ grows, what happens to the length of $\left(1 + \frac{i\theta}{n}\right)^n$, for a
            fixed angle $\theta$?
          answer:
            type: choice
            options:
              - { id: grows, label: 'It grows without limit, since every factor is longer than 1' }
              - { id: right, label: 'It settles on 1, since the gap is about $\frac{\theta^2}{2n}$' }
              - { id: theta, label: 'It settles on $\theta$, the angle turned' }
              - { id: e, label: 'It settles on $e$, as compound interest does' }
            correct: [right]
          explanation: >-
            Each factor is longer than 1 by only about $\frac{\theta^2}{2n^2}$, and $n$ of them add
            up to about $\frac{\theta^2}{2n}$, which shrinks to 0.

