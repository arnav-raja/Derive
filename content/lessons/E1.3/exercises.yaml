  - id: build-smooth-pure
    phase: build
    kind: build
    concept: E1.3/pure-functions
    covers: [E1.3/scope]
    title: Making a function pure
    prompt: >-
      A training log smooths the loss, so that its trend shows through the noise from step to step:
      each new loss moves the smoothed value a tenth of the way towards it. This script does it with
      `record`, which changes the main program's `smooth`. Replace `record` with a pure function,
      `smoothed(previous, loss)`, that returns the new smoothed value, and change the loop to use
      it, keeping the name `smooth` for the smoothed value, so that the script still prints the
      same. The tests type other losses too.
    answer:
      type: code
      stdin: ["3", "2.0", "1.0", "1.5"]
      starter: |
        n = int(input())    # the person types 3, then the losses 2.0, 1.0 and 1.5, one per line
        smooth = 0.0

        def record(loss):
            global smooth
            smooth = 0.9 * smooth + 0.1 * loss

        for step in range(n):
            record(float(input()))

        print("smoothed loss:", smooth)
      tests: |
        import contextlib
        import io

        # close(a, b) is True when a and b agree to about nine significant figures, as math.isclose
        # decides. smoothed.__globals__ is the main program's names.

        def test_defined():
            """There is a function called smoothed."""
            assert "smoothed" in globals(), "There is no function called smoothed yet. Define it with def, with the parameters previous and loss."

        def test_values():
            """smoothed moves previous a tenth of the way towards loss."""
            for previous, loss, expected in [(0.0, 2.0, 0.2), (1.0, 1.0, 1.0), (0.5, 3.0, 0.75)]:
                got = smoothed(previous, loss)
                assert got is not None and close(got, expected), f"smoothed({previous}, {loss}) is {got!r}, but it should be {expected}."

        def test_pure():
            """smoothed leaves the main program's smooth alone, and uses only its arguments."""
            world = smoothed.__globals__
            kept = world.get("smooth")
            try:
                world["smooth"] = 123.0
                first = smoothed(0.0, 1.0)
                assert world["smooth"] == 123.0, "Calling smoothed changed the main program's smooth. Return the new value instead, and let the loop assign it."
                world["smooth"] = -50.0
                second = smoothed(0.0, 1.0)
            finally:
                world["smooth"] = kept
            assert first == second, (
                f"smoothed(0.0, 1.0) gave {first!r} with the main program's smooth at 123.0 and {second!r} with it at -50.0, "
                "so it reads smooth from outside instead of using previous."
            )

        def test_record_replaced():
            """record is gone: the loop calls smoothed and assigns smooth itself."""
            assert "record" not in globals(), "record is still defined. Replace it with smoothed, and let the loop assign smooth itself."

        def test_silent():
            """smoothed prints nothing."""
            sink = io.StringIO()
            with contextlib.redirect_stdout(sink):
                smoothed(0.5, 1.0)
            assert sink.getvalue() == "", f"smoothed printed {sink.getvalue()!r}. Print in the main program instead."

        def test_script():
            """The script still ends with smooth holding the smoothed loss, for other losses too."""
            # rerun("3", "2.0", "1.0", "1.5") runs your program again with those lines typed: names is
            # its names at the end, and printed is what it printed.
            for typed, expected in [(("3", "2.0", "1.0", "1.5"), 0.402), (("2", "10.0", "0.0"), 0.9)]:
                names, printed = rerun(*typed)
                assert "smooth" in names, "The main program has no name smooth at the end. Keep smooth for the smoothed value, and assign it in the loop."
                assert close(names["smooth"], expected), f"Typing {', '.join(typed)}, smooth ends as {names['smooth']!r}, but it should be {expected}."
      reference: |
        n = int(input())    # the person types 3, then the losses 2.0, 1.0 and 1.5, one per line
        smooth = 0.0

        def smoothed(previous, loss):
            """previous, moved a tenth of the way towards loss."""
            return 0.9 * previous + 0.1 * loss

        for step in range(n):
            smooth = smoothed(smooth, float(input()))

        print("smoothed loss:", smooth)
      wrong:
