exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-halve
    phase: puzzle
    kind: predict
    concept: E1.3/scope
    title: Halving inside a function
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: both-halved, label: '`0.05 0.05`' }
        - { id: error, label: 'Nothing: Python stops with an error, since `lr` is already a name of the program' }
        - { id: outer-kept, label: '`0.1 0.05`' }
      correct: [outer-kept]
    explanation: >-
      The call makes a new name `lr` of its own for the value it is given, 0.1. `lr = lr / 2` makes
      that name refer to 0.05, and `return lr` hands 0.05 back, so `smaller` refers to 0.05. The
      program's own `lr` is never assigned again, so it still refers to 0.1, and the program prints
      `0.1 0.05`.

  # Recall ---------------------------------------------------------------------
  - id: recall-rebind
    phase: recall
    kind: recall
    concept: E1.1/variables-as-names
    prompt: |
      What does `b` refer to once these three lines have run?

      ```python
      a = 3
      b = a
      a = a + 1
      ```
    answer: { type: number, value: 3, tolerance: { abs: 0 } }
    explanation: >-
      `b = a` makes `b` refer to 3, the value `a` refers to then. `a = a + 1` makes `a` refer to 4
      and changes no other name, so `b` still refers to 3.

  - id: recall-one-output
    phase: recall
    kind: recall
    concept: M1.3/function-as-mapping
    prompt: In M1.3's sense, is a rule that sends 4 to both 2 and $-2$ a function?
    answer:
      type: choice
      options:
        - { id: yes-has-output, label: 'Yes, since every input has an output' }
        - { id: no-one-output, label: 'No, since a function gives each input exactly one output' }
        - { id: yes-onto, label: 'Yes, provided every output comes from some input' }
      correct: [no-one-output]
    explanation: >-
      A function gives every input exactly one output. This rule gives the input 4 two outputs, so
      it is not a function.

  - id: recall-compose
    phase: recall
    kind: recall
    concept: M1.3/composition
    prompt: With $f(x) = x + 3$ and $g(x) = 2x$, what is $f(g(4))$?
    answer: { type: number, value: 11, tolerance: { abs: 0 } }
    explanation: 'The inner function goes first: $g(4) = 8$, then $f(8) = 11$.'

  - id: recall-while
    phase: recall
    kind: recall
    concept: E1.2/loops
    prompt: |
      What does this program print?

      ```python
      n = 1
      while n < 20:
          n = n * 2
      print(n)
      ```
    answer: { type: number, value: 32, tolerance: { abs: 0 } }
    explanation: >-
      `n` goes 1, 2, 4, 8, 16, and `16 < 20` is still `True`, so one more pass makes it 32. Then
      `32 < 20` is `False`, and the program prints 32.

  - id: recall-chain
    phase: recall
    kind: recall
    concept: E1.2/conditions
    prompt: |
      What does `size` refer to once this has run?

      ```python
      x = 15
      if x > 10:
          size = "large"
      elif x > 5:
          size = "medium"
      else:
          size = "small"
      ```
    answer:
      type: choice
      options:
        - { id: medium, label: '`"medium"`' }
        - { id: large, label: '`"large"`' }
        - { id: small, label: '`"small"`' }
      correct: [large]
    explanation: >-
      `15 > 10` is `True`, so the first block runs and the rest of the chain is skipped, although
      `15 > 5` would be `True` as well.

  # Explore --------------------------------------------------------------------
  - id: explore-def-runs
    phase: explore
    kind: predict
    concept: E1.3/defining-functions
    title: A function that prints and returns
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: no-calls-print, label: '`start` and `4`, on two lines' }
        - { id: in-order, label: '`start`, `one`, `two` and `4`, one per line' }
        - { id: printed-value, label: '`start`, `one`, `two` and `onetwo`, one per line' }
      correct: [in-order]
    explanation: >-
      The `def` line only makes `shout` refer to the function, so `start` comes first. Each call
      then runs the whole body, printing its word, and gives back 2, so `a + b` is 4. The value of a
      call is what `return` gives, not what the call printed.
    review:
      variants:
        - prompt: |
            What does this program print?

            ```python
            def twice(x):
                return 2 * x

            y = twice(3)
            z = twice(y)
            print(z)
            ```
          answer: { type: number, value: 12, tolerance: { abs: 0 } }
          explanation: '`twice(3)` is 6, so `y` refers to 6, and `twice(6)` is 12.'
        - prompt: |
            What does this program print?

            ```python
            def show(x):
                print("got", x)
                return x + 1

            a = show(1)
            print(a)
            ```
          answer:
            type: choice
            options:
              - { id: both, label: '`got 1`, then `2`, on two lines' }
              - { id: value-only, label: '`2`' }
              - { id: print-only, label: '`got 1`' }
              - { id: got-two, label: '`got 2`, then `2`, on two lines' }
            correct: [both]
          explanation: >-
            The call runs the body: it prints `got 1` and returns 2, so `a` refers to 2, and the last
            line prints it.
        - prompt: |
            How many times does the body of `f` run?

            ```python
            def f(x):
                return x + 1

            a = f(1)
            b = f(a)
            c = f(f(b))
            ```
          answer: { type: number, value: 4, tolerance: { abs: 0 } }
          explanation: >-
            Every call runs the body once: one call each for `a` and `b`, and two for `c`, the inner
            call first. That is 4 calls.

  - id: explore-print-not-return
    phase: explore
    kind: predict
    concept: E1.3/defining-functions
    title: Adding two areas
    placement: true
    prompt: What happens when the program runs?
    answer:
      type: choice
      options:
        - { id: total, label: 'It prints `26`' }
        - { id: all-three, label: 'It prints `6`, `20` and `26`, one per line' }
        - { id: type-error, label: 'It prints `6` and `20`, one per line, then Python stops with `TypeError`' }
        - { id: error-first, label: 'Python stops with `TypeError` before anything is printed' }
      correct: [type-error]
    explanation: >-
      Each call prints its area, so `6` and then `20` appear. But `area` has no `return`, so each
      call gives back `None`, and `None + None` stops Python with `TypeError` before `total` is ever
      made.
    review:
      variants:
        - prompt: |
            What does this program print?

            ```python
            def half(x):
                print(x / 2)
                return x / 2

            h = half(8)
            print(h + 1)
            ```
          answer:
            type: choice
            options:
              - { id: both, label: '`4.0`, then `5.0`, on two lines' }
              - { id: last, label: '`5.0`' }
              - { id: first, label: '`4.0`' }
              - { id: error, label: '`4.0`, then Python stops with `TypeError`' }
            correct: [both]
          explanation: >-
            This time the function both prints and returns, so the call prints `4.0` and gives back
            4.0, and `h + 1` is 5.0.
        - prompt: What is the type of the value of `print("hi")`, once it has printed `hi`?
          answer:
            type: choice
            options:
              - { id: str, label: '`str`' }
              - { id: none-type, label: '`NoneType`' }
              - { id: bool, label: '`bool`' }
            correct: [none-type]
          explanation: >-
            `print` shows its argument and returns `None`, the one value of type `NoneType`. Printing
            a value never hands it back.
        - prompt: |
            What does this program print?

            ```python
            def double(x):
                y = 2 * x

            print(double(5))
            ```
          answer:
            type: choice
            options:
              - { id: ten, label: '`10`' }
              - { id: none, label: '`None`' }
              - { id: name-error, label: 'Nothing: Python stops with `NameError`' }
            correct: [none]
          explanation: >-
            The body makes `y` refer to 10 but never returns it, so the call gives `None`, and that
            is what `print` shows.

  - id: explore-early-return
    phase: explore
    kind: predict
    concept: E1.3/defining-functions
    title: Where the call ends
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: last-runs, label: '`0 0 0`, since the last line of each call runs too' }
        - { id: right, label: '`-1 0 1`' }
        - { id: error, label: 'Nothing: Python stops with an error, since `sign` has three `return` lines' }
      correct: [right]
    explanation: >-
      `sign(-4)` returns $-1$ at its second `return`, `sign(0)` reaches the last line and returns 0,
      and `sign(9)` returns 1 at the first. Each call ends at the first `return` it reaches, so the
      lines after it never run.
    review:
      variants:
        - prompt: |
            What does this program print?

            ```python
            def grade(score):
                if score >= 80:
                    return "distinction"
                if score >= 50:
                    return "pass"
                return "fail"

            print(grade(85), grade(50), grade(20))
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`distinction pass fail`' }
              - { id: later-wins, label: '`pass pass fail`' }
              - { id: last-runs, label: '`fail fail fail`' }
            correct: [right]
          explanation: >-
            Each call ends at the first `return` it reaches. 85 returns at the first test, 50 at the
            second, and 20 reaches the last line.
        - prompt: |
            What does this program print?

            ```python
            def first_over(limit):
                for k in range(1, 100):
                    if k * k > limit:
                        return k
                return 0

            print(first_over(50))
            ```
          answer: { type: number, value: 8, tolerance: { abs: 0 } }
          explanation: >-
            $7 \times 7 = 49$ is not above 50, and $8 \times 8 = 64$ is, so the call returns 8 on that
            pass. `return` ends the loop and the call together.

  - id: explore-local-gone
    phase: explore
    kind: predict
    concept: E1.3/scope
    title: A name made inside a call
    placement: true
    prompt: What happens at the last line?
    answer:
      type: choice
      options:
        - { id: fraction, label: 'It prints `0.25`' }
        - { id: lr, label: 'It prints `0.00025`' }
        - { id: name-error, label: 'Python stops with `NameError`' }
        - { id: none, label: 'It prints `None`' }
      correct: [name-error]
    explanation: >-
      `fraction` is local to the call: it is given its value when the call runs its first line, and
      it is gone once the call returns. The main program never had a name `fraction`, so Python stops
      with `NameError`, its error for a name it cannot find.
    review:
      variants:
        - prompt: |
            What does this program print?

            ```python
            def area(width, height):
                result = width * height
                return result

            result = 0
            a = area(3, 4)
            print(result, a)
            ```
          answer:
            type: choice
            options:
              - { id: both-twelve, label: '`12 12`' }
              - { id: right, label: '`0 12`' }
              - { id: zeros, label: '`0 0`' }
            correct: [right]
          explanation: >-
            The call's `result` is its own local name, so assigning 12 to it leaves the main
            program's `result` at 0. Only the returned 12 comes back, as `a`.
        - prompt: |
            What does this program print?

            ```python
            x = 5

            def bump(x):
                x = x + 1
                return x

            bump(x)
            print(x)
            ```
          answer: { type: number, value: 5, tolerance: { abs: 0 } }
          explanation: >-
            The call's parameter `x` is its own name, so `x = x + 1` changes only that. The call
            returns 6, but nothing keeps it, and the main program's `x` is still 5.
        - prompt: |
            What does this program print?

            ```python
            def count_up(n):
                total = 0
                for k in range(n):
                    total = total + 1
                return total

            print(count_up(3) + count_up(3))
            ```
          answer: { type: number, value: 6, tolerance: { abs: 0 } }
          explanation: >-
            Each call makes its own `total`, starting from 0, so each returns 3, and the sum is 6.
        - prompt: |
            What happens at the last line?

            ```python
            def make_total(n):
                total = n * 2
                return total

            make_total(5)
            print(total)
            ```
          answer:
            type: choice
            options:
              - { id: ten, label: 'It prints `10`' }
              - { id: none, label: 'It prints `None`' }
              - { id: name-error, label: 'Python stops with `NameError`' }
            correct: [name-error]
          explanation: >-
            `total` is local to the call and is gone once it returns, and the call's value, 10, is not
            kept. The main program has no name `total`, so Python stops with `NameError`.

  - id: explore-global-read
    phase: explore
    kind: predict
    concept: E1.3/scope
    title: A name read from outside
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: at-def, label: '`20 20`, since `scaled` keeps the value `scale` had when it was defined' }
        - { id: at-call, label: '`20 30`' }
        - { id: at-end, label: '`30 30`, since `scale` is 3 by the time anything is printed' }
        - { id: error, label: 'Nothing: Python stops with `NameError`, since `scale` is not a parameter of `scaled`' }
      correct: [at-call]
    explanation: >-
      `scaled` never assigns `scale`, so each call looks it up among the main program's names when
      the call runs. The first call finds 2 and the second finds 3, so the same call gives 20 and
      then 30.
    review:
      variants:
        - prompt: |
            What does this program print?

            ```python
            def f(x):
                return x + y

            y = 1
            a = f(1)
            y = 10
            b = f(1)
            print(a, b)
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`2 11`' }
              - { id: same, label: '`2 2`' }
              - { id: error, label: 'Nothing: Python stops with `NameError`, since `y` does not exist when `f` is defined' }
            correct: [right]
          explanation: >-
            Python looks `y` up when each call runs, not when `f` is defined, so the calls find 1 and
            then 10.
        - prompt: |
            What does this program print?

            ```python
            rate = 0.1

            def cost(steps):
                return rate * steps

            rate = 0.2
            print(cost(10))
            ```
          answer: { type: number, value: 2, tolerance: { rel: 1e-9 } }
          explanation: 'By the time `cost` is called, `rate` refers to 0.2, so the call gives $0.2 \times 10 = 2.0$.'

  - id: explore-assign-makes-local
    phase: explore
    kind: predict
    concept: E1.3/scope
    title: Counting from inside
    prompt: What happens when `tick()` is called?
    answer:
      type: choice
      options:
        - { id: changes-global, label: 'It returns 1, and the main program''s `count` becomes 1' }
        - { id: local-copy, label: 'It returns 1, and the main program''s `count` stays 0' }
        - { id: unbound, label: 'Python stops with an error at `count = count + 1`' }
        - { id: zero, label: 'It returns 0' }
      correct: [unbound]
    explanation: >-
      `tick` assigns `count`, so `count` is local throughout `tick`, and the right side of
      `count = count + 1` asks for the call's own `count` before it has a value. Python stops with
      `UnboundLocalError`.
    review:
      variants:
        - prompt: |
            What does this program print?

            ```python
            total = 10

            def add(x):
                total = total + x
                return total

            print(add(5))
            ```
          answer:
            type: choice
            options:
              - { id: fifteen, label: '`15`' }
              - { id: five, label: '`5`' }
              - { id: unbound, label: 'Nothing: Python stops with `UnboundLocalError`' }
              - { id: ten, label: '`10`' }
            correct: [unbound]
          explanation: >-
            `add` assigns `total`, so `total` is local throughout it, and `total + x` asks for that
            local name before it has a value.
        - prompt: |
            What does this program print?

            ```python
            total = 10

            def add(x):
                return total + x

            print(add(5), total)
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`15 10`' }
              - { id: both, label: '`15 15`' }
              - { id: unbound, label: 'Nothing: Python stops with `UnboundLocalError`' }
            correct: [right]
          explanation: >-
            This `add` only reads `total`, so it finds the main program's 10 and returns 15, and the
            main program's `total` is unchanged.

  - id: explore-which-pure
    phase: explore
    kind: predict
    concept: E1.3/pure-functions
    title: Five functions
    placement: true
    prompt: Which of the five functions are pure? Choose every one.
    answer:
      type: choice
      multiple: true
      options:
        - { id: f, label: '`f`' }
        - { id: g, label: '`g`' }
        - { id: h, label: '`h`' }
        - { id: k, label: '`k`' }
        - { id: m, label: '`m`' }
      correct: [f, k]
    explanation: >-
      `f` and `k` depend only on their arguments and change nothing outside: `k`'s `total` and `i`
      are its own local names. `g` prints, `h` reads `offset`, which the script changes, and `m`
      reads a line of input.
    review:
      variants:
        - prompt: |
            Is `double` pure?

            ```python
            calls = 0

            def double(x):
                global calls
                calls = calls + 1
                return 2 * x
            ```
          answer:
            type: choice
            options:
              - { id: yes-value, label: 'Yes, since its value depends only on `x`' }
              - { id: no-changes, label: 'No, since a call changes the main program''s `calls`' }
              - { id: yes-global, label: 'Yes, since `global` makes the assignment allowed' }
            correct: [no-changes]
          explanation: >-
            Its value does depend only on `x`, but each call changes `calls`, a name outside it. A
            pure function changes nothing outside itself.
        - prompt: |
            Which of these functions are pure? Choose every one.

            ```python
            def a(x, y):
                return x * y

            def b(x):
                return x + float(input())

            def c(n):
                best = 0
                for k in range(n):
                    if k % 3 == 0:
                        best = k
                return best
            ```
          answer:
            type: choice
            multiple: true
            options:
              - { id: a, label: '`a`' }
              - { id: b, label: '`b`' }
              - { id: c, label: '`c`' }
            correct: [a, c]
          explanation: >-
            `a` and `c` depend only on their arguments, and `c`'s `best` and `k` are local to each
            call. `b` reads a line of input, so two calls with the same `x` can differ.
        - prompt: |
            The script changes `scale` between calls of `scaled`. Which change makes `scaled` pure?

            ```python
            scale = 2

            def scaled(x):
                return scale * x
            ```
          answer:
            type: choice
            options:
              - { id: parameter, label: 'Make `scale` a parameter, as in `def scaled(x, scale):`, and pass it at every call' }
              - { id: global, label: 'Add `global scale` at the top of its body' }
              - { id: print, label: 'Print `scale` inside it, so that the value used can be seen' }
            correct: [parameter]
          explanation: >-
            As a parameter, `scale` comes in with each call, so the value depends only on the
            arguments. `global` would let it change the outside name, and printing is itself a change
            outside the function.

  - id: explore-contract
    phase: explore
    kind: predict
    concept: E1.3/abstraction
    title: Using a function you cannot see
    prompt: Going by its docstring alone, what does `warmup_lr(250, 0.004, 1000)` return?
    answer: { type: number, value: 0.001, tolerance: { rel: 1e-9 } }
    explanation: >-
      Step 250 is a quarter of the way through the 1,000 warm-up steps, so the rate has risen a
      quarter of the way from 0 to the peak of 0.004, which is 0.001.
    review:
      variants:
        - prompt: >-
            `warmup_lr(step, peak, warmup)` has the docstring "The learning rate at a step: rising
            evenly from 0 to peak over the first warmup steps, then holding at peak." What does
            `warmup_lr(5000, 0.004, 1000)` return?
          answer: { type: number, value: 0.004, tolerance: { rel: 1e-9 } }
          explanation: 'Step 5,000 is past the 1,000 warm-up steps, so the rate holds at the peak, 0.004.'
        - prompt: >-
            `def larger(a, b):` has the docstring "The larger of a and b." What does
            `larger(larger(3, 9), 5)` return?
          answer: { type: number, value: 9, tolerance: { abs: 0 } }
          explanation: 'The inner call gives 9, and the larger of 9 and 5 is 9.'
        - prompt: >-
            `def clamp(x, low, high):` has the docstring "x, limited to the range from low to high."
            What does `clamp(7, 0, 5)` return?
          answer: { type: number, value: 5, tolerance: { abs: 0 } }
          explanation: '7 is above the top of the range, so it is limited to 5.'

  - id: explore-defaults
    phase: explore
    kind: predict
    concept: E1.3/abstraction
    title: Settings with defaults
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: error, label: 'Nothing: Python stops with an error at the last call, whose arguments are out of order' }
        - { id: default-always, label: '`0.5 0.5 0.25`' }
        - { id: right, label: '`0.5 2.0 0.25`' }
        - { id: by-position, label: '`0.5 2.0 4.0`' }
      correct: [right]
    explanation: >-
      `progress(500)` uses the default 1,000 for `warmup`, `progress(500, 250)` gives `warmup` as
      250, and the last call gives `step` as 1,000 and `warmup` as 4,000 by name, whatever their
      order, so it is $1{,}000 / 4{,}000 = 0.25$.
    review:
      variants:
        - prompt: |
            What does this program print?

            ```python
            def scaled(x, factor=2):
                return x * factor

            print(scaled(5) + scaled(5, 3))
            ```
          answer: { type: number, value: 25, tolerance: { abs: 0 } }
          explanation: '`scaled(5)` uses the default factor 2 and gives 10, and `scaled(5, 3)` gives 15.'
        - prompt: |
            What does this program print?

            ```python
            def power(base, exponent=2):
                return base ** exponent

            print(power(exponent=3, base=2))
            ```
          answer: { type: number, value: 8, tolerance: { abs: 0 } }
          explanation: >-
            Keyword arguments go to the parameters they name, so `base` is 2 and `exponent` is 3,
            and $2^3 = 8$. Read by position, it would be $3^2 = 9$.

  - id: explore-compose
    phase: explore
    kind: predict
    concept: E1.3/abstraction
    title: Clip and scale
    placement: true
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: same, label: '`0.5 0.5`, since both apply the same two functions' }
        - { id: outer-first, label: '`1.0 0.5`' }
        - { id: right, label: '`0.5 1.0`' }
        - { id: no-clip, label: '`1.5 1.0`' }
      correct: [right]
    explanation: >-
      The inner call runs first. `clip(3.0)` is 1.0 and `scale(1.0)` is 0.5. `scale(3.0)` is 1.5,
      and `clip(1.5)` is 1.0. The order of composition matters.
    review:
      variants:
        - prompt: >-
            With `def add3(x):` returning `x + 3` and `def times2(x):` returning `2 * x`, what is
            `times2(add3(4)) - add3(times2(4))`?
          answer: { type: number, value: 3, tolerance: { abs: 0 } }
