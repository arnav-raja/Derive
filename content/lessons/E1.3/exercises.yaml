  - id: derive-pure-twice
    phase: derive
    kind: proof
    concept: E1.3/pure-functions
    title: Why one call can do for two
    prompt: >-
      Here is why `f(a) + f(a)` has the same value as `2 * f(a)` when `f` is pure, whatever the
      value `a`. Each line follows from the lines above it. Choose the rule that justifies each line.
      A rule may be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: algebra, name: Algebra, label: 'For any number $v$, $v + v = 2v$.' }
        - { id: local, name: Local names, label: 'A name that a function assigns is local to each call, and is gone when the call returns.' }
        - { id: same-value, name: Same arguments, label: 'A pure function''s value depends only on its arguments, so calls with equal arguments give equal values.' }
        - { id: left-first, name: Left first, label: 'Python works out the left side of `+` before the right side.' }
        - { id: no-effects, name: No effects, label: 'A call of a pure function prints nothing, reads no input and assigns no name outside the function.' }
        - { id: return-value, name: Return, label: 'A call ends at the first `return` it reaches, and the value after it is the value of the call.' }
      start: '\text{Let } \texttt{f} \text{ be a pure function and } \texttt{a} \text{ any value.}'
      lines:
        - math: '\text{In } \texttt{f(a) + f(a)} \text{, the left call runs first; let } v \text{ be its value}'
          rule: left-first
        - math: '\text{That call changed nothing outside } \texttt{f} \text{, so the right call gets the same argument, and finds everything outside as it was}'
          rule: no-effects
        - math: '\text{So the right call gives } v \text{ as well}'
          rule: same-value
        - math: '\texttt{f(a) + f(a)} = v + v = 2v'
          rule: algebra
        - math: '\text{A single call } \texttt{f(a)} \text{ gives } v \text{ too, so } \texttt{2 * f(a)} = 2v'
          rule: same-value
    explanation: >-
      The left call runs first and gives some value $v$. Because it changed nothing outside `f`, the
      right call is made with the same argument in the same world, and because `f`'s value depends
      only on its arguments, it gives $v$ too. So the sum is $2v$, which is what one call doubled
      gives. Neither the rule about local names nor the one about `return` is needed.

