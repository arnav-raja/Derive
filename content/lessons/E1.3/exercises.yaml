  - id: explain-functions
    phase: explain
    kind: explain
    concept: E1.3/abstraction
    covers: [E1.3/defining-functions, E1.3/scope, E1.3/pure-functions]
    title: Functions, calls and contracts
    prompt: >-
      Explain to your friend what a function is, how a call runs and what it gives back, why
      printing a result is not the same as returning it, why the puzzle prints `0.1 0.05`, what
      makes a function pure and why that matters, and why programs are built from small functions
      with clear contracts.
    answer:
      type: text
      rubric:
        - { id: call, criterion: 'Explains that `def` makes a name for a function whose body runs only when it is called, and that a call makes each parameter a name for its argument''s value, runs the body, and ends at `return`, whose value becomes the value of the call.' }
        - { id: return-print, criterion: 'Says that printing is not returning: a function that ends without `return` gives `None`, so a result the program needs must be returned.' }
        - { id: local, criterion: 'Explains the puzzle with local names: the call''s `lr` is a new name of its own for 0.1, so halving it leaves the main program''s `lr` at 0.1, and only the returned 0.05 comes back.' }
        - { id: pure, criterion: 'Says what makes a function pure, that its value depends only on its arguments and a call changes nothing outside it, and why that matters: the same call always gives the same value, so it can be tested, replaced by its value or reused.' }
        - { id: abstraction, criterion: 'Describes a function as a job with a contract, so that callers rely on what it does and not on how, and says that functions combine by passing the value of one call to the next.' }
      reference: >-
        A function is a job with a name. The def line names it and lists its parameters, the names
        its inputs will have, and the indented body below runs only when the function is called. A
        call such as halve(lr) first works out the argument, here 0.1, then makes the parameter a
        new name for that value, runs the body, and stops at return. The value after return becomes
        the value of the call, so it can be printed, stored or passed on. A function that ends
        without return gives None, so printing an answer inside a function is not the same as
        returning it, and a program that adds two such answers fails. The names a call makes, its
        parameters and anything it assigns, are local: they belong to that call and vanish when it
        returns. In the puzzle the lr inside halve is a different name from the main program's lr,
        even though they are spelled the same. Halving it changes only the call's own name, so the
        main program's lr is still 0.1, and only the returned 0.05 comes back, as smaller. That is
        why it prints 0.1 0.05. A function is pure when its value depends only on its arguments and
        a call changes nothing outside it: it does not read outside names that change, assign them,
        print or read input. Then the same call always gives the same value, like a function in
        maths, so it can be tested once and trusted, a call can be replaced by its value, and a
        repeated call can be skipped. Programs are built from small functions because each one has a
        contract, what it takes and what it gives back, and its callers rely on the contract rather
        than the details. Functions combine by passing one call's value to the next, as in
        scale(clip(g)), and a contract proved once, like triangle's, holds at every call.
      minWords: 100
      maxWords: 400
