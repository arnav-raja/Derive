exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-greedy
    phase: puzzle
    kind: predict
    concept: E1.12/next-word-counts
    title: Always the likeliest word
    prompt: What does the program write?
    answer:
      type: choice
      options:
        - { id: wander, label: 'A long text that never repeats itself, since there are so many words to choose from' }
        - { id: stop, label: 'A few words, and then it stops at a word that nothing in the book follows' }
        - { id: right, label: 'A few words that repeat in the same order, again and again, for ever' }
        - { id: same, label: '"the the the ...", since "the" is the commonest word of the whole book' }
      correct: [right]
    explanation: >-
      Each next word depends only on the word before it, so as soon as some word comes round a
      second time, everything after it repeats. It never stops, since every word it reaches is
      followed by something somewhere in the book, and "the" is rarely followed by "the".

  # Recall ---------------------------------------------------------------------
  - id: recall-length
    phase: recall
    kind: recall
    concept: E1.6/unicode-and-bytes
    prompt: What is `len("नमस्ते")`?
    answer: { type: number, value: 6, tolerance: { abs: 0 } }
    explanation: >-
      Six code points: न, म, स, the sign ् that joins स to the next letter, त, and the vowel sign
      े. The screen draws them as three clusters, but `len` counts code points.

  - id: recall-counts
    phase: recall
    kind: recall
    concept: E1.4/dicts-and-sets
    prompt: |-
      What does this print?

      ```python
      counts = {}
      for w in ["to", "be", "or", "not", "to", "be"]:
          counts[w] = counts.get(w, 0) + 1
      print(counts["be"], counts.get("is", 0))
      ```
    answer:
      type: choice
      options:
        - { id: once, label: '`1 0`' }
        - { id: none, label: '`2 None`' }
        - { id: right, label: '`2 0`' }
        - { id: error, label: 'It stops with a `KeyError`' }
      correct: [right]
    explanation: >-
      `"be"` appears twice, so its count is 2, and `counts.get("is", 0)` gives back the 0 it was
      handed, since `"is"` is not a key. Only `counts["is"]` would stop with a `KeyError`.

  - id: recall-split
    phase: recall
    kind: recall
    concept: E1.6/parsing-and-formatting
    prompt: >-
      The string `"the  cat"` has two spaces between its words. How many items does
      `"the  cat".split(" ")` give?
    answer: { type: number, value: 3, tolerance: { abs: 0 } }
    explanation: >-
      `split(" ")` cuts at each single space, so between the two spaces it finds an empty field:
      `['the', '', 'cat']`. `split()` with nothing in its brackets gives `['the', 'cat']`.

  - id: recall-seed
    phase: recall
    kind: recall
    concept: E1.9/properties
    prompt: Why does a property-based test call `random.seed(1)` before it makes its random inputs?
    answer:
      type: choice
      options:
        - { id: more, label: 'So that its inputs are more random than they would be without it' }
        - { id: right, label: 'So that every run makes the same inputs, and a failure can be made again' }
        - { id: different, label: 'So that no two of the inputs it makes are ever the same as each other' }
        - { id: small, label: 'So that the inputs it makes are small enough to read when a test fails' }
      correct: [right]
    explanation: >-
      A fixed seed makes the generator give the same sequence on every run, so an input that broke
      the property comes back the next time, to be looked at, fixed and checked. A different seed
      tries different inputs.

  - id: recall-shrink
    phase: recall
    kind: recall
    concept: E1.9/shrinking
    prompt: A property fails on a random list of 40 numbers. What does shrinking the list do?
    answer:
      type: choice
      options:
        - { id: sort, label: 'It sorts the list and rounds its numbers, so that the failure is easier to read' }
        - { id: fresh, label: 'It makes new random lists, each shorter than the last, until one of them passes' }
        - { id: halve, label: 'It keeps only the first half of the list for as long as the property passes on it' }
        - { id: right, label: 'It takes out one item at a time, keeping each removal while the property still fails' }
      correct: [right]
    explanation: >-
      A removal is kept only if the property still fails, so what is left still shows the bug, and
      once no single removal fails it is small, often two or three numbers that point at the cause.

  # Explore --------------------------------------------------------------------
  - id: explore-split
    phase: explore
    kind: predict
    concept: E1.12/tokenising
    title: Words by split
    prompt: What does the program print?
    answer: { type: number, value: 6, tolerance: { abs: 0 } }
    explanation: >-
      `split` cuts only at whitespace, so `'The'` and `'the'`, and `'cat'` and `'CAT'`, are
      different strings, and `'sat.'` and `'ran.'` keep their full stops: six different strings.
    review:
      variants:
        - prompt: What does `"Stop. stop!".split()` give?
          answer:
            type: choice
            options:
              - { id: lower, label: '`[''stop'', ''stop'']`' }
              - { id: right, label: '`[''Stop.'', ''stop!'']`' }
              - { id: letters, label: '`[''Stop'', ''stop'']`' }
              - { id: spaces, label: '`[''Stop.'', '' '', ''stop!'']`' }
            correct: [right]
          explanation: >-
            `split` cuts at the space and changes nothing else, so the capital, the full stop and the `!` stay:
            two different strings for one word said twice.
        - prompt: How many different strings are in `set("a A a. A".split())`?
          answer: { type: number, value: 3, tolerance: { abs: 0 } }
          explanation: >-
            The pieces are `'a'`, `'A'`, `'a.'` and `'A'`, and the set keeps one of each: `'a'`,
            `'A'` and `'a.'`.

  - id: explore-apostrophe
    phase: explore
    kind: predict
    concept: E1.12/tokenising
    title: An apostrophe
    prompt: What does `tokens("Don't panic!")` give?
    answer:
      type: choice
      options:
        - { id: kept, label: '`["Don''t", ''panic!'']`' }
        - { id: right, label: '`[''don'', ''t'', ''panic'']`' }
        - { id: whole, label: '`["don''t", ''panic'']`' }
        - { id: joined, label: '`[''dont'', ''panic'']`' }
      correct: [right]
    explanation: >-
      The apostrophe is not a letter, so it ends the word `don`, and `t` starts a new one. The `!`
      ends `panic`, and `lower` has made every letter small.
    placement: true
    review:
      variants:
        - prompt: >-
            With the Explore phase's tokeniser, which keeps only runs of letters, what does
            `tokens("It's 5 o'clock")` give?
          answer:
            type: choice
            options:
              - { id: right, label: '`[''it'', ''s'', ''o'', ''clock'']`' }
              - { id: whole, label: '`["it''s", ''5'', "o''clock"]`' }
              - { id: digits, label: '`[''it'', ''s'', ''5'', ''o'', ''clock'']`' }
              - { id: words, label: '`["it''s", "o''clock"]`' }
            correct: [right]
          explanation: >-
            Each apostrophe ends a word, and the 5 is not a letter, so it ends nothing and is
            dropped: four pieces, two of them not words at all.
        - prompt: When should a tokeniser keep an apostrophe as part of a word?
          answer:
            type: choice
            options:
              - { id: always, label: 'Always, since it is part of how many English words are spelt' }
              - { id: never, label: 'Never, since it is a punctuation mark, as a comma or a full stop is' }
              - { id: right, label: 'Only when a word character stands on each side of it, as in "don''t"' }
              - { id: end, label: 'Only at the end of a word, where it marks a plural, as in "rabbits''"' }
            correct: [right]
          explanation: >-
            Between two word characters it is part of the word, as in "don't" and "o'clock". At
            either end it is usually a quotation mark, as in `'Oh dear!'`, so the tool lets it end
            the word, and loses the apostrophe of "rabbits'".

  - id: explore-hindi
    phase: explore
    kind: predict
    concept: E1.12/tokenising
    title: A word in Hindi
    prompt: What does `tokens("नमस्ते")` give?
    answer:
      type: choice
      options:
        - { id: whole, label: '`[''नमस्ते'']`' }
        - { id: letters, label: '`[''नमसत'']`' }
        - { id: right, label: '`[''नमस'', ''त'']`' }
        - { id: none, label: '`[]`' }
      correct: [right]
    explanation: >-
      `isalpha` is `True` for the four letters न, म, स and त, but not for the sign ् or the vowel
      sign े. So the word is cut at ्, and the े after त is dropped, as the full stop of "sat." was.

  - id: explore-vocab
    phase: explore
    kind: predict
    concept: E1.12/word-frequencies
    title: How many different words
    prompt: >-
      *Alice* is 26,688 words. How many different words does it use, as
      `len(word_counts(tokens(text)))` counts them? Make your best guess: one within a factor of 2
      either way counts.
    answer: { type: number, value: 2630, tolerance: { factor: 2 } }
    explanation: >-
      `split` found 5,293 different strings, and the tokeniser merges many of them, as it merges
      "Alice", "Alice," and "Alice." into one word, so the answer is well under 5,293. Any guess
      from 1,315 to 5,260 counts: the point is the size, a few thousand words for a book of 26,688.

  - id: explore-sort
    phase: explore
    kind: predict
    concept: E1.12/word-frequencies
    title: Sorting with a key
    prompt: 'What does `sorted({"cat": 2, "bat": 2, "ant": 1, "dog": 3}.items(), key=by_count)` give?'
    answer:
      type: choice
      options:
        - { id: plain, label: '`[(''ant'', 1), (''bat'', 2), (''cat'', 2), (''dog'', 3)]`' }
        - { id: dict, label: '`[(''dog'', 3), (''cat'', 2), (''bat'', 2), (''ant'', 1)]`' }
        - { id: right, label: '`[(''dog'', 3), (''bat'', 2), (''cat'', 2), (''ant'', 1)]`' }
        - { id: rising, label: '`[(''ant'', 1), (''cat'', 2), (''bat'', 2), (''dog'', 3)]`' }
      correct: [right]
    explanation: >-
      `by_count` turns each pair into `(-count, word)`, and the pairs are sorted by those: `-3`
      comes first, then the two `-2`s, whose tie goes to `'bat'` before `'cat'`, and `-1` last,
      whatever order the dict holds them in. With no key, `sorted` would compare the pairs
      themselves, and so put them in alphabetical order of their words.
    review:
      variants:
        - prompt: 'What does `sorted({"x": 5, "y": 1, "z": 5}.items(), key=by_count)` give?'
          answer:
            type: choice
            options:
              - { id: dict, label: '`[(''z'', 5), (''x'', 5), (''y'', 1)]`' }
              - { id: right, label: '`[(''x'', 5), (''z'', 5), (''y'', 1)]`' }
              - { id: plain, label: '`[(''x'', 5), (''y'', 1), (''z'', 5)]`' }
              - { id: rising, label: '`[(''y'', 1), (''x'', 5), (''z'', 5)]`' }
            correct: [right]
          explanation: >-
            The keys are `(-5, 'x')`, `(-1, 'y')` and `(-5, 'z')`, so the two counts of 5 come
            first, `'x'` before `'z'`, and `'y'` last.
        - prompt: 'What is `by_count(("door", 6))`?'
          answer:
            type: choice
            options:
              - { id: same, label: '`(''door'', 6)`' }
              - { id: swapped, label: '`(6, ''door'')`' }
              - { id: right, label: '`(-6, ''door'')`' }
              - { id: count, label: '`-6`' }
            correct: [right]
          explanation: >-
            `word, count = pair` gives `word` the value `'door'` and `count` the value 6, and the
            function gives back the tuple `(-count, word)`, which is `(-6, 'door')`.

  - id: explore-zipf
    phase: explore
    kind: predict
    concept: E1.12/word-frequencies
    title: The hundredth word
    prompt: >-
      The commonest word of *Alice* appears 1,642 times, the 10th commonest 386 times and the 30th
      commonest 130 times. About how many times does the 100th commonest word appear? A guess within
      a factor of 1.5 either way counts.
    answer: { type: number, value: 48, tolerance: { factor: 1.5 } }
    explanation: >-
      The 100th is "never", with 48. From rank 10 to rank 30 the count falls to about a third as the
      rank triples, so ten times further down than rank 10 should give about a tenth: 386 ÷ 10,
      about 39, is a good guess. Dividing by the fall from rank 1 to rank 10, about 4, gives about
      90, too many: the commonest word is unusually common.
    placement: true
    review:
      variants:
        - prompt: >-
            In a long text the 20th commonest word appears 300 times. If the text follows Zipf's
            law, about how many times does the 60th commonest word appear?
          answer: { type: number, value: 100, tolerance: { rel: 0.15 } }
          explanation: >-
            Count times rank stays about the same: $20 \times 300 = 6{,}000$, so the 60th appears
            about $\frac{6{,}000}{60} = 100$ times.
        - prompt: What does Zipf's law say about the word at rank $r$ in a long text?
          answer:
            type: choice
            options:
              - { id: right, label: 'It appears about $\frac{C}{r}$ times, so count times rank stays about the same' }
              - { id: linear, label: 'It appears about $C - r$ times, so each rank falls by the same amount' }
              - { id: square, label: 'It appears about $\frac{C}{r^2}$ times, so the counts fall ever faster' }
              - { id: equal, label: 'Every word appears about as often as every other, once the text is long' }
            correct: [right]
          explanation: >-
            The word at rank $r$ appears about $\frac{C}{r}$ times, for a number $C$ that depends on
            the text: a few words make up much of it, and the counts fall away slowly through the
            long tail of rare words.

  - id: explore-once
    phase: explore
    kind: predict
    concept: E1.12/word-frequencies
    title: Words used once
    prompt: Of the 2,630 different words of *Alice*, about what share appear exactly once?
    answer:
      type: choice
      options:
        - { id: few, label: 'Under 5%' }
        - { id: some, label: 'About 15%' }
        - { id: right, label: 'About 40%' }
        - { id: most, label: 'About 75%' }
      correct: [right]
    explanation: >-
      1,143 of them, 43%. If count times rank stays near the 3,000 of "paw" at rank 1,000, every
      word past rank 1,500 appears fewer than 2 times, so once: about 1,130 of the 2,630.
    review:
      variants:
        - prompt: >-
            A long text follows Zipf's law and has 4,000 different words. About how many of them
            appear only once?
          answer: { type: number, value: 2000, tolerance: { rel: 0.25 } }
          explanation: >-
            About half of them, 2,000: the words at ranks from about $\frac{C}{2}$ to $C$ each
            appear once, where $C$, the rank of the last word, is about 4,000.
        - prompt: >-
            1,143 of the 2,630 different words of *Alice* appear only once. What does that mean for
            a tool that learns about words from their counts in the book?
          answer:
            type: choice
            options:
              - { id: drop, label: 'Little, since the words that appear once make up almost half of the text, and can be dropped' }
              - { id: longer, label: 'Little, since a book twice as long would show each of those words several times' }
              - { id: right, label: 'It has seen almost half the words it knows only once, and each new text brings words it has never seen' }
              - { id: typos, label: 'Little, since words that appear only once are mostly misprints, not real words' }
            correct: [right]
          explanation: >-
            One sighting is too little to learn much about a word, and a longer book does not cure
            it: it brings new rare words of its own. The words seen once are many different words but
            a small part of the text, 1,143 of its 26,688 words, about 4%.

  - id: explore-sentences
    phase: explore
    kind: predict
    concept: E1.12/tokenising
    title: Sentences by their punctuation
    prompt: |-
      What does this print?

      ```python
      text = "Mr. Brown paid 3.50 rupees. Was it worth it?!"
      count = 0
      for ch in text:
          if ch in ".!?":
              count = count + 1
      print(count)
      ```
    answer: { type: number, value: 5, tolerance: { abs: 0 } }
    explanation: >-
      It counts every `.`, `!` and `?`: the full stops of "Mr.", "3.50" and "rupees.", and both
      characters of "?!", five for two sentences. The full stops of "Mr." and "3.50" end nothing,
      and "?!" ends one sentence with two characters.

  - id: explore-said
    phase: explore
    kind: predict
    concept: E1.12/next-word-counts
    title: Guessing the word after "said"
    prompt: >-
      A tool reads *Alice* and always guesses "the" for the word after "said". What fraction of its
      guesses are right? A decimal or a fraction will do.
    answer: { type: number, value: 0.4545, tolerance: { abs: 0.01 } }
    explanation: >-
      "said" is followed by a word 462 times, and 210 of them are "the":
      $\frac{210}{462} \approx 0.45$.
    placement: true
    review:
      variants:
        - prompt: >-
            After "queen", *Alice* has "and" 7 times out of the 68 times that "queen" is followed by
            a word. What fraction of the time is the guess "and" right after "queen"?
          answer: { type: number, value: 0.103, tolerance: { abs: 0.005 } }
          explanation: $\frac{7}{68} \approx 0.10$, about one time in ten, though "and" is the commonest word after "queen".
        - prompt: >-
            A writer adds, again and again, the word that most often follows the last word it wrote,
            from a table of next-word counts. What happens?
          answer:
            type: choice
            options:
              - { id: new, label: 'It writes new sentences for ever, since the table holds so many pairs' }
              - { id: stops, label: 'It stops as soon as it reaches a word that it has written before' }
              - { id: book, label: 'It writes the book back word for word, since the counts came from it' }
              - { id: right, label: 'It falls into a loop once a word comes round, since each word fixes the next' }
            correct: [right]
          explanation: >-
            The next word depends only on the last one, and there are only so many words, so some
            word comes round again, and from there everything repeats. Drawing each next word at
            random, in proportion to the counts, avoids the loop.

  # Derive ---------------------------------------------------------------------
  - id: derive-loop
    phase: derive
    kind: proof
    concept: E1.12/next-word-counts
    title: Why the writer repeats
    prompt: >-
      The writer starts at a word $w_0$ and writes $w_1, w_2, \ldots$, each the commonest word after
      the one before, with ties broken by alphabetical order. The book has $V$ different words, and
      every word the writer reaches is followed by some word in the book, so it never stops. Here
      is a proof that it repeats a loop of at most $V$ words, which starts within its first $V$
      words. Each line follows from the lines above it. Choose the rule that justifies each line. A
      rule may be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: function, name: One word back, label: 'Each next word is fixed by the word before it alone, so equal words are followed by equal words.' }
        - { id: zipf, name: Zipf's law, label: 'The word at rank $r$ appears about $\frac{C}{r}$ times.' }
        - { id: induction, name: Induction, label: 'A statement about a whole number $k$ that holds for $k = 0$, and holds for $k + 1$ whenever it holds for $k$, holds for every whole number $k \ge 0$.' }
        - { id: vocabulary, name: Only V words, label: 'Every word the writer writes is one of the book''s $V$ different words.' }
        - { id: counting, name: Counting, label: 'The whole numbers from $a$ to $b$, for $a \le b$, number $b - a + 1$.' }
        - { id: pigeonhole, name: Pigeonholes, label: 'When more than $V$ things each have one of $V$ values, two of the things have the same value.' }
      start: '\text{The writer writes } w_0, w_1, w_2, \ldots'
      lines:
        - math: 'w_0, w_1, \ldots, w_V \text{ are } V + 1 \text{ words}'
          rule: counting
        - math: '\text{Each is one of } V \text{ different words}'
          rule: vocabulary
        - math: 'w_i = w_j \text{ for some } 0 \le i < j \le V'
          rule: pigeonhole
        - math: 'w_{i+1} = w_{j+1}'
          rule: function
        - math: 'w_{i+k} = w_{j+k} \text{ for every } k \ge 0'
          rule: induction
    explanation: >-
      $w_0$ to $w_V$ are $V + 1$ words (Counting), each one of the book's $V$ words (Only V
      words), so two of them are the same word, $w_i = w_j$ with $i < j$ (Pigeonholes). Equal words
      are followed by equal words, so $w_{i+1} = w_{j+1}$ (One word back), and in the same way,
      step by step, $w_{i+k} = w_{j+k}$ for every $k$ (Induction): from $w_i$ on, the writer repeats
      the $j - i$ words $w_i, \ldots, w_{j-1}$ for ever. Zipf's law is not needed.
    review:
      variants:
        - prompt: >-
            A writer that always adds the commonest next word works from a book with 500 different
            words. At most how many words long can its loop be?
          answer: { type: number, value: 500, tolerance: { abs: 0 } }
          explanation: >-
            Among $w_0, \ldots, w_{500}$, 501 words, two are equal, $w_i = w_j$ with
            $0 \le i < j \le 500$, and the loop is $j - i$ words long: at most 500.
        - prompt: >-
            A writer chooses each next word from the last two words it wrote, always the commonest
            after that pair, and every pair it reaches is followed by some word in the book. The
            book has 500 different words. Does it fall into a loop?
          answer:
            type: choice
            options:
              - { id: never, label: 'No: with two words to look back on, it can write for ever without one' }
              - { id: right, label: 'Yes: it can be at only $500^2$ pairs, and each pair fixes the next word' }
              - { id: same, label: 'Yes, within 500 words, since there are still only 500 words to write' }
              - { id: random, label: 'Only if some pair is never followed by anything in the book' }
            correct: [right]
          explanation: >-
            The writer's place is now the last two words, and each pair fixes the next word and so
            the next pair. There are at most $500^2 = 250{,}000$ pairs, so some pair comes round
            again and everything after it repeats, though the loop can be far longer than 500
            words.

  - id: derive-join
    phase: derive
    kind: step
    concept: E1.12/next-word-counts
    title: Pairs in two joined texts
    prompt: >-
      The text `a` has $n$ words and the text `b` has $m$ words, with $n$ and $m$ at least 1. How
      many neighbouring pairs of words does `a + " " + b` have, written with $n$ and $m$?
    answer:
      type: expression
      symbols:
        - { name: n, positive: true, integer: true }
        - { name: m, positive: true, integer: true }
      reference: n + m - 1
      lhs: '\text{pairs} ='
      accept: ['m + n - 1', '(n - 1) + (m - 1) + 1']
      reject:
        - 'n + m'
        - 'n + m - 2'
        - 'n*m'
        - 'n + m + 1'
    explanation: >-
      The joined text has $n + m$ words, since the space ends `a`'s last word, and every word but
      the last starts one pair: $n + m - 1$. Counted another way, `a` has $n - 1$ pairs, `b` has
      $m - 1$, and one more crosses the join.
    placement: true
    review:
      variants:
        - prompt: >-
            A text of 10 words is joined with a space to a text of 7 words. How many neighbouring
            pairs of words does the result have?
          answer: { type: number, value: 16, tolerance: { abs: 0 } }
          explanation: $10 + 7 = 17$ words make 16 neighbouring pairs, 9 from the first text, 6 from the second and 1 across the join.
        - prompt: >-
            Two texts are joined with a space. How do the next-word counts of the result compare with
            those of the two texts?
          answer:
            type: choice
            options:
              - { id: right, label: 'They are the two texts'' counts added up, and 1 more for the pair across the join' }
              - { id: sum, label: 'They are the two texts'' counts added up, with nothing more and nothing less' }
              - { id: less, label: 'They are the two texts'' counts added up, less 1 for the space between them' }
              - { id: longer, label: 'They are the counts of the longer text, since its pairs outnumber the rest' }
            correct: [right]
          explanation: >-
