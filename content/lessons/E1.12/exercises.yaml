        def by_count(pair):
            """Sort key: larger counts first, and equal counts in alphabetical order."""
            word, count = pair
            return (-count, word)


        def next_counts(words):
            """follows[a][b] is how many times the word b comes straight after the word a
            in the list words."""
            follows = {}
            for i in range(len(words) - 1):
                a = words[i]
                b = words[i + 1]
                if a not in follows:
                    follows[a] = {}
                follows[a][b] = follows[a].get(b, 0) + 1
            return follows


        def most_likely(follows, word):
            """The word that most often follows word, with ties going to the word first in
            alphabetical order, or None if nothing follows word."""
            if word not in follows:
                return None
            return sorted(follows[word].items(), key=by_count)[0][0]


        def generate(follows, start, n):
            """A list that starts with start and adds the most likely next word again and
            again, until it holds n words or its last word has nothing after it."""
            text = [start]
            while len(text) < n:
                word = most_likely(follows, text[-1])
                if word is None:
                    return text
                text.append(word)
            return text


