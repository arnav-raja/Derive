            """A full stop, ! or ? that is the last character of the text ends a sentence."""
            for text, expected in [("Hi!", 1), ("Is it?", 1), ("Alice.", 1), ("...", 1)]:
                got = count_sentences(text)
                assert got == expected, f"count_sentences({text!r}) is {got!r}, not {expected}."
