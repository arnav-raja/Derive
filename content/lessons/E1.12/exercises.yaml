  - id: derive-once
    phase: derive
    kind: step
    concept: E1.12/word-frequencies
    title: How many words appear once
    prompt: >-
      Take Zipf's law as exact: for an even whole number $C$, the word at rank $r$ appears
      $\frac{C}{r}$ times rounded down. The word at rank $C$ appears once, and none come after it,
      so there are $C$ different words. A word appears exactly once when
      $1 \le \frac{C}{r} < 2$. For how many ranks $r$ is that true, written with $C$? Since $C$ is
      even, write it without rounding.
    answer:
      type: expression
      symbols:
        - { name: C, positive: true }
      reference: C/2
      lhs: '\text{ranks} ='
      accept: ['C - C/2', '0.5*C']
      reject:
        - 'C'
        - 'C/3'
        - 'C/2 - 1'
        - 'C/2 + 1'
        - '2*C'
    explanation: >-
      $1 \le \frac{C}{r} < 2$ is $\frac{C}{2} < r \le C$: the ranks from $\frac{C}{2} + 1$ to $C$,
      and there are $C - \frac{C}{2} = \frac{C}{2}$ of them, half of the $C$ words.
    review:
      variants:
        - prompt: >-
            Take Zipf's law as exact: the word at rank $r$ appears $\frac{C}{r}$ times rounded
            down, and $C = 1{,}000$. How many words appear exactly twice?
          answer: { type: number, value: 167, tolerance: { abs: 0 } }
          explanation: >-
            Exactly twice needs $2 \le \frac{1{,}000}{r} < 3$, so $333.3 < r \le 500$: the ranks
            from 334 to 500, which are 167 of them, about a sixth.
        - prompt: >-
            Under Zipf's law taken as exact, the word at rank $r$ appears $\frac{C}{r}$ times rounded
            down, and there are $C$ different words. Which ranks hold the words that appear exactly
            once?
          answer:
            type: choice
            options:
              - { id: last, label: 'Only rank $C$, the last word, since every other word appears more often than it' }
              - { id: right, label: 'The ranks above $\frac{C}{2}$, up to $C$: half of all the different words' }
              - { id: tenth, label: 'The ranks above $\frac{9C}{10}$, up to $C$: the last tenth of the words' }
              - { id: none, label: 'None of them, since $\frac{C}{r}$ is a whole number only when $r$ divides $C$' }
            correct: [right]
          explanation: >-
            A word appears exactly once when $1 \le \frac{C}{r} < 2$, which is
            $\frac{C}{2} < r \le C$: every rank in the top half of the ranks, $\frac{C}{2}$ words.

