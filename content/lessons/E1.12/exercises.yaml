  - id: build-tokens
    phase: build
    kind: build
    concept: E1.12/tokenising
    title: A tokeniser for any script
    prompt: >-
      Rewrite `tokens(text)`, which is the Explore phase's tokeniser, so that it gives the words of
      any text in lower case: its runs of characters whose Unicode category begins with `L`, `M` or
      `N`. An apostrophe belongs to a word only when the character just before it and the character
      just after it are both of those kinds, as in "don't" and "o'clock"; anywhere else it ends a
      word, as other punctuation does. The tests try English with apostrophes and quotation marks,
      Hindi, Tamil, digits, and the edges: an empty text and a text of one word.
    answer:
      type: code
      starter: |
        import unicodedata


        def tokens(text):
            """The words of text, in lower case: its runs of letters, marks and digits,
            with an apostrophe kept only between two of them."""
            words = []
            word = ""
            for ch in text.lower():
                if ch.isalpha():
                    word = word + ch
                else:
                    if word != "":
                        words.append(word)
                    word = ""
            if word != "":
                words.append(word)
            return words


        print(tokens("'Don't panic,' said the Rabbit at five o'clock."))
        print(tokens("नमस्ते दुनिया, 2026"))
      tests: |
        def test_example():
            """The Explore phase's text gives its six words, with "the" and "cat" twice."""
            got = tokens("The cat sat. the CAT ran.")
            expected = ["the", "cat", "sat", "the", "cat", "ran"]
            assert got == expected, f"tokens('The cat sat. the CAT ran.') is {got!r}, not {expected!r}."

        def test_empty_and_one_word():
            """An empty text has no words, and a text of one word has just that word, in lower case."""
            for text, expected in [("", []), ("Alice", ["alice"]), ("x", ["x"]), ("  ", []), ("?!", [])]:
                got = tokens(text)
                assert got == expected, f"tokens({text!r}) is {got!r}, not {expected!r}."

        def test_apostrophe_inside():
            """An apostrophe between two letters stays in its word."""
            text = "Don't panic, it's five o'clock: rock'n'roll."
            got = tokens(text)
            expected = ["don't", "panic", "it's", "five", "o'clock", "rock'n'roll"]
            assert got == expected, f"tokens({text!r}) is {got!r}, not {expected!r}."

        def test_quotation_marks():
            """An apostrophe at the start or the end of a word is a quotation mark, and is left out."""
            cases = [
                ("'Oh dear!' said the Rabbit.", ["oh", "dear", "said", "the", "rabbit"]),
                ("the rabbits' ears", ["the", "rabbits", "ears"]),
                ("'tis", ["tis"]),
                ("a''b", ["a", "b"]),
                ("' '", []),
            ]
            for text, expected in cases:
                got = tokens(text)
                assert got == expected, f"tokens({text!r}) is {got!r}, not {expected!r}."

        def test_apostrophe_last():
            """An apostrophe that is the last character of the text is left out, without looking past the end."""
            for text, expected in [("it'", ["it"]), ("Said the Rabbit'", ["said", "the", "rabbit"]), ("don't'", ["don't"]), ("'", [])]:
                got = tokens(text)
                assert got == expected, f"tokens({text!r}) is {got!r}, not {expected!r}."

        def test_hindi():
            """A word of Hindi keeps its vowel signs and the sign that joins two consonants, which are marks."""
            for text, expected in [("नमस्ते", ["नमस्ते"]), ("नमस्ते दुनिया", ["नमस्ते", "दुनिया"]), ("मैं ठीक हूँ।", ["मैं", "ठीक", "हूँ"])]:
                got = tokens(text)
                assert got == expected, f"tokens({text!r}) is {got!r}, not {expected!r}."

        def test_tamil():
            """Words of Tamil, with their marks, are whole words."""
            text = "வணக்கம், தமிழ்"
            got = tokens(text)
            expected = ["வணக்கம்", "தமிழ்"]
            assert got == expected, f"tokens({text!r}) is {got!r}, not {expected!r}."

        def test_digits():
            """Digits, in any script, belong to words: an apostrophe between digits stays, and a full stop between digits ends a word."""
            for text, expected in [("Chapter 12", ["chapter", "12"]), ("3.50 rupees", ["3", "50", "rupees"]), ("२०२६ में", ["२०२६", "में"]), ("5'6 tall", ["5'6", "tall"])]:
                got = tokens(text)
                assert got == expected, f"tokens({text!r}) is {got!r}, not {expected!r}."

        def test_capitals():
            """Capital letters become small ones, accented ones too."""
            text = "ÉCOLE École école"
            got = tokens(text)
            expected = ["école", "école", "école"]
            assert got == expected, f"tokens({text!r}) is {got!r}, not {expected!r}."

        def test_separate_accent():
            """An accent typed as a mark after its letter, U+0301, stays in the word."""
            import unicodedata
            text = "cafe\u0301 au lait"
            got = tokens(text)
            nfc = [unicodedata.normalize("NFC", w) if isinstance(w, str) else w for w in got] if isinstance(got, list) else got
            assert nfc == ["caf\u00e9", "au", "lait"], f"tokens({text!r}) is {got!r}, not ['café', 'au', 'lait']: the accent, U+0301, is a mark and should stay in its word."
