      tests: |
        def test_example():
            """'It was late. She ran.' has 2 sentences."""
            got = count_sentences("It was late. She ran.")
            assert got == 2, f"count_sentences('It was late. She ran.') is {got!r}, not 2."

        def test_empty_and_one_word():
            """An empty text has no sentences, and nor has a text of one word with no full stop, ! or ? after it."""
            for text, expected in [("", 0), ("Alice", 0), ("no end", 0)]:
                got = count_sentences(text)
                assert got == expected, f"count_sentences({text!r}) is {got!r}, not {expected}."

        def test_not_followed_by_space():
            """A full stop, ! or ? followed by a letter, a digit or another of them ends nothing."""
            for text, expected in [("It cost 3.50 rupees.", 1), ("Wait... What?! No.", 3), ("e.g.", 1)]:
                got = count_sentences(text)
                assert got == expected, f"count_sentences({text!r}) is {got!r}, not {expected}."

        def test_quotation_mark():
            """A full stop, ! or ? followed by a closing quotation mark ends a sentence."""
            text = "'Oh dear! Oh dear! I shall be late!'"
            got = count_sentences(text)
            assert got == 3, f"count_sentences({text!r}) is {got!r}, not 3."

        def test_whitespace():
            """A full stop, ! or ? followed by a newline or a tab ends a sentence, as one followed by a space does."""
            for text, expected in [("One.\nTwo.", 2), ("One!\tTwo?", 2), ("One. \n Two.", 2)]:
                got = count_sentences(text)
                assert got == expected, f"count_sentences({text!r}) is {got!r}, not {expected}."

        def test_the_rule():
            """The rule counts the full stop of Mr. too, so the Explore phase's text gives 3."""
            text = "Mr. Brown paid 3.50 rupees. Was it worth it?!"
            got = count_sentences(text)
            assert got == 3, f"count_sentences({text!r}) is {got!r}, not 3, which is what the rule gives."

        def test_join():
            """The sentence counts of two texts joined with a space add up."""
            pairs = [("Hi.", "Yo."), ("It was late.", "She ran!"), ("", "No."), ("Wait", "what?"), ("'Run!'", "He ran."), ("3.", "50")]
            for a, b in pairs:
                both = count_sentences(a + " " + b)
                apart = count_sentences(a) + count_sentences(b)
                assert both == apart, f"count_sentences({a + ' ' + b!r}) is {both!r}, but count_sentences({a!r}) + count_sentences({b!r}) is {apart!r}: the counts of two texts joined with a space should add up."

