    title: Two ways to type é
    prompt: Predict what happens after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        import unicodedata

        words = ["café", "au", "lait", "cafe\u0301", "noir"]
        counts = {}
        for w in words:
            w = unicodedata.normalize("NFC", w)
            counts[w] = counts.get(w, 0) + 1
        print(counts["café"])
      broken: |
        import unicodedata

        words = ["café", "au", "lait", "cafe\u0301", "noir"]
        counts = {}
        for w in words:
            counts[w] = counts.get(w, 0) + 1
        print(counts["café"])
      change: The loop no longer puts each word in NFC before it counts it.
      options:
        - { id: same, label: 'It still prints `2`', when: "error is None and output.strip() == '2'" }
        - { id: one, label: 'It prints `1`', when: "error is None and output.strip() == '1'" }
        - { id: keyerror, label: 'Python stops with `KeyError`', when: "error is not None" }
    explanation: >-
      The word typed with é as one code point and the word typed with e and an accent are different
      strings, though they print alike, so without NFC the dict counts them under two keys, once
      each, and `counts["café"]` finds only the first: 1.

