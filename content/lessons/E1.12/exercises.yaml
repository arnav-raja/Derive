        def nonempty(follows):
            """The table without entries for words that nothing follows."""
            return {a: follows[a] for a in follows if follows[a] != {}}

        def test_counts_example():
            """For "the cat sat the cat ran", the table counts "cat" twice after "the"."""
            words = ["the", "cat", "sat", "the", "cat", "ran"]
            got = nonempty(next_counts(words))
            expected = {"the": {"cat": 2}, "cat": {"sat": 1, "ran": 1}, "sat": {"the": 1}}
            assert got == expected, f"next_counts({words!r}) is {got!r}, not {expected!r}."

        def test_counts_edges():
            """An empty list and a list of one word have no neighbouring pairs, so nothing follows anything."""
            for words in [[], ["alice"]]:
                got = nonempty(next_counts(list(words)))
                assert got == {}, f"next_counts({words!r}) is {got!r}, but with no neighbouring pairs nothing follows anything."

        def test_counts_add_up():
            """A list of n words has n - 1 neighbouring pairs, so the counts add up to n - 1."""
            for words in [["a", "b", "a", "b", "a"], ["x", "x", "x", "x"], ["the", "queen", "and", "the", "king"]]:
                follows = next_counts(list(words))
                total = 0
                for a in follows:
                    for b in follows[a]:
                        total = total + follows[a][b]
                assert total == len(words) - 1, f"The counts of next_counts({words!r}) add up to {total}, not {len(words) - 1}."

        def test_counts_join():
            """The table of two lists joined is the two tables added up, plus 1 for the pair where they meet."""
            xs = ["the", "cat", "sat"]
            ys = ["on", "the", "cat"]
            got = nonempty(next_counts(xs + ys))
            expected = {"the": {"cat": 2}, "cat": {"sat": 1}, "sat": {"on": 1}, "on": {"the": 1}}
            assert got == expected, f"next_counts({xs + ys!r}) is {got!r}, not {expected!r}: the pair (sat, on), where the lists meet, is counted once."

        def test_counts_leave_words():
            """next_counts leaves the list it is given as it was."""
            words = ["a", "b", "a"]
            next_counts(words)
            assert words == ["a", "b", "a"], f"After next_counts(words), words is {words!r}, not ['a', 'b', 'a']."

        def test_most_likely():
            """After "said", Alice's counts give "the", 210 times in 462."""
            follows = {"said": {"alice": 116, "the": 210, "to": 39, "nothing": 6}}
            got = most_likely(follows, "said")
            assert got == "the", f"most_likely(follows, 'said') is {got!r}, not 'the', which follows 'said' 210 times."

        def test_ties():
            """A tie goes to the word first in alphabetical order, wherever it is in the dict."""
            for counts, expected in [({"queen": 2, "king": 2, "cat": 1}, "king"), ({"his": 1, "her": 1}, "her"), ({"b": 3, "a": 1, "c": 3}, "b")]:
                got = most_likely({"w": counts}, "w")
                assert got == expected, f"With {counts!r} after w, most_likely gives {got!r}, not {expected!r}."

        def test_nothing_follows():
            """For a word that nothing follows, most_likely gives None."""
            for word in ["b", "zebra"]:
                got = most_likely({"a": {"b": 1}}, word)
                assert got is None, f"most_likely({{'a': {{'b': 1}}}}, {word!r}) is {got!r}, not None."

