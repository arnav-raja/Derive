        import unicodedata


        def in_word(ch):
            """True when ch is a letter, a mark or a digit, in any script."""
            return unicodedata.category(ch)[0] in "LMN"


        def tokens(text):
            """The words of text, in lower case: its runs of letters, marks and digits,
            with an apostrophe kept only between two of them."""
            words = []
            word = ""
            text = text.lower()
            for i in range(len(text)):
                ch = text[i]
                inner = ch == "'" and word != "" and i + 1 < len(text) and in_word(text[i + 1])
                if in_word(ch) or inner:
                    word = word + ch
                else:
                    if word != "":
                        words.append(word)
                    word = ""
            if word != "":
                words.append(word)
            return words


