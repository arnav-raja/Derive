  - id: explain-tool
    phase: explain
    kind: explain
    concept: E1.12/tokenising
    covers: [E1.12/word-frequencies, E1.12/next-word-counts]
    title: A text tool, simply
    prompt: >-
      Explain to your friend why `split` and a dict will miscount the chat's words, and what a
      tokeniser does instead, with an example; why a word in Hindi needs more than `isalpha`; and
      why the same word typed on two devices can count as two words, and what mends that. Then
      explain what their counts will look like by Zipf's law, and why about half the different
      words will appear only once. Then explain what the writer will do and why, what to do
      instead, and why a table of word pairs knows so little. Last, suggest tests for the
      tokeniser: some examples, and one property.
    answer:
      type: text
      rubric:
        - { id: split, criterion: 'Says why `split` and a dict miscount: `split` cuts only at whitespace, so capitals and punctuation make one word several keys, with an example, and that a tokeniser lowers the case and keeps only runs of the characters that can be part of a word.' }
        - { id: scripts, criterion: 'Says that Hindi''s vowel signs and the sign that joins consonants are marks, not letters, so `isalpha` cuts words at them, and a tokeniser keeps characters whose Unicode category begins with L, M or N; and that one word can be typed as different code points, such as é as one character or as e and an accent, which putting the text in NFC first mends.' }
        - { id: zipf, criterion: 'Says that by Zipf''s law count times rank stays roughly the same, so a few words make up much of the chat, and why about half the different words appear once: if the word at rank r appears C/r times, the ranks from about C/2 to C each appear once.' }
        - { id: loop, criterion: 'Says that always adding the likeliest next word falls into a loop, since each next word depends only on the word before it and among a limited number of words some word must come round again, and that drawing each next word at random in proportion to the counts avoids the loop.' }
        - { id: sparse, criterion: 'Says why a table of word pairs knows so little: a text has about as many neighbouring pairs as words, far fewer than the square of the number of different words, so most possible pairs never appear and the table can say nothing about them.' }
        - { id: tests, criterion: 'Suggests examples that say exactly which words are right, such as an empty text, one word, a word with an apostrophe and a word in Hindi, and a property, such as that the words of two texts joined with a space are the words of the first followed by the words of the second.' }
      reference: >-
        `split` cuts only at whitespace and changes nothing else, so it keeps capitals and
        punctuation, and the dict counts "Haan", "haan" and "haan!" as three different words. A
        tokeniser lowers the case and keeps only the runs of characters that can be part of a word,
        so all three become "haan", with an apostrophe kept only between two such characters, as in
        "don't". `isalpha` is not enough for Hindi. In नमस्ते, the sign ् that joins two consonants
        and the vowel sign े are marks, not letters, so a tokeniser built on `isalpha` cuts the word
        in two and drops a piece. Unicode gives every character a category, and the tokeniser should
        keep each character whose category begins with L, M or N: a letter, a mark or a digit. The
        same word typed on two devices can still count twice, because Unicode allows more than one
        way to type it: é can arrive as one code point from one keyboard and as an e followed by an
        accent from another program.
        They look the same but are different strings, so the dict keeps two keys. Putting the whole
        text in one form first, with `unicodedata.normalize("NFC", text)`, mends it. The counts will
        be very uneven. By Zipf's law the word at rank r appears about C/r times, so count times rank
        stays roughly the same: the 100th commonest word appears about a tenth as often as the
        10th, 48 times against 386 in *Alice*. A handful of words will make up much of the chat, followed by a long tail of rare
        ones. If the law were exact, the words at ranks from C/2 to C would each appear once, which
        is half of the C different words; in Alice it is 43%. The writer will soon repeat itself,
        such as "the queen and the queen and" for ever. Each next word depends only on the word
        before it, and there are only V different words, so within V + 1 words some word comes round
        again, and from there everything repeats. Instead, draw each next word at random, in
        proportion to its count, with `random.choices`. Even then the table knows little: a chat of
        50,000 words has under 50,000 neighbouring pairs, but with 5,000 different words there are
        25 million possible pairs, so at most 0.2% of them can ever be seen, and the table can say
        nothing about the rest. For tests, start with examples that say exactly what is right: an
        empty text gives no words, "Hi" gives ["hi"], "Don't panic!" gives ["don't", "panic"], and
        नमस्ते gives one word, not two. Then a property: for any two texts a and b, the words of
        a + " " + b are the words of a followed by the words of b. Check it on thousands of random
        texts made of Latin and Devanagari letters, marks, apostrophes and spaces, and shrink any
        failure to a small case.
      minWords: 120
      maxWords: 600
    explanation: >-
      A strong answer says that `split` keeps capitals and punctuation, so one word becomes several
      keys, and that a tokeniser lowers the case and keeps runs of word characters; that Hindi's
      vowel signs and joining sign are marks, so a tokeniser keeps categories L, M and N rather than
      only what `isalpha` accepts, and that NFC puts a word typed as different code points in one
      form; that by Zipf's law count times rank stays about the same, and about half the different
      words appear once; that always taking the likeliest next word loops, since each word fixes
      the next and some word must come round again, while drawing in proportion to the counts does
      not; that most possible pairs never appear; and that tests need exact examples and a property
      such as the join.
