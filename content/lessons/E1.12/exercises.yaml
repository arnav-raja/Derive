            """For up to trials trials, makes a with make() and then b with make(). Gives
            the first pair that breaks the property, shrunk, or None if none does."""
            for t in range(trials):
                a = make()
                b = make()
                if not joins_right(tokenise, a, b):
                    return shrink_pair(tokenise, a, b)
            return None


