        import random

        ALPHABET = ["a", "b", "न", "ि", "'", " ", ".", "5"]


        def random_text():
            """A text of 0 to 8 characters, each chosen at random from ALPHABET."""
            text = ""
            for k in range(random.randint(0, 8)):
                text = text + random.choice(ALPHABET)
            return text


        def tokens(text):
            """The Explore phase's tokeniser, which keeps only what isalpha calls a letter."""
            words = []
            word = ""
            for ch in text.lower():
                if ch.isalpha():
                    word = word + ch
                else:
                    if word != "":
                        words.append(word)
                    word = ""
            if word != "":
                words.append(word)
            return words


        def forgets_last(text):
            """The same tokeniser without its last if."""
            words = []
            word = ""
            for ch in text.lower():
                if ch.isalpha():
                    word = word + ch
                else:
                    if word != "":
                        words.append(word)
                    word = ""
            return words


        def joins_right(tokenise, a, b):
            """True when tokenise gives the words of a + " " + b as the words of a
            followed by the words of b."""
