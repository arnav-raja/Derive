        import random


        def _cut(text, start, keep_last, look_back, keep_quotes):
            """The Explore phase's tokeniser, with switches that put bugs into it."""
            words = []
            word = ""
            text = text.lower()
            for i in range(start, len(text)):
                ch = text[i]
                quote = ch == "'" and keep_quotes
                if look_back and ch == "'" and text[i - 1].isalpha() and i + 1 < len(text) and text[i + 1].isalpha():
                    quote = True
                if ch.isalpha() or quote:
                    word = word + ch
                else:
                    if word != "":
                        words.append(word)
                    word = ""
            if keep_last and word != "":
                words.append(word)
            return words

        def letters_only(text):
            """The Explore phase's tokeniser, which keeps only what isalpha calls a letter."""
            return _cut(text, 0, True, False, False)

        def keeps_quotes(text):
            """Keeps every apostrophe as part of a word, quotation marks too."""
            return _cut(text, 0, True, False, True)

        def drops_last(text):
            """Loses the last word of a text that ends inside a word."""
            return _cut(text, 0, False, False, False)

        def skips_first(text):
            """Never looks at the first character of the text."""
            return _cut(text, 1, True, False, False)

        def looks_back(text):
            """Keeps an apostrophe between two letters, looking at text[i - 1], which at i = 0 is the last character of the text."""
            return _cut(text, 0, True, True, False)

        def maker(texts):
            """A stand-in for make that gives the texts in turn, and the list of those it has given."""
            given = []
            def make():
                given.append(texts[len(given)])
                return given[-1]
            return make, given

        def test_holds():
            """joins_right is True for pairs whose words join right."""
            for tokenise, a, b in [(letters_only, "The cat", "sat."), (letters_only, "", ""), (keeps_quotes, "a'", "'b"), (drops_last, "ab ", "c")]:
                got = joins_right(tokenise, a, b)
                assert got is True, f"joins_right({tokenise.__name__}, {a!r}, {b!r}) is {got!r}, not True: {tokenise.__name__}({a + ' ' + b!r}) is {tokenise(a + ' ' + b)!r}, and {tokenise.__name__}({a!r}) + {tokenise.__name__}({b!r}) is {tokenise(a) + tokenise(b)!r}."

        def test_breaks():
            """joins_right is False when the join loses a word or changes one."""
            for tokenise, a, b in [(drops_last, "ab", "c"), (skips_first, "", "a"), (looks_back, "", "'a")]:
                got = joins_right(tokenise, a, b)
                assert got is False, f"joins_right({tokenise.__name__}, {a!r}, {b!r}) is {got!r}, not False: {tokenise.__name__}({a + ' ' + b!r}) is {tokenise(a + ' ' + b)!r}, but {tokenise.__name__}({a!r}) + {tokenise.__name__}({b!r}) is {tokenise(a) + tokenise(b)!r}."

        def test_asks_for_the_joined_text():
            """joins_right asks the tokeniser it is given for the words of a + ' ' + b, of a and of b."""
            asked = []
            def spy(text):
                asked.append(text)
                return letters_only(text)
            joins_right(spy, "ab", "cd")
            for text in ["ab cd", "ab", "cd"]:
                assert text in asked, f"joins_right(tokenise, 'ab', 'cd') never asked tokenise for the words of {text!r}; it asked for {asked!r}."

        def test_shrink_a():
            """For a tokeniser that loses a word at the end, ('ab cd', 'ef') shrinks to ('d', ''): a first, then b."""
            got = shrink_pair(drops_last, "ab cd", "ef")
            assert got == ("d", ""), f"shrink_pair(drops_last, 'ab cd', 'ef') is {got!r}, not ('d', ''). Take the characters of a out from the first: when a removal is kept, the next character moves into its place, so try that place again, and move on only when the removal mends the property."

        def test_shrink_b():
            """For a tokeniser that skips the first character, ('xy', 'ab') shrinks to ('', 'b')."""
            got = shrink_pair(skips_first, "xy", "ab")
            assert got == ("", "b"), f"shrink_pair(skips_first, 'xy', 'ab') is {got!r}, not ('', 'b')."

        def test_shrink_apostrophe():
            """For a tokeniser that looks back past the start, ('x', "'ab") shrinks to ('', "'b")."""
            got = shrink_pair(looks_back, "x", "'ab")
            assert got == ("", "'b"), f"shrink_pair(looks_back, 'x', \"'ab\") is {got!r}, not ('', \"'b\")."

        def test_shrink_small_pair():
            """A pair that is already as small as it can be stays as it is."""
            got = shrink_pair(drops_last, "a", "")
            assert got == ("a", ""), f"shrink_pair(drops_last, 'a', '') is {got!r}, not ('a', '')."

        def test_first_pair():
            """find_bug gives the first pair that breaks the property, shrunk, after making just the texts up to it, a and then b."""
            make, given = maker(["ab ", "c", "d", "e f", "g", "h"])
            got = find_bug(drops_last, make, 3)
            assert got == ("d", ""), f"With the texts 'ab ', 'c', 'd', 'e f' and so on, find_bug(drops_last, make, 3) is {got!r}, not ('d', ''): the first pair is ('ab ', 'c'), which keeps the property, and the second, ('d', 'e f'), breaks it and shrinks to ('d', '')."
            assert given == ["ab ", "c", "d", "e f"], f"find_bug made the texts {given!r}, not just ['ab ', 'c', 'd', 'e f']: it should stop at the first pair that breaks the property."

        def test_none():
            """find_bug gives None when every pair keeps the property, after making 2 texts for each trial."""
            make, given = maker(["a b", "c", "न", "", "it's", "x.y"] * 20)
            got = find_bug(letters_only, make, 50)
            assert got is None, f"find_bug(letters_only, make, 50) is {got!r}, not None, though every pair keeps the property."
            assert len(given) == 100, f"find_bug made {len(given)} texts in 50 trials, not 100."

        def test_random_texts():
            """With random texts, it gives None for two wrong tokenisers that keep the property, and a pair for three that break it."""
            for tokenise in [letters_only, keeps_quotes]:
                random.seed(5)
                got = find_bug(tokenise, random_text, 300)
                assert got is None, f"find_bug({tokenise.__name__}, random_text, 300) is {got!r}, not None."
            for tokenise in [drops_last, skips_first, looks_back]:
                for seed in [1, 2, 3]:
                    random.seed(seed)
                    got = find_bug(tokenise, random_text, 300)
                    assert got is not None, f"With random.seed({seed}), find_bug({tokenise.__name__}, random_text, 300) is None, but {tokenise.__name__} breaks the property."
                    a, b = got
                    assert not joins_right(tokenise, a, b), f"With random.seed({seed}), find_bug({tokenise.__name__}, random_text, 300) gives {got!r}, which keeps the property."
                    for k in range(len(a)):
                        assert joins_right(tokenise, a[:k] + a[k + 1:], b), f"With random.seed({seed}), find_bug({tokenise.__name__}, random_text, 300) gives {got!r}, but taking character {k} out of a still breaks the property, so the pair is not shrunk."
                    for k in range(len(b)):
                        assert joins_right(tokenise, a, b[:k] + b[k + 1:]), f"With random.seed({seed}), find_bug({tokenise.__name__}, random_text, 300) gives {got!r}, but taking character {k} out of b still breaks the property, so the pair is not shrunk."
