    title: A property-based test for tokenisers
    prompt: >-
      Write the three parts of a property-based test for tokenisers. `joins_right(tokenise, a, b)`
      is `True` when the tokeniser `tokenise` gives the words of `a + " " + b` as the words of `a`
      followed by the words of `b`. `shrink_pair(tokenise, a, b)`, for a pair that breaks the
      property, works on `a` first, as E1.9's `shrink` did: it tries taking out the character at
      position 0, and while the pair still breaks the property without it, it keeps the removal and
      tries position 0 again; when a removal mends the property, it puts the character back and
      moves on to the next position. Then it does the same for `b`, and gives the pair `(a, b)`
      that is left. `find_bug(tokenise,
      make, trials)` makes up to `trials` pairs, calling `make()` for `a` and then for `b`, and
      gives the first pair that breaks the property, shrunk, at once, or `None` if none does.
