        def count_sentences(text):
            """How many sentences text has: the number of times a ., ! or ? is followed
            by whitespace or a closing quotation mark ', or ends the text."""
            count = 0
            for i in range(len(text) - 1):
                if text[i] in ".!?" and (text[i + 1].isspace() or text[i + 1] == "'"):
                    count = count + 1
            return count


