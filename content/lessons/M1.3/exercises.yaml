  - id: build-rounded-thermometer
    phase: build
    kind: breakit
    concept: M1.3/injective-surjective
    title: A thermometer that rounds
    prompt: Predict what `back` will be after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        def to_fahrenheit(c):
            return 1.8 * c + 32

        def to_celsius(f):
            return (f - 32) / 1.8

        back = to_celsius(to_fahrenheit(37))
        print(back)
      broken: |
        def to_fahrenheit(c):
            return round(1.8 * c + 32)

        def to_celsius(f):
            return (f - 32) / 1.8

        back = to_celsius(to_fahrenheit(37))
        print(back)
      change: >-
        `to_fahrenheit` now rounds its answer to the nearest whole degree, as a cheap thermometer does.
      options:
        - { id: same, label: '`back` is still 37', when: 'abs(back - 37) < 1e-9' }
        - { id: near, label: '`back` is near 37, but not 37', when: '1e-9 <= abs(back - 37) < 1' }
        - { id: far, label: '`back` is a degree or more away from 37', when: 'abs(back - 37) >= 1' }
        - { id: error, label: 'Python stops with an error', when: 'error is not None' }
    explanation: >-
      `to_fahrenheit(37)` is 98.6, which now rounds to 99, and `to_celsius(99)` is $67 \div 1.8$, about
      37.22. Every temperature from about 36.95 °C up to 37.5 °C now reads 99 °F, so the rounded rule
      is not one-to-one, and `to_celsius` cannot know which of them you started with.

  - id: build-sympy-inverse
    phase: build
    kind: build
    concept: M1.3/inverse-functions
    covers: [M1.3/injective-surjective]
    title: Inverses by machine
    prompt: >-
      Replace each `None` with a call of `solve`, as in the example line, so that `celsius` holds the
      rule solved for `c` and `roots` holds the square solved for `x`.
    answer:
      type: code
      starter: |
        from sympy import symbols, Eq, Rational, solve

        c, f, x, y = symbols("c f x y")

        # Eq(left, right) is an equation. Rational(9, 5) is the exact
        # fraction 9/5, where the decimal 1.8 would be stored rounded.
        rule = Eq(f, Rational(9, 5)*c + 32)
        square = Eq(y, x**2)

        example = solve(Eq(3*x + 2, 17), x)
        print("example:", example)

        celsius = None   # the rule, solved for c
        roots = None     # the square, solved for x

        print("celsius:", celsius)
        print("roots:", roots)
      tests: |
        from sympy import simplify

        def test_celsius():
            """celsius is the list of solutions of the rule, solved for c."""
            assert celsius is not None, "Replace None with a call of solve."
            assert isinstance(celsius, list) and len(celsius) == 1, f"celsius is {celsius}, not a list of one formula for c."
            back = celsius[0]
            assert back.subs(f, 212) == 100 and back.subs(f, 32) == 0, f"{back} does not turn 212 into 100 and 32 into 0."

        def test_roots():
            """roots is the list of solutions of the square, solved for x."""
            assert roots is not None, "Replace None with a call of solve."
            assert isinstance(roots, list) and len(roots) == 2, f"roots is {roots}, not a list of two solutions for x."
            for r in roots:
                assert simplify(r**2 - y) == 0, f"{r} squared is not y."
      reference: |
        from sympy import symbols, Eq, Rational, solve

        c, f, x, y = symbols("c f x y")

        rule = Eq(f, Rational(9, 5)*c + 32)
        square = Eq(y, x**2)

        example = solve(Eq(3*x + 2, 17), x)
        print("example:", example)

        celsius = solve(rule, c)
        roots = solve(square, x)

        print("celsius:", celsius)
        print("roots:", roots)
      wrong:
        - code: |
            from sympy import symbols, Eq, Rational, solve

            c, f, x, y = symbols("c f x y")

            rule = Eq(f, Rational(9, 5)*c + 32)
            square = Eq(y, x**2)

            example = solve(Eq(3*x + 2, 17), x)
            print("example:", example)

            celsius = solve(rule, f)
            roots = solve(square, x)

            print("celsius:", celsius)
            print("roots:", roots)
          why: Solves the rule for f instead of c, which only gives back the rule itself.
        - code: |
