exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-round-trip
    phase: puzzle
    kind: predict
    concept: M1.3/inverse-functions
    title: The trip the other way
    prompt: >-
      Now go the other way. Start from any list of ids, decode it into text, then encode that text.
      Do you always get back the list you started with?
    answer:
      type: choice
      options:
        - { id: always, label: 'Yes, for every list' }
        - { id: single, label: 'Only for lists of a single id' }
        - { id: not-always, label: 'No, not for every list' }
        - { id: never, label: 'No, never' }
      correct: [not-always]
    explanation: >-
      Some lists come back and some do not. [1, 0] decodes to `ba`, which encodes to [1, 0] again. But
      [0, 1] decodes to `ab`, and the encoder reads `ab` as the single piece [2].

  # Recall ---------------------------------------------------------------------
  - id: recall-solve
    phase: recall
    kind: recall
    concept: M1.2/solving-equations
    prompt: Solve $3x + 2 = 17$. What is $x$?
    answer: { type: number, value: 5 }
    explanation: >-
      Subtract 2 from both sides, then divide both sides by 3: $3x = 15$, so $x = 5$.

  - id: recall-evaluate
    phase: recall
    kind: recall
    concept: M1.2/expression-trees
    prompt: What is $2x^2 - 1$ when $x = -3$?
    answer: { type: number, value: 17 }
    explanation: >-
      The square comes first and applies to all of $-3$: $(-3)^2 = 9$. Then $2 \times 9 = 18$, and
      $18 - 1 = 17$.

  - id: recall-convert
    phase: recall
    kind: recall
    concept: M1.2/expression-trees
    prompt: >-
      A temperature of $C$ degrees Celsius is $F = 1.8C + 32$ degrees Fahrenheit. What is 25 °C in
      Fahrenheit?
    answer: { type: number, value: 77, unit: °F }
    explanation: >-
      $1.8 \times 25 = 45$, and $45 + 32 = 77$.

  - id: recall-squares
    phase: recall
    kind: recall
    concept: M1.2/field-axioms
    prompt: Which numbers have a square of 16?
    answer:
      type: choice
      options:
        - { id: only-four, label: 'Only 4' }
        - { id: both, label: '4 and $-4$' }
        - { id: eights, label: '8 and $-8$' }
        - { id: only-minus, label: 'Only $-4$' }
      correct: [both]
    explanation: >-
      $4^2 = 16$, and $(-4)^2 = 16$ as well, because a negative times a negative is positive.

  # Explore --------------------------------------------------------------------
  - id: explore-reverse-arrows
    phase: explore
    kind: predict
    concept: M1.3/function-as-mapping
    title: Turning the arrows round
    prompt: >-
      Turn every arrow round, so that each one points from a month to a person. Is the new rule a
      function, giving each month exactly one output?
    answer:
      type: choice
      options:
        - { id: always, label: 'Yes: turning the arrows round always gives a function' }
        - { id: shared, label: 'No: March would point to two people' }
        - { id: months, label: 'No: a month cannot be the input of a function' }
        - { id: reached, label: 'Yes: every month has at least one arrow' }
      correct: [shared]
    explanation: >-
      Two arrows arrive at March, from Asha and from Chen. Turned round, they become two arrows
      leaving March, so March would have two outputs, and a function allows exactly one.
    review:
      variants:
        - prompt: >-
            In a class of 30, each roll number from 1 to 30 belongs to exactly one student. Is the
            rule that takes a roll number to its student a function?
          answer:
            type: choice
            options:
              - { id: one-each, label: 'Yes: each roll number gives exactly one student' }
              - { id: not-number, label: 'No: a student is not a number, so cannot be an output' }
              - { id: both-ways, label: 'Only if each student also has exactly one roll number' }
            correct: [one-each]
          explanation: >-
            Every input, a roll number, has exactly one output, a student, and that is all a function
            needs. The outputs need not be numbers, and nothing is asked of the rule run backwards.
        - prompt: Which of these rules on the whole numbers 0, 1, 2, 3 and so on is a function?
          answer:
            type: choice
            options:
              - { id: bigger, label: 'Each number goes to every number bigger than it' }
              - { id: factors, label: 'Each number goes to each of its factors' }
              - { id: plus-one, label: 'Each number goes to the number one more than it' }
            correct: [plus-one]
          explanation: >-
            Adding one gives exactly one output for each input. The other two give many outputs for
            most inputs: 6, for example, has the factors 1, 2, 3 and 6.
        - prompt: For the function $f(x) = 3x - 1$, what is $f(4)$?
          answer: { type: number, value: 11 }
          explanation: >-
            Put 4 in place of $x$: $3 \times 4 - 1 = 11$.

  - id: explore-square-undo
    phase: explore
    kind: predict
    concept: M1.3/injective-surjective
    title: Running a square backwards
    prompt: The function $f(x) = x^2$ gives the output 9. What was its input?
    answer:
      type: choice
      options:
        - { id: three, label: '3' }
        - { id: minus-three, label: '$-3$' }
        - { id: none, label: 'No input gives 9' }
        - { id: either, label: 'Either 3 or $-3$' }
      correct: [either]
    explanation: >-
      Both $3^2$ and $(-3)^2$ are 9. Two inputs share the output 9, so the output alone cannot tell
      you which one went in.
    placement: true
    review:
      variants:
        - prompt: >-
            The function $f(x) = 2x$ doubles a number. Can two different inputs give the same output?
          answer:
            type: choice
            options:
              - { id: negatives, label: 'Yes: $x$ and $-x$ always do' }
              - { id: never, label: 'No, never' }
              - { id: zero, label: 'Only when one of them is 0' }
            correct: [never]
          explanation: >-
            If $2a = 2b$, dividing both sides by 2 gives $a = b$. Different inputs always give
            different doubles, so doubling is one-to-one.
        - prompt: >-
            A rule sends 1 to 5, 2 to 7 and 3 to 5. Its possible outputs are 5, 7 and 9. Which is
            true?
          answer:
            type: choice
            options:
              - { id: injective-only, label: 'It is one-to-one, but not onto' }
              - { id: surjective-only, label: 'It is onto, but not one-to-one' }
              - { id: both, label: 'It is both one-to-one and onto' }
              - { id: neither, label: 'It is neither one-to-one nor onto' }
            correct: [neither]
          explanation: >-
            1 and 3 share the output 5, so it is not one-to-one, and nothing reaches 9, so it is not
            onto.
        - prompt: Which of these rules on all numbers can be undone, whatever the input?
          answer:
            type: choice
            options:
              - { id: square, label: 'Squaring' }
              - { id: size, label: 'Taking the size of a number, ignoring its sign' }
              - { id: cube, label: 'Cubing' }
              - { id: zero, label: 'Multiplying by 0' }
            correct: [cube]
          explanation: >-
            Cubing keeps the sign, $2^3 = 8$ while $(-2)^3 = -8$, so no two numbers share a cube, and
            the cube root undoes it. Squaring and taking the size both send $x$ and $-x$ to the same
            output, and multiplying by 0 sends every number to 0.

  - id: explore-compose-order
    phase: explore
    kind: predict
    concept: M1.3/composition
    title: One rule after another
    prompt: >-
      Take $f(x) = x + 3$ and $g(x) = 2x$. Start with 1, apply $f$, then apply $g$ to what $f$ gives.
      This is written $g\big(f(1)\big)$, and the inner bracket is worked out first. What number comes
      out?
    answer: { type: number, value: 8 }
    explanation: >-
      $f(1) = 1 + 3 = 4$, and then $g(4) = 2 \times 4 = 8$.

  - id: explore-compose-swap
    phase: explore
    kind: predict
    concept: M1.3/composition
    title: Swapping the order
    prompt: >-
      With the same $f(x) = x + 3$ and $g(x) = 2x$, for which numbers $x$ is $g\big(f(x)\big)$ equal
      to $f\big(g(x)\big)$?
    answer:
      type: choice
      options:
        - { id: every, label: 'For every $x$' }
        - { id: zero, label: 'Only for $x = 0$' }
        - { id: none, label: 'For no $x$' }
        - { id: some, label: 'For a few values of $x$' }
      correct: [none]
    explanation: >-
      $g\big(f(x)\big) = 2(x + 3) = 2x + 6$, while $f\big(g(x)\big) = 2x + 3$. The first is always 3
      more than the second, so they are never equal.

  - id: explore-undo-order
    phase: explore
    kind: predict
    concept: M1.3/inverse-functions
    title: Undoing a chain
    prompt: >-
      To turn Celsius into Fahrenheit, multiply by 1.8, then add 32. To turn a Fahrenheit reading
      back into Celsius, what do you do first?
    answer:
      type: choice
      options:
        - { id: subtract, label: 'Subtract 32' }
        - { id: divide, label: 'Divide by 1.8' }
        - { id: add, label: 'Add 32' }
        - { id: multiply, label: 'Multiply by 1.8' }
      correct: [subtract]
    explanation: >-
      The last step done is the first undone. Adding 32 came last, so subtract 32 first, and then
      divide by 1.8.

  - id: explore-onto
    phase: explore
    kind: predict
    concept: M1.3/injective-surjective
    title: A list no text makes
    prompt: >-
      Is there any text, written with the letters `a` and `b`, that the encoder turns into exactly the
      list [0, 1]?
    answer:
      type: choice
      options:
        - { id: ab, label: 'Yes: `ab`' }
        - { id: aab, label: 'Yes: `aab`' }
        - { id: longer, label: 'Yes, but only a longer text, such as `abab`' }
        - { id: none, label: 'No: no text does' }
      correct: [none]
    explanation: >-
      If some text encoded to [0, 1], decoding [0, 1] would give that text back, so it would have to
      be `ab`. But `ab` encodes to [2]. So no text encodes to [0, 1].

  # Derive ---------------------------------------------------------------------
  - id: derive-compose-formula
    phase: derive
    kind: step
    concept: M1.3/composition
    title: Composition as a formula
    prompt: Take $f(x) = x - 4$ and $g(x) = x^2$. Write $g\big(f(x)\big)$ as a formula in $x$.
    answer:
      type: expression
      symbols:
        - { name: x }
      lhs: 'g\big(f(x)\big) ='
      reference: (x - 4)**2
      accept: ['(x - 4)^2', 'x^2 - 8*x + 16', '(4 - x)^2', '(x - 4)*(x - 4)']
      reject: ['x^2 - 4', 'x - 4', 'x^2 - 16', 'x^2 + 16', '(x + 4)^2', 'x^2', '(x - 4)*2']
    explanation: >-
      $g$ squares whatever it is given, and here it is given $f(x) = x - 4$. So
      $g\big(f(x)\big) = (x - 4)^2$, which multiplies out to $x^2 - 8x + 16$.
    placement: true
    review:
      variants:
        - prompt: With $f(x) = 10x$ and $g(x) = x + 1$, write $f\big(g(x)\big)$ as a formula in $x$.
          answer:
            type: expression
            symbols:
              - { name: x }
            lhs: 'f\big(g(x)\big) ='
            reference: 10*x + 10
            accept: ['10*(x + 1)', '10 + 10*x']
            reject: ['10*x + 1', '11*x', 'x + 10', '10*x']
          explanation: >-
            $f$ multiplies its whole input by 10, and its input is $x + 1$, so
            $f\big(g(x)\big) = 10(x + 1) = 10x + 10$.
        - prompt: With $f(x) = x + 5$ and $g(x) = 3x$, what is $g\big(f(1)\big)$?
          answer: { type: number, value: 18 }
          explanation: >-
            $f(1) = 6$, and then $g(6) = 18$.
        - prompt: With $f(x) = x^2$ and $g(x) = x + 1$, which formula is $g\big(f(x)\big)$?
          answer:
            type: choice
            options:
              - { id: plus-one-after, label: '$x^2 + 1$' }
              - { id: square-after, label: '$(x + 1)^2$' }
              - { id: mixed, label: '$x^2 + x$' }
              - { id: doubled, label: '$2x + 1$' }
            correct: [plus-one-after]
          explanation: >-
            $f$ acts first and squares $x$; then $g$ adds 1 to the result, giving $x^2 + 1$. The
            other order, $f\big(g(x)\big)$, is $(x + 1)^2$.

  - id: derive-inverse-formula
    phase: derive
    kind: step
    concept: M1.3/inverse-functions
    title: Undoing a formula
    prompt: >-
      Solve $F = 1.8C + 32$ for $C$, to get the rule that turns a Fahrenheit reading $F$ back into
      Celsius.
    answer:
      type: expression
      symbols:
        - { name: F }
      lhs: 'C ='
      reference: (F - 32)/1.8
      accept: ['5*(F - 32)/9', 'F/1.8 - 32/1.8', '(F - 32)*5/9', '5*F/9 - 160/9', '(F - 32)/(9/5)']
      reject:
        - 'F/1.8 - 32'
        - 'F - 32/1.8'
        - '(F + 32)/1.8'
        - '1.8*F + 32'
        - '1.8*(F - 32)'
        - '(F - 32)/18'
        - '(F - 32)*1.8'
    explanation: >-
      Subtract 32 from both sides to get $F - 32 = 1.8C$, then divide both sides by 1.8:
      $C = \dfrac{F - 32}{1.8}$. All of $F - 32$ is divided by 1.8, not just the 32.
    placement: true
    review:
      variants:
        - prompt: Solve $y = 3x - 1$ for $x$.
          answer:
            type: expression
            symbols:
              - { name: y }
            lhs: 'x ='
            reference: (y + 1)/3
            accept: ['y/3 + 1/3', '(1 + y)/3']
            reject: ['(y - 1)/3', '3*y + 1', 'y/3 + 1', 'y/3 - 1/3']
          explanation: >-
            Add 1 to both sides to get $y + 1 = 3x$, then divide both sides by 3:
            $x = \dfrac{y + 1}{3}$.
        - prompt: >-
            The function $f(x) = \dfrac{x}{4} + 3$ has an inverse. What is $f^{-1}(5)$, the input
            that $f$ sends to 5?
          answer: { type: number, value: 8 }
          explanation: >-
            Solve $\dfrac{x}{4} + 3 = 5$: subtracting 3 gives $\dfrac{x}{4} = 2$, and multiplying by 4
            gives $x = 8$. Check: $f(8) = 2 + 3 = 5$.
        - prompt: A rule doubles a number, then subtracts 5. Which rule undoes it?
          answer:
            type: choice
            options:
              - { id: halve-add, label: 'Halve, then add 5' }
              - { id: add-halve, label: 'Add 5, then halve' }
              - { id: subtract-halve, label: 'Subtract 5, then halve' }
              - { id: halve-subtract, label: 'Halve, then subtract 5' }
            correct: [add-halve]
          explanation: >-
            Undo the last step first: add the 5 back, then halve. Starting from 3, doubling gives 6
            and subtracting 5 gives 1; adding 5 gives 6 again, and halving gives 3.

  - id: derive-inverse-injective
    phase: derive
    kind: proof
    concept: M1.3/injective-surjective
    covers: [M1.3/inverse-functions]
    title: Only one-to-one functions can be undone
    prompt: >-
      $f$ has an inverse $f^{-1}$, and two inputs $a$ and $b$ give the same output: $f(a) = f(b)$.
      Choose the rule that justifies each line. A rule may be used more than once or not at all, and
      may be read from right to left as well as from left to right.
    answer:
      type: steps
      rules:
        - { id: compose, name: Compose, label: '$(g \circ f)(x)$ means $g\big(f(x)\big)$.' }
        - { id: replace, name: Replace, label: 'Equal things can replace each other, and $f(a) = f(b)$.' }
        - { id: onto, name: Onto, label: 'Every possible output of $f$ is reached by some input.' }
        - { id: undo, name: Undo, label: '$f^{-1}$ undoes $f$: $f^{-1}\big(f(x)\big) = x$ for every input $x$.' }
      start: 'a'
      lines:
        - math: '= f^{-1}\big(f(a)\big)'
          rule: undo
        - math: '= f^{-1}\big(f(b)\big)'
          rule: replace
        - math: '= b'
          rule: undo
    explanation: >-
      Undo, replace, undo. Writing $a$ as $f^{-1}\big(f(a)\big)$ reads the undo rule from right to
      left; replacing $f(a)$ by the equal $f(b)$ changes nothing; and undoing again gives $b$. So
      $a = b$: two inputs with the same output were the same input all along.

  - id: derive-socks-shoes
    phase: derive
    kind: proof
    concept: M1.3/composition
    covers: [M1.3/inverse-functions]
    title: Undoing a chain, in reverse order
    prompt: >-
      $f$ and $g$ both have inverses. Choose the rule that justifies each line, to show that
      $f^{-1} \circ g^{-1}$ undoes $g \circ f$. A rule may be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: undo-g, name: Undo g, label: '$g^{-1}\big(g(u)\big) = u$ for every input $u$ of $g$.' }
        - { id: redo-g, name: Redo g, label: '$g\big(g^{-1}(u)\big) = u$ for every output $u$ of $g$.' }
        - { id: compose, name: Compose, label: '$(p \circ q)(u)$ means $p\big(q(u)\big)$, for any functions $p$ and $q$.' }
        - { id: undo-f, name: Undo f, label: '$f^{-1}\big(f(u)\big) = u$ for every input $u$ of $f$.' }
      start: '(f^{-1} \circ g^{-1})\big((g \circ f)(x)\big)'
      lines:
        - math: '= f^{-1}\Big(g^{-1}\big((g \circ f)(x)\big)\Big)'
          rule: compose
        - math: '= f^{-1}\Big(g^{-1}\big(g(f(x))\big)\Big)'
          rule: compose
        - math: '= f^{-1}\big(f(x)\big)'
          rule: undo-g
        - math: '= x'
          rule: undo-f
    explanation: >-
      Compose, compose, undo $g$, undo $f$. The inverse of the chain undoes $g$ first, because $g$ was
      applied last, and then undoes $f$.

  - id: derive-root-square
    phase: derive
    kind: predict
    concept: M1.3/inverse-functions
    title: Does a square root undo a square?
    prompt: What is $\sqrt{(-3)^2}$?
    answer: { type: number, value: 3 }
    explanation: >-
      $(-3)^2 = 9$, and $\sqrt{9} = 3$, because the square root always gives the number that is 0 or
      more. It sent back 3, not the $-3$ that went in.

  - id: derive-restrict-inverse
    phase: derive
    kind: step
    concept: M1.3/injective-surjective
    covers: [M1.3/inverse-functions]
    title: An inverse for a narrowed square
    prompt: >-
      The function $f(x) = (x - 2)^2$ is not one-to-one, but with its inputs narrowed to $x \ge 2$ it
      is. Solve $y = (x - 2)^2$ for $x$, for inputs $x \ge 2$.
    answer:
      type: expression
      symbols:
        - { name: y, positive: true }
      lhs: 'x ='
      reference: sqrt(y) + 2
      accept: ['2 + sqrt(y)', 'y^(1/2) + 2', 'y**0.5 + 2']
      reject:
        - '2 - sqrt(y)'
        - 'sqrt(y) - 2'
        - 'sqrt(y - 2)'
        - 'sqrt(y + 2)'
        - '(y - 2)^2'
        - 'sqrt(y)'
        - '(y + 2)^2'
        - 'y + 2'
    explanation: >-
      For $x \ge 2$, $x - 2$ is 0 or more, so taking square roots gives exactly $\sqrt{y} = x - 2$.
      Adding 2 gives $x = \sqrt{y} + 2$.

  - id: derive-mirror
    phase: derive
    kind: predict
    concept: M1.3/inverse-functions
    title: The graph of an inverse
    prompt: >-
      The point $(2, 4)$ is on the graph of $y = x^2$, because squaring takes 2 to 4. The square root
      takes 4 back to 2. Which point does that put on the graph of $y = \sqrt{x}$?
    answer:
      type: choice
      options:
        - { id: same, label: '$(2, 4)$' }
        - { id: negative, label: '$(-2, 4)$' }
        - { id: further, label: '$(4, 16)$' }
        - { id: swapped, label: '$(4, 2)$' }
      correct: [swapped]
    explanation: >-
      The graph of $y = \sqrt{x}$ has a point $(x, y)$ for each input $x$ and its output $y$. The
      input 4 gives the output 2, so $(4, 2)$ is on it: the same two numbers as $(2, 4)$, swapped.

  # Build ----------------------------------------------------------------------
  - id: build-to-celsius
    phase: build
    kind: build
    concept: M1.3/inverse-functions
    covers: [M1.3/function-as-mapping]
    title: Fahrenheit back to Celsius
    prompt: >-
      `to_fahrenheit` is written for you. Finish `to_celsius` so that it undoes `to_fahrenheit`. The
      tests convert there and back, and back and there.
    answer:
      type: code
      starter: |
        def to_fahrenheit(c):
            return 1.8 * c + 32

        def to_celsius(f):
            return 0   # replace 0 with the rule that undoes to_fahrenheit

        print(to_celsius(212))
      tests: |
        def test_boiling():
            """Water boils at 212 °F, which is 100 °C."""
            got = to_celsius(212)
            assert close(got, 100), f"to_celsius(212) gave {got}, not 100."

        def test_there_and_back():
            """Celsius to Fahrenheit and back again gives the starting temperature."""
            for c in [-40, 0, 37, 100]:
                got = to_celsius(to_fahrenheit(c))
                assert close(got, c, abs_tol=1e-9), f"to_celsius(to_fahrenheit({c})) gave {got}, not {c}."

        def test_back_and_there():
            """Fahrenheit to Celsius and back again gives the starting reading."""
            for f in [-40, 32, 98.6, 451]:
                got = to_fahrenheit(to_celsius(f))
                assert close(got, f, abs_tol=1e-9), f"to_fahrenheit(to_celsius({f})) gave {got}, not {f}."
      reference: |
        def to_fahrenheit(c):
            return 1.8 * c + 32

        def to_celsius(f):
            return (f - 32) / 1.8

        print(to_celsius(212))
      wrong:
        - code: |
            def to_fahrenheit(c):
                return 1.8 * c + 32

            def to_celsius(f):
                return f / 1.8 - 32

            print(to_celsius(212))
          why: >-
            Undoes the steps in the order they were done, dividing before subtracting, which turns
            212 into about 85.8.
        - code: |
            def to_fahrenheit(c):
                return 1.8 * c + 32

            def to_celsius(f):
                return f - 32 / 1.8

            print(to_celsius(212))
          why: >-
            Leaves out the brackets, so Python divides only the 32 by 1.8, and 212 becomes about
            194.2.
        - code: |
            def to_fahrenheit(c):
                return 1.8 * c + 32

            def to_celsius(f):
                return (f + 32) / 1.8

            print(to_celsius(212))
          why: Adds 32 where it should subtract it, so 212 becomes about 135.6.
    explanation: >-
      `return (f - 32) / 1.8`. The brackets make Python subtract before it divides, the reverse of the
      order `to_fahrenheit` used.

  - id: build-kelvin
    phase: build
    kind: debug
    concept: M1.3/composition
    title: Kelvin to Fahrenheit
    prompt: >-
      `kelvin_to_fahrenheit` should turn a temperature in kelvin into Fahrenheit by way of Celsius.
      Water freezes at 273.15 K, which is 32 °F, but the program prints something else. Find the bug
      and fix it.
    answer:
      type: code
      starter: |
        def to_fahrenheit(c):
            return 1.8 * c + 32

        def kelvin_to_celsius(k):
            return k - 273.15

        def kelvin_to_fahrenheit(k):
            return kelvin_to_celsius(to_fahrenheit(k))

        print(kelvin_to_fahrenheit(273.15))
      tests: |
        def test_freezing():
            """Water freezes at 273.15 K, which is 32 °F."""
            got = kelvin_to_fahrenheit(273.15)
            assert close(got, 32), f"kelvin_to_fahrenheit(273.15) gave {got}, not 32."

