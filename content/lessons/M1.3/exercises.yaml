  - id: explain-undoing
    phase: explain
    kind: explain
    concept: M1.3/inverse-functions
    covers: [M1.3/function-as-mapping, M1.3/injective-surjective, M1.3/composition]
    title: Explain it to a friend
    prompt: >-
      A friend says: "Decoding undoes encoding, so encoding must undo decoding too." Explain to your
      friend why that does not follow. Say what a function is, and when one can be undone in both
      directions. Then explain how to undo a chain of two functions, and how a function that cannot be
      undone, such as squaring, can be made into one that can.
    answer:
      type: text
      rubric:
        - id: mapping
          criterion: Says what a function is.
        - id: shared
          criterion: Explains why decoding cannot always be undone.
        - id: conditions
          criterion: Says when a function can be undone in both directions, naming both conditions.
        - id: order
          criterion: Explains how to undo a chain of two functions, and why the order matters.
        - id: restrict
          criterion: >-
            Explains, with an example, how narrowing the inputs can turn a function that cannot be
            undone into one that can.
        - id: plain
          criterion: >-
            Is simple enough for the friend to follow, and explains any term such as "one-to-one" the
            first time it is used.
      reference: >-
        A function is a rule that gives every input exactly one output. The encoder is one: each text
        gives one list of ids. The decoder is another: each list gives one text. Decoding undoes
        encoding, because if you encode a text and decode the result, you get the text back. The other
        way fails, because two different lists can decode to the same text: [0, 1] and [2] both decode
        to `ab`. Once you have the text `ab`, nothing in it records which list it came from, so no rule
        can recover the list, and the encoder simply picks [2]. A function can be undone in both
        directions only when two things hold. It must be one-to-one: no two inputs share an output, so
        each output points back to a single input. And it must be onto: every possible output is
        reached, so there is always an input to go back to. The encoder is one-to-one but not onto,
        since no text encodes to [0, 1]; the decoder is onto but not one-to-one. That is why each undoes
        the other in one direction only. A function that is both, such as turning Celsius into
        Fahrenheit, has an inverse that undoes it either way round. To undo a chain, undo the last step
        first. To turn Celsius into Fahrenheit you multiply by 1.8 and then add 32, so to go back you
        subtract 32 first and then divide by 1.8. The other order gives the wrong answer: 212 °F would
        come out as about 85.8 °C instead of 100. It is like socks and shoes, where the shoes come off
        first. Squaring cannot be undone, because 3 and $-3$ both square to 9. But if you allow only
        inputs that are 0 or more, no two inputs share a square, and the square root undoes it:
        $\sqrt{x^2} = x$ for every $x \ge 0$. Narrowing the inputs removed the sharing.
      minWords: 100
      maxWords: 500
