  - id: build-rounded-pixels
    phase: build
    kind: breakit
    concept: M1.3/injective-surjective
    title: Pixels that round
    prompt: Predict what `back` will be after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        def to_model(pixel):
            return pixel / 127.5 - 1

        def to_pixel(x):
            return 127.5 * (x + 1)

        back = to_model(to_pixel(0.5))
        print(back)
      broken: |
        def to_model(pixel):
            return pixel / 127.5 - 1

        def to_pixel(x):
            return round(127.5 * (x + 1))

        back = to_model(to_pixel(0.5))
        print(back)
      change: >-
        `to_pixel` now rounds its answer to the nearest whole number, as saving a picture does.
      options:
        - { id: same, label: '`back` is still 0.5', when: 'abs(back - 0.5) < 1e-9' }
        - { id: near, label: '`back` is near 0.5, but not 0.5', when: '1e-9 <= abs(back - 0.5) < 0.1' }
        - { id: far, label: '`back` is 0.1 or more away from 0.5', when: 'abs(back - 0.5) >= 0.1' }
        - { id: error, label: 'Python stops with an error', when: 'error is not None' }
    explanation: >-
      `to_pixel(0.5)` is 191.25, which now rounds to 191, and `to_model(191)` is about 0.498. Every
      number from about 0.494 up to about 0.502 now gives the pixel 191, so the rounded rule is not
      one-to-one, and `to_model` cannot know which of them you started with.

  - id: build-sympy-inverse
    phase: build
    kind: build
    concept: M1.3/inverse-functions
    covers: [M1.3/injective-surjective]
    title: Inverses by machine
    prompt: >-
      Replace each `None` with a call of `solve`, as in the example line, so that `undo_chain` holds
      the chain solved for `x` and `roots` holds the square solved for `x`.
    answer:
      type: code
      starter: |
        from sympy import symbols, Eq, solve

        x, y = symbols("x y")   # two letters at once

        # Eq(left, right) is an equation. The chain is Explore's f and g:
        # add 3, then double. The square is y = x squared.
        chain = Eq(y, 2*(x + 3))
        square = Eq(y, x**2)

        example = solve(Eq(3*x + 2, 17), x)
        print("example:", example)

        undo_chain = None   # the chain, solved for x
        roots = None        # the square, solved for x

        print("undo_chain:", undo_chain)
        print("roots:", roots)
      tests: |
        from sympy import simplify

        def test_undo_chain():
            """undo_chain is the list of solutions of the chain, solved for x."""
            assert undo_chain is not None, "Replace None with a call of solve."
            assert isinstance(undo_chain, list) and len(undo_chain) == 1, f"undo_chain is {undo_chain}, not a list of one formula for x."
            back = undo_chain[0]
            assert simplify(back.subs(y, 2*(x + 3)) - x) == 0, f"{back} does not take 2(x + 3) back to x."

        def test_roots():
            """roots is the list of solutions of the square, solved for x."""
            assert roots is not None, "Replace None with a call of solve."
            assert isinstance(roots, list) and len(roots) == 2, f"roots is {roots}, not a list of two solutions for x."
            for r in roots:
                assert simplify(r**2 - y) == 0, f"{r} squared is not y."
      reference: |
        from sympy import symbols, Eq, solve

        x, y = symbols("x y")

        chain = Eq(y, 2*(x + 3))
        square = Eq(y, x**2)

        example = solve(Eq(3*x + 2, 17), x)
        print("example:", example)

        undo_chain = solve(chain, x)
        roots = solve(square, x)

        print("undo_chain:", undo_chain)
        print("roots:", roots)
