    title: Collections and what they cost
    prompt: >-
      Explain to your friend what a list is and how Python finds its slots, why `b = a` followed by
      `a.append(3)` changes what `b` shows, what dictionaries and sets are for, why the puzzle's
      `unique` takes hours on a million documents while a set takes about a second, and how to
      estimate a program's running time before it runs.
    answer:
      type: text
      rubric:
        - { id: slots, criterion: 'Describes a list as a row of numbered slots, from index 0, so that reaching a slot by its index or appending takes about one step however long the list is, while `x in xs` compares `x` with the slots one at a time.' }
        - { id: alias, criterion: 'Explains that assignment never copies: after `b = a` both names refer to one list, so a change made in place, such as `append`, shows through both, while `a = a + [x]` makes a new list; and that `list(a)` makes a copy.' }
        - { id: dict-set, criterion: 'Says that a dictionary keeps one value under each key, like a function given by a table, and a set holds each value once, and that both find a key in about one step, by working out from the key where to look.' }
        - { id: puzzle, criterion: 'Explains the puzzle: the k-th document is compared with the k - 1 kept before it, so n different documents make n(n - 1)/2 comparisons, about n²/2; a hundred times the documents is about ten thousand times the work, hours instead of a second, while a set looks each document up once.' }
        - { id: estimate, criterion: 'Describes estimating a running time before the program runs: count the basic steps it takes, then divide by the steps a second the machine manages, as M1.1 did for a training run.' }
      reference: >-
        A list is a row of numbered slots, side by side in memory, each referring to a value, with
        the first slot at index 0. Python finds slot i by arithmetic, the start of the row plus i
        slots along, so xs[i] takes one step however long the list is, and append is cheap too,
        since the list keeps spare slots at its end. But x in xs cannot know where x is, so it
        compares x with the slots one at a time. Assignment never copies anything. After b = a, the
        two names refer to one list, so a.append(3) changes that list and b shows the change too.
        By contrast a = a + [3] makes a new list and moves only a, and list(a) makes a copy when
        one is wanted. The same holds for a list passed to a function: the function can change the
        caller's list. A dictionary keeps a value under each key, like a function given by a table,
        and a set holds each value once. Both work out from the key itself where to look, so
        finding a key takes about one step however many keys there are. The puzzle's unique checks
        each document against the list of those kept so far. With every document different, the
        k-th document is compared with the k - 1 kept before it, so n documents make
        0 + 1 + ... + (n - 1) = n(n - 1)/2 comparisons, about n squared over 2. A hundred times the
        documents is about ten thousand times the work, so the one second for 10,000 documents
        becomes hours for a million. Keeping a set of the documents seen means each is looked up
        once, so the work only grows in proportion to the number of documents, and a million take
        about a second. To estimate a running time before a long job starts, count the steps it
        takes, then divide by the steps a second the machine manages, as M1.1 did for a training
        run: 5 times 10 to the 11 comparisons at 5 times 10 to the 7 a second is 10,000 seconds,
        about three hours.
      minWords: 100
      maxWords: 400
