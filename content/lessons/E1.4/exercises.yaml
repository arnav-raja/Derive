exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-dedup
    phase: puzzle
    kind: predict
    concept: E1.4/cost-of-operations
    title: A million documents
    prompt: About how long does `unique` take on a million different documents?
    answer:
      type: choice
      options:
        - { id: hundred-seconds, label: About 100 seconds }
        - { id: three-hours, label: About 3 hours }
        - { id: twelve-days, label: About 12 days }
        - { id: one-second, label: About a second }
      correct: [three-hours]
    explanation: >-
      `doc not in kept` compares `doc` with the kept documents one at a time, and with every
      document different it never finds a match, so it compares `doc` with all of them, while `kept`
      grows by one document each time. A hundred times as many documents means a hundred times as
      many documents to check, each compared with up to a hundred times as many kept ones: about
      10,000 times the work, and 10,000 seconds is close to 3 hours.

  # Recall ---------------------------------------------------------------------
  - id: recall-call-rebind
    phase: recall
    kind: recall
    concept: E1.3/scope
    prompt: |
      What does this program print?

      ```python
      def bump(n):
          n = n + 1
          return n

      k = 1
      bump(k)
      print(k)
      ```
    answer: { type: number, value: 1, tolerance: { abs: 0 } }
    explanation: >-
      The call's `n` is a new name for 1, and `n = n + 1` changes only that name. The main
      program's `k` is never assigned again, so it still refers to 1.

  - id: recall-square-total
    phase: recall
    kind: recall
    concept: E1.2/accumulator-pattern
    prompt: |
      What does this program print?

      ```python
      total = 0
      for x in range(1, 5):
          total = total + x * x
      print(total)
      ```
    answer: { type: number, value: 30, tolerance: { abs: 0 } }
    explanation: '`x` takes the values 1, 2, 3 and 4, so the total is $1 + 4 + 9 + 16 = 30$.'

  - id: recall-triangle
    phase: recall
    kind: recall
    concept: E1.2/loop-invariants
    prompt: E1.2 proved that $1 + 2 + \dots + n = \frac{n(n+1)}{2}$ for every whole number $n$. What is $1 + 2 + \dots + 99$?
    answer: { type: number, value: 4950, tolerance: { abs: 0 } }
    explanation: 'With $n = 99$, the formula gives $\frac{99 \times 100}{2} = 4{,}950$.'

  - id: recall-fermi
    phase: recall
    kind: recall
    concept: M1.1/fermi-estimation
    prompt: >-
      A job takes $6 \times 10^{11}$ steps, and a machine does about $2 \times 10^{8}$ steps a
      second. About how many seconds does the job take?
    answer: { type: number, value: 3000, tolerance: { rel: 0.01 } }
    explanation: 'Divide the steps by the rate: $\frac{6 \times 10^{11}}{2 \times 10^{8}} = 3 \times 10^{3}$ seconds.'

  - id: recall-shared-output
    phase: recall
    kind: recall
    concept: M1.3/function-as-mapping
    prompt: 'A table gives each student''s mark: Asha 7, Ben 9, Chitra 7. Does it describe a function from students to marks?'
    answer:
      type: choice
      options:
        - { id: no-shared, label: 'No, since Asha and Chitra have the same mark' }
        - { id: yes-one-each, label: 'Yes, since each student has exactly one mark' }
        - { id: no-not-all, label: 'No, since not every mark from 0 to 10 is given to someone' }
      correct: [yes-one-each]
    explanation: >-
      Each student, each input, has exactly one mark, so the table is a function. Two inputs may
      share an output; what a function may not do is give one input two outputs.
  # Explore --------------------------------------------------------------------
  - id: explore-index
    phase: explore
    kind: predict
    concept: E1.4/lists
    title: Indexes and a slice
    placement: true
    prompt: |
      What does this print?

      ```python
      losses = [2.31, 1.87, 1.52, 1.45]
      print(losses[1], losses[-1], losses[1:3])
      ```
    answer:
      type: choice
      options:
        - { id: one-based, label: '`2.31 1.45 [2.31, 1.87, 1.52]`' }
        - { id: right, label: '`1.87 1.45 [1.87, 1.52]`' }
        - { id: wrong-end, label: '`1.87 1.52 [1.87, 1.52, 1.45]`' }
        - { id: inclusive, label: '`1.87 1.45 [1.87, 1.52, 1.45]`' }
      correct: [right]
    explanation: >-
      Index 1 is the second slot, since indexes start at 0, and index $-1$ is the last. The slice
      `losses[1:3]` takes the slots at indexes 1 and 2 and stops before index 3.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            xs = [10, 20, 30, 40, 50]
            print(xs[2] + xs[-2])
            ```
          answer: { type: number, value: 70, tolerance: { abs: 0 } }
          explanation: '`xs[2]` is the third slot, 30, and `xs[-2]` is the second from the end, 40.'
        - prompt: |
            What does this print?

            ```python
            xs = [10, 20, 30, 40, 50]
            print(len(xs[1:4]))
            ```
          answer: { type: number, value: 3, tolerance: { abs: 0 } }
          explanation: 'The slice takes the slots at indexes 1, 2 and 3, and stops before 4, so it has 3 slots.'
        - prompt: |
            What does this print?

            ```python
            tokens = ["a", "b", "c"]
            tokens[0] = "z"
            print(tokens)
            ```
          answer:
            type: choice
            options:
              - { id: second, label: "`['a', 'z', 'c']`" }
              - { id: first, label: "`['z', 'b', 'c']`" }
              - { id: error, label: 'Nothing: Python stops with an error, since a slot cannot be changed' }
            correct: [first]
          explanation: 'Assigning to `tokens[0]` gives the first slot a new value, and the list is changed in place.'

  - id: explore-append
    phase: explore
    kind: predict
    concept: E1.4/lists
    title: A list built by a loop
    prompt: What does the program print?
    answer: { type: number, value: 14, tolerance: { abs: 0 } }
    explanation: >-
      The loop appends $0, 1, 4, 9, 16$, so `squares[3]` is 9, the fourth value, and `len(squares)`
      is 5.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            evens = []
            for k in range(1, 7):
                if k % 2 == 0:
                    evens.append(k)
            print(evens[-1] * len(evens))
            ```
          answer: { type: number, value: 18, tolerance: { abs: 0 } }
          explanation: '`evens` ends as `[2, 4, 6]`, so the last value is 6 and there are 3 of them.'
        - prompt: |
            What does this print?

            ```python
            xs = [3, 1, 2]
            xs.append(xs[0] + xs[1])
            print(xs)
            ```
          answer:
            type: choice
            options:
              - { id: front, label: '`[4, 3, 1, 2]`' }
              - { id: both, label: '`[3, 1, 2, 3, 1]`' }
              - { id: right, label: '`[3, 1, 2, 4]`' }
            correct: [right]
          explanation: '`xs[0] + xs[1]` is 4, and `append` puts it in a new slot at the end.'

  - id: explore-alias
    phase: explore
    kind: predict
    concept: E1.4/aliasing-and-mutation
    title: Appending after b = a
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: copy, label: '`[1, 2, 3] [1, 2]`' }
        - { id: swapped, label: '`[1, 2] [1, 2, 3]`' }
        - { id: right, label: '`[1, 2, 3] [1, 2, 3]`' }
      correct: [right]
    explanation: >-
      `b = a` makes `b` a second name for the list that `a` refers to, not a copy of it. So
      `a.append(3)` changes the one list both names refer to, and both show `[1, 2, 3]`.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            scores = [0.5, 0.7]
            best = scores
            scores[0] = 0.9
            print(best[0])
            ```
          answer: { type: number, value: 0.9, tolerance: { abs: 0 } }
          explanation: '`best` and `scores` are two names for one list, so giving its first slot 0.9 through `scores` changes what `best[0]` gives.'
        - prompt: |
            What does this print?

            ```python
            a = [1]
            b = a
            c = [1]
            a.append(2)
            print(len(b), len(c))
            ```
          answer:
            type: choice
            options:
              - { id: same, label: '`1 1`' }
              - { id: right, label: '`2 1`' }
              - { id: all, label: '`2 2`' }
            correct: [right]
          explanation: >-
            `b` is another name for `a`'s list, which now has two slots. `c` is a list of its own that
            happens to hold an equal value, so appending to `a`'s list leaves it with one slot.

  - id: explore-rebind-new
    phase: explore
    kind: predict
    concept: E1.4/aliasing-and-mutation
    title: A new list or the same list
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: swapped, label: '`[1, 2] [1, 2, 3]`' }
        - { id: both, label: '`[1, 2, 3] [1, 2, 3]`' }
        - { id: right, label: '`[1, 2, 3] [1, 2]`' }
        - { id: error, label: 'Nothing: Python stops with an error, since lists cannot be added' }
      correct: [right]
    explanation: >-
      `a + [3]` makes a new list, `[1, 2, 3]`, and the assignment makes `a` refer to it. `b` still
      refers to the first list, which nothing changed.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            a = [1, 2]
            b = a
            b.append(9)
            print(a)
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`[1, 2, 9]`' }
              - { id: unchanged, label: '`[1, 2]`' }
              - { id: front, label: '`[9, 1, 2]`' }
            correct: [right]
          explanation: '`b` is another name for `a`''s list, so appending through `b` changes the list that `a` refers to.'
        - prompt: |
            What does this print?

            ```python
            x = 5
            y = x
            x = x + 1
            a = [5]
            b = a
            a[0] = a[0] + 1
            print(y, b[0])
            ```
          answer:
            type: choice
            options:
              - { id: both-six, label: '`6 6`' }
              - { id: right, label: '`5 6`' }
              - { id: both-five, label: '`5 5`' }
              - { id: reversed, label: '`6 5`' }
            correct: [right]
          explanation: >-
            `x = x + 1` makes `x` refer to a new number and leaves `y` at 5. `a[0] = a[0] + 1` changes
            a slot of the one list that `a` and `b` share, so `b[0]` is 6.

  - id: explore-is-equal
    phase: explore
    kind: predict
    concept: E1.4/aliasing-and-mutation
    title: Equal or the same
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: all-true, label: '`True True True`' }
        - { id: not-equal, label: '`False False True`' }
        - { id: c-new, label: '`True False False`' }
        - { id: right, label: '`True False True`' }
      correct: [right]
    explanation: >-
      `a` and `b` refer to two lists that hold equal values, so `a == b` is `True` and `a is b` is
      `False`. `c = a` makes `c` another name for `a`'s list, so `a is c` is `True`.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            a = [1, 2]
            b = list(a)
            b.append(3)
            print(a, a == b)
            ```
          answer:
            type: choice
            options:
              - { id: shared, label: '`[1, 2, 3] True`' }
              - { id: half, label: '`[1, 2, 3] False`' }
              - { id: right, label: '`[1, 2] False`' }
            correct: [right]
          explanation: '`list(a)` makes a copy, so appending to `b` leaves `a` as `[1, 2]`, and the two lists are no longer equal.'
        - prompt: |
            What does this print?

            ```python
            a = [0, 0]
            b = a[:]
            c = a
            a[0] = 7
            print(b[0], c[0])
            ```
          answer:
            type: choice
            options:
              - { id: both, label: '`7 7`' }
              - { id: neither, label: '`0 0`' }
              - { id: reversed, label: '`7 0`' }
              - { id: right, label: '`0 7`' }
            correct: [right]
          explanation: '`a[:]` is a copy, so `b` keeps 0, while `c` is another name for `a`''s list and shows the 7.'
  - id: explore-snapshots
    phase: explore
    kind: predict
    concept: E1.4/aliasing-and-mutation
    title: Saving the weights
    placement: true
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: each-step, label: '`[[1.0, 0.0], [2.0, 0.0], [3.0, 0.0]]`' }
        - { id: right, label: '`[[3.0, 0.0], [3.0, 0.0], [3.0, 0.0]]`' }
        - { id: first, label: '`[[1.0, 0.0], [1.0, 0.0], [1.0, 0.0]]`' }
        - { id: flat, label: '`[3.0, 0.0, 3.0, 0.0, 3.0, 0.0]`' }
      correct: [right]
    explanation: >-
      `snapshots.append(weights)` stores the list itself, not a copy of its values at that step. All
      three slots of `snapshots` refer to the one list `weights`, which ends as `[3.0, 0.0]`.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            row = [0, 0]
            grid = []
            for i in range(2):
                grid.append(row)
            grid[0][1] = 5
            print(grid)
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`[[0, 5], [0, 5]]`' }
              - { id: one-row, label: '`[[0, 5], [0, 0]]`' }
              - { id: wrong-slot, label: '`[[5, 0], [0, 0]]`' }
            correct: [right]
          explanation: >-
            Both slots of `grid` refer to the one list `row`, so changing slot 1 of `grid[0]` changes
            what `grid[1]` shows too.
        - prompt: |
            What does this print?

            ```python
            batch = [1, 2]
            history = []
            history.append(list(batch))
            batch.append(3)
            history.append(list(batch))
            print(history)
            ```
          answer:
            type: choice
            options:
              - { id: shared, label: '`[[1, 2, 3], [1, 2, 3]]`' }
              - { id: first, label: '`[[1, 2], [1, 2]]`' }
              - { id: right, label: '`[[1, 2], [1, 2, 3]]`' }
            correct: [right]
          explanation: '`list(batch)` stores a copy each time, so the first copy keeps `[1, 2]` after `batch` changes.'
        - prompt: |
            What does this print?

            ```python
            state = [1]
            saved = [state, state]
            state.append(2)
            print(len(saved[0]) + len(saved[1]))
            ```
          answer: { type: number, value: 4, tolerance: { abs: 0 } }
          explanation: 'Both slots of `saved` refer to `state`, which has 2 values after the append, so the sum is 4.'

  - id: explore-mutating-call
    phase: explore
    kind: predict
    concept: E1.4/aliasing-and-mutation
    title: Two calls that are given a list
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: cleared, label: '`[]`' }
        - { id: untouched, label: '`[2.0]`' }
        - { id: error, label: 'Nothing: Python stops with an error, since `add_loss` returns nothing' }
        - { id: right, label: '`[2.0, 1.5]`' }
      correct: [right]
    explanation: >-
      `add_loss` changes the list it was given, which is `h`'s list, so `h` shows 1.5. `clear` only
      makes its own name `history` refer to a new empty list, and leaves `h`'s list as it was.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            def double_all(xs):
                for i in range(len(xs)):
                    xs[i] = 2 * xs[i]

            v = [1, 2, 3]
            double_all(v)
            print(v)
            ```
          answer:
            type: choice
            options:
              - { id: unchanged, label: '`[1, 2, 3]`' }
              - { id: right, label: '`[2, 4, 6]`' }
              - { id: none, label: '`None`' }
            correct: [right]
          explanation: '`xs` and `v` are two names for one list, and the call changes its slots in place.'
        - prompt: |
            What does this print?

            ```python
            def extend(xs):
                xs = xs + [0]
                return xs

            v = [1]
            w = extend(v)
            print(len(v), len(w))
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`1 2`' }
              - { id: both, label: '`2 2`' }
              - { id: neither, label: '`1 1`' }
            correct: [right]
          explanation: >-
            `xs + [0]` makes a new list, and the call's `xs` is made to refer to it, so `v`'s list
            keeps one value. The call returns the new list, which has two.

  - id: explore-default-shared
    phase: explore
    kind: predict
    concept: E1.4/aliasing-and-mutation
    title: A default list
    prompt: What does the program print, on its two lines?
    answer:
      type: choice
      options:
        - { id: right, label: '`[2.0]`, then `[2.0, 1.5]`' }
        - { id: fresh, label: '`[2.0]`, then `[1.5]`' }
        - { id: both-full, label: '`[2.0, 1.5]`, twice' }
        - { id: error, label: 'Nothing: Python stops with an error, since `history` is not given' }
      correct: [right]
    explanation: >-
      The default list is made once, when the `def` line runs. The first call appends 2.0 to it and
      prints it, and the second call appends 1.5 to the same list, which now holds both.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            def add(x, seen=[]):
                seen.append(x)
                return len(seen)

            print(add("a") + add("b") + add("c"))
            ```
          answer: { type: number, value: 6, tolerance: { abs: 0 } }
          explanation: 'All three calls append to the one default list, so they return 1, 2 and 3.'
        - prompt: |
            What does this print?

            ```python
            def add(x, seen=[]):
                seen.append(x)
                return len(seen)

            mine = []
            print(add("a", mine), add("b", mine), add("c"))
            ```
          answer:
            type: choice
            options:
              - { id: one-list, label: '`1 2 3`' }
              - { id: all-one, label: '`1 1 1`' }
              - { id: right, label: '`1 2 1`' }
            correct: [right]
          explanation: >-
            The first two calls append to `mine`, which ends with two values. The third leaves out
            `seen`, so it appends to the default list, which was still empty.
  - id: explore-dict-replace
    phase: explore
    kind: predict
    concept: E1.4/dicts-and-sets
    title: A key assigned twice
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: kept-first, label: '`3 1`' }
        - { id: two-cats, label: '`4 5`' }
        - { id: error, label: 'Nothing: Python stops with an error, since the value 5 is already used' }
        - { id: right, label: '`3 5`' }
      correct: [right]
    explanation: >-
      Assigning `"cat"` again replaces its value, so `"cat"` maps to 5. `"mat"` is a new key, and it
      may share the value 5, so the dict has three keys.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            ids = {"a": 1}
            ids["b"] = 1
            ids["a"] = 2
            print(ids["a"] + ids["b"], len(ids))
            ```
          answer:
            type: choice
            options:
              - { id: first-a, label: '`2 2`' }
              - { id: right, label: '`3 2`' }
              - { id: three-keys, label: '`3 3`' }
            correct: [right]
          explanation: '`"a"` now maps to 2 and `"b"` to 1, and there are two keys.'
        - prompt: |
            What does this print?

            ```python
            d = {"x": 1, "y": 2}
            print("x" in d, 2 in d, d.get("z", 0))
            ```
          answer:
            type: choice
            options:
              - { id: values-too, label: '`True True 0`' }
              - { id: right, label: '`True False 0`' }
              - { id: none, label: '`True False None`' }
            correct: [right]
          explanation: '`in` asks about keys, and 2 is a value, not a key. `d.get("z", 0)` gives the default, 0, for a missing key.'

  - id: explore-dict-count
    phase: explore
    kind: predict
    concept: E1.4/dicts-and-sets
    title: Counting tokens
    placement: true
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: tokens, label: '`2 6`' }
        - { id: once, label: '`1 5`' }
        - { id: right, label: '`2 5`' }
        - { id: key-error, label: 'Nothing: Python stops with `KeyError` at the first token' }
      correct: [right]
    explanation: >-
      `counts.get(t, 0)` gives 0 for a token not yet counted, so no `KeyError` arises. `"the"`
      appears twice, so its count is 2, and the dict has a key for each of the five different
      tokens.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            words = ["to", "be", "or", "not", "to", "be"]
            print(len(words), len(set(words)))
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`6 4`' }
              - { id: same, label: '`6 6`' }
              - { id: both-four, label: '`4 4`' }
            correct: [right]
          explanation: 'The list has 6 slots, and the set keeps each of the 4 different words once.'
        - prompt: |
            What does this print?

            ```python
            words = ["a", "b", "a", "c", "a"]
            counts = {}
            for w in words:
                counts[w] = counts.get(w, 0) + 1
            print(counts["a"] * len(counts))
            ```
          answer: { type: number, value: 9, tolerance: { abs: 0 } }
          explanation: '`"a"` appears 3 times, and there are 3 different words.'

  - id: explore-cost-which
    phase: explore
    kind: predict
    concept: E1.4/cost-of-operations
    title: Which operations slow down
    placement: true
    prompt: >-
      `xs.pop()` removes the last slot of the list `xs` and gives its value, and `xs.pop(0)` removes
      the first slot. `max(xs)` gives the largest value. Which of these take longer the more values
      `xs` holds? Choose every one.
    answer:
      type: choice
      multiple: true
      options:
        - { id: last, label: '`xs[-1]`' }
        - { id: pop-end, label: '`xs.pop()`' }
        - { id: pop-front, label: '`xs.pop(0)`' }
        - { id: max, label: '`max(xs)`' }
        - { id: slice-ten, label: '`xs[:10]`' }
      correct: [pop-front, max]
    explanation: >-
      `xs[-1]` and `xs.pop()` work on the last slot, which is found by arithmetic. `xs.pop(0)` has
      to move every remaining value along by one slot, and `max(xs)` has to look at every value,
      since any of them could be the largest. `xs[:10]` copies ten slots, however long `xs` is.
    review:
      variants:
