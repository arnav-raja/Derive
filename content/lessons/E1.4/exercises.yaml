  - id: derive-append-proof
    phase: derive
    kind: proof
    concept: E1.4/cost-of-operations
    title: Why doubling keeps appends cheap
    prompt: >-
      Here is why appending $n = 2^k$ values to a list whose row doubles copies fewer than $n$
      values in all, however large $n$ is. Each line follows from the lines above it. Choose the
      rule that justifies each line. A rule may be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: triangle, name: Sum of 1 to m, label: '$1 + 2 + \dots + m = \frac{m(m+1)}{2}$, as E1.2 proved.' }
        - { id: substitute, name: Substitute, label: 'Replace a letter by what it stands for.' }
        - { id: distribute, name: Distribute, label: 'Multiplying a sum multiplies each of its terms, and $2 \times 2^j = 2^{j+1}$.' }
        - { id: divide, name: Divide, label: 'Dividing both sides of an inequality by a positive number keeps it true.' }
        - { id: cancel, name: Cancel, label: 'In a difference of two sums, a term that appears in both cancels.' }
        - { id: collect, name: Collect, label: 'For any number $S$, $2S - S = S$.' }
        - { id: less, name: Less by one, label: 'Taking 1 away leaves a smaller number: $m - 1 < m$.' }
      start: 'S = 1 + 2 + 4 + \dots + 2^{k-1}'
      lines:
        - math: '2S = 2 + 4 + 8 + \dots + 2^{k}'
          rule: distribute
        - math: '2S - S = 2^{k} - 1'
          rule: cancel
        - math: 'S = 2^{k} - 1'
          rule: collect
        - math: 'S = n - 1'
          rule: substitute
        - math: 'S < n'
          rule: less
        - math: '\frac{S}{n} < 1'
          rule: divide
    explanation: >-
      Doubling $S$ shifts every term up one place. Subtracting $S$ cancels every term the two sums
      share, leaving the top term of $2S$ and the bottom term of $S$. So $S = 2^k - 1 = n - 1$, which
      is less than $n$, and dividing by $n$ shows fewer than one copy per append. E1.2's sum of 1 to
      $m$ is not needed.
