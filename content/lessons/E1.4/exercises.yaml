  - id: build-unique-fast
    phase: build
    kind: build
    concept: E1.4/cost-of-operations
    title: Removing repeats fast
    prompt: >-
      Here is the puzzle's `unique`. Make it fast without changing what it returns: a new list of
      the documents, each once, in the order in which they first appear. The tests count the work
      your function does on 300 documents, each comparison and each time a set works out where a
      document goes, and call it with other lists too.
    answer:
      type: code
      maxSteps: 10000000
      starter: |
        def unique(docs):
            """A new list of the documents in the list docs, each once, in the order in which they
            first appear. It takes time in proportion to the number of documents."""
            kept = []
            for doc in docs:
                if doc not in kept:
                    kept.append(doc)
            return kept


        print(unique(["a cat", "a dog", "a cat", "a bird", "a dog"]))
      tests: |
        # Doc is a string that adds 1 to Doc.work each time it is compared with another document,
        # and each time a set or dict works out where to keep it, so that test_fast can count the
        # work your unique does. A later lesson shows how a class like this is written.
        class Doc(str):
            """A document that counts the work done on it: each time it is compared with another
            document, and each time a set or dict works out from it where to keep it."""
            work = 0

            def __eq__(self, other):
                Doc.work = Doc.work + 1
                return str.__eq__(self, other)

            def __hash__(self):
                Doc.work = Doc.work + 1
                return str.__hash__(self)

        def test_examples():
            """Repeats are removed, and first appearances keep their order."""
            for docs, expected in [
                (["a cat", "a dog", "a cat"], ["a cat", "a dog"]),
                (["x", "x", "x"], ["x"]),
                (["b", "a", "c", "a", "b"], ["b", "a", "c"]),
                ([], []),
            ]:
                got = unique(list(docs))
                assert got == expected, f"unique({docs}) is {got!r}, not {expected}."

        def test_order():
            """The order is that of first appearance, not sorted and not a set's order."""
            got = unique([30, 10, 30, 20, 10])
            assert got == [30, 10, 20], f"unique([30, 10, 30, 20, 10]) is {got!r}, not [30, 10, 20]: the values should stay in the order in which they first appear."

        # isinstance(got, list) is True when got is a list.
        def test_list():
            """unique returns a list."""
            got = unique(["a", "b", "a"])
            assert isinstance(got, list), f"unique(['a', 'b', 'a']) gave {got!r}, which is not a list."

        # [Doc("doc " + str(i % 100)) for i in range(300)] is a list built by a loop, as append builds
        # one: Doc("doc 0") to Doc("doc 99"), three times over. [str(d) for d in got] turns each
        # document of the result back into a plain string.
        def test_fast():
            """On 300 documents, 100 of them different, fewer than 3,000 steps of work."""
            docs = [Doc("doc " + str(i % 100)) for i in range(300)]
            Doc.work = 0
            got = unique(docs)
            count = Doc.work
            assert count < 3000, f"unique did {count:,} steps of work on 300 documents, 100 of them different, counting each comparison and each time a set or dict worked out where a document goes. The puzzle's version makes 15,050 comparisons, and a version that looks each document up once does about 600 steps."
            assert [str(d) for d in got] == ["doc " + str(k) for k in range(100)], "On 300 documents, 100 of them different, unique did not give each of the 100 once, in order."

        def test_unchanged():
            """unique leaves the list it is given as it was, and returns a new list."""
            docs = ["b", "a", "b"]
            unique(docs)
            assert docs == ["b", "a", "b"], f"After unique(docs), docs is {docs!r}, not ['b', 'a', 'b']."
            docs = ["x", "y"]
            assert unique(docs) is not docs, "unique(docs) returned the very list it was given. It should return a new list, as its docstring says."
      reference: |
        def unique(docs):
            """A new list of the documents in the list docs, each once, in the order in which they
            first appear. It takes time in proportion to the number of documents."""
            seen = set()
            kept = []
            for doc in docs:
                if doc not in seen:
                    seen.add(doc)
                    kept.append(doc)
            return kept


        print(unique(["a cat", "a dog", "a cat", "a bird", "a dog"]))
      # The first wrong program's run is kept as the tutor's picture of being stuck, so it must print
      # the same in every run: a set of strings, whose order changes from run to run, comes later.
      wrong:
        - code: |
            def unique(docs):
                seen = set()
                kept = []
                for doc in docs:
                    if doc not in kept:
                        seen.add(doc)
                        kept.append(doc)
                return kept
          why: Keeps a set but still asks `doc not in kept`, so it compares each document with every kept one.
        - code: |
            def unique(docs):
                return list(set(docs))
          why: Turns the list into a set and back, which loses the order of first appearance.
        - code: |
            def unique(docs):
                return sorted(set(docs))
          why: Sorts the documents, which loses the order of first appearance.
        - code: |
            def unique(docs):
                kept = []
                for doc in docs:
                    if doc not in set(kept):
                        kept.append(doc)
                return kept
          why: Builds a new set from `kept` for every document, which looks at every kept document each time.
        - code: |
            def unique(docs):
                seen = set()
                kept = []
                for doc in docs:
                    if doc not in seen:
                        kept.append(doc)
                return kept
          why: Never adds a document to the set, so nothing counts as seen and every repeat is kept.
        - code: |
            def unique(docs):
                seen = set()
                for doc in docs:
                    if doc not in seen:
                        seen.add(doc)
                return seen
          why: Returns the set, which is not a list and keeps no order.
        - code: |
            def unique(docs):
                seen = set()
                kept = []
                for doc in docs:
                    if doc not in seen:
                        seen.add(doc)
                    kept.append(doc)
                return kept
          why: Appends every document, repeat or not, since the append is outside the `if`.
    explanation: >-
      The set `seen` answers "seen before?" by looking in about one place, and the list `kept` keeps
      the order, which a set does not. Each document is looked up once and added at most once, so
      the work grows in proportion to the number of documents.

  - id: build-default-history
    phase: build
    kind: debug
    concept: E1.4/aliasing-and-mutation
    title: A history that remembers too much
    prompt: >-
      Run the script: it prints `[2.0, 1.5] [2.0, 1.5]`, though each call made without a history
      should start a list of its own. Fix `log` so that it keeps its contract. The `def` line runs
      once and the body at every call, so a list for each call has to be made in the body, and the
      default then has to be a value that is not a list but can stand for "no history given". The
      tests call `log` with a history and without one.
    answer:
      type: code
      starter: |
        def log(loss, history=[]):
            """Appends loss to the list history and returns that list. Called without a history, it
            starts a new list of its own."""
            history.append(loss)
            return history


        first = log(2.0)
