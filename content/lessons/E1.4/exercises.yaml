  # Derive ---------------------------------------------------------------------
  - id: derive-comparisons
    phase: derive
    kind: step
    concept: E1.4/cost-of-operations
    title: Comparisons for n documents
    prompt: >-
      Write the total number of comparisons that `unique` makes on $n$ different documents, as an
      expression in $n$.
    answer:
      type: expression
      symbols:
        - { name: n, integer: true, positive: true }
      lhs: 'C(n) ='
      reference: n*(n - 1)/2
      accept: ['n(n-1)/2', '(n^2 - n)/2', 'n^2/2 - n/2', '(n - 1)*n/2']
      reject: ['n*(n + 1)/2', 'n^2', 'n^2/2', 'n*(n - 1)', 'n - 1', '(n - 1)^2/2']
    explanation: >-
      The $k$-th document is compared with $k - 1$ kept ones, so the total is
      $0 + 1 + \dots + (n - 1)$. E1.2's formula with $n - 1$ in place of $n$ gives
      $\frac{(n - 1)n}{2}$.

  - id: derive-ratio
    phase: derive
    kind: step
    concept: E1.4/cost-of-operations
    title: Twice the documents
    prompt: >-
      With $C(n) = \frac{n(n - 1)}{2}$, write $\frac{C(2n)}{C(n)}$ as an expression in $n$, as
      simple as you can make it.
    answer:
      type: expression
      symbols:
        - { name: n, integer: true, positive: true }
      lhs: '\frac{C(2n)}{C(n)} ='
      reference: 2*(2*n - 1)/(n - 1)
      accept: ['(4n - 2)/(n - 1)', '(4*n-2)/(n-1)', '2(2n-1)/(n-1)', '4 + 2/(n - 1)']
      reject: ['4', '2', '(2*n - 1)/(n - 1)', '4*(2*n - 1)/(n - 1)', '(2*n + 1)/(n + 1)', '2*(2*n + 1)/(n + 1)', '(2n(2n - 1)/2)/(n(n - 1)/2)', '(4n^2 - 2n)/(n^2 - n)']
      form:
        maxOps: 4
        message: That is equal, but it can be simpler. Cancel the factor that the top and the bottom share.
    explanation: >-
      $C(2n) = \frac{2n(2n - 1)}{2} = n(2n - 1)$, so the ratio is
      $\frac{n(2n - 1)}{n(n - 1)/2} = \frac{2(2n - 1)}{n - 1}$.

  - id: derive-estimate
