  - id: build-best-step
    phase: build
    kind: build
    concept: E1.4/lists
    title: The best step
    prompt: >-
      Write the body of `best_step(losses)`, which gives the index of the smallest loss in a list of
      losses, the step whose weights a training script would keep. The tests call it with many
      different lists, and check that it leaves the list as it was.
    answer:
      type: code
      starter: |
        def best_step(losses):
            """The index of the smallest loss in the list losses, which holds at least one loss.
            If the smallest loss appears more than once, the first of its indexes."""


        print(best_step([2.0, 1.5, 1.7]))   # the smallest loss, 1.5, is at index 1
      tests: |
        def test_examples():
            """The index of the smallest loss, for a few lists."""
            for losses, expected in [([2.0, 1.5, 1.7], 1), ([0.9, 0.4, 0.6, 0.2], 3), ([3.1, 2.2], 1)]:
                got = best_step(list(losses))
                assert got == expected, f"best_step({losses}) is {got!r}, but the smallest loss, {min(losses)}, is at index {expected}."

        def test_first_slot():
            """The smallest loss can be in the first slot, and a list can hold a single loss."""
            got = best_step([0.5, 0.9, 0.7])
            assert got == 0, f"best_step([0.5, 0.9, 0.7]) is {got!r}, but the smallest loss is in the first slot, index 0."
            got = best_step([1.25])
            assert got == 0, f"best_step([1.25]) is {got!r}, but a list of one loss has it at index 0."

        def test_ties():
            """When the smallest loss appears twice, the first of its indexes."""
            got = best_step([3.0, 1.0, 2.0, 1.0])
            assert got == 1, f"best_step([3.0, 1.0, 2.0, 1.0]) is {got!r}. The smallest loss, 1.0, is at indexes 1 and 3, and the first of them is 1."

        def test_unchanged():
            """best_step leaves the list it is given as it was."""
            losses = [2.0, 0.5, 1.0]
            best_step(losses)
            assert losses == [2.0, 0.5, 1.0], f"After best_step(losses), losses is {losses!r}, not [2.0, 0.5, 1.0]: the function changed its caller's list."
      reference: |
        def best_step(losses):
            """The index of the smallest loss in the list losses, which holds at least one loss.
            If the smallest loss appears more than once, the first of its indexes."""
            best = 0
            for i in range(len(losses)):
                if losses[i] < losses[best]:
                    best = i
            return best


        print(best_step([2.0, 1.5, 1.7]))   # the smallest loss, 1.5, is at index 1
      wrong:
        - code: |
            def best_step(losses):
                smallest = losses[0]
                for loss in losses:
                    if loss < smallest:
                        smallest = loss
                return smallest
          why: Returns the smallest loss itself, not its index.
        - code: |
            def best_step(losses):
                best = 0
                for i in range(len(losses)):
                    if losses[i] <= losses[best]:
                        best = i
                return best
          why: Uses `<=`, so a later loss equal to the smallest takes its place.
        - code: |
            def best_step(losses):
                best = 0
                best_loss = 0
                for i in range(len(losses)):
                    if losses[i] < best_loss:
                        best = i
                        best_loss = losses[i]
                return best
          why: Starts the best loss at 0, which no positive loss beats, so it always gives 0.
        - code: |
            def best_step(losses):
                best = 0
                for i in range(len(losses) - 1):
                    if losses[i] < losses[best]:
                        best = i
                return best
          why: Stops one slot early, so it never looks at the last loss.
        - code: |
            def best_step(losses):
                original = list(losses)
                losses.sort()
                return original.index(losses[0])
          why: Sorts the caller's list in place to find the smallest loss, which changes the list it was given.
    explanation: >-
      `best` holds the index of the smallest loss so far, starting at the first slot. The loop
      visits every index, and `<` moves `best` only for a loss strictly smaller, so a tie keeps the
      first index. Nothing assigns to a slot of `losses`, so the caller's list is left alone.

  - id: build-vocabulary
    phase: build
    kind: build
    concept: E1.4/dicts-and-sets
    title: A tokeniser's vocabulary
    prompt: >-
      A tokeniser gives each different token a number, its id. Write the body of
      `vocabulary(tokens)`, which numbers the tokens in the order they first appear. The tests call it
      with other lists of tokens too.
    answer:
      type: code
      starter: |
        def vocabulary(tokens):
            """A new dict that gives each different token in the list tokens an id: 0 for the first
            token to appear, 1 for the next new token, and so on. A repeated token keeps its id."""


        print(vocabulary(["the", "cat", "sat", "on", "the", "mat"]))
      tests: |
        def test_ids():
            """Each new token gets the next id, from 0."""
            got = vocabulary(["the", "cat", "sat"])
            assert got == {"the": 0, "cat": 1, "sat": 2}, f"vocabulary(['the', 'cat', 'sat']) is {got!r}, not {{'the': 0, 'cat': 1, 'sat': 2}}."

        def test_repeats():
            """A repeated token keeps the id it got when it first appeared."""
            got = vocabulary(["b", "a", "b", "b", "c", "a"])
            assert got == {"b": 0, "a": 1, "c": 2}, f"vocabulary(['b', 'a', 'b', 'b', 'c', 'a']) is {got!r}, not {{'b': 0, 'a': 1, 'c': 2}}."

        def test_many():
            """Ten different tokens, in no particular order, numbered in the order they first appear."""
            tokens = ["t5", "t3", "t9", "t3", "t1", "t7", "t0", "t8", "t5", "t2", "t6", "t4"]
            got = vocabulary(tokens)
            expected = {"t5": 0, "t3": 1, "t9": 2, "t1": 3, "t7": 4, "t0": 5, "t8": 6, "t2": 7, "t6": 8, "t4": 9}
            assert got == expected, f"vocabulary({tokens}) is {got!r}, not {expected!r}."

        def test_empty():
            """No tokens give an empty dict."""
            got = vocabulary([])
            assert got == {}, f"vocabulary([]) is {got!r}, not {{}}."

        def test_fresh():
            """Each call numbers only its own tokens, in a new dict."""
            first = vocabulary(["x", "y"])
            second = vocabulary(["y"])
            assert second == {"y": 0}, f"vocabulary(['y']) after vocabulary(['x', 'y']) is {second!r}, not {{'y': 0}}: the first call's tokens carried over to the second."
            assert first is not second, "Two calls of vocabulary returned the same dict. Each call should make a new one."

        def test_unchanged():
            """vocabulary leaves the list of tokens as it was."""
            tokens = ["b", "a", "b"]
            vocabulary(tokens)
            assert tokens == ["b", "a", "b"], f"After vocabulary(tokens), tokens is {tokens!r}, not ['b', 'a', 'b']."
      reference: |
        def vocabulary(tokens):
            """A new dict that gives each different token in the list tokens an id: 0 for the first
            token to appear, 1 for the next new token, and so on. A repeated token keeps its id."""
            ids = {}
            for t in tokens:
                if t not in ids:
                    ids[t] = len(ids)
            return ids


        print(vocabulary(["the", "cat", "sat", "on", "the", "mat"]))
      wrong:
        - code: |
            def vocabulary(tokens):
                ids = {}
                for i in range(len(tokens)):
                    ids[tokens[i]] = i
                return ids
          why: Numbers each token by its position, so a repeated token is given the position of its last copy.
        - code: |
            def vocabulary(tokens):
                ids = {}
                for t in tokens:
                    ids[t] = len(ids)
                return ids
          why: Gives a repeated token a new id each time it appears.
        - code: |
            ids = {}

            def vocabulary(tokens):
                for t in tokens:
                    if t not in ids:
                        ids[t] = len(ids)
                return ids
          why: Keeps the dict outside the function, so the tokens of one call carry over to the next.
        - code: |
            def vocabulary(tokens):
                ids = {}
                for t in tokens:
                    if t not in ids:
                        ids[t] = len(ids) + 1
                return ids
          why: Numbers the tokens from 1 instead of 0.
        - code: |
            def vocabulary(tokens):
                ids = {}
                for t in set(tokens):
                    ids[t] = len(ids)
                return ids
          why: Numbers the tokens in a set's order, which is not the order they first appear.
        - code: |
            def vocabulary(tokens):
                ids = {}
                for i in range(len(tokens)):
                    if tokens[i] not in ids:
                        ids[tokens[i]] = i
                return ids
          why: Gives each new token the position where it first appears, so the ids skip a number after each repeat.
    explanation: >-
      `len(ids)` is the number of tokens numbered so far, which is exactly the id the next new token
