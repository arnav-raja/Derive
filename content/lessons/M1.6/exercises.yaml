                assert value is not None, f"Replace the None in {name}."

        def test_triangle():
            """triangle is 10 at n = 4, and going from n - 1 to n adds n."""
            assert triangle is not None, "Replace the None in triangle first."
            got = triangle.subs(n, 4)
