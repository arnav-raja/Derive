  # Explain --------------------------------------------------------------------
  - id: explain-attention-count
    phase: explain
    kind: explain
    concept: M1.6/arithmetic-series
    covers: [M1.6/sigma-notation, M1.6/geometric-series, M1.6/product-notation]
    title: Long sums, simply
    prompt: >-
      Explain to your friend how to count the comparisons for 1,000 tokens without adding a thousand
      numbers, and why the agent's discounted rewards, $1 + 0.9 + 0.9^2 + \dots$, have a finite total
      although they never stop. Show what $\Sigma$ and $\Pi$ mean, with an example of each worked
      out.
    answer:
      type: text
      rubric:
        - { id: pairing, criterion: 'Explains the pairing: written forwards and backwards, every column adds to the same total, $n + 1$, so twice the sum is $n(n + 1)$.' }
        - { id: count, criterion: 'Gives the count for 1,000 tokens, 500,500, and says it grows roughly with the square of the number of tokens.' }
        - { id: geometric, criterion: 'Finds the total of the discounted rewards, 10, by multiplying the sum by the ratio and subtracting, or by the pattern $\frac{1}{1 - r}$.' }
        - { id: never, criterion: 'Says that the sums never reach 10 but get as close to it as you like, and that this is what the total of a sum with no last term means.' }
        - { id: notation, criterion: 'Says what $\Sigma$ and $\Pi$ mean, with an example of each worked out.' }
      reference: >-
        Write the sum 1 + 2 + ... + 1,000 forwards, and under it backwards. Each column, 1 and 1,000,
        2 and 999, and so on, adds to 1,001, and there are 1,000 columns, so the two rows make
        1,000 × 1,001 = 1,001,000. That is twice the sum, so the count is 500,500. In general
        1 + 2 + ... + n = n(n + 1)/2, which is about half of n squared, so a passage twice as long
        needs about four times as many comparisons. For the rewards, call the sum of the first n
        terms S = 1 + 0.9 + ... + 0.9 to the power n − 1. Then 0.9S has the same terms moved up one
        power, so subtracting leaves S − 0.9S = 1 − 0.9 to the power n, and S = 10 × (1 − 0.9 to the
        power n). The power shrinks towards 0 as n grows, so the sums climb towards 10, never reach
        it, and get as close as you like; that number, 10, is what the sum with no last term means.
        Σ is short for a sum: the sum of k squared for k from 1 to 3 is 1 + 4 + 9 = 14. Π is short for
        a product: the product of k for k from 1 to 4 is 1 × 2 × 3 × 4 = 24, which is 4 factorial.
      minWords: 80
      maxWords: 350
