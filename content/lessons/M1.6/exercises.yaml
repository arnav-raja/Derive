    title: A ratio of 1
    prompt: Predict what happens after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        def geometric_formula(r, n):
            return (1 - r ** n) / (1 - r)

        print(geometric_formula(0.5, 10))
      broken: |
        def geometric_formula(r, n):
            return (1 - r ** n) / (1 - r)

        print(geometric_formula(1, 10))
      change: The ratio is now 1.
      options:
        - { id: ten, label: 'It prints `10.0`, one for each of the ten terms', when: "output.strip() in ('10', '10.0')" }
        - { id: zero, label: 'It prints `0.0`', when: "output.strip() in ('0', '0.0')" }
