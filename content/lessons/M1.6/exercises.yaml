  - id: build-geometric
    phase: build
    kind: debug
    concept: M1.6/geometric-series
    title: A sum with a bug
    prompt: >-
      `geometric(r, n)` should give $1 + r + r^2 + \dots + r^{n-1}$, the first `n` terms of a
      geometric series with ratio `r`. Some of its tests fail. Find the bug and fix it.
    answer:
      type: code
      starter: |
        def geometric(r, n):
            return sum(r ** k for k in range(1, n))    # 1 + r + ... + r^(n-1)

        print(geometric(2, 3))    # 1 + 2 + 4 should be 7
      tests: |
        # close(a, b) is True when a and b agree to about nine significant figures.
        def test_three_terms():
            """Three terms with ratio 2 are 1 + 2 + 4 = 7."""
            assert geometric(2, 3) == 7, f"geometric(2, 3) is {geometric(2, 3)}, not 1 + 2 + 4 = 7."

        def test_one_term():
            """A single term is 1, whatever the ratio."""
            for r in (2, 0.5, -3):
                assert geometric(r, 1) == 1, f"geometric({r}, 1) is {geometric(r, 1)}, not 1."

        def test_ratio_one():
            """With ratio 1, n terms add to n."""
            for n in (1, 5, 12):
                assert geometric(1, n) == n, f"geometric(1, {n}) is {geometric(1, n)}, not {n}."

        def test_next_term():
            """One more term adds r to the power n."""
            for r, n in ((0.5, 4), (3, 6), (0.9, 20)):
                step = geometric(r, n + 1) - geometric(r, n)
                assert close(step, r ** n), f"geometric({r}, {n + 1}) - geometric({r}, {n}) is {step}, not {r} ** {n}."
      reference: |
        def geometric(r, n):
            return sum(r ** k for k in range(n))    # 1 + r + ... + r^(n-1)

        print(geometric(2, 3))    # 1 + 2 + 4 should be 7
      wrong:
        - code: |
            def geometric(r, n):
                return sum(r ** k for k in range(1, n))

            print(geometric(2, 3))
          why: The starter's bug. The range starts at 1, so the first term, $r^0 = 1$, is missing.
        - code: |
            def geometric(r, n):
                return sum(r ** k for k in range(1, n + 1))

            print(geometric(2, 3))
          why: Has the right number of terms, but from $r$ up to $r^n$ instead of from 1 up to $r^{n-1}$.
        - code: |
            def geometric(r, n):
                return sum(r ** k for k in range(n + 1))

            print(geometric(2, 3))
          why: Adds one term too many, up to $r^n$.
        - code: |
            def geometric(r, n):
                return sum(r ** (k - 1) for k in range(1, n))

            print(geometric(2, 3))
          why: Starts the powers at 0, but the range still stops one term short.
    explanation: >-
      `range(n)`: the powers run from $r^0$ to $r^{n-1}$, so the counter must take 0, 1, ..., up to
      $n - 1$, which is `range(0, n)`, or `range(n)`. `range(1, n)` starts one too late and misses
      the first term, 1.

  - id: build-ratio-one
    phase: build
