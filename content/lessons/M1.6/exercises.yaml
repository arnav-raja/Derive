    concept: M1.6/arithmetic-series
    title: Comparisons at once
    prompt: >-
      Replace the `None` so that `triangle(n)` gives $1 + 2 + \dots + n$, the number of comparisons
      for a passage of `n` tokens, as a whole number, without adding the numbers one by one.
    answer:
      type: code
      starter: |
        def triangle(n):
            return None    # 1 + 2 + ... + n, without adding the numbers one by one

        print(triangle(1000))
      tests: |
        import time

        def test_answers():
            """triangle gives a number, not None."""
            assert triangle(4) is not None, "Replace the None with a formula."

        def test_small():
            """triangle(n) is 1 + 2 + ... + n for every n from 0 to 30 (for 0 tokens, 0 comparisons)."""
            for n in range(31):
                total = sum(range(1, n + 1))
                assert triangle(n) == total, f"triangle({n}) is {triangle(n)}, but 1 + 2 + ... + {n} is {total}."

        def test_whole_number():
            """triangle gives a whole number, an int, not a float."""
            got = triangle(10)
            assert isinstance(got, int), f"triangle(10) is {got!r}, a {type(got).__name__}, but a count is a whole number, an int."

        def test_at_once():
            """triangle(10 ** 7) is found at once, without adding ten million numbers."""
            start = time.perf_counter()
            triangle(10 ** 7)
            took = time.perf_counter() - start
            assert took < 0.05, f"triangle(10 ** 7) took {took:.2f} seconds. Can it be found without adding the numbers one by one?"

        def test_exact():
            """triangle stays exact for a million million tokens: one more token adds that many comparisons."""
            # Adding a million million numbers one by one would take hours, so this waits for test_at_once.
            start = time.perf_counter()
            triangle(10 ** 7)
            assert time.perf_counter() - start < 0.05, "Make triangle pass test_at_once first."
            n = 10 ** 12
            got = triangle(n) - triangle(n - 1)
            assert got == n, f"triangle({n}) - triangle({n - 1}) is {got}, not {n:,}."
      reference: |
        def triangle(n):
            return n * (n + 1) // 2

        print(triangle(1000))
      wrong:
        - code: |
            def triangle(n):
                return n * (n + 1) / 2

            print(triangle(1000))
          why: Divides with `/`, which gives a float, so the count is no longer an int.
        - code: |
            def triangle(n):
                return sum(range(1, n + 1))

            print(triangle(1000))
          why: Adds the numbers one by one, which is right but takes far too long for ten million.
        - code: |
            def triangle(n):
                return n * n // 2

            print(triangle(1000))
          why: Takes half of the square, which leaves out half of the diagonal.
        - code: |
            def triangle(n):
                return n * (n - 1) // 2

            print(triangle(1000))
          why: Counts the comparisons with earlier tokens only, leaving out each token's comparison with itself.
        - code: |
            def triangle(n):
                return int(n * (n + 1) / 2)

            print(triangle(1000))
          why: Turns the answer back into an int, but only after a float has rounded it, so huge counts are wrong.
    explanation: >-
      `n * (n + 1) // 2`: Derive's formula, with `//` so that the count stays a whole number and
      stays exact however large it is.

