exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-namaste
    phase: puzzle
    kind: predict
    concept: E1.6/unicode-and-bytes
    covers: [E1.6/strings-as-sequences]
    title: A greeting in two scripts
    prompt: What does the program print? The options show its two lines, one after the other.
    answer:
      type: choice
      options:
        - { id: seen-one-byte, label: '`5 3`, then `5 3`' }
        - { id: one-byte, label: '`5 6`, then `5 6`' }
        - { id: seen-three, label: '`5 3`, then `5 9`' }
        - { id: two-bytes, label: '`5 6`, then `5 12`' }
        - { id: right, label: '`5 6`, then `5 18`' }
      correct: [right]
    explanation: >-
      A reader sees three syllables in नमस्ते: न, म and स्ते. Python counts six characters: न, म,
      स, the mark ्, which Hindi calls halant and Unicode calls virama, that takes away स's vowel
      so that it joins the next letter, त, and the vowel sign े. Each letter of `hello` takes one byte, but each of the six Hindi characters takes
      three, so the greeting takes 18 bytes.

  # Recall ---------------------------------------------------------------------
  - id: recall-plus-strings
    phase: recall
    kind: recall
    concept: E1.1/values-and-types
    prompt: |
      What does this program print?

      ```python
      print("4" + str(2), int("4") + 2, "4" * 2)
      ```
    answer:
      type: choice
      options:
        - { id: numbers, label: '`6 6 8`' }
        - { id: right, label: '`42 6 44`' }
        - { id: joined, label: '`42 42 44`' }
        - { id: error, label: 'Nothing: Python stops with `TypeError`' }
      correct: [right]
    explanation: >-
      `+` joins the strings `"4"` and `"2"` into `42`. `int("4")` is the number 4, and 4 plus 2 is
      6. `"4" * 2` repeats the string, giving `44`.

  - id: recall-slice
    phase: recall
    kind: recall
    concept: E1.4/lists
    prompt: |
      What does this program print?

      ```python
      xs = ["s", "t", "e", "p"]
      print(xs[0], xs[-1], xs[1:3])
      ```
    answer:
      type: choice
      options:
        - { id: one-based, label: '`t p [''e'', ''p'']`' }
        - { id: with-end, label: '`s p [''t'', ''e'', ''p'']`' }
        - { id: right, label: '`s p [''t'', ''e'']`' }
        - { id: no-negative, label: 'Nothing: Python stops with `IndexError` at `xs[-1]`' }
      correct: [right]
    explanation: >-
      `xs[0]` is the first slot, `s`, and `xs[-1]` is the last, `p`. `xs[1:3]` is a new list of
      slots 1 and 2, stopping before slot 3: `['t', 'e']`.

  - id: recall-accumulate
    phase: recall
    kind: recall
    concept: E1.2/accumulator-pattern
    prompt: |
      What does this program print?

      ```python
      text = ""
      for k in range(3):
          text = text + str(k) + ","
      print(text)
      ```
    answer:
      type: choice
      options:
        - { id: right, label: '`0,1,2,`' }
        - { id: no-last, label: '`0,1,2`' }
        - { id: last-only, label: '`2,`' }
        - { id: from-one, label: '`1,2,3,`' }
      correct: [right]
    explanation: >-
      `text` starts empty, and each pass adds its number and a comma to what is there: `"0,"`,
      then `"0,1,"`, then `"0,1,2,"`. The last pass adds a comma too.

  - id: recall-dict-count
    phase: recall
    kind: recall
    concept: E1.4/dicts-and-sets
    prompt: |
      What does this program print?

      ```python
      counts = {}
      for w in ["to", "be", "or", "not", "to", "be"]:
          counts[w] = counts.get(w, 0) + 1
      print(counts["to"], len(counts))
      ```
    answer:
      type: choice
      options:
        - { id: all-words, label: '`2 6`' }
        - { id: right, label: '`2 4`' }
        - { id: first-only, label: '`1 4`' }
        - { id: key-error, label: 'Nothing: Python stops with `KeyError`' }
      correct: [right]
    explanation: >-
      `counts.get(w, 0)` is 0 the first time a word comes, so each word's count goes up by one
      every time it comes. `"to"` comes twice, and the dictionary has four keys: to, be, or and
      not.

  - id: recall-powers
    phase: recall
    kind: recall
    concept: M1.1/powers-of-ten
    prompt: >-
      A gigabyte is $10^9$ bytes, and a page of English text takes about 2,000 bytes. How many
      pages of 2,000 bytes fit in a gigabyte?
    answer: { type: number, value: 500000, tolerance: { abs: 0 }, unit: pages }
    explanation: >-
      $\frac{10^9}{2 \times 10^3} = \frac{1}{2} \times 10^6 = 500{,}000$ pages.

  # Explore --------------------------------------------------------------------
  - id: explore-in
    phase: explore
    kind: predict
    concept: E1.6/strings-as-sequences
    title: Inside a string
    placement: true
    prompt: >-
      What does the program print? The options show its three lines, one after another.
    answer:
      type: choice
      options:
        - { id: letters-anywhere, label: '`l g earn`, then `True True`, then `False`' }
        - { id: single-chars, label: '`l g earn`, then `False False`, then `False`' }
        - { id: list-runs, label: '`l g earn`, then `True False`, then `True`' }
        - { id: right, label: '`l g earn`, then `True False`, then `False`' }
      correct: [right]
    explanation: >-
      `"earn"` is in `"learning"`, at indexes 1 to 4, which is the slice `s[1:5]`. `"nl"` is not:
      the string has an `n` and an `l`, but never side by side in that order. For the list, `in`
      looks for `["e", "a"]` as one of its items, and its items are four single letters.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            word = "token"
            print(word[-2], word[1:3], len(word[1:]))
            ```
          answer:
            type: choice
            options:
              - { id: last, label: '`n ok 4`' }
              - { id: with-end, label: '`e oke 4`' }
              - { id: right, label: '`e ok 4`' }
              - { id: whole, label: '`e ok 5`' }
            correct: [right]
          explanation: >-
            `word[-2]` is the second character from the end, `e`. `word[1:3]` is the characters at
            indexes 1 and 2, `ok`, and `word[1:]` is every character after the first, `oken`, four
            of them.
        - prompt: |
            What does this print?

            ```python
            print([1, 2] in [1, 2, 3], [1, 2] in [[1, 2], 3])
            ```
          answer:
            type: choice
            options:
              - { id: both, label: '`True True`' }
              - { id: run, label: '`True False`' }
              - { id: right, label: '`False True`' }
            correct: [right]
          explanation: >-
            For a list, `in` asks whether the value is one of its items. `[1, 2, 3]` has the items
            1, 2 and 3, none of them the list `[1, 2]`; `[[1, 2], 3]` has `[1, 2]` as its first
            item.
        - prompt: |
            What does this print?

            ```python
            print("ain" in "training", "tin" in "training")
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`True False`' }
              - { id: both, label: '`True True`' }
              - { id: neither, label: '`False False`' }
            correct: [right]
          explanation: >-
            `"ain"` appears in `training` as a run of letters side by side. `t`, `i` and `n` are
            all in `training`, but not as the run `tin`.

  - id: explore-upper
    phase: explore
    kind: predict
    concept: E1.6/strings-as-sequences
    title: Capital letters
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: changed, label: '`DERIVE`, then `DERIVE DERIVE`, then `DERIVE`' }
        - { id: slot-assign, label: '`derive`, then `DERIVE Derive`, then `Derive`' }
        - { id: right, label: '`derive`, then `DERIVE Derive`, and then Python stops with `TypeError`' }
      correct: [right]
    explanation: >-
      `name.upper()` gives a new string, `"DERIVE"`, and leaves `name` as it was, so the first line
      is `derive`. `name.replace("d", "D")` is another new string, `Derive`. Then
      `name[0] = "D"` tries to change a slot of the string, which Python does not allow.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            tag = "loss"
            tag.replace("s", "t")
            print(tag, tag.replace("s", "t"))
            ```
          answer:
            type: choice
            options:
              - { id: changed, label: '`lott lott`' }
              - { id: right, label: '`loss lott`' }
              - { id: first-only, label: '`loss lost`' }
            correct: [right]
          explanation: >-
            The second line works out a new string and drops it, so `tag` is still `loss`.
            `replace` replaces every `s`, so the new string is `lott`.
        - prompt: |
            What does this print?

            ```python
            a = "cat"
            b = a
            a = a + "s"
            print(a, b)
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`cats cat`' }
              - { id: shared, label: '`cats cats`' }
              - { id: unchanged, label: '`cat cat`' }
            correct: [right]
          explanation: >-
            `a + "s"` makes a new string, and `a` is made to refer to it. `b` still refers to the
            string `"cat"`, which never changes.

  - id: explore-compare
    phase: explore
    kind: predict
    concept: E1.6/strings-as-sequences
    covers: [E1.6/unicode-and-bytes]
    title: Two comparisons
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: right, label: '`True True`' }
        - { id: alphabet, label: '`False False`' }
        - { id: numbers, label: '`True False`' }
        - { id: letters-only, label: '`False True`' }
      correct: [right]
    explanation: >-
      Python compares the first characters, `Z` and `a`, and in Python's order the capitals A to Z
      all come before the small letters a to z. `"10"` and `"9"` are compared as text too: their first
      characters, `1` and `9`, decide it, and `1` comes first.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            print("Cat" < "cat", "cat" < "cats", "9" < "10")
            ```
          answer:
            type: choice
            options:
              - { id: all, label: '`True True True`' }
              - { id: right, label: '`True True False`' }
              - { id: alphabet, label: '`False True True`' }
            correct: [right]
          explanation: >-
            `C`, at 67, comes before `c`, at 99. `cat` is the start of `cats`, and a string comes
            before any longer string that starts with it. `"9"` and `"10"` are decided by their first
            characters, and `9`, at 57, comes after `1`, at 49.
        - prompt: |
            What does this print?

            ```python
            print(ord("c") - ord("a"), chr(ord("A") + 2))
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`2 C`' }
              - { id: three, label: '`3 C`' }
              - { id: small, label: '`2 c`' }
            correct: [right]
          explanation: >-
            The small letters have code points in order, 97 for `a` and 99 for `c`, so the
            difference is 2. The capitals are in order too, so 2 after `A`, at 65, is `C`, at 67.

  - id: explore-duniya
    phase: explore
    kind: predict
    concept: E1.6/unicode-and-bytes
    title: Hello, world
    placement: true
    prompt: >-
      `"नमस्ते दुनिया"` is "hello, world" in Hindi. Python counts 13 characters in it: the six of
      नमस्ते, a space, and the six of दुनिया, "world", whose code points run from 2,342 to 2,369.
      How many bytes does it take in UTF-8?
    answer: { type: number, value: 37, tolerance: { abs: 0 }, unit: bytes }
    explanation: >-
      नमस्ते takes 18 bytes, as the puzzle and the figure showed. The space, at code point 32,
      takes one, as in `𝑥 + 1`. The figure gives त, the fifth character of नमस्ते, the code point
      2,340, and 日 26,085, and both take three bytes. A larger code point never takes fewer, so
      every code point from 2,340 to 26,085 takes three, the six of दुनिया among them: 18 more.
      That is $18 + 1 + 18 = 37$ bytes.
    review:
      variants:
        - prompt: >-
            How many bytes does `"naïve"` take in UTF-8? Its `ï` has code point 239, and the other
            four letters are English.
          answer: { type: number, value: 6, tolerance: { abs: 0 }, unit: bytes }
          explanation: >-
            The four English letters take one byte each, and `ï`, from 128 to 2,047, takes two:
            6 bytes for 5 characters.
        - prompt: >-
            How many bytes does `"日本語"`, "Japanese", take in UTF-8? Its code points are 26,085,
            26,412 and 35,486.
          answer: { type: number, value: 9, tolerance: { abs: 0 }, unit: bytes }
          explanation: >-
            Each code point is from 2,048 to 65,535, so each takes three bytes: 9 bytes for 3
            characters.
        - prompt: >-
            How many bytes does `"2 × 3"` take in UTF-8? `×` has code point 215, and the other
            four characters are digits and spaces.
          answer: { type: number, value: 6, tolerance: { abs: 0 }, unit: bytes }
          explanation: >-
            The digits and spaces take one byte each, and `×`, from 128 to 2,047, takes two: 6
            bytes.

  - id: explore-cut
    phase: explore
    kind: predict
    concept: E1.6/unicode-and-bytes
    title: Four bytes of a greeting
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: chars, label: '`नमस`, then `नमस्`' }
        - { id: dropped, label: '`न`, then `न` again, leaving out the part of a character' }
        - { id: replaced, label: '`न`, then `न` and a mark for a broken character' }
        - { id: right, label: '`न`, and then Python stops with `UnicodeDecodeError`' }
      correct: [right]
    explanation: >-
      The first three bytes are न, so `data[:3]` decodes to न. The fourth byte, 224, is the first
      of म's three, and its markers, `1110`, promise two more bytes that are not there. Python does
      not guess what was meant: `decode` stops with `UnicodeDecodeError`.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            data = "café".encode("utf-8")
            print(len(data), data[:4].decode("utf-8", errors="ignore"))
            ```
          answer:
            type: choice
            options:
              - { id: chars, label: '`4 café`' }
              - { id: whole, label: '`5 café`' }
              - { id: right, label: '`5 caf`' }
            correct: [right]
          explanation: >-
            `café` takes 5 bytes, two of them for `é`. The first four bytes hold `caf` and the
            first byte of `é`, which `errors="ignore"` leaves out.
        - prompt: In UTF-8, which of these bytes can never be the first byte of a character?
          answer:
            type: choice
            options:
              - { id: ascii, label: '65, which is `01000001`' }
              - { id: two, label: '195, which is `11000011`' }
              - { id: right, label: '169, which is `10101001`' }
              - { id: four, label: '240, which is `11110000`' }
            correct: [right]
          explanation: >-
            A byte that starts with `10` only ever continues a character. 65 is a whole character,
            195 starts a character of two bytes, and 240 one of four.

  - id: explore-readlines
    phase: explore
    kind: predict
    concept: E1.6/files
    title: Reading the losses back
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: stripped, label: '`[''2.5'', ''1.9'', ''1.4''] 3`' }
        - { id: one-string, label: '`[''2.5\n1.9\n1.4\n''] 1`' }
        - { id: right, label: '`[''2.5\n'', ''1.9\n'', ''1.4\n''] 3`' }
        - { id: empty-last, label: '`[''2.5'', ''1.9'', ''1.4'', ''''] 4`' }
      correct: [right]
    explanation: >-
      `readlines` cuts the text after each newline and keeps the newline with its line, so each
      line is a string such as `'2.5\n'`, and `print` shows a list's strings with their newlines
      written as `\n`. The file ends with a newline, so nothing is left after the third line.

  - id: explore-strip
    phase: explore
    kind: predict
    concept: E1.6/files
    covers: [E1.6/parsing-and-formatting]
    title: Counting lines
    placement: true
    prompt: What does the program print?
    answer: { type: number, value: 0, tolerance: { abs: 0 } }
    explanation: >-
      Each line keeps its newline, so the lines are `"ok\n"`, `"fail\n"`, `"ok\n"` and `"ok\n"`,
      and none of them is equal to `"ok"`. The count stays at 0.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            total = 0
            for line in ["3\n", "4\n", "\n"]:
                if line.strip() != "":
                    total = total + int(line)
            print(total)
            ```
          answer: { type: number, value: 7, tolerance: { abs: 0 } }
          explanation: >-
            The blank line strips to `""` and is skipped. `int` skips the newline around a number,
            so the other two lines give 3 and 4.
        - prompt: |
            What does this print?

            ```python
            with open("words.txt", "w", encoding="utf-8") as f:
                f.write("cat\ndog\n")

            with open("words.txt", encoding="utf-8") as f:
                text = f.read()
            print(len(text), text.split("\n"))
            ```
          answer:
            type: choice
            options:
              - { id: no-newlines, label: '`6 [''cat'', ''dog'']`' }
              - { id: dropped, label: '`8 [''cat'', ''dog'']`' }
              - { id: right, label: '`8 [''cat'', ''dog'', '''']`' }
            correct: [right]
          explanation: >-
            `read` gives the whole file, newlines and all: `"cat\ndog\n"`, 8 characters. Splitting
            at each newline leaves an empty string after the last one.

  - id: explore-split
    phase: explore
    kind: predict
    concept: E1.6/parsing-and-formatting
    title: Three ways to split
    placement: true
    prompt: What does the program print? The options show its three lines, one after another.
    answer:
      type: choice
      options:
        - { id: drops-empty, label: '`[''100'', ''2.9'', ''0.001'']`, then `[''the'', ''cat'']`, then `[''the'', ''cat'']`' }
        - { id: right, label: '`[''100'', ''2.9'', '''', ''0.001'']`, then `['''', ''the'', '''', ''cat'', '''']`, then `[''the'', ''cat'']`' }
        - { id: space-merges, label: '`[''100'', ''2.9'', '''', ''0.001'']`, then `[''the'', ''cat'']`, then `[''the'', ''cat'']`' }
        - { id: same-split, label: '`[''100'', ''2.9'', '''', ''0.001'']`, then `['''', ''the'', '''', ''cat'', '''']`, then `['''', ''the'', '''', ''cat'', '''']`' }
        - { id: csv-drops, label: '`[''100'', ''2.9'', ''0.001'']`, then `['''', ''the'', '''', ''cat'', '''']`, then `[''the'', ''cat'']`' }
      correct: [right]
    explanation: >-
      `split(",")` cuts at every comma, and the two commas side by side leave an empty field
      between them. `split(" ")` cuts at every single space, so the spaces at the ends and the
      two spaces side by side leave empty strings too. `split()` with no separator treats each run
      of spaces as one break and ignores the spaces at the ends.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            print("a,b,".split(","), len(",".split(",")))
            ```
          answer:
            type: choice
            options:
              - { id: drops, label: '`[''a'', ''b''] 1`' }
              - { id: half, label: '`[''a'', ''b'', ''''] 1`' }
              - { id: right, label: '`[''a'', ''b'', ''''] 2`' }
            correct: [right]
          explanation: >-
            A comma at the end leaves an empty field after it. A single comma has an empty field
            on each side: `['', '']`, two of them.
        - prompt: |
            What does this print?

            ```python
            print("-".join("a b  c".split()))
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`a-b-c`' }
              - { id: empty, label: '`a-b--c`' }
              - { id: ends, label: '`-a-b-c-`' }
            correct: [right]
          explanation: >-
            `split()` gives `['a', 'b', 'c']`, treating the two spaces as one break, and `join` puts
            a `-` between each pair.
        - prompt: |
            What does this print?

            ```python
            fields = "7,,9".split(",")
            print(len(fields), fields[1] == "")
            ```
          answer:
            type: choice
            options:
              - { id: dropped, label: '`2 False`' }
              - { id: right, label: '`3 True`' }
              - { id: space, label: '`3 False`' }
            correct: [right]
          explanation: >-
            The two commas side by side leave an empty string between them, so there are three
            fields, and the middle one is `""`.

  - id: explore-format
    phase: explore
    kind: predict
    concept: E1.6/parsing-and-formatting
    covers: [E1.6/strings-as-sequences]
    title: Writing numbers out
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: truncates, label: '`step 1,500: loss 0.666`, then `0.30 0.30000000000000004 False`' }
        - { id: right, label: '`step 1,500: loss 0.667`, then `0.30 0.30000000000000004 False`' }
        - { id: changes-value, label: '`step 1,500: loss 0.667`, then `0.30 0.3 True`' }
      correct: [right]
    explanation: >-
      `:,` puts a comma in `1500`, and `:.3f` rounds $\frac{2}{3}$ to three digits after the point,
      `0.667`. `shown` is the string `"0.30"`, but making it changed nothing about `x`, which is
      still the float that E1.1 showed is just above 0.3, so `x == 0.3` is `False`.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            print(f"{1234.5678:.2f}", f"{1000000:,}")
            ```
          answer:
            type: choice
            options:
              - { id: right, label: '`1234.57 1,000,000`' }
              - { id: truncates, label: '`1234.56 1,000,000`' }
              - { id: swapped, label: '`1,234.57 1000000`' }
            correct: [right]
          explanation: >-
            `:.2f` rounds to two digits after the point, and `.5678` rounds up to `.57`. `:,`
            groups the digits of a million in threes. `:.2f` alone adds no commas.
        - prompt: |
            What does this print?

            ```python
            loss = 2.71828
            text = f"{loss:.1f}"
            print(text, float(text) == loss)
            ```
          answer:
            type: choice
            options:
              - { id: same, label: '`2.7 True`' }
              - { id: right, label: '`2.7 False`' }
              - { id: unrounded, label: '`2.71828 True`' }
            correct: [right]
          explanation: >-
            The format writes `2.7`, and turning that text back into a number gives 2.7, not the
            2.71828 that was rounded off.

  # Derive ---------------------------------------------------------------------
  - id: derive-payload
    phase: derive
    kind: step
    concept: E1.6/unicode-and-bytes
    title: Bits for the code point
    prompt: >-
      A character takes $n$ bytes, where $n$ is 2, 3 or 4. How many of its $8n$ bits carry its code
      point? Write it as an expression in $n$.
    answer:
      type: expression
      symbols:
        - { name: n, integer: true, positive: true }
      lhs: '\text{bits for the code point} ='
      reference: 5*n + 1
      accept: ['1 + 5n', '5n+1', '(7 - n) + 6*(n - 1)', '8*n - (n + 1) - 2*(n - 1)']
      reject: ['8*n', '6*n', '7*n', '6*n + 1', '5*n', '7*n - 1', '6*n - 1', '5*n - 1', '7 - n']
    explanation: >-
      The first byte spends $n + 1$ bits on its markers, $n$ ones and a zero, and keeps $7 - n$.
      Each of the other $n - 1$ bytes spends 2 bits on `10` and keeps 6. That is
      $(7 - n) + 6(n - 1) = 5n + 1$ bits.

  - id: derive-largest
    phase: derive
    kind: step
    concept: E1.6/unicode-and-bytes
    title: The largest code point
    prompt: >-
      What is the largest code point that a character of $n$ bytes can carry, for $n$ from 2 to 4?
      Write it as an expression in $n$.
    answer:
      type: expression
      symbols:
        - { name: n, integer: true, positive: true }
      lhs: '\text{largest code point} ='
      reference: 2**(5*n + 1) - 1
      accept: ['2^(5n+1) - 1', '2*32**n - 1', '2*2**(5*n) - 1', '-1 + 2**(5*n + 1)']
      reject: ['2**(5*n + 1)', '2**(5*n) - 1', '2**(8*n) - 1', '2**(5*n + 1) + 1', '256**n - 1', '5*n + 1', '2**(5*n + 2) - 1', '2**(6*n) - 1']
    explanation: >-
      $5n + 1$ bits, all of them 1, are worth $1 + 2 + 4 + \dots + 2^{5n} = 2^{5n+1} - 1$, by
      E1.4's doubling sum, and they can write every number from 0 up to that.

  - id: derive-devanagari-proof
    phase: derive
    kind: proof
    concept: E1.6/unicode-and-bytes
    title: The Devanagari block
    prompt: >-
      Here is why every character of the Devanagari block takes exactly three bytes in UTF-8. Each line follows
      from the lines above it. Choose the rule that justifies each line. A rule may be used more
      than once or not at all.
    answer:
      type: steps
      rules:
        - { id: work-out, name: Work it out, label: 'Work out a power, or compare two known numbers.' }
        - { id: fewest, name: Fewest bytes, label: 'UTF-8 writes each code point in the fewest bytes that can carry it.' }
        - { id: byte-size, name: Byte size, label: 'A byte is 8 bits, so it holds one of 256 numbers, 0 to 255.' }
        - { id: largest, name: Largest code point, label: 'A character of $n$ bytes, for $n$ from 2 to 4, can carry a code point up to $2^{5n+1} - 1$ and no larger, and a single byte one up to $2^7 - 1$ and no larger.' }
        - { id: block, name: The block, label: 'Unicode gives its Devanagari block the code points from 2,304 to 2,431.' }
      start: '\text{Claim: every character of the Devanagari block takes exactly 3 bytes in UTF-8}'
      lines:
        - math: '\text{A character of the block has a code point } c \text{ with } 2{,}304 \le c \le 2{,}431'
          rule: block
        - math: '\text{One byte carries code points up to } 2^7 - 1 \text{, and two bytes up to } 2^{11} - 1'
          rule: largest
        - math: '2^7 - 1 = 127 \text{ and } 2^{11} - 1 = 2{,}047 \text{, both less than } 2{,}304 \text{, so one or two bytes cannot carry } c'
          rule: work-out
        - math: '\text{Three bytes carry code points up to } 2^{16} - 1'
          rule: largest
        - math: 'c \le 2{,}431 < 65{,}535 = 2^{16} - 1 \text{, so three bytes can carry } c'
          rule: work-out
        - math: '\text{So UTF-8 writes } c \text{ in exactly 3 bytes}'
          rule: fewest
    explanation: >-
      The block puts every one of its code points between 2,304 and 2,431. The bound from the
      previous step gives 127 for one byte and 2,047 for two, both below 2,304, so fewer than three
      bytes cannot carry the character, while three bytes carry up to 65,535, well above 2,431.
      UTF-8 always uses the fewest bytes that can carry a code point, so it uses exactly three. The
      rule about a byte's 256 numbers is not needed: what decides the length is how many bits each
      length leaves for the code point, not how many numbers a whole byte can hold.

  - id: derive-mixed-bytes
    phase: derive
    kind: step
    concept: E1.6/unicode-and-bytes
    title: Bytes per character, mixed
    prompt: >-
      On average, how many bytes does the text take for each character? Write it as an expression
      in $p$.
    answer:
      type: expression
      symbols:
        - { name: p, positive: true }
      lhs: '\text{bytes per character} ='
      reference: 3 - 2*p
      accept: ['p + 3*(1 - p)', '1*p + 3*(1 - p)', '3 - 2p', '-2*p + 3']
      reject: ['2*p + 1', '3*p + (1 - p)', '3 - p', '2', '1 + 2*p', '3*p + 1', 'p + 3', '4*p', '(1 + 3)/2']
    explanation: >-
      A fraction $p$ of the characters take 1 byte each and the other $1 - p$ take 3, so on average
      a character takes $p \times 1 + (1 - p) \times 3 = 3 - 2p$ bytes.

  - id: derive-estimate
    phase: derive
    kind: estimate
    concept: E1.6/unicode-and-bytes
    title: Words in a gigabyte
    prompt: >-
      A dataset holds a gigabyte, $10^9$ bytes, of Hindi text in UTF-8. Its words average five
      characters, as Python counts them, all of them Devanagari, and each word is followed by a
      space. About how many words does it hold? An answer within a factor of 1.3 counts.
    answer: { type: number, value: 62500000, tolerance: { factor: 1.3 }, unit: words }
    explanation: >-
      A word takes five characters of three bytes each, and one byte for its space: 16 bytes. So
      $10^9$ bytes hold $\frac{10^9}{16} = 6.25 \times 10^7$ words, about 60 million.

