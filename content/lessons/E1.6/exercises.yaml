  - id: build-break-encoding
    phase: build
    kind: breakit
    concept: E1.6/files
    covers: [E1.6/unicode-and-bytes]
    title: Another encoding
    prompt: Predict what happens after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        with open("names.txt", "w", encoding="utf-8") as f:
            f.write("Arnav\nअर्णव\n")

        with open("names.txt", encoding="utf-8") as f:
            lines = f.readlines()
        print(len(lines), len(lines[1].strip()))
      broken: |
        with open("names.txt", "w", encoding="utf-8") as f:
            f.write("Arnav\nअर्णव\n")

        with open("names.txt", encoding="latin-1") as f:
            lines = f.readlines()
        print(len(lines), len(lines[1].strip()))
      change: 'The file is read back with `encoding="latin-1"`, an older encoding for Western European languages, in place of `encoding="utf-8"`.'
      options:
        - { id: same, label: 'It prints `2 5`, as before', when: "error is None and output.split() == ['2', '5']" }
        - { id: decode-error, label: 'Python stops with `UnicodeDecodeError`, since the file was written in UTF-8', when: "error == 'UnicodeDecodeError'" }
        - { id: bytes, label: 'It prints `2 15`, with no error', when: "error is None and output.split() == ['2', '15']" }
        - { id: other, label: 'Something else happens', when: "not ((error is None and output.split() in (['2', '5'], ['2', '15'])) or error == 'UnicodeDecodeError')" }
    explanation: >-
      Latin-1 turns each byte into one character, so it never meets a byte that it cannot decode.
      The first line, `Arnav`, comes out the same, since its bytes are all below 128. But अर्णव is
      five characters of three bytes each in UTF-8, and Latin-1 reads its 15 bytes as 15
      characters. Nothing tells you that anything went wrong.

  - id: build-truncate
    phase: build
    kind: debug
    concept: E1.6/unicode-and-bytes
    title: Cutting to a limit
    prompt: >-
      A message field allows at most `limit` bytes of UTF-8, so `truncate(text, limit)` should give
      the longest start of `text` that fits. Run the script: it works on English, but stops with
      `UnicodeDecodeError` on Hindi. Fix `truncate` so that it moves the cut back to the start of a
      character, without `errors=`, and still gives the longest start that fits. The tests try every limit on texts in several
      scripts.
    answer:
      type: code
      starter: |
        def truncate(text, limit):
            """The longest start of text whose UTF-8 bytes number at most limit."""
            data = text.encode("utf-8")
            return data[:limit].decode("utf-8")


        print(truncate("hello world", 5))
        print(truncate("नमस्ते दुनिया", 10))
      tests: |
        # ("hello", 0, "") is a tuple, a fixed group of values. for text, limit, expected in ...
        # gives each tuple's three values these three names, one tuple on each pass.
        # text[:len(got)] == got is True when got is a start of text.
        # truncate.__code__.co_consts lists the strings and numbers written in truncate's code.
        def test_english():
            """English text, where every character takes one byte."""
            for text, limit, expected in [("hello world", 5, "hello"), ("hello", 10, "hello"), ("hello", 0, "")]:
                got = truncate(text, limit)
                assert got == expected, f"truncate({text!r}, {limit}) is {got!r}, not {expected!r}."

        def test_hindi():
            """The script's Hindi greeting, cut to 10 bytes."""
            got = truncate("नमस्ते दुनिया", 10)
            assert got == "नमस", f"truncate('नमस्ते दुनिया', 10) is {got!r}, not 'नमस': three characters of three bytes each fit in 10 bytes, and a fourth does not."

        def test_every_limit():
            """Every limit from 0 to past the end, on texts in several scripts."""
            for text in ["नमस्ते दुनिया", "café au lait", "À la carte", "𝑥 + 1 = 2", "日本語"]:
                size = len(text.encode("utf-8"))
                for limit in range(size + 3):
                    # If truncate stops with an error, the message names the text and the limit.
                    try:
                        got = truncate(text, limit)
                    except Exception as e:
                        raise AssertionError(f"truncate({text!r}, {limit}) stops with {type(e).__name__}: {e}")
                    assert type(got) == str, f"truncate({text!r}, {limit}) is {got!r}, not a string."
                    assert text[:len(got)] == got, f"truncate({text!r}, {limit}) is {got!r}, which is not a start of the text."
                    used = len(got.encode("utf-8"))
                    assert used <= limit, f"truncate({text!r}, {limit}) is {got!r}, which takes {used} bytes, more than {limit}."
                    if got != text:
                        longer = text[:len(got) + 1]
                        assert len(longer.encode("utf-8")) > limit, f"truncate({text!r}, {limit}) is {got!r}, but {longer!r} also fits in {limit} bytes."

        def test_no_errors_argument():
            """truncate moves the cut itself, without errors="ignore" or errors="replace"."""
            consts = truncate.__code__.co_consts
            assert "ignore" not in consts and "replace" not in consts, "truncate tells decode to drop or replace the broken character; move the cut back to the start of a character instead."
      reference: |
        def truncate(text, limit):
            """The longest start of text whose UTF-8 bytes number at most limit."""
            data = text.encode("utf-8")
            if limit >= len(data):
                return text
            end = limit
            while end > 0 and data[end] >= 128 and data[end] < 192:
                end = end - 1
            return data[:end].decode("utf-8")


        print(truncate("hello world", 5))
        print(truncate("नमस्ते दुनिया", 10))
      wrong:
        - code: |
            def truncate(text, limit):
                return text[:limit]


            print(truncate("hello world", 5))
            print(truncate("नमस्ते दुनिया", 10))
          why: Cuts at `limit` characters rather than `limit` bytes, so Hindi text keeps up to three times as many bytes as the limit allows.
        - code: |
            def truncate(text, limit):
                data = text.encode("utf-8")
                if limit >= len(data):
                    return text
                end = limit
                while end > 0 and data[end - 1] >= 128 and data[end - 1] < 192:
                    end = end - 1
                return data[:end].decode("utf-8")


            print(truncate("hello world", 5))
            print(truncate("नमस्ते दुनिया", 10))
          why: Looks at the last byte kept instead of the first byte left out, so a cut just after the first byte of a character still breaks it, and `decode` stops Python with `UnicodeDecodeError`.
        - code: |
            def truncate(text, limit):
                return text[:limit // 3]


            print(truncate("hello world", 5))
            print(truncate("नमस्ते दुनिया", 10))
          why: Allows three bytes for every character, which suits Devanagari but cuts English text to a third of what fits.
        - code: |
            def truncate(text, limit):
                data = text.encode("utf-8")
                return data[:limit].decode("utf-8", errors="replace")


            print(truncate("hello world", 5))
            print(truncate("नमस्ते दुनिया", 10))
          why: Puts the mark � in place of the broken character, and the mark is not part of the text and takes three bytes of its own.
        - code: |
            def truncate(text, limit):
                data = text.encode("utf-8")
                end = limit
                while end > 0 and data[end] >= 128 and data[end] < 192:
                    end = end - 1
                return data[:end].decode("utf-8")


            print(truncate("hello world", 5))
            print(truncate("नमस्ते दुनिया", 10))
          why: Looks at `data[limit]` even when the limit reaches the end of the bytes, so it stops Python with `IndexError`.
        - code: |
            def truncate(text, limit):
                """The longest start of text whose UTF-8 bytes number at most limit."""
                data = text.encode("utf-8")
                return data[:limit].decode("utf-8", errors="ignore")


            print(truncate("hello world", 5))
            print(truncate("नमस्ते दुनिया", 10))
          why: Lets `decode` drop the broken character with `errors="ignore"` instead of moving the cut, which hides the break rather than avoiding it.
        - code: |
            def truncate(text, limit):
                """The longest start of text whose UTF-8 bytes number at most limit."""
                data = text.encode("utf-8")
                if limit >= len(data):
                    return text
                end = limit
                while end > 0 and data[end] > 128 and data[end] < 192:
                    end = end - 1
                return data[:end].decode("utf-8")


            print(truncate("hello world", 5))
            print(truncate("नमस्ते दुनिया", 10))
          why: Tests `data[end] > 128`, so a cut just before a continuation byte of 128, as in À, is not moved back, and `decode` stops Python with `UnicodeDecodeError`.
    explanation: >-
      The byte at the cut, `data[limit]` to begin with, is the first byte left out. While it is a
      byte from 128 to 191, which only ever
      continues a character, the cut is inside a character, so the cut moves back one byte, and at
      most three steps reach the start of that character. A limit that reaches the end keeps the
      whole text, and there is no byte after the end to look at.

  # Explain --------------------------------------------------------------------
  - id: explain-text-bytes
    phase: explain
    kind: explain
    concept: E1.6/unicode-and-bytes
    covers: [E1.6/strings-as-sequences, E1.6/files, E1.6/parsing-and-formatting]
    title: What text is made of
    prompt: >-
      Explain to your friend why Python counts six characters in नमस्ते, and why a file needs 18
      bytes to store it: what a string is and what can be done with one, what code points are, how
      UTF-8 turns them into bytes, and why a cut through the bytes can break a character. Then
      explain how a program reads a file of lines and turns them into numbers, what can go wrong on
      the way, and how it turns numbers back into text.
    answer:
      type: text
      rubric:
        - { id: strings, criterion: 'Explains that a string is a sequence of characters that never changes: indexes, slices, `len` and `for` work as on a list, `in` finds a run of characters, and methods give back new strings rather than changing the old one.' }
        - { id: code-points, criterion: 'Explains that Unicode gives each character a number, its code point, and that Python counts code points, which need not match what a reader sees: नमस्ते is three syllables to a reader but six code points, among them a vowel sign and the mark that joins two letters.' }
        - { id: utf8, criterion: 'Explains that UTF-8 writes each code point as one to four bytes, one for a code point below 128 and three for each character of the Devanagari block, so that नमस्ते takes 18; that marker bits at the start of each byte say where a character starts and how many bytes it has; and that a cut through a character leaves bytes that cannot be decoded.' }
        - { id: files, criterion: 'Explains that a file holds bytes, decoded with an encoding when it is read, that the wrong encoding can stop with an error or quietly give the wrong characters, and that each line read keeps its newline, so a line is stripped before it is compared.' }
        - { id: parsing, criterion: 'Explains parsing and formatting: `split` cuts a line into fields, keeping an empty field where a value is missing, `int` and `float` turn fields into numbers, and a format such as `:.3f` or `:,` in an f-string changes how a number is written but not the number.' }
      reference: >-
        A string is a sequence of characters. You can take its length, index it from 0, slice it
        and loop over it as you would a list, and `in` asks whether a run of characters appears in
        it, so "earn" in "learning" is True. Unlike a list, a string never changes: upper and replace
        give back new strings, and assigning to s[0] is an error. Every character has a number, its
        code point, given by Unicode, such as 97 for a and 2,344 for न, and Python's characters are
        code points. नमस्ते looks like three syllables, न, म and स्ते, but स्ते is written with four
        code points: स, the mark ् that joins it to the next letter, त, and the vowel sign े. So
        len counts six. A file stores bytes, numbers from 0 to 255, and UTF-8 turns each code point
        into one to four bytes. Code points below 128, such as the English letters, take one byte,
        and those of the Devanagari block, from 2,304 to 2,431, take three, so hello takes 5 bytes
        and नमस्ते takes 18. The first bits of each byte are markers: a byte that is a whole character starts with 0,
        the first byte of a longer one starts with as many 1s as the character has bytes, and every
        other byte starts with 10. So if you cut the bytes in the middle of a character, the part
        you keep cannot be decoded, and Python stops with UnicodeDecodeError. To read a file, open
        it with its encoding, utf-8. Read it with the wrong one and you may get an error, or worse,
        nonsense with no error at all. Each line you read keeps its newline, so strip it before you
        compare it with anything. split then cuts a line into fields at each comma, keeping an empty
        string where a value is missing, and int and float turn the fields into numbers. To write
        numbers out, use an f-string: {loss:.3f} writes three digits after the point and {step:,}
        puts commas in, but the numbers themselves are unchanged.
      minWords: 100
      maxWords: 400
