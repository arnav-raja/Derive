  - id: build-utf8-length
    phase: build
    kind: build
    concept: E1.6/unicode-and-bytes
    covers: [E1.6/strings-as-sequences]
    title: Bytes without encode
    prompt: >-
      Write the body of `utf8_length(text)`, which works out how many bytes `text` takes in UTF-8
      from the code points of its characters, without `encode`. The tests compare it with `encode`
      on many texts, among them the code points on each side of every change in the number of
      bytes.
    answer:
      type: code
      starter: |
        def utf8_length(text):
            """The number of bytes that text takes in UTF-8, worked out from the code points of its
            characters, without encode."""


        for word in ["hello", "café", "नमस्ते", "𝑥 + 1"]:
            print(word, len(word), utf8_length(word))
      tests: |
        # Each test compares utf8_length with len(text.encode("utf-8")), which counts the bytes themselves.
        def test_examples():
            """The script's four texts, and the empty text."""
            for text in ["hello", "café", "नमस्ते", "𝑥 + 1", ""]:
                got = utf8_length(text)
                expected = len(text.encode("utf-8"))
                assert got == expected, f"utf8_length({text!r}) is {got!r}, not {expected}."

        def test_edges():
            """The code points on each side of every change in the number of bytes."""
            for cp in [0, 127, 128, 2047, 2048, 65535, 65536, 1114111]:
                text = chr(cp)
                got = utf8_length(text)
                expected = len(text.encode("utf-8"))
                assert got == expected, f"utf8_length(chr({cp})) is {got!r}, not {expected}, the number of bytes that UTF-8 gives code point {cp:,}."

        def test_long_text():
            """A text of several hundred characters in several scripts."""
            text = "Derive नमस्ते 日本 𝑥² é " * 20
            got = utf8_length(text)
            expected = len(text.encode("utf-8"))
            assert got == expected, f"utf8_length of a text of {len(text)} characters in several scripts is {got!r}, not {expected}."

        # The function's own names are in utf8_length.__code__.co_names. A generator expression inside
        # it has a code object of its own among utf8_length.__code__.co_consts, with names of its own.
        def test_no_encode():
            """utf8_length works from code points, without encode or bytes."""
            names = list(utf8_length.__code__.co_names)
            for const in utf8_length.__code__.co_consts:
                if type(const) == type(utf8_length.__code__):
                    names = names + list(const.co_names)
            assert "encode" not in names and "bytes" not in names, "utf8_length makes the bytes, with encode or bytes; work the number of bytes out from each character's code point instead."
      reference: |
        def utf8_length(text):
            """The number of bytes that text takes in UTF-8, worked out from the code points of its
            characters, without encode."""
            total = 0
            for ch in text:
                cp = ord(ch)
                if cp < 128:
                    total = total + 1
                elif cp < 2048:
                    total = total + 2
                elif cp < 65536:
                    total = total + 3
                else:
                    total = total + 4
            return total


        for word in ["hello", "café", "नमस्ते", "𝑥 + 1"]:
