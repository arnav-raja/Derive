misconceptions:
  - id: examples-prove
    belief: Checking many cases proves a claim about every case.
    why: >-
      A claim about every whole number covers infinitely many cases, and checks cover only
      finitely many, so the next case can always break it, as $n = 40$ does after forty primes. A
      proof reasons about a letter that stands for any case, so it covers them all at once.
    cue: The learner chooses "forty primes in a row cannot happen by chance" in the puzzle, the first argument in explore-odd-sum or the forty checks in explore-always-odd, or says in the Explain phase that a long enough search proves a claim.
  - id: same-letter
    belief: Two numbers chosen separately can share a letter, as $2k + 1$ and $2k + 1$.
    why: >-
      One letter for both makes the two numbers equal, so the argument covers only an odd integer
      added to itself. 3 and 5 are both odd, but 3 needs $k = 1$ and 5 needs $k = 2$: numbers
      chosen separately need letters of their own.
    cue: The learner chooses the second argument in explore-odd-sum, or "Nothing" in its review about $a = 2k + 1$ and $b = 2k + 1$.
  - id: circular
    belief: Saying the claim again in other words is an argument for it.
    why: >-
      "Odd plus odd is always even, so this sum is even" assumes the very claim it sets out to
      prove. A proof must reach the claim from definitions and results already proved.
    cue: The learner chooses the fourth argument in explore-odd-sum, or "Even plus even is even" in its review.
  - id: partial-cases
    belief: A proof by cases is complete once each case is proved, whatever the cases are.
    why: >-
      The cases must between them cover everything. "$n$ is even" and "$n$ is positive" leave out
      $-3$, which is odd and not positive, so proving those two cases says nothing about it.
      Cases that overlap do no harm, but a gap does.
    cue: The learner chooses "each case is proved" or "the cases overlap" in the review of explore-always-odd, or treats the case $n = 3k + 1$ alone as the whole proof for root three.
  - id: odd-plus-odd-odd
    belief: An odd number plus an odd number is odd.
    why: >-
      $(2j + 1) + (2k + 1) = 2(j + k + 1)$, which is even: the two ones make a two. Odd minus odd
      is even for the same reason.
    cue: The learner chooses "It is not" in explore-always-odd, or "odd minus odd, which is odd" in its review.
  - id: converse-proves
    belief: From "if $P$ then $Q$" and $Q$, it follows that $P$.
    why: >-
      That needs the converse, $Q \Rightarrow P$, a different claim. Wet grass agrees with rain and
      with a sprinkler. The valid forms run from $P$ to $Q$, and from not $Q$ to not $P$.
    cue: The learner calls the team's argument valid in explore-converse-argument, or chooses the converse in explore-which-to-prove.
  - id: inverse-equivalent
    belief: Denying both parts of an if-then, without swapping them, says the same as the original.
    why: >-
      $\neg P \Rightarrow \neg Q$ says the same as the converse, not the original. Only denying both
      parts and swapping them, $\neg Q \Rightarrow \neg P$, keeps the meaning, and that is what a
      proof by the contrapositive proves.
    cue: The learner chooses "If $n^2$ is odd, then $n$ is odd" in explore-which-to-prove, or the inverse in recall-contrapositive.
  - id: contradiction-blames-step
    belief: When a proof by contradiction reaches something impossible, one of its steps must be wrong, or the claim must be false.
    why: >-
      Every step after the supposition was valid, so the only thing that can be false is the
      supposition itself. The supposition was the claim's denial, so the claim is true.
    cue: The learner blames the step about $p^2$ or the squaring in explore-root-two, or chooses "That the claim is false" in its review.
  - id: euclid-number-prime
    belief: Euclid's proof shows that the product of the first primes, plus 1, is always prime.
    why: >-
      The proof shows only that no prime on the list divides $N$, so the prime factors of $N$ are
      missing from the list. $N$ itself may be prime or not: $30{,}031 = 59 \times 509$.
    cue: The learner chooses "always prime" or "no prime up to 13 divides it" in explore-euclid, or returns Euclid's number itself from `new_prime` in build-euclid.
  - id: divide-by-expression
    belief: Both sides of an equation may always be divided by the same expression.
    why: >-
      Division is allowed only by something that is not 0. In the "proof" that $2 = 1$, $a - b$ is
      0, and $(a + b) \times 0 = b \times 0$ holds whatever $a + b$ and $b$ are.
    cue: The learner picks a step other than step 5 in explore-one-is-two, or keeps only $x = 3$ in its review.
  - id: sqrt-bound-strict
    belief: A search for a factor of $n$ may stop below $\sqrt{n}$, leaving out $\sqrt{n}$ itself.
    why: >-
      The proof gives a factor $d$ with $d \le \sqrt{n}$, and $d$ may equal $\sqrt{n}$, as for
      $49 = 7 \times 7$. So the search must try `isqrt(n)` itself: `range(2, isqrt(n))` stops one
      short, and calls 49 prime.
    cue: The learner concludes $d < \sqrt{n}$ in derive-small-factor, writes `range(2, isqrt(n))` in build-prime-test, or predicts `False False` or `True False` in build-break-square.
  - id: early-not-found
    belief: A search may give its "not found" answer as soon as one value fails the test.
    why: >-
      A search has found nothing only after it has tried every value, so the "not found" answer
      belongs after the loop, not in an `else` inside it.
    cue: The learner returns `n` in an `else` inside the loop in build-prime-test, or `None` inside the loop in build-first-failure.

exercises:
  derive-odd-square:
    rungs:
      - What is $(2k + 1)^2$ multiplied out, and how much of it can be written as 2 times something?
      - >-
        In Recall, $(2k + 1)^2$ was multiplied out term by term, and in Explore the sum
        $2j + 2k + 2$ became $2(j + k + 1)$ by taking out the factor 2.
      - >-
        Try $k = 1$: then $n = 3$, and $n^2 = 9 = 2m + 1$. What is $m$? Try $k = 2$ as well, and
        check that your expression gives both.
      - >-
        If you multiplied out to $4k^2 + 4k + 1$, that part is right, and the trouble is in reading
        off $m$: the $+ 1$ stays outside $2m$, and $m$ is what is left once the factor 2 is taken out
        of the rest. If your expression gives the wrong $m$ at $k = 1$, check the middle term of the
        multiplying out.
      - >-
        With $n = 2k$, to write $n^2$ in the form $2m$: $n^2 = 4k^2 = 2(2k^2)$, so $m = 2k^2$, an
        integer whenever $k$ is one, and $n^2$ is even.
    notes: >-
      $4k^2 + 4k$ is $2m$, not $m$: the factor 2 is still in it. An answer with $+ 1$ keeps the 1,
      which sits outside $2m$. $k^2 + k$ takes out a factor of 4 instead of 2. $2k^2 + k$ and
      $4k^2 + 2k$ come from multiplying out with one middle term, $4k^2 + 2k + 1$. $4k^2 + 4k + 1$
      is $n^2$ itself. The checker compares values at whole numbers $k$, so a factorised form is
      accepted.
  derive-contrapositive-proof:
    rungs:
      - For each line, what changed from the line above, and which rule allows exactly that change?
      - >-
        In Explore, "if $n^2$ is even, then $n$ is even" was turned round, and even and odd were
        defined as $n = 2k$ and $n = 2k + 1$ for some integer $k$.
      - >-
        Look at the first two lines alone. The first changes which statement is to be proved, and
        the second only puts "not even" in other words. Which rule does each?
      - >-
        If your rule for the first line lets a proof prove another statement in place of the claim,
        that part is right, and the trouble is in a later line: for each, say whether a word became a
        formula, a formula was rewritten, or a formula was read back as a word, and find the rule
        that does exactly that. If your first line uses Contradiction, look again: this proof never
        supposes that the claim is false.
      - >-
        To show that the sum of two even integers is even: $a = 2j$ and $b = 2k$ for integers $j$
        and $k$, by the definition of even; $a + b = 2j + 2k = 2(j + k)$, by taking out a factor; and
        $a + b$ is even, since $j + k$ is an integer.
    notes: >-
      Contradiction for the first line mistakes proving the contrapositive for supposing the claim
      false. Odd for the second line misses that the line only rewords not even as odd, and the
      definition comes in the next line. Even for the last line reads the result by the wrong
      definition, since $2(\dots) + 1$ is the form of an odd integer. Multiply out for the fifth line
      misses that the bracket was put in, by taking out the factor 2, not opened.
  derive-root-two:
    rungs:
      - For each line, what changed from the lines above, and which rule allows exactly that change?
      - >-
        In Explore, the same reasoning was written out in words, from $p^2 = 2q^2$ to $p$ and $q$
        both even, and each of its steps is one of the rules listed here.
      - >-
        Take the lines about $p$ first, lines 1 to 4. Then lines 6 to 8 do for $q$ what lines 1 to 3
        did for $p$, so the same rules come back in the same order.
      - >-
        If your rules for lines 1 to 4 are right, the pattern is right, and the trouble is later: ask
        in line 5 what happened to $p$, in line 6 what was done to both sides, and in line 9 what the
        start said that the line now denies. If one of lines 1 to 4 is wrong, ask for each whether it
        does something to both sides, reads an equation by a definition, or uses a result proved
        earlier: "$p^2$ is even" needs only the definition, since $q^2$ is an integer.
      - >-
        Suppose that $\frac{a}{b} = 3$, with $b \neq 0$. Multiplying both sides by $b$ gives
        $a = 3b$, by the same on both sides. If also $b = 2c$, replacing $b$ gives $a = 6c$, by
        substituting, and $a = 2(3c)$ is even by the definition, since $3c$ is an integer.
    notes: >-
      Contrapositive for line 3 or line 8 cites the rule used inside the proof of the even-square
      result, not the result itself. Even square for line 2 or line 7 uses the result where only the
      definition is needed, since $p^2 = 2q^2$ is already 2 times an integer. Even for line 3 or
      line 8 skips the result: the definition says what an even number is, not that a number with an
      even square is even. Same on both sides for line 5 misses that $p$ was replaced by $2r$, and
      Substitute for line 6 misses that both sides were divided by 2.
  derive-three-square:
    rungs:
      - What is $(3k + 2)^2$ multiplied out, and how can it be split into a multiple of 3 plus 1?
      - >-
        Just before this exercise, the first case, $n = 3k + 1$, gave
        $n^2 = 9k^2 + 6k + 1 = 3(3k^2 + 2k) + 1$, and at the start of this phase an odd square was
        written as $2m + 1$ in the same way.
      - >-
        Try $k = 0$: then $n = 2$, and $n^2 = 4 = 3m + 1$, so $m = 1$. Try $k = 1$, where $n = 5$:
        what is $m$ there? Check that your expression gives both.
      - >-
        If you multiplied out to $9k^2 + 12k + 4$, that part is right, and the trouble is in the
        constant: only the 1 of $3m + 1$ may sit outside the multiple of 3, so ask where the rest of
        the 4 must go.
      - >-
        With $n = 5k + 3$, to write $n^2$ in the form $5m + 4$:
        $n^2 = 25k^2 + 30k + 9 = 25k^2 + 30k + 5 + 4 = 5(5k^2 + 6k + 1) + 4$, so
        $m = 5k^2 + 6k + 1$.
    notes: >-
      $3k^2 + 4k$ treats $n^2$ as $3m + 4$, forgetting that 3 of the 4 belong to the multiple of 3.
      $9k^2 + 12k + 3$ is $3m$, not $m$, and $9k^2 + 12k + 4$ is $n^2$ itself. $3k^2 + 2k$ is the
      first case's $m$. $3k^2 + 12k + 1$ divides only the first term by 3. The checker compares
      values at whole numbers $k$, so a factorised form is accepted.
  derive-small-factor:
    rungs:
      - What does "not prime" give you to work with, and what would be true of $ab$ if $a$ and $b$ were both greater than $\sqrt{n}$?
      - >-
        In Explore, a proof by contradiction supposed the opposite of its claim and reasoned until a
        statement and its denial were both true. Just before this exercise, two inequalities between
        positive numbers were multiplied.
      - >-
        Try $n = 36$, where $\sqrt{36} = 6$. If $a$ and $b$ were whole numbers both greater than 6,
        how small could $ab$ be, and could it be 36?
      - >-
        If your proof writes $n = ab$ and supposes that both factors are greater than $\sqrt{n}$,
        that is the right start, and what is left is to multiply the two inequalities, compare the
        result with $n$, and say what the contradiction shows about $a$ and $b$. If it starts
        elsewhere, begin from what "not prime" gives: two whole numbers, each at least 2, whose
        product is $n$.
      - >-
        To prove that if $x + y > 10$, then $x > 5$ or $y > 5$: suppose, for a contradiction, that
        $x \le 5$ and $y \le 5$. Adding the two inequalities gives $x + y \le 10$, which denies
        $x + y > 10$. So the supposition is false, and $x > 5$ or $y > 5$.
    notes: >-
      The setup needs $a$ and $b$ each at least 2, since $n = 1 \times n$ always holds and gives no
      small factor. Multiplying the inequalities is allowed because every number in them is
      positive, and an answer should say so. A conclusion of $d < \sqrt{n}$ is too strong: $49 = 7
      \times 7$ has no factor below 7. Supposing only that $a > \sqrt{n}$ proves nothing, since one
      factor may be large. Checking examples such as 36 and 100 is evidence, not the proof.
  build-prime-test:
    rungs:
      - >-
        For `smallest_factor`, which values of `d` must the loop try, what does it do when one
        divides `n`, and what does it give when none does? For `is_prime`, what two things must be
        true of a prime?
      - >-
        At the start of this phase, `first_even` returned the first `k` that passed its test from
        inside the loop, and `None` after the loop. The Derive phase proved that a search for a
        factor may stop at $\sqrt{n}$, with $d \le \sqrt{n}$.
      - >-
        Work out `smallest_factor(91)` by hand: `isqrt(91)` is 9, so which `d` from 2 to 9 is the
        first to divide 91? Then do the same for 97.
      - >-
        If test_smallest_factor passes, the loop and its test are right, and the trouble is at an
        edge. If test_square_root_itself fails, `range` stops before its second number, so ask
        whether `isqrt(n)` itself is tried. If test_prime_is_its_own_factor fails, check where
        `return n` sits: it belongs after the loop, once every `d` has failed. If test_below_two
        fails, `is_prime` needs a second condition. If test_large_prime runs too long, the search
        goes past `isqrt(n)`.
      - >-
        To find the first multiple of 7 from `a` to `b`, both included: `for k in range(a, b + 1):`,
        then `if k % 7 == 0:` and `return k` inside the loop, and `return None` after it, which runs
        only when no `k` passed. The `+ 1` is what makes `b` itself one of the values tried.
    notes: >-
      `range(2, isqrt(n))` stops one short and calls prime every number whose smallest factor is
      `isqrt(n)`, such as 4, 6, 9 and 1,681: it fails test_smallest_factor, test_square_root_itself
      and test_primes_below_sixty. Leaving out `n >= 2` fails test_primes_below_sixty and
      test_below_two, since 0 and 1 come out as their own smallest factor. A `return n` in an `else`
      inside the loop gives `n` as soon as 2 fails to divide it, and fails test_smallest_factor,
      test_square_root_itself and test_primes_below_sixty. A search up to `n` gives right answers
      but is stopped for running too long on 999,983 and 10,000,019, failing
      test_prime_is_its_own_factor and test_large_prime.
  build-first-failure:
    rungs:
      - Which values of `n` must the search try, what does it check for each, what does it give as soon as one fails, and what does it give if none does?
      - >-
        At the start of this phase, `first_even` returned the first `k` that passed its test from
        inside the loop, and `None` after the loop, and `twice` called the function it was given as
        `f(x)`.
      - >-
        Try a small case by hand: for $f(n) = n + 2$ and a limit of 10, $f(0) = 2$ and $f(1) = 3$
        are prime and $f(2) = 4$ is not. What should the search give: the $n$, or the value?
      - >-
        If test_euler passes, the loop and its test are right, and the trouble is at an edge: check
        that the search starts at 0, and that `None` comes only after the loop. If test_euler gets
        1,681, the code gives the formula's value instead of `n`. If it gets 0, ask whether the code
        tests `f(n)` or `n` itself. If test_filled fails, look at where `return None` sits.
      - >-
        To find the first word in a list `words` that is longer than 5 letters:
        `for w in words:`, then `if len(w) > 5:` and `return w` inside the loop, and `return None`
        after it. A function passed in is called like any other: if `check` is a function,
        `check(w)` runs it on `w`.
    notes: >-
      Returning `f(n)` gives 1,681 for the puzzle's formula, and fails test_euler, test_moved_along
      and test_starts_at_zero. Starting at 1 fails only test_starts_at_zero. A `return None` inside
      the loop gives `None` at once, since $f(0) = 41$ is prime, and fails test_filled, test_euler,
      test_moved_along and test_starts_at_zero. Testing `is_prime(n)` gives 0, since 0 is not prime,
      and fails test_euler, test_no_failure, test_moved_along and test_starts_at_zero.
  build-euclid:
    rungs:
      - What does `prod` give for a list, and what must be added to it? Then which function, already written, finds the smallest factor of a number?
      - >-
        Just before this exercise, `prod([2, 3, 5])` was 30. In Explore, Euclid's number was the
        product of the primes on the list, plus 1, and `smallest_factor` was written in the first
        exercise of this phase.
      - >-
        Work out the starter's first line by hand: for `[2, 3, 5]`, what is Euclid's number, and
        what is its smallest factor? Then do the same for `[3, 5]`.
      - >-
        If test_small passes, `euclid_number` is right, and the trouble is in `new_prime`: ask which
        number's smallest factor it should find, and remember that Euclid's number need not be prime.
        If test_small fails, compare `euclid_number([2, 3])` with 7, and check both that it
        multiplies and that it adds the 1.
      - >-
        To give the largest number in a list `xs`, plus 1, write `max(xs) + 1`, and to ask whether
        that number is prime, pass it straight to the function that answers: `is_prime(max(xs) + 1)`.
    notes: >-
      `prod(primes)` without the 1 fails test_small, test_six, test_missing and test_any_list, since
      every prime on the list divides it. Returning Euclid's number itself from `new_prime` fails
      test_six, test_missing and test_any_list, since 30,031 and 16 are not prime. `sum(primes) + 1`
      fails test_small, test_six, test_missing and test_any_list. The smallest factor of
      `prod(primes)` is the smallest prime on the list, and fails test_six, test_missing and
      test_any_list.

novice:
  - Why are a million checked cases not enough, when no one could ever check that many by hand?
  - If a proof uses a letter such as $k$, how can it be about every number at once?
  - Why does proving "if $n$ is odd, then $n^2$ is odd" also prove "if $n^2$ is even, then $n$ is even"?
  - In a proof by contradiction, how do you know that the supposition went wrong, and not one of the steps?
  - Why does Euclid's proof not show that his number is prime, when no prime on the list divides it?
