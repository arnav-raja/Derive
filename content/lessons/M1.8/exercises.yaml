      reference: |
        from math import isqrt

        def smallest_factor(n):
            """The smallest whole number from 2 up that divides n, for a whole number n of at
            least 2. When no d from 2 to isqrt(n) divides n, n is prime and is its own smallest
            factor."""
            for d in range(2, isqrt(n) + 1):
                if n % d == 0:
                    return d
            return n

        def is_prime(n):
            """True when n is prime: a whole number of at least 2 whose smallest factor is itself."""
            return n >= 2 and smallest_factor(n) == n

        print(smallest_factor(91), smallest_factor(97))
        print(is_prime(97), is_prime(91), is_prime(1))
