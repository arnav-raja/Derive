    kind: proof
    concept: M1.8/direct-proof
    title: Odd times odd
    prompt: Prove that the product of any two odd integers is odd.
    answer:
      type: text
      rubric:
        - { id: letters, criterion: 'Writes each of the two odd integers out by the definition of odd, with a letter of its own.' }
        - { id: multiply, criterion: 'Multiplies the product out correctly.' }
        - { id: form, criterion: 'Puts the product in the form that the definition of odd asks for, and says why the part that 2 multiplies is an integer.' }
        - { id: conclude, criterion: 'Concludes, by the definition of odd, that the product is odd, for every pair at once.' }
