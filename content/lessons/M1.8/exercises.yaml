        from math import isqrt, prod

        def smallest_factor(n):
            for d in range(2, isqrt(n) + 1):
                if n % d == 0:
                    return d
            return n

        def is_prime(n):
            return n >= 2 and smallest_factor(n) == n

        def euclid_number(primes):
            """The product of the primes in the list primes, plus 1."""
            return None

        def new_prime(primes):
            """The smallest factor of euclid_number(primes): a prime that is not in the list."""
            return None

        print(euclid_number([2, 3, 5]), new_prime([2, 3, 5]))
        print(euclid_number([2, 3, 5, 7, 11, 13]), new_prime([2, 3, 5, 7, 11, 13]))
      tests: |
        FIRST = [2, 3, 5, 7, 11, 13, 17, 19]

        def test_filled():
            """euclid_number and new_prime both give an answer, not None."""
            assert euclid_number([2, 3]) is not None, "Replace the None in euclid_number."
            assert new_prime([2, 3]) is not None, "Replace the None in new_prime."

        def test_small():
            """Euclid's numbers for the first one, two and three primes are 3, 7 and 31."""
            for primes, right in (([2], 3), ([2, 3], 7), ([2, 3, 5], 31)):
                got = euclid_number(primes)
                assert got == right, f"euclid_number({primes}) gives {got}, not {right}."

        def test_six():
            """For the first six primes, Euclid's number is 30,031, whose smallest factor is 59."""
            got = euclid_number(FIRST[:6])
            assert got == 30031, f"euclid_number({FIRST[:6]}) gives {got}, not 30031."
            got = new_prime(FIRST[:6])
            assert got == 59, f"new_prime({FIRST[:6]}) gives {got}, not 59: 30,031 = 59 × 509 is not prime, and its smallest factor is 59."

        def test_missing():
            """For each of the first eight lists of primes, new_prime is a prime missing from the list."""
            for k in range(1, 9):
                primes = FIRST[:k]
                got = new_prime(primes)
                assert is_prime(got), f"new_prime({primes}) gives {got}, which is not prime."
                assert got not in primes, f"new_prime({primes}) gives {got}, which is in the list."

        def test_any_list():
            """The argument works for any list of primes: for [3, 5] the number is 16, and 2 is missing from the list."""
            got = euclid_number([3, 5])
            assert got == 16, f"euclid_number([3, 5]) gives {got}, not 16."
            got = new_prime([3, 5])
            assert got == 2, f"new_prime([3, 5]) gives {got}, not 2."

        def test_list_unchanged():
            """The list given is left as it was."""
            primes = [2, 3, 5]
            euclid_number(primes)
            new_prime(primes)
            assert primes == [2, 3, 5], f"After the calls, the list is {primes}, not [2, 3, 5]."
