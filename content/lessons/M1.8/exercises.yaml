  - id: derive-small-factor
    phase: derive
    kind: proof
    concept: M1.8/contradiction
    title: A factor below the square root
    prompt: >-
      Prove that every whole number $n$ of at least 2 that is not prime has a factor $d$ with
      $2 \le d \le \sqrt{n}$. Start from what "not prime" means, write $n = ab$, and suppose, for a
      contradiction, that $a$ and $b$ are both greater than $\sqrt{n}$.
    answer:
      type: text
      rubric:
        - { id: setup, criterion: 'Writes $n = ab$ with whole numbers $a$ and $b$, each at least 2 and less than $n$, because $n$ is at least 2 and not prime.' }
        - { id: suppose, criterion: 'Supposes, for a contradiction, that $a > \sqrt{n}$ and $b > \sqrt{n}$.' }
        - { id: multiply, criterion: 'Multiplies the two inequalities, which is allowed because every number in them is positive, to get $ab > \sqrt{n} \times \sqrt{n} = n$.' }
        - { id: contradiction, criterion: 'Says that $ab > n$ contradicts $ab = n$, so the supposition is false.' }
        - { id: conclude, criterion: 'Concludes that $a \le \sqrt{n}$ or $b \le \sqrt{n}$, so one of them is a factor $d$ with $2 \le d \le \sqrt{n}$.' }
      reference: >-
        Since $n$ is at least 2 and not prime, it has a factor other than 1 and $n$, so $n = ab$ for
        whole numbers $a$ and $b$ with $2 \le a \le n - 1$ and $2 \le b \le n - 1$. Suppose, for a
        contradiction, that $a > \sqrt{n}$ and $b > \sqrt{n}$. Every number in these two inequalities
        is positive, so they can be multiplied, giving $ab > \sqrt{n} \times \sqrt{n} = n$. But
        $ab = n$, and $n > n$ is impossible. So the supposition is false: $a \le \sqrt{n}$ or
        $b \le \sqrt{n}$. Whichever it is, that number is a factor $d$ of $n$ with $2 \le d \le \sqrt{n}$.
        So to test whether $n$ is prime, it is enough to try the divisors from 2 to $\sqrt{n}$: if none
        of them divides $n$, then $n$ is prime.
      minWords: 40
      maxWords: 250

