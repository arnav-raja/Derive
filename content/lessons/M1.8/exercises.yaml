  - id: explain-proof
    phase: explain
    kind: explain
    concept: M1.8/proof
    covers: [M1.8/direct-proof, M1.8/contrapositive-proof, M1.8/contradiction]
    title: Forty primes and a proof, simply
    prompt: >-
      Explain to your friend why forty primes in a row prove nothing about every whole number, and
      how anyone can see without a computer that $n^2 + n + 41$ is not prime at $n = 41$. Say what a
      proof does that checking cannot. Then walk your friend through the proof that $\sqrt{2}$ is not
      a fraction: where it supposes the opposite of what it proves, where it uses the claim about
      even squares and how that claim was proved, and where the contradiction comes.
    answer:
      type: text
      rubric:
        - { id: evidence, criterion: 'Says that agreeing cases are evidence and not proof: however many are checked, the next one could break a claim about every whole number, as $n = 40$ and $n = 41$ do here.' }
        - { id: forty-one, criterion: 'Shows that at $n = 41$ every term has a factor of 41, so the value is $41 \times 43$, which is not prime.' }
        - { id: proof, criterion: 'Says that a proof reasons from definitions about a letter that stands for any case, each step justified, so that it covers every case at once.' }
        - { id: suppose, criterion: 'Begins the proof for $\sqrt{2}$ by supposing the opposite, $\sqrt{2} = \frac{p}{q}$ with integers $p$ and $q$ not both even, and says why lowest terms costs nothing.' }
        - { id: chain, criterion: 'Gives the chain from $p^2 = 2q^2$ to $p$ even, $q^2 = 2r^2$ and $q$ even, using "if $n^2$ is even, then $n$ is even", proved by its contrapositive: an odd $n = 2k + 1$ has an odd square.' }
        - { id: contradiction, criterion: 'Names the contradiction, $p$ and $q$ both even against not both even, and concludes that the supposition is false, so $\sqrt{2}$ is not a fraction.' }
      reference: >-
        Forty primes in a row feel like a law, but they are forty cases, and the claim is about every
        whole number, of which there are infinitely many. However many cases agree, the next one could
        be the exception, and here it is: at $n = 41$ every term of $41^2 + 41 + 41$ has a factor of
        41, so the value is $41 \times 43$, which is not prime. In fact $n = 40$ already fails, since
        $40^2 + 40 + 41 = 41 \times 41$. Checking can only ever cover finitely many cases. A proof
        works differently: it reasons about a letter, $n$, that stands for any whole number, starting
        from definitions and justifying each step, so whatever it shows holds for every case at once.
        Here is one. To prove that $\sqrt{2}$ is not a fraction, suppose the opposite: $\sqrt{2} =
        \frac{p}{q}$ for integers $p$ and $q$. We may take the fraction in lowest terms, so that $p$
        and $q$ are not both even, since halving both while they are even keeps the value and must
        stop. Squaring gives $p^2 = 2q^2$, so $p^2$ is even. Now use a claim proved earlier: if $n^2$
        is even, then $n$ is even. It was proved by its contrapositive, "if $n$ is odd, then $n^2$ is
        odd", which says the same: an odd $n$ is $2k + 1$, and its square is $4k^2 + 4k + 1 =
        2(2k^2 + 2k) + 1$, which is odd. So $p$ is even, $p = 2r$, and then $4r^2 = 2q^2$, so
        $q^2 = 2r^2$ is even, and $q$ is even too. Now $p$ and $q$ are both even, which contradicts
        the supposition that they are not both even. Every step was valid, so the supposition must be
        false: no fraction equals $\sqrt{2}$.
