            from math import isqrt

            def smallest_factor(n):
                for d in range(2, isqrt(n)):
                    if n % d == 0:
                        return d
                return n

            def is_prime(n):
                return n >= 2 and smallest_factor(n) == n
          why: Stops one divisor short, so it never tries isqrt(n), and calls prime every number whose smallest factor is isqrt(n), such as 4, 6, 9 and 1,681.
        - code: |
            from math import isqrt

            def smallest_factor(n):
                for d in range(2, isqrt(n) + 1):
                    if n % d == 0:
                        return d
                return n

            def is_prime(n):
                return smallest_factor(n) == n
          why: Leaves out n >= 2, so 0 and 1, which come out as their own smallest factor, count as prime.
        - code: |
            from math import isqrt

            def smallest_factor(n):
                for d in range(2, isqrt(n) + 1):
                    if n % d == 0:
                        return d
                    else:
                        return n
                return n

            def is_prime(n):
                return n >= 2 and smallest_factor(n) == n
          why: Gives n as soon as the first d fails to divide it, instead of after trying every d.
        - code: |
            def smallest_factor(n):
                for d in range(2, n):
                    if n % d == 0:
                        return d
                return n

            def is_prime(n):
                return n >= 2 and smallest_factor(n) == n
          why: Tries every d up to n, which gives the right answers but runs out of steps on a prime as large as 10,000,019.
    explanation: >-
      `for d in range(2, isqrt(n) + 1)` tries every divisor up to and including `isqrt(n)`, the first
      `d` with `n % d == 0` is returned at once, and `n` is returned when none divides it. Then
      `is_prime(n)` is `n >= 2 and smallest_factor(n) == n`.

