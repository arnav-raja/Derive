        definition of odd, with a letter for each, since the two need not be equal. Multiplying
        out, $ab = 4jk + 2j + 2k + 1 = 2(2jk + j + k) + 1$. Since $j$ and $k$ are integers, so is
        $2jk + j + k$, so $ab$ is 2 times an integer, plus 1, and is odd by the definition. The
        letters stood for any integers, so this covers every pair of odd integers.
      minWords: 30
      maxWords: 200
    explanation: >-
      Let $a = 2j + 1$ and $b = 2k + 1$, for integers $j$ and $k$, by the definition of odd, with a
      letter for each. Then $ab = 4jk + 2j + 2k + 1 = 2(2jk + j + k) + 1$. Sums and products of
      integers are integers, so $2jk + j + k$ is one, and $ab$ is odd by the definition. The letters
      stand for any integers, so the proof covers every pair.

  - id: derive-root-two
    phase: derive
    kind: proof
    concept: M1.8/contradiction
    covers: [M1.8/contrapositive-proof]
    title: Root two is not a fraction
    prompt: >-
      Here is the proof that $\sqrt{2}$ is not a fraction. Each line follows from the lines above
      it. Choose the rule that justifies each line. A rule may be used more than once or not at
      all.
    answer:
      type: steps
      rules:
        - { id: def-even, name: Even, label: 'An integer is even when it is $2k$ for some integer $k$.' }
        - { id: even-square, name: Even square, label: 'If $n^2$ is even, then $n$ is even, as proved above.' }
        - { id: contrapositive, name: Contrapositive, label: '$P \Rightarrow Q$ says the same as $\neg Q \Rightarrow \neg P$.' }
        - { id: contradiction, name: Contradiction, label: 'If supposing a statement leads to a statement and its denial, the supposition is false.' }
        - { id: both-sides, name: Same on both sides, label: 'Doing the same to both sides of an equation, such as squaring them, or multiplying or dividing them by the same number other than 0, keeps it true.' }
        - { id: substitute, name: Substitute, label: 'A letter may be replaced by what it equals.' }
      start: '\text{Suppose } \sqrt{2} = \tfrac{p}{q}\text{, with } p, q \text{ integers, } q \neq 0\text{, in lowest terms, so not both even.}'
      lines:
        - math: 'p^2 = 2q^2'
          rule: both-sides
        - math: 'p^2 \text{ is even}'
          rule: def-even
        - math: 'p \text{ is even}'
          rule: even-square
        - math: 'p = 2r \text{ for some integer } r'
          rule: def-even
        - math: '(2r)^2 = 2q^2 \text{, that is, } 4r^2 = 2q^2'
          rule: substitute
        - math: 'q^2 = 2r^2'
          rule: both-sides
        - math: 'q^2 \text{ is even}'
          rule: def-even
        - math: 'q \text{ is even}'
          rule: even-square
        - math: 'p \text{ and } q \text{ are both even, against the start, so } \sqrt{2} \text{ is not a fraction}'
          rule: contradiction
    explanation: >-
      Square both sides and multiply them by $q^2$, read $p^2 = 2q^2$ by the definition of even, use
      the result proved above to get $p$ even, write $p = 2r$ by the definition, substitute, halve
      both sides, and do the same again for $q$. Then the start, which said not both even, is
      contradicted. The contrapositive is not cited, since it was used inside the proof of the
      even-square result.

