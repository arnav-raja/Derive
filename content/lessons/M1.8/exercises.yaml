    answer:
      type: code
      starter: |
        from math import isqrt

        def smallest_factor(n):
            for d in range(2, isqrt(n) + 1):
                if n % d == 0:
                    return d
            return n

        def is_prime(n):
            return n >= 2 and smallest_factor(n) == n

        def first_failure(f, limit):
            """The first whole number n from 0 up to, but not including, limit for which f(n) is
            not prime, or None when f(n) is prime for every such n."""
            return None

        def euler(n):
