  - id: derive-small-factor
    phase: derive
    kind: proof
    concept: M1.8/contradiction
    title: A factor up to the square root
    prompt: >-
      Prove that every whole number $n$ of at least 2 that is not prime has a factor $d$ with
      $2 \le d \le \sqrt{n}$. Start from what "not prime" means, argue by contradiction, and justify
      each step.
    answer:
      type: text
      rubric:
        - { id: setup, criterion: 'Writes out what "not prime" gives: $n$ as a product of two whole numbers, each at least 2.' }
        - { id: suppose, criterion: 'Supposes, for a contradiction, that the claim is false, and says what that supposition means for the two factors.' }
        - { id: multiply, criterion: 'Reasons from the supposition to something that cannot be true, and says why each step is allowed.' }
        - { id: contradiction, criterion: 'Says what that contradicts, and so which statement is false.' }
        - { id: conclude, criterion: 'Concludes with a factor $d$ in the range asked for.' }
      reference: >-
        Since $n$ is at least 2 and not prime, it has a factor other than 1 and $n$, so $n = ab$ for
        whole numbers $a$ and $b$, each at least 2. Suppose, for a
        contradiction, that $a > \sqrt{n}$ and $b > \sqrt{n}$. Every number in these two inequalities
        is positive, so they can be multiplied, giving $ab > \sqrt{n} \times \sqrt{n} = n$. But
        $ab = n$, and $n > n$ is impossible. So the supposition is false: $a \le \sqrt{n}$ or
        $b \le \sqrt{n}$. Whichever it is, that number is a factor $d$ of $n$ with $2 \le d \le \sqrt{n}$.
        So to test whether $n$ is prime, it is enough to try the divisors from 2 to $\sqrt{n}$: if none
        of them divides $n$, then $n$ is prime. A proof may instead suppose that no whole number from 2
        to $\sqrt{n}$ divides $n$, which makes both $a$ and $b$ greater than $\sqrt{n}$, and go on in
        the same way.
      minWords: 40
      maxWords: 250
    explanation: >-
      Since $n$ is at least 2 and not prime, $n = ab$ for whole numbers $a$ and $b$, each at least 2.
      Suppose, for a contradiction, that $a > \sqrt{n}$ and $b > \sqrt{n}$. All four numbers in these
      inequalities are positive, so they can be multiplied: $ab > \sqrt{n} \times \sqrt{n} = n$. That
      contradicts $ab = n$, so the supposition is false, and $a \le \sqrt{n}$ or $b \le \sqrt{n}$.
      Whichever it is, it is a factor $d$ of $n$ with $2 \le d \le \sqrt{n}$.

