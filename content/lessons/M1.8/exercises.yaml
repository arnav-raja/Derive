    answer:
      type: steps
      rules:
        - { id: def-even, name: Even, label: 'An integer is even when it is $2k$ for some integer $k$.' }
        - { id: even-square, name: Even square, label: 'If $n^2$ is even, then $n$ is even, as proved above.' }
        - { id: contrapositive, name: Contrapositive, label: '$P \Rightarrow Q$ says the same as $\neg Q \Rightarrow \neg P$.' }
        - { id: contradiction, name: Contradiction, label: 'If supposing a statement leads to a statement and its denial, the supposition is false.' }
        - { id: both-sides, name: Same on both sides, label: 'Doing the same to both sides of an equation, such as squaring them, or multiplying or dividing them by the same number other than 0, keeps it true.' }
        - { id: substitute, name: Substitute, label: 'A letter may be replaced by what it equals.' }
      start: '\text{Suppose } \sqrt{2} = \tfrac{p}{q}\text{, with } p, q \text{ integers, } q \neq 0\text{, not both even.}'
      lines:
        - math: 'p^2 = 2q^2'
          rule: both-sides
        - math: 'p^2 \text{ is even}'
          rule: def-even
        - math: 'p \text{ is even}'
          rule: even-square
        - math: 'p = 2r \text{ for some integer } r'
          rule: def-even
        - math: '4r^2 = 2q^2'
          rule: substitute
        - math: 'q^2 = 2r^2'
          rule: both-sides
        - math: 'q^2 \text{ is even}'
          rule: def-even
        - math: 'q \text{ is even}'
          rule: even-square
        - math: 'p \text{ and } q \text{ are both even, against the start, so } \sqrt{2} \text{ is not a fraction}'
          rule: contradiction
    explanation: >-
      Square both sides and multiply them by $q^2$, read $p^2 = 2q^2$ by the definition of even, use
      the result proved above to get $p$ even, write $p = 2r$ by the definition, substitute, halve
      both sides, and do the same again for $q$. Then the start, which said not both even, is
      contradicted. The contrapositive is not cited, since it was used inside the proof of the
      even-square result.

