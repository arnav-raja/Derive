  - id: derive-contrapositive-proof
    phase: derive
    kind: proof
    concept: M1.8/contrapositive-proof
    covers: [M1.8/direct-proof]
    title: If the square is even
    prompt: >-
      Here is a proof that, for every integer $n$, if $n^2$ is even, then $n$ is even. Each line
      follows from the lines above it. Choose the rule that justifies each line. A rule may be used
      more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: def-even, name: Even, label: 'An integer is even when it is $2k$ for some integer $k$.' }
        - { id: def-odd, name: Odd, label: 'An integer is odd when it is $2k + 1$ for some integer $k$.' }
        - { id: not-even, name: Not even is odd, label: 'An integer that is not even is odd, and one that is not odd is even.' }
        - { id: contrapositive, name: Contrapositive, label: '$P \Rightarrow Q$ says the same as $\neg Q \Rightarrow \neg P$, so proving one proves the other.' }
        - { id: contradiction, name: Contradiction, label: 'If supposing a statement leads to a statement and its denial, the supposition is false.' }
        - { id: multiply-out, name: Multiply out, label: 'Multiplying out a bracket gives an equal expression.' }
        - { id: factor, name: Take out a factor, label: 'Taking a common factor out of several terms gives an equal expression, as $2a + 2b = 2(a + b)$.' }
      start: '\text{Claim: if } n^2 \text{ is even, then } n \text{ is even.}'
      lines:
        - math: '\text{It is enough to prove: if } n \text{ is not even, then } n^2 \text{ is not even.}'
          rule: contrapositive
        - math: '\text{That is: if } n \text{ is odd, then } n^2 \text{ is odd. Suppose that } n \text{ is odd.}'
          rule: not-even
        - math: 'n = 2k + 1 \text{ for some integer } k'
          rule: def-odd
        - math: 'n^2 = 4k^2 + 4k + 1'
          rule: multiply-out
        - math: 'n^2 = 2(2k^2 + 2k) + 1'
          rule: factor
        - math: 'n^2 \text{ is odd, since } 2k^2 + 2k \text{ is an integer}'
          rule: def-odd
    explanation: >-
      The proof swaps the claim for its contrapositive, reads "not even" as "odd", writes the odd $n$
      out by the definition, multiplies out, takes the factor 2 out of the first two terms, and reads
      the result by the definition of odd. Even and Contradiction are never needed.

  - id: derive-root-two
