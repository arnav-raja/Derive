    concept: M1.8/contrapositive-proof
    covers: [M1.8/direct-proof]
    title: An odd square
    prompt: With $n = 2k + 1$, write $n^2$ in the form $2m + 1$. What is $m$, in terms of $k$?
    answer:
      type: expression
      symbols:
        - { name: k, integer: true }
      lhs: 'm ='
      reference: 2*k**2 + 2*k
      accept: ['2*k*(k + 1)', '2*k^2 + 2*k', '2k^2+2k']
      reject: ['4*k**2 + 4*k', '2*k**2 + 2*k + 1', 'k**2 + k', '4*k**2 + 4*k + 1', '2*k**2 + k', '4*k**2 + 2*k', '((2*k + 1)**2 - 1)/2']
