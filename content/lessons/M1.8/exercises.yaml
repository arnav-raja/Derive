        print(first_failure(euler, 100))
        print(first_failure(euler, 40))
      tests: |
        def euler(n):
            return n * n + n + 41

        def shifted(n):
            return n * n - n + 41

        def grouped(v):
            """A whole number with its digits grouped in threes, or anything else as Python shows it."""
            return f"{v:,}" if type(v) is int else str(v)

        def double(n):
            return 2 * n

        def plus_two(n):
            return n + 2

        def test_filled():
            """first_failure gives an answer for the puzzle's formula, not None."""
            assert first_failure(euler, 100) is not None, "first_failure(euler, 100) gives None, but the puzzle's formula is not prime for some n below 100. If you have replaced the None, ask when your code reaches its return None."

        def test_euler():
            """The puzzle's formula first fails at n = 40."""
            got = first_failure(euler, 100)
            hint = ""
            if got == euler(40):
                hint = " It should give n, the number put into the formula, not the formula's value."
            elif got is None:
                hint = " It found no failure: does the loop reach n = 40 before a return ends it?"
            assert got == 40, f"first_failure(euler, 100) gives {grouped(got)}, not 40.{hint}"

        def test_no_failure():
            """When f(n) is prime for every n below limit, first_failure gives None."""
            got = first_failure(euler, 40)
            assert got is None, f"first_failure(euler, 40) gives {got}, not None: n = 40 is not below the limit."

        def test_moved_along():
            """n² − n + 41 first fails at n = 41."""
            got = first_failure(shifted, 100)
            assert got == 41, f"first_failure(shifted, 100) gives {grouped(got)}, not 41."

        def test_starts_at_zero():
            """The search starts at n = 0."""
            got = first_failure(double, 10)
            assert got == 0, f"For f(n) = 2n, first_failure gives {got}, not 0: f(0) is 0, which is not prime."
            got = first_failure(plus_two, 10)
            assert got == 2, f"For f(n) = n + 2, first_failure gives {got}, not 2: f(0) = 2 and f(1) = 3 are prime, and f(2) = 4 is not."

        def test_empty_range():
            """With limit 0 there is nothing to check, so there is no failure."""
            got = first_failure(double, 0)
