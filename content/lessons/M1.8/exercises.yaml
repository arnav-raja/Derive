exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-forty-primes
    phase: puzzle
    kind: predict
    concept: M1.8/proof
    title: Forty primes in a row
    prompt: Is $n^2 + n + 41$ prime for every whole number $n$?
    answer:
      type: choice
      options:
        - { id: pattern, label: 'Yes: forty primes in a row cannot happen by chance' }
        - { id: by-hand, label: 'No, and a whole number $n$ for which it is not prime can be found without a computer' }
        - { id: computer, label: 'No, but only a long computer search could find where it fails' }
        - { id: unknowable, label: 'No one can know without checking every whole number' }
      correct: [by-hand]
    explanation: >-
      At $n = 41$, every term of $41^2 + 41 + 41$ has a factor of 41, so the value is
      $41 \times 43$, which is not prime. Reasoning about the shape of the formula settles it in a
      line. Forty agreeing cases were never a proof: the next case can always break a claim about
      every whole number, and here it does.

  # Recall ---------------------------------------------------------------------
  - id: recall-false-if
    phase: recall
    kind: recall
    concept: M1.7/implication
    prompt: When is "if $P$ then $Q$" false?
    answer:
      type: choice
      options:
        - { id: p-false, label: 'Whenever $P$ is false' }
        - { id: both-false, label: 'When $P$ and $Q$ are both false' }
        - { id: q-false, label: 'Whenever $Q$ is false' }
        - { id: p-true-q-false, label: 'Only when $P$ is true and $Q$ is false' }
      correct: [p-true-q-false]
    explanation: >-
      "If $P$ then $Q$" promises $Q$ only in the cases where $P$ holds, so it is broken only when
      $P$ is true and $Q$ is false. When $P$ is false it is true, vacuously, whatever $Q$ is.

  - id: recall-contrapositive
    phase: recall
    kind: recall
    concept: M1.7/implication
    prompt: Which says exactly the same as "if $n$ is a multiple of 4, then $n$ is even"?
    answer:
      type: choice
      options:
        - { id: converse, label: 'If $n$ is even, then $n$ is a multiple of 4' }
        - { id: contrapositive, label: 'If $n$ is not even, then $n$ is not a multiple of 4' }
        - { id: inverse, label: 'If $n$ is not a multiple of 4, then $n$ is not even' }
        - { id: and, label: '$n$ is a multiple of 4, and $n$ is even' }
      correct: [contrapositive]
    explanation: >-
      The contrapositive denies both parts and swaps them, and says exactly the same. The converse
      swaps the parts without denying them, and is false: 6 is even but not a multiple of 4.
      Denying both parts without swapping them says the same as the converse, and 6 breaks it too.

  - id: recall-deny-every
    phase: recall
    kind: recall
    concept: M1.7/quantifiers
    prompt: Which is the denial of "for every whole number $n$, $n^2 + n + 41$ is prime"?
    answer:
      type: choice
      options:
        - { id: none, label: 'For every whole number $n$, $n^2 + n + 41$ is not prime' }
        - { id: most, label: 'For most whole numbers $n$, $n^2 + n + 41$ is not prime' }
        - { id: some-not, label: 'For some whole number $n$, $n^2 + n + 41$ is not prime' }
        - { id: some-prime, label: 'For some whole number $n$, $n^2 + n + 41$ is prime' }
      correct: [some-not]
    explanation: >-
      Not for every is there is with a not: the denial needs a single exception, one whole number
      for which the value is not prime. The puzzle's $n = 41$ is one.

  - id: recall-de-morgan
    phase: recall
    kind: recall
    concept: M1.7/connectives
    prompt: Which says the same as "it is not true that $p$ and $q$ are both even"?
    answer:
      type: choice
      options:
        - { id: at-least-one, label: '$p$ is not even, or $q$ is not even, or both' }
        - { id: both-not, label: '$p$ is not even, and $q$ is not even' }
        - { id: exactly-one, label: 'Exactly one of $p$ and $q$ is even' }
        - { id: p-not, label: '$p$ is not even' }
      correct: [at-least-one]
    explanation: >-
      By De Morgan's laws, not ($P$ and $Q$) is (not $P$) or (not $Q$): "both even" fails as soon as
      one of them is not even, and also when neither is.

  - id: recall-expand
    phase: recall
    kind: recall
    concept: M1.2/equivalence
    prompt: Which of these is equal to $(2k + 1)^2$ for every number $k$?
    answer:
      type: choice
      options:
        - { id: no-middle, label: '$4k^2 + 1$' }
        - { id: two-k, label: '$4k^2 + 2k + 1$' }
        - { id: two-squared, label: '$2k^2 + 4k + 1$' }
        - { id: right, label: '$4k^2 + 4k + 1$' }
      correct: [right]
    explanation: >-
      $(2k + 1)^2 = (2k + 1)(2k + 1) = 4k^2 + 2k + 2k + 1 = 4k^2 + 4k + 1$. A check at $k = 1$:
      $3^2 = 9$, and $4 + 4 + 1 = 9$.

  # Explore --------------------------------------------------------------------
  - id: explore-odd-sum
    phase: explore
    kind: predict
    concept: M1.8/direct-proof
    covers: [M1.8/proof]
    title: Two odd integers
    prompt: Which of the four arguments proves that the sum of any two odd integers is even?
    answer:
      type: choice
      options:
        - { id: checked, label: 'The first, which checks every pair below a million' }
        - { id: same-letter, label: 'The second, which writes both as $2k + 1$' }
        - { id: two-letters, label: 'The third, which writes them as $2j + 1$ and $2k + 1$' }
        - { id: says-so, label: 'The fourth, which says that odd plus odd is always even' }
      correct: [two-letters]
    explanation: >-
      The third gives each number a letter of its own, so it covers every pair of odd integers, and
      each of its steps follows from the definitions. The first checks only some pairs, the second
      only an odd integer added to itself, and the fourth assumes the claim it set out to prove.
    placement: true
    review:
      variants:
        - prompt: Which of these proves that the product of any two even integers is even?
          answer:
            type: choice
            options:
              - { id: same, label: 'Write both as $2k$. Their product is $4k^2 = 2(2k^2)$, which is even.' }
              - { id: examples, label: '$2 \times 4 = 8$, $6 \times 10 = 60$ and $-2 \times 8 = -16$ are all even.' }
              - { id: two, label: 'Write them as $2j$ and $2k$. Their product is $4jk = 2(2jk)$, and $2jk$ is an integer, so it is even.' }
            correct: [two]
          explanation: >-
            Separate letters cover every pair. One letter for both covers only an even integer times
            itself, and examples cover only themselves.
        - prompt: >-
            A proof begins: "Let $a$ and $b$ be odd integers, so that $a = 2k + 1$ and $b = 2k + 1$ for
            some integer $k$." What is wrong with it?
          answer:
            type: choice
            options:
              - { id: fine, label: 'Nothing: every odd integer can be written as $2k + 1$' }
              - { id: equal, label: 'It makes $a$ and $b$ equal, so it covers only an odd integer paired with itself' }
              - { id: even, label: '$2k + 1$ is even when $k$ is odd' }
            correct: [equal]
          explanation: >-
            Each odd integer is $2k + 1$ for some $k$, but not for the same $k$: 3 needs $k = 1$, and 5
            needs $k = 2$. Two numbers chosen separately need separate letters, such as $j$ and $k$.
        - prompt: Which of these proves that the sum of any two even integers is even?
          answer:
            type: choice
            options:
              - { id: same, label: 'Write both as $2k$. Their sum is $4k = 2(2k)$.' }
              - { id: two, label: 'Write them as $2j$ and $2k$. Their sum is $2j + 2k = 2(j + k)$, and $j + k$ is an integer.' }
              - { id: checked, label: 'Every pair of even integers from $-1{,}000$ to $1{,}000$ has an even sum.' }
              - { id: obvious, label: 'Even plus even is even, so their sum is even.' }
            correct: [two]
          explanation: >-
            $2(j + k)$ is even by the definition, since $j + k$ is an integer, and the letters $j$ and
            $k$ stand for any integers, so every pair is covered.

  - id: explore-always-odd
    phase: explore
    kind: predict
    concept: M1.8/direct-proof
    title: Odd or even values
    prompt: Which of these settles whether $n^2 + n + 41$ is odd for every integer $n$?
    answer:
      type: choice
      options:
        - { id: forty, label: 'It is: it was odd for all forty values checked' }
        - { id: product, label: 'It is: $n^2 + n = n(n + 1)$, and one of $n$ and $n + 1$ is even, so $n^2 + n$ is even and adding 41 makes it odd' }
        - { id: odd-even, label: 'It is not: when $n$ is odd, $n^2$ and $n$ are odd, so $n^2 + n + 41$ is even' }
        - { id: forty-one, label: 'It is: 41 is odd, so $n^2 + n + 41$ is odd whatever $n$ is' }
      correct: [product]
    explanation: >-
      Of two neighbouring integers one is even, so $n(n + 1)$ is even: if $n$ is even it is, and if
      $n$ is odd then $n + 1$ is. Those two cases cover every integer, and adding the odd 41 makes
      every value odd. Forty checks cover forty values, the 41 alone ignores $n^2 + n$, and for odd
      $n$, $n^2 + n$ is odd plus odd, which is even.
    review:
      variants:
        - prompt: Is $n^2 - n$ even for every integer $n$?
          answer:
            type: choice
            options:
              - { id: odd-minus-odd, label: 'No: when $n$ is odd, $n^2 - n$ is odd minus odd, which is odd' }
              - { id: neighbours, label: 'Yes: $n^2 - n = (n - 1)n$, a product of two neighbouring integers, one of which is even' }
              - { id: only-even, label: 'Only when $n$ is even' }
            correct: [neighbours]
          explanation: >-
            $(n - 1)n$ is a product of two neighbouring integers, and one of any two neighbouring
            integers is even. Odd minus odd is even, not odd: $(2j + 1) - (2k + 1) = 2(j - k)$.
        - prompt: >-
            A proof that a claim holds for every integer $n$ treats two cases, "$n$ is even" and "$n$ is
            positive", and proves the claim in each. Does it prove the claim for every integer?
          answer:
            type: choice
            options:
              - { id: yes, label: 'Yes: each case is proved' }
              - { id: overlap, label: 'No: the cases overlap, since 4 is in both' }
              - { id: gap, label: 'No: an integer that is odd and not positive, such as $-3$, is in neither case' }
            correct: [gap]
          explanation: >-
            Cases may overlap, which only proves some integers twice, but together they must cover
            everything. These two leave out the odd integers that are 0 or less, such as $-3$.
        - prompt: Is $n(n + 1)(n + 2)$ a multiple of 3 for every integer $n$?
          answer:
            type: choice
            options:
              - { id: checked, label: 'Yes: it is for every $n$ from 1 to 10' }
              - { id: no, label: 'No: $1 \times 2 \times 3 = 6$ and $2 \times 3 \times 4 = 24$ are not multiples of 3' }
              - { id: cases, label: 'Yes: $n$ is $3k$, $3k + 1$ or $3k + 2$, and in each case one of the three factors is a multiple of 3' }
            correct: [cases]
          explanation: >-
            If $n = 3k$, $n$ itself is a multiple of 3; if $n = 3k + 1$, then $n + 2 = 3(k + 1)$; and if
            $n = 3k + 2$, then $n + 1 = 3(k + 1)$. The three cases cover every integer. 6 and 24 are
            multiples of 3, and ten checks are only evidence.

  - id: explore-which-to-prove
    phase: explore
    kind: predict
    concept: M1.8/contrapositive-proof
    title: Turning the claim round
    prompt: Which of these, once proved, also proves that if $n^2$ is even, then $n$ is even?
    answer:
      type: choice
      options:
        - { id: converse, label: 'If $n$ is even, then $n^2$ is even' }
        - { id: example, label: '4 is even, and so is its square, 16' }
        - { id: inverse, label: 'If $n^2$ is odd, then $n$ is odd' }
        - { id: contrapositive, label: 'If $n$ is odd, then $n^2$ is odd' }
      correct: [contrapositive]
    explanation: >-
      Denying both parts and swapping them gives the contrapositive, "if $n$ is odd, then $n^2$ is
      odd", which says exactly the same as the claim. The converse swaps the parts without denying
      them, "if $n^2$ is odd, then $n$ is odd" denies them without swapping, which says the same as
      the converse, and an example proves nothing about every integer.
    placement: true
    review:
      variants:
        - prompt: >-
            To prove "if $xy$ is odd, then $x$ and $y$ are both odd" by the contrapositive, what do you
            suppose at the start?
          answer:
            type: choice
            options:
              - { id: xy-even, label: '$xy$ is even' }
              - { id: one-even, label: '$x$ is even or $y$ is even' }
              - { id: both-odd, label: '$x$ and $y$ are both odd' }
              - { id: both-even, label: '$x$ and $y$ are both even' }
            correct: [one-even]
          explanation: >-
            The contrapositive is "if not ($x$ and $y$ both odd), then $xy$ is not odd". By De Morgan's
            laws, not ($x$ odd and $y$ odd) is $x$ even or $y$ even, so you suppose that, and prove that
            $xy$ is even.
        - prompt: >-
            A proof of "if a training run diverged, then its learning rate was above 0.1" begins
            "Suppose that the learning rate was at most 0.1." What must it go on to show?
          answer:
            type: choice
            options:
              - { id: diverged, label: 'That the run diverged' }
              - { id: above, label: 'That the learning rate was above 0.1' }
              - { id: not-diverged, label: 'That the run did not diverge' }
            correct: [not-diverged]
          explanation: >-
            Starting from not $Q$, a rate of at most 0.1, a proof by the contrapositive must reach
            not $P$: the run did not diverge.
        - prompt: Which pair of statements says exactly the same?
          answer:
            type: choice
            options:
              - { id: converse, label: '"If $n$ is a multiple of 4, then $n$ is even" and "if $n$ is even, then $n$ is a multiple of 4"' }
              - { id: inverse, label: '"If $n$ is a multiple of 6, then $n$ is even" and "if $n$ is not a multiple of 6, then $n$ is not even"' }
              - { id: contrapositive, label: '"If $n^2$ is a multiple of 3, then $n$ is a multiple of 3" and "if $n$ is not a multiple of 3, then $n^2$ is not a multiple of 3"' }
            correct: [contrapositive]
          explanation: >-
            The third pair is a claim and its contrapositive. The first pairs a true claim with its
            converse, which 6 breaks, and the second pairs a true claim with its inverse, which 2 breaks.

  - id: explore-root-two
    phase: explore
    kind: predict
    concept: M1.8/contradiction
    title: Both even
    prompt: Every step after "suppose" follows from the one before. What does the reasoning show?
    answer:
      type: choice
      options:
        - { id: fraction, label: 'That $\sqrt{2}$ is a fraction after all, with $p$ and $q$ both even' }
        - { id: false-supposition, label: 'That the supposition is false, so $\sqrt{2}$ cannot be written as a fraction' }
        - { id: bad-step, label: 'That the step from "$p^2$ is even" to "$p$ is even" must be wrong, since it led to a problem' }
        - { id: squaring, label: 'Nothing, since squaring both sides can add solutions, as in M1.2' }
      correct: [false-supposition]
    explanation: >-
      The supposition said that $p$ and $q$ are not both even, and valid steps led to both even: a
      statement and its denial, both true. So the supposition is false, and no fraction equals
      $\sqrt{2}$. The step about $p^2$ rests on a claim that is proved, so it is not the culprit, and
      squaring runs one way only here, from $\sqrt{2} = \frac{p}{q}$ to $p^2 = 2q^2$, which is all the
      reasoning needs.
    placement: true
    review:
      variants:
        - prompt: To prove by contradiction that there is no largest whole number, how does the proof begin?
          answer:
            type: choice
            options:
              - { id: no-largest, label: '"Suppose that there is no largest whole number."' }
              - { id: below, label: '"Suppose that every whole number is less than 1,000,000."' }
              - { id: largest, label: '"Suppose that there is a largest whole number, $N$."' }
            correct: [largest]
          explanation: >-
            A proof by contradiction supposes the denial of the claim: that there is a largest whole
            number, $N$. Then $N + 1$ is a larger one, a contradiction.
        - prompt: A proof supposes that a claim is false and, by valid steps, reaches a contradiction. What has it shown?
          answer:
            type: choice
            options:
              - { id: claim-true, label: 'That the claim is true' }
              - { id: unknown, label: 'Nothing yet, until the claim is checked on examples as well' }
              - { id: claim-false, label: 'That the claim is false' }
              - { id: both, label: 'That the claim is both true and false' }
            correct: [claim-true]
          explanation: >-
            If every step was valid, the only thing that can be wrong is the supposition, so the
            claim's denial is false, and the claim is true.
        - prompt: >-
            The proof that $\sqrt{2}$ is irrational supposes that $\sqrt{2} = \frac{p}{q}$ in lowest
            terms. Why does it need "in lowest terms"?
          answer:
            type: choice
            options:
              - { id: small, label: 'Only to keep the numbers small' }
              - { id: contradiction, label: 'Because the contradiction is with it: the steps show that $p$ and $q$ are both even, which lowest terms rules out' }
              - { id: needless, label: 'It does not need it: any fraction would do' }
            correct: [contradiction]
          explanation: >-
            Without it, $p$ and $q$ both even would be no contradiction, since $\frac{2}{2}$ has both
            even. Every fraction can be put in lowest terms, so supposing it costs nothing.

  - id: explore-euclid
    phase: explore
    kind: predict
    concept: M1.8/contradiction
    title: Euclid's number for six primes
    prompt: Is 30,031 prime?
    answer:
      type: choice
      options:
        - { id: always, label: "Yes: Euclid's proof shows that such a number is always prime" }
        - { id: no-small, label: 'Yes: no prime up to 13 divides it, so no prime divides it' }
        - { id: thirteen, label: 'No: 13 divides it' }
        - { id: bigger, label: 'No: it has a prime factor larger than 13' }
      correct: [bigger]
    explanation: >-
      $30{,}031 = 59 \times 509$. No prime on the list divides it, since each leaves a remainder of
      1, but its prime factors, 59 and 509, are primes that are not on the list. The proof said only
      that $N$ has a prime factor missing from the list, never that $N$ is prime.
    review:
      variants:
        - prompt: >-
            Euclid's proof makes $N = 2 \times 3 \times 5 \times \dots \times P + 1$ from a list of
            primes supposed to be complete. Which of these does the proof use?
          answer:
            type: choice
            options:
              - { id: prime, label: '$N$ is prime' }
              - { id: remainder, label: 'Each prime on the list leaves a remainder of 1 when it divides $N$' }
              - { id: largest, label: '$P$ is the largest number that is not prime' }
            correct: [remainder]
          explanation: >-
            The remainder of 1 shows that no prime on the list divides $N$. Whether $N$ itself is prime
            is never needed: its prime factors are missing from the list either way.
        - prompt: What is $2 \times 3 \times 5 \times 7 + 1$, and is it prime?
          answer:
            type: choice
            options:
              - { id: product, label: '210, which is not prime' }
              - { id: factored, label: '211, which is $11 \times 19$' }
              - { id: prime, label: '211, which is prime' }
            correct: [prime]
          explanation: >-
            $2 \times 3 \times 5 \times 7 = 210$, and 211 is prime: no prime up to $\sqrt{211}$, about
            14.5, divides it, and $11 \times 19$ is 209. Euclid's numbers for the first one to five
            primes are all prime, 3, 7, 31, 211 and 2,311, and the sixth, 30,031, is the first that is
            not.
        - prompt: >-
            Euclid's argument works for any list of primes. For the list 3, 5 and 7 it makes
            $3 \times 5 \times 7 + 1 = 106$. What is the smallest prime factor of 106?
          answer: { type: number, value: 2, tolerance: { abs: 0 } }
          explanation: >-
            $106 = 2 \times 53$, and both 2 and 53 are missing from the list 3, 5 and 7, as the argument
            says a prime factor must be.

  - id: explore-converse-argument
    phase: explore
    kind: predict
    concept: M1.8/proof
    title: A gap in the losses
    prompt: Is the team's argument valid, so that its conclusion must be true whenever its first two sentences are?
    answer:
      type: choice
      options:
        - { id: valid, label: 'Yes: the conclusion follows from the first two sentences' }
        - { id: either-way, label: 'Yes: the first sentence and its contrapositive say the same, so it can be read either way' }
        - { id: converse, label: 'No: the first sentence promises nothing about a model that has not memorised, and such a model could have the same gap' }
        - { id: false-premise, label: 'No: the first sentence is false, so nothing follows from it' }
      correct: [converse]
    explanation: >-
      The argument has the shape "$P \Rightarrow Q$, and $Q$, so $P$", which needs the converse,
      $Q \Rightarrow P$. A test set unlike the training data, or a bug in the code that works out the
      test loss, gives the same gap without any memorising. The contrapositive runs the other way:
      from $\neg Q$ it gives $\neg P$.
    placement: true
    review:
      variants:
        - prompt: '"If it rained last night, the grass is wet. The grass is wet. So it rained last night." Is the argument valid?'
          answer:
            type: choice
            options:
              - { id: valid, label: 'Yes: the conclusion follows' }
              - { id: converse, label: 'No: it needs the converse, and a garden sprinkler wets the grass too' }
              - { id: only-if, label: 'Only if it really did rain' }
            correct: [converse]
          explanation: >-
            From $P \Rightarrow Q$ and $Q$, nothing follows about $P$. Wet grass agrees with rain, and
            with a sprinkler, a burst pipe or dew.
        - prompt: >-
            "If the code has this bug, the test fails. The test passes. So the code does not have this
            bug." Is the argument valid?
          answer:
            type: choice
            options:
              - { id: converse, label: 'No: it proves the converse' }
              - { id: passing, label: 'No: a passing test never proves anything' }
              - { id: valid, label: 'Yes: by the contrapositive, a passing test rules the bug out' }
            correct: [valid]
          explanation: >-
            The first sentence's contrapositive is "if the test passes, the code does not have this
            bug", so the conclusion follows from a passing test, as long as the first sentence is true.
            That is the valid form: from $P \Rightarrow Q$ and $\neg Q$, conclude $\neg P$.
        - prompt: >-
            "If a model is overfitting, its validation loss rises while its training loss falls. Our
            validation loss rose while the training loss fell. So our model is overfitting." Which
            form does the argument have?
          answer:
            type: choice
            options:
              - { id: tollens, label: 'From $P \Rightarrow Q$ and $\neg Q$, conclude $\neg P$' }
              - { id: ponens, label: 'From $P \Rightarrow Q$ and $P$, conclude $Q$' }
              - { id: converse, label: 'From $P \Rightarrow Q$ and $Q$, conclude $P$' }
            correct: [converse]
          explanation: >-
            It argues from $Q$ back to $P$, which needs the converse, so it is not valid as it stands,
            however often overfitting is in fact the cause.

  - id: explore-one-is-two
    phase: explore
    kind: predict
    concept: M1.8/proof
    title: A proof that 2 is 1
    prompt: Which step of the "proof" is wrong?
    answer:
      type: choice
      options:
        - { id: step-5, label: 'Step 5, which divides both sides by $a - b$' }
        - { id: step-2, label: 'Step 2, since multiplying both sides by $a$ can add a solution' }
        - { id: step-4, label: 'Step 4, since $a^2 - b^2$ is not $(a + b)(a - b)$' }
        - { id: step-7, label: 'Step 7, which divides both sides by $b$' }
      correct: [step-5]
    explanation: >-
      Since $a = b$, $a - b$ is 0, and dividing by 0 is not allowed. Step 4 holds only because both
      sides are 0, so it cannot show that $a + b = b$. Multiplying both sides by $a$ keeps a true
      equation true, $a^2 - b^2$ is $(a + b)(a - b)$, and $b$ is not 0, so step 7 is allowed.
    review:
      variants:
        - prompt: >-
            Starting from $x^2 = 3x$, a student divides both sides by $x$ and concludes that the only
            solution is $x = 3$. What has gone wrong?
          answer:
            type: choice
            options:
              - { id: nothing, label: 'Nothing: 3 is the only solution' }
              - { id: zero, label: 'Dividing by $x$ assumes that $x$ is not 0, and $x = 0$ is a solution too' }
              - { id: negative, label: 'It lost the solution $x = -3$' }
            correct: [zero]
          explanation: >-
            $x^2 = 3x$ is $x(x - 3) = 0$, so $x = 0$ or $x = 3$. Dividing by $x$ is allowed only where
            $x$ is not 0, so it quietly lost $x = 0$, as M1.2 found.
        - prompt: 'A "proof" that $1 = -1$ reads $1 = \sqrt{1} = \sqrt{(-1)^2} = -1$. Which equals sign is wrong?'
          answer:
            type: choice
            options:
              - { id: first, label: 'The first, $1 = \sqrt{1}$' }
              - { id: second, label: 'The second, $\sqrt{1} = \sqrt{(-1)^2}$' }
              - { id: third, label: 'The third, $\sqrt{(-1)^2} = -1$' }
            correct: [third]
          explanation: >-
            $(-1)^2 = 1$, and $\sqrt{1}$ is 1, the root that is not negative, so $\sqrt{(-1)^2} = 1$, not
            $-1$. Squaring loses the sign, and a square root cannot bring it back.

