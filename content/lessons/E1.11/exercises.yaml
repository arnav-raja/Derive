  - id: build-countdown
    phase: build
    kind: build
    concept: E1.11/iterators
    title: An iterator by hand
    prompt: >-
      Finish the class `Countdown`, an iterator over the whole numbers from `n` down to 1, so that
      `list(Countdown(3))` is `[3, 2, 1]`. Its `__iter__` is written. Its `__next__`, as it
      stands, ends every loop at once; make it give the numbers.
    answer:
      type: code
      starter: |
        class Countdown:
            """An iterator over the whole numbers from n down to 1."""

            def __init__(self, n):
                self.n = n

            def __iter__(self):
                return self

            def __next__(self):
                """The next number down, or raise StopIteration when there is none."""
                raise StopIteration


        c = Countdown(3)
        print(next(c, "end"), next(c, "end"), next(c, "end"), next(c, "end"))   # should be 3 2 1 end
        print(next(c, "end"))   # should be end, since c is used up
      tests: |
        def take(it, k):
            """The first k values of the iterator it, or fewer if it runs out."""
            done = object()
            out = []
            for _ in range(k):
                x = next(it, done)
                if x is done:
                    break
                out.append(x)
            return out


        def test_three():
            """Countdown(3) gives 3, 2 and 1."""
            got = take(Countdown(3), 10)
            assert got == [3, 2, 1], f"The first values of Countdown(3) are {got}, not [3, 2, 1]."


        def test_zero_and_one():
            """Countdown(0) and Countdown(-2) give nothing, and Countdown(1) gives 1."""
            got = take(Countdown(0), 10)
            assert got == [], f"Countdown(0) gave {got}, not []: there is no whole number from 0 down to 1."
            got = take(Countdown(-2), 10)
            assert got == [], f"Countdown(-2) gave {got}, not []: there is no whole number from -2 down to 1."
            got = take(Countdown(1), 10)
            assert got == [1], f"Countdown(1) gave {got}, not [1]."


        def test_for_loop():
            """A for loop over Countdown(100) adds up to 5,050."""
            total = 0
            steps = 0
            for x in Countdown(100):
                total = total + x
                steps = steps + 1
                if steps > 200:
                    break
            assert steps <= 100, "A for loop over Countdown(100) ran more than 100 passes: __next__ should raise StopIteration after it gives 1."
            assert total == 5050, f"A for loop over Countdown(100) added up to {total:,}, not 5,050 = 100 + 99 + ... + 1."


        def test_used_up():
            """An iterator is used up after one loop over it, and stays used up."""
            c = Countdown(4)
            first = take(c, 10)
            again = take(c, 10)
            assert first == [4, 3, 2, 1], f"The first loop over Countdown(4) gave {first}, not [4, 3, 2, 1]."
            assert again == [], f"A second loop over the same Countdown(4) gave {again}, not []: an iterator is used up after one loop over it."
            assert next(c, "none") == "none", "After it is used up, next on a Countdown should keep raising StopIteration."


        def test_iter_is_self():
            """iter of a Countdown is the Countdown itself."""
            c = Countdown(2)
            assert iter(c) is c, "iter(c) should give back c itself: an iterator's __iter__ returns self."
      reference: |
        class Countdown:
            """An iterator over the whole numbers from n down to 1."""

            def __init__(self, n):
                self.n = n

            def __iter__(self):
                return self

            def __next__(self):
                """The next number down, or raise StopIteration when there is none."""
                if self.n <= 0:
                    raise StopIteration
                value = self.n
                self.n = self.n - 1
                return value


        c = Countdown(3)
        print(next(c, "end"), next(c, "end"), next(c, "end"), next(c, "end"))
        print(next(c, "end"))
      wrong:
        - code: |
            class Countdown:
                def __init__(self, n):
                    self.n = n

                def __iter__(self):
                    return self

                def __next__(self):
                    self.n = self.n - 1
                    if self.n < 0:
                        raise StopIteration
                    return self.n

            c = Countdown(3)
            print(next(c, "end"), next(c, "end"), next(c, "end"), next(c, "end"))
            print(next(c, "end"))
          why: >-
            Counts down one too early: it takes 1 off before handing out the value, so
            `Countdown(3)` gives 2, 1 and 0.
        - code: |
            class Countdown:
                def __init__(self, n):
                    self.n = n

                def __iter__(self):
                    return self

                def __next__(self):
                    value = self.n
                    self.n = self.n - 1
                    return value

            c = Countdown(3)
            print(next(c, "end"), next(c, "end"), next(c, "end"), next(c, "end"))
            print(next(c, "end"))
          why: >-
            Never raises `StopIteration`, so it counts on through 0 and the negative numbers for
            ever, and a `for` loop over it never ends.
        - code: |
            class Countdown:
                def __init__(self, n):
                    self.n = n

                def __iter__(self):
                    return Countdown(self.n)

                def __next__(self):
                    if self.n <= 0:
                        raise StopIteration
                    self.n = self.n - 1
                    return self.n + 1

            c = Countdown(3)
            print(next(c, "end"), next(c, "end"), next(c, "end"), next(c, "end"))
            print(next(c, "end"))
          why: >-
            `__iter__` makes a new `Countdown` instead of giving back `self`, so `iter(c)` is not `c`,
            and a second `for` loop over a fresh object starts again, which is not what an iterator
            does.

  - id: debug-epochs
    phase: build
    kind: debug
    concept: E1.11/streaming-pipelines
    covers: [E1.11/iterators]
    title: The epochs' counts
    prompt: >-
      `seen_per_epoch(path, epochs)` should give a list of how many examples each epoch sees, with
      every epoch opening the file afresh and streaming it one line at a time, never holding all
      its lines at once. `train.txt` has 4 examples, so `seen_per_epoch("train.txt", 3)` should be
