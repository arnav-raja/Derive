  - id: explain-streams
    phase: explain
    kind: explain
    concept: E1.11/iterators
    covers: [E1.11/generators, E1.11/streaming-pipelines, E1.11/batches-and-shuffle-buffers]
    title: Streams, simply
    prompt: >-
      Explain to your friend what a `for` loop asks of the thing it loops over, why the second and
      third epochs saw nothing while a loop over a list never has that trouble, and how to mend the
      script while still reading one line at a time. Then explain why a list of the whole file is a
      bad idea at 50 GB, what a generator does instead, and how a pipeline of generators, such as
      one that reads, cleans and batches the examples, keeps memory small. Give an example for
      each.
    answer:
      type: text
      rubric:
        - { id: protocol, criterion: 'Says what a `for` loop asks for: an iterator from `iter`, and `next` before each pass, until `StopIteration` says that nothing is left.' }
        - { id: used-up, criterion: 'Says why the later epochs saw nothing: an open file is its own iterator, used up after one loop over it, while a list makes a fresh iterator for every loop, with an example.' }
        - { id: fix, criterion: 'Gives a mend that streams the file afresh in each epoch, such as opening it, or calling a generator function, inside the epoch loop.' }
        - { id: memory, criterion: 'Says why a list of the whole file is a bad idea at 50 GB: it holds every line at once, which is more than the memory of most machines.' }
        - { id: generator, criterion: 'Says what a generator does: it makes each value only when it is asked for, pausing at `yield`, so it holds one value at a time, with an example.' }
        - { id: pipeline, criterion: 'Explains that a pipeline of generators passes one item at a time through every stage, so that memory holds about one item for each stage however long the file, with an example.' }
      reference: >-
        A `for` loop does not look at a list or a file directly. It calls `iter` on it once, to get
        an iterator, an object that hands out one value each time `next` is called on it and
        remembers where it is, and it calls `next` before every pass until the iterator raises
        `StopIteration`, its way of saying that nothing is left. A list makes a new iterator,
        starting at the first item, every time a loop asks, so looping over a list twice sees every
        item twice. An open file is different: it is its own iterator, with one place in the text,
        like a bookmark. The first epoch's loop read to the end and left the bookmark there, so the
        second and third loops asked for a line, got none, and ended at once, without an error. With
        a file of `cat`, `dog` and `bird`, the epochs see 3, 0 and 0. The mend is to open the file
        afresh inside the epoch loop, or to write a generator function, `def examples(path):` with
        `for line in f: yield line.strip()` inside a `with open(...)`, and call it inside the epoch
        loop, so that each epoch gets a new stream. A list of the whole file would also count
        right, but it holds all 50 GB at once, more memory than most machines have, and far more
        than the job needs. A generator makes each value only when it is asked for: calling the
        function runs none of its body, and each `next` runs it to the next `yield`, hands out that
        value and pauses there. So it holds one line at a time, a few hundred bytes, however long
        the file. Generators can be chained into a pipeline: `read` yields lines, `clean` loops over
        `read` and yields stripped lines without blanks, and `batches` loops over `clean` and
        yields lists of 32. The training loop asks `batches` for a batch, `batches` asks `clean`,
        `clean` asks `read`, and one line at a time flows through all the stages, so memory holds
        about one line for each stage and the batch being filled, whether the file is 50 KB or
        50 GB.
      minWords: 120
      maxWords: 550
    explanation: >-
      A strong answer says that a `for` loop calls `iter` once and then `next` before every pass
      until `StopIteration`; that a list makes a fresh iterator for every loop while an open file is
      its own iterator, used up by the first epoch, so the later epochs see nothing; that opening
      the file, or calling a generator function, inside the epoch loop mends it; that a list of 50
      GB holds everything at once; that a generator makes each value only when asked, pausing at
      `yield`; and that a pipeline of generators passes one item at a time through every stage, so
      memory holds about one item per stage.

