                    lines = "line" if n == 1 else "lines"
                    times = "epoch" if epochs == 1 else "epochs"
                    assert got == [n] * epochs, f"With a file of {n} {lines} and {epochs} {times}, seen_per_epoch gave {got}, not {[n] * epochs}."


        def test_no_epochs():
            """Zero epochs give an empty list."""
            got = seen_per_epoch("train.txt", 0)
            assert got == [], f'seen_per_epoch("train.txt", 0) gave {got}, not [].'


        def test_streams_each_epoch():
            """Each epoch opens the file afresh, rather than carrying on from a stream or a list made earlier."""
            names = seen_per_epoch.__globals__
            opened = []

            def counting_open(*args, **kwargs):
                opened.append(args)
                return open(*args, **kwargs)

            names["open"] = counting_open
            try:
                seen_per_epoch("train.txt", 3)
            finally:
                names.pop("open")
            times = {0: "never", 1: "once"}.get(len(opened), f"{len(opened)} times")
            assert len(opened) >= 3, f"Over three epochs, seen_per_epoch opened train.txt {times}, not once in each epoch: each epoch should open the file afresh, rather than carry on from a stream or a list made earlier."


        def test_one_line_at_a_time():
            """Each epoch counts the lines as they stream past, never holding all of them at once."""
            names = seen_per_epoch.__globals__
            if "examples" not in names:
                return
            original = names["examples"]
            alive = [0, 0]

            class Line(str):
                """A line that counts how many lines are held at once."""

                def __del__(self):
                    alive[0] = alive[0] - 1

            def held(*args, **kwargs):
                for x in original(*args, **kwargs):
                    line = Line(x)
                    alive[0] = alive[0] + 1
                    alive[1] = max(alive[1], alive[0])
                    yield line

            names["examples"] = held
            try:
                seen_per_epoch("train.txt", 3)
            finally:
                names["examples"] = original
            most = alive[1]
            assert most <= 2, f"seen_per_epoch held {most} lines of train.txt at once: count each line as it streams past, without keeping the lines in a list."
      reference: |
