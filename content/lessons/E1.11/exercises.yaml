    answer:
      type: code
      files:
        train.txt: |
          the cat sat
          the dog ran
          a bird sang
          fish swim
      starter: |
        def examples(path):
            """The lines of the file at path, without their newlines, one at a time."""
            with open(path, encoding="utf-8") as f:
                for line in f:
                    yield line.strip()


        def seen_per_epoch(path, epochs):
            """A list of how many examples each of the epochs sees."""
            data = examples(path)
            counts = []
            for epoch in range(epochs):
                seen = 0
                for x in data:
                    seen = seen + 1
                counts.append(seen)
            return counts


