      tests: |
        def write(path, n):
            with open(path, "w", encoding="utf-8") as f:
                for i in range(n):
                    f.write(f"example {i}\n")


        def test_train():
            """Three epochs over train.txt each see its 4 examples."""
            got = seen_per_epoch("train.txt", 3)
            assert got == [4, 4, 4], f'seen_per_epoch("train.txt", 3) gave {got}, not [4, 4, 4].'


        def test_other_files():
