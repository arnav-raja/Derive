exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-epochs
    phase: puzzle
    kind: predict
    concept: E1.11/iterators
    title: The second epoch
    prompt: What is the second line that the script prints?
    answer:
      type: choice
      options:
        - { id: again, label: '`epoch 1 saw 3`' }
        - { id: last-line, label: '`epoch 1 saw 1`' }
        - { id: right, label: '`epoch 1 saw 0`' }
        - { id: closed, label: 'No second line: it stops with an error, since the file has been read to its end' }
      correct: [right]
    explanation: >-
      An open file keeps a place in its text, like a bookmark, and every line read moves the place
      on. The first epoch's loop read to the end and left the place there, so the second loop asked
      for a line, got none, and ended at once: `seen` stayed 0. The file is still open, so there is
      no error; it is simply used up. It does not read `bird` again either, since the place is
      after the last line, not on it.

  # Recall ---------------------------------------------------------------------
  - id: recall-range
    phase: recall
    kind: recall
    concept: E1.2/loops
    prompt: How many times does the block of `for i in range(3, 10):` run?
    answer: { type: number, value: 7, tolerance: { abs: 0 } }
    explanation: >-
      `range(3, 10)` gives 3, 4, 5, 6, 7, 8 and 9, which is $10 - 3 = 7$ values: it stops before
      10.

  - id: recall-invariant
    phase: recall
    kind: recall
    concept: E1.2/loop-invariants
    prompt: What makes a statement an invariant of a loop?
    answer:
      type: choice
      options:
        - { id: after, label: 'It is true once the loop has ended, whatever happened inside it' }
        - { id: test, label: 'It is the test that the loop checks before every pass' }
        - { id: right, label: 'It is true before the loop starts, and every pass keeps it true' }
        - { id: changes, label: 'It changes on every pass, moving the loop towards its end' }
      correct: [right]
    explanation: >-
      True before the first pass and kept by every pass, so it holds at every check and after the
      loop, where it joins the reason the loop stopped to say what the loop computed. A statement
      true only at the end proves nothing about how it got there, and what moves a loop towards
      its end is a falling count, not an invariant.

  - id: recall-alias
    phase: recall
    kind: recall
    concept: E1.4/aliasing-and-mutation
    prompt: |-
      What does this print?

      ```python
      a = [1, 2]
      b = a
      b.append(3)
      print(a)
      ```
    answer:
      type: choice
      options:
        - { id: copy, label: '`[1, 2]`' }
        - { id: right, label: '`[1, 2, 3]`' }
        - { id: twice, label: '`[1, 2, 3, 3]`' }
        - { id: error, label: 'It stops with an error' }
      correct: [right]
    explanation: >-
      `b = a` makes `b` a second name for the same list, so appending through `b` changes the list
      that `a` names too.

  - id: recall-newline
    phase: recall
    kind: recall
    concept: E1.6/files
    prompt: >-
      A file holds three lines, `cat`, `dog` and `bird`, each ending with a newline. A program
      opens it as `f` and runs `for line in f: print(len(line))`. What is the first number it
      prints?
    answer: { type: number, value: 4, tolerance: { abs: 0 } }
    explanation: >-
      Each line arrives with the newline that ends it, so the first is `"cat\n"`, four characters.
      `line.strip()` would give `"cat"`.

  - id: recall-special
    phase: recall
    kind: recall
    concept: E1.7/special-methods
    prompt: '`m` is an object of a class you wrote. Which call does Python make to work out `m + 1`?'
    answer:
      type: choice
      options:
        - { id: right, label: '`m.__add__(1)`' }
        - { id: plain, label: '`m.add(1)`' }
        - { id: other, label: '`(1).__add__(m)`' }
        - { id: init, label: '`m.__init__(1)`' }
      correct: [right]
    explanation: >-
      `+` calls the left operand's `__add__` with the right operand, as `==` calls `__eq__`.
      `__init__` runs only when an object is made.

  # Explore --------------------------------------------------------------------
  - id: explore-past-the-end
    phase: explore
    kind: predict
    concept: E1.11/iterators
    title: Past the end
    prompt: After those two lines, `print(next(it))` runs twice more. What happens?
    answer:
      type: choice
      options:
        - { id: wrap, label: 'It prints `bird`, then `cat`, starting over' }
        - { id: none, label: 'It prints `bird`, then `None`' }
        - { id: right, label: 'It prints `bird`, then stops with an error' }
        - { id: stay, label: 'It prints `bird`, and then `bird` again' }
      correct: [right]
    explanation: >-
      The third call gives `bird`, the last item, and the fourth finds nothing left and raises an
      error, which stops the program. An iterator never starts over and never makes up a value: it
      either has a next item or says that it has none.
    placement: true
    review:
      variants:
        - prompt: After `it = iter("ab")`, what does the first `next(it)` give?
          answer:
            type: choice
            options:
              - { id: whole, label: '`"ab"`' }
              - { id: right, label: '`"a"`' }
              - { id: last, label: '`"b"`' }
              - { id: error, label: 'An error, since a string is not a list' }
            correct: [right]
          explanation: >-
            A string is iterable, and its iterator hands out its characters one at a time, as a
            `for` loop over a string does.
        - prompt: After `it = iter([7])`, what is `next(it, 0) + next(it, 0)`?
          answer: { type: number, value: 7, tolerance: { abs: 0 } }
          explanation: >-
            The first call gives 7, the only item. The second finds nothing left and gives its
            default, 0, instead of raising, so the sum is 7.

  - id: explore-two-iterators
    phase: explore
    kind: predict
    concept: E1.11/iterators
    title: Two at once
    prompt: What does it print?
    answer:
      type: choice
      options:
        - { id: right, label: '`1 2 1`' }
        - { id: shared, label: '`1 2 3`' }
        - { id: same, label: '`1 2 2`' }
        - { id: error, label: 'It stops with an error, since a list has one iterator at a time' }
      correct: [right]
    explanation: >-
      `a` and `b` are two iterators over one list, each with a place of its own. `a` gives 1 and
      then 2; `b` has not been asked before, so it gives 1.
    review:
      variants:
        - prompt: |-
            What does this print?

            ```python
            xs = [1, 2, 3]
            a = iter(xs)
            b = a
            print(next(a), next(b))
            ```
          answer:
            type: choice
            options:
              - { id: two, label: '`1 1`' }
              - { id: right, label: '`1 2`' }
              - { id: error, label: 'It stops with an error' }
              - { id: three, label: '`2 3`' }
            correct: [right]
          explanation: >-
            `b = a` makes `b` a second name for the same iterator, as it would for a list, so the
            second call carries on from where the first left off.
        - prompt: |-
            What does this print?

            ```python
            a = iter([4, 5, 6])
            next(a)
            print(list(a))
            ```
          answer:
            type: choice
            options:
              - { id: all, label: '`[4, 5, 6]`' }
              - { id: empty, label: '`[]`' }
              - { id: right, label: '`[5, 6]`' }
              - { id: four, label: '`[4]`' }
            correct: [right]
          explanation: >-
            `list` takes what the iterator has left. The first `next` used up 4, so 5 and 6
            remain.
        - prompt: |-
            What does this print?

            ```python
            class Repeatable:
                def __init__(self, n):
                    self.n = n

                def __iter__(self):
                    n = self.n
                    while n > 0:
                        yield n
                        n = n - 1


            r = Repeatable(3)
            print(list(r), list(r))
            ```
          answer:
            type: choice
            options:
              - { id: used, label: '`[3, 2, 1] []`' }
              - { id: error, label: 'It stops with an error, since `__next__` is missing' }
              - { id: right, label: '`[3, 2, 1] [3, 2, 1]`' }
              - { id: one, label: '`[3] [2]`' }
            correct: [right]
          explanation: >-
            Each `list` calls `iter(r)`, which calls `__iter__`, and an `__iter__` written with
            `yield` gives a new generator, starting from the top, on every call. `r` itself never
            changes, so the second `list` sees every value again.

  - id: explore-yield
    phase: explore
    kind: predict
    concept: E1.11/generators
    title: When the body runs
    prompt: What does the program print, line by line?
    answer:
      type: choice
      options:
        - { id: eager, label: '`start`, `made`, `3`, `2`' }
        - { id: right, label: '`made`, `start`, `3`, `2`' }
        - { id: whole, label: '`start`, `lift-off`, `made`, `3`, `2`' }
        - { id: restart, label: '`made`, `start`, `3`, `start`, `2`' }
      correct: [right]
    explanation: >-
      Calling a generator function runs none of its body, so `made` comes first. The first `next`
      runs the body from the top, printing `start`, as far as `yield n`, and hands out 3. The second
      carries on from that `yield`, with `n` still 3, makes it 2 and hands out 2. `lift-off` would
      come only with a fourth `next`.
    placement: true
    review:
      variants:
        - prompt: |-
            What does this print?

            ```python
            def two():
                yield "a"
                yield "b"


            g = two()
            print(next(g), next(g), next(g, "none"))
            ```
          answer:
            type: choice
            options:
              - { id: again, label: '`a b a`' }
              - { id: error, label: 'It stops with an error after `a b`' }
              - { id: last, label: '`a b b`' }
              - { id: right, label: '`a b none`' }
            correct: [right]
          explanation: >-
            After `yield "b"` the body ends, so the third `next` finds nothing more and gives its
            default, `"none"`.
        - prompt: |-
            How many times does this print `hi`?

            ```python
            def f():
                print("hi")
                yield 1


            g = f()
            h = f()
            next(g)
            ```
          answer: { type: number, value: 1, tolerance: { abs: 0 } }
          explanation: >-
            Each call of `f` makes a generator and runs none of the body. Only `g` is asked for a
            value, so only its body runs, once, as far as its `yield`.

  - id: explore-sum-twice
    phase: explore
    kind: predict
    concept: E1.11/generators
    title: Summing twice
    prompt: What is the second number it prints?
    answer: { type: number, value: 0, tolerance: { abs: 0 } }
    explanation: >-
      The first `sum` took every value the generator had and left it used up, so the second took
      none, and the sum of no numbers is 0.
    review:
      variants:
        - prompt: |-
            What does this print?

            ```python
            g = (x for x in [3, 4])
            print(list(g), list(g))
            ```
          answer:
            type: choice
            options:
              - { id: twice, label: '`[3, 4] [3, 4]`' }
              - { id: right, label: '`[3, 4] []`' }
              - { id: split, label: '`[3] [4]`' }
              - { id: none, label: '`[] []`' }
            correct: [right]
          explanation: >-
            The first `list` uses the generator up; the second finds nothing left.
        - prompt: After `g = (x + 1 for x in range(3))`, what is `next(g) + sum(g)`?
          answer: { type: number, value: 6, tolerance: { abs: 0 } }
          explanation: >-
            The generator gives 1, 2 and 3. `next` takes the 1, and `sum` takes what is left, 2 and
            3, so the total is $1 + 5 = 6$.

  - id: explore-pulled
    phase: explore
    kind: predict
    concept: E1.11/streaming-pipelines
    title: How much was made
    prompt: >-
      How many numbers has `naturals()` handed out by the time the line has printed? Count every
      value it yielded, kept or not.
    answer: { type: number, value: 5, tolerance: { abs: 0 } }
    explanation: >-
      `naturals()` hands out 0, 1, 2, 3 and 4. The filter keeps 0, 2 and 4 and drops 1 and 3, and
      the third `next` stops asking as soon as it has 4, so nothing beyond 4 is ever made.
    review:
      variants:
        - prompt: >-
            With `odds = (n for n in naturals() if n % 2 == 1)`, three calls of `next(odds)` give
            1, 3 and 5. How many numbers has `naturals()` handed out by then?
          answer: { type: number, value: 6, tolerance: { abs: 0 } }
          explanation: >-
            0, 1, 2, 3, 4 and 5: six numbers, the last of them the third odd one.
        - prompt: >-
            With `tens = (n for n in naturals() if n % 10 == 0)`, two calls of `next(tens)` give 0
            and 10. How many numbers has `naturals()` handed out by then?
          answer: { type: number, value: 11, tolerance: { abs: 0 } }
          explanation: >-
            0 to 10, which is 11 numbers: the filter looks at each and keeps 0 and 10.

  - id: explore-pipeline
    phase: explore
    kind: predict
    concept: E1.11/streaming-pipelines
    title: Two stages
    prompt: In what order are the lines printed?
    answer:
      type: choice
      options:
        - { id: lists, label: '`read ant`, `read bison`, `read cat`, `read dingo`, `got bison`, `got dingo`' }
        - { id: skip, label: '`read bison`, `got bison`, `read dingo`, `got dingo`' }
        - { id: right, label: '`read ant`, `read bison`, `got bison`, `read cat`, `read dingo`, `got dingo`' }
        - { id: outer, label: '`got bison`, `got dingo`, `read ant`, `read bison`, `read cat`, `read dingo`' }
      correct: [right]
    explanation: >-
      A generator does its work only when it is asked for a value. The loop asks `long_only`, which
      asks `read`: `ant` is read and dropped, `bison` is read and passed straight on, and
      `got bison` is printed before `cat` is read. Every word is read, but each only when it is
      needed.
    placement: true
    review:
      variants:
        - prompt: |-
            How many lines beginning `read` does this print?

            ```python
            def read(words):
                for w in words:
                    print("read", w)
                    yield w


            three = (w for w in read(["ox", "yak", "emu"]) if len(w) == 3)
            print("first", next(three))
            ```
          answer: { type: number, value: 2, tolerance: { abs: 0 } }
          explanation: >-
            `ox` is read and dropped, `yak` is read and kept, and `next` asks for nothing more, so
            `emu` is never read.
        - prompt: >-
            The stages swap places, and the loop becomes
            `for w in read(long_only(["ant", "bison", "cat", "dingo"])): print("got", w)`. Which
            words does `read` print?
          answer:
            type: choice
            options:
              - { id: all, label: 'All four, in order' }
              - { id: right, label: '`bison` and `dingo`' }
              - { id: short, label: '`ant` and `cat`' }
              - { id: none, label: 'None of them' }
            correct: [right]
          explanation: >-
            Now `long_only` comes first and `read` sees only the words it passes on, so the order
            of the stages changes what each stage sees, as the order of two functions in a
            composition does.

  - id: explore-batches
    phase: explore
    kind: predict
    concept: E1.11/batches-and-shuffle-buffers
    title: Seven items in threes
    prompt: What does it print?
    answer:
      type: choice
      options:
        - { id: drop, label: '`[[0, 1, 2], [3, 4, 5]]`' }
        - { id: wrap, label: '`[[0, 1, 2], [3, 4, 5], [6, 0, 1]]`' }
        - { id: empty, label: '`[[0, 1, 2], [3, 4, 5], [6], []]`' }
        - { id: right, label: '`[[0, 1, 2], [3, 4, 5], [6]]`' }
      correct: [right]
    explanation: >-
      Two full batches are handed out inside the loop. When the stream ends, `batch` holds `[6]`,
      which is not empty, so the last `if` hands it out too. The stream is not read again from the
      start, and no empty batch is made.
    review:
      variants:
        - prompt: What does `print(list(batches(range(6), 3)))` print?
          answer:
            type: choice
            options:
              - { id: empty, label: '`[[0, 1, 2], [3, 4, 5], []]`' }
              - { id: one, label: '`[[0, 1, 2]]`' }
              - { id: flat, label: '`[0, 1, 2, 3, 4, 5]`' }
              - { id: right, label: '`[[0, 1, 2], [3, 4, 5]]`' }
            correct: [right]
          explanation: >-
            Both batches fill exactly, so `batch` is empty when the loop ends and the last `if`
            hands out nothing more.
        - prompt: How many batches does `batches(range(100), 32)` hand out?
          answer: { type: number, value: 4, tolerance: { abs: 0 } }
          explanation: >-
            Three full batches take 96 items, and the 4 left over make a fourth, short batch.

  - id: explore-first-batch
    phase: explore
    kind: predict
    concept: E1.11/batches-and-shuffle-buffers
    title: The first batch
    prompt: Which examples can the first batch of 32 hold?
    answer:
      type: choice
      options:
        - { id: any, label: 'Any of the 100,000 examples, each as likely as the rest' }
        - { id: right, label: 'Only cooking examples, from the first 1,031 to arrive' }
        - { id: first, label: 'Exactly the first 32 examples, in a random order' }
        - { id: mixed, label: 'Some of every topic, though mostly cooking examples' }
      correct: [right]
    explanation: >-
      The buffer hands out its first item when the 1,001st arrives, choosing among the first
      1,000, and its 32nd when the 1,032nd arrives, choosing among the first 1,031. All of those are
      about cooking. Within them the choice is random, so the batch is not simply the first 32.
    placement: true
    review:
      variants:
        - prompt: >-
            The same file of 100,000 is shuffled with a buffer of 100,000. Which examples can the
            first batch of 32 hold?
          answer:
            type: choice
            options:
              - { id: cooking, label: 'Only cooking examples' }
              - { id: first, label: 'Only the first 1,031' }
              - { id: right, label: 'Any of the 100,000' }
              - { id: last, label: 'Only the last 32' }
            correct: [right]
          explanation: >-
            The buffer never fills before the stream ends, so all 100,000 are held and then
            shuffled with `random.shuffle`: a full shuffle, in which any example can come first.
        - prompt: >-
            `shuffled` runs with a buffer of 10. How many items have arrived from the stream when
            it hands out its first item?
          answer: { type: number, value: 11, tolerance: { abs: 0 } }
          explanation: >-
            The first 10 fill the buffer, and the first item is handed out when the 11th arrives,
            to take its place.

  # Derive ---------------------------------------------------------------------
  - id: derive-pulled
    phase: derive
    kind: step
    concept: E1.11/streaming-pipelines
    title: What a request costs
    prompt: >-
      How many numbers has `naturals()` handed out once the $k$th multiple of $m$ has come out of
      `multiples`?
    answer:
      type: expression
      symbols:
        - { name: k, positive: true, integer: true }
        - { name: m, positive: true, integer: true }
      lhs: '\text{numbers} ='
      reference: (k - 1)*m + 1
      accept: ['k*m - m + 1', 'm*(k - 1) + 1', '1 + m*k - m']
      reject: ['k*m', 'k*m + 1', '(k + 1)*m', 'k*(m - 1) + 1', '(k - 1)*m', 'k*m - 1', 'k + m', '(k - 1)*m + 2']
    explanation: >-
      The multiples of $m$ are $0, m, 2m, \dots$, so the $k$th is $(k - 1)m$, and `naturals()` has
      handed out every number from 0 up to it: $(k - 1)m + 1$ numbers. For $k = 3$ and $m = 2$
      that is 5, as the Explore phase found.
    review:
      variants:
        - prompt: >-
            How many numbers does `naturals()` hand out to give the first 5 multiples of 3 through
            `(n for n in naturals() if n % 3 == 0)`?
          answer: { type: number, value: 13, tolerance: { abs: 0 } }
          explanation: >-
            The 5th multiple of 3 is 12, and the numbers from 0 to 12 are 13 numbers.
        - prompt: >-
            With `big = (n * n for n in naturals() if n * n > 50)`, how many numbers has
            `naturals()` handed out when `next(big)` gives its first value?
          answer: { type: number, value: 9, tolerance: { abs: 0 } }
          explanation: >-
            The first square above 50 is $8^2 = 64$, so `naturals()` has handed out 0 to 8, which
            is 9 numbers.

  - id: derive-batches-proof
    phase: derive
    kind: proof
    concept: E1.11/batches-and-shuffle-buffers
    title: Nothing lost, nothing repeated
    prompt: >-
      Here is a proof, by a loop invariant, that `batches` hands out every item of any stream
      once, in order, in batches of `size` but perhaps a shorter last one, and never an empty
      batch. Each line follows from the lines above it. Choose the rule that justifies each line.
      A rule may be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: invariant, name: Loop invariant, label: 'A statement that holds at the first check of a loop, and that every pass keeps true, still holds once the loop has stopped.' }
        - { id: last, name: The leftover batch, label: 'Once the loop is over, `if len(batch) > 0: yield batch` yields `batch` only if it is not empty.' }
        - { id: alias, name: A new list, label: '`batch = []` makes `batch` refer to a new list, and leaves the list it referred to before as it was.' }
        - { id: start, name: The set-up, label: '`batch = []` runs first, and until the loop runs, nothing is taken from `items` and nothing is yielded.' }
        - { id: wait, name: Generators wait, label: 'A generator runs none of its body until it is asked for a value.' }
        - { id: full, name: The size test, label: 'The `if` inside the loop yields `batch` exactly when `len(batch) == size`, and then runs `batch = []`.' }
        - { id: end, name: How a loop stops, label: 'A `for` loop stops only when `next` on its iterator raises `StopIteration`, that is, when nothing is left.' }
        - { id: append, name: Appending, label: '`batch.append(x)` makes `batch` one item longer, with `x` as its last item.' }
      start: 'P\text{: the batches handed out so far, followed by } \texttt{batch}\text{, hold the items read so far, in order; each batch handed out holds } \texttt{size} \text{ items; and } \texttt{batch} \text{ holds fewer than } \texttt{size}\text{.}'
      lines:
        - math: 'P \text{ holds before the first check: nothing has been read or handed out, and } \texttt{batch} \text{ is empty.}'
          rule: start
        - math: '\text{Appending to } \texttt{batch} \text{ never changes a batch already handed out, so what } P \text{ says of those batches stays true through a pass.}'
          rule: alias
        - math: '\text{A pass reads the next item and puts it at the end of } \texttt{batch}\text{, so the batches and } \texttt{batch} \text{ still hold the items read so far, in order.}'
          rule: append
        - math: '\text{If } \texttt{batch} \text{ now holds } \texttt{size} \text{ items, it is handed out full and } \texttt{batch} \text{ starts again empty; if not, it still holds fewer than } \texttt{size}\text{. Either way } P \text{ holds.}'
          rule: full
        - math: 'P \text{ holds after the loop ends.}'
          rule: invariant
        - math: '\text{By then every item has been read, so the batches handed out and } \texttt{batch} \text{ hold all the items, in order.}'
          rule: end
        - math: '\text{So every item is handed out once, in order, in batches of } \texttt{size} \text{ but perhaps a shorter last one, and never an empty batch.}'
          rule: last
    explanation: >-
      $P$ holds before the loop because nothing has happened yet. Each batch handed out is a list
      that no later append touches, since `batch = []` made `batch` refer to a new one, so $P$
      stays true of it. A pass appends one item, which keeps the items in order, and then either
      hands out a full batch and starts a new list, or leaves `batch` short of `size`. The
      invariant rule carries $P$ to the end of the loop, when every item has been read, and the
      final `if` hands out the rest only if there is any. That generators wait is true, but this
      proof does not need it.
    review:
      variants:
        - prompt: >-
            In the proof that `batches` hands out every item once, which fact would fail if
            `batch = []` were replaced by `batch.clear()`?
          answer:
            type: choice
            options:
              - { id: start, label: '$P$ holds before the first check' }
              - { id: right, label: 'A batch already handed out never changes' }
              - { id: end, label: 'Every item has been read when the loop ends' }
              - { id: last, label: 'The last batch is never empty' }
            correct: [right]
          explanation: >-
            `clear` empties the very list that was handed out, so the next appends change it, and
            every batch handed out is the same list.
        - prompt: Which of these is an invariant of the loop in `batches`, true before every check?
          answer:
            type: choice
            options:
              - { id: empty, label: '`batch` is empty' }
              - { id: right, label: '`batch` holds fewer than `size` items' }
              - { id: read, label: '`batch` holds every item read so far' }
              - { id: equal, label: '`len(batch) == size`' }
            correct: [right]
          explanation: >-
            A full `batch` is handed out at once and replaced by an empty list, so before each
            check it holds fewer than `size` items. It need not be empty: after 4 items with a
            size of 3, it holds 1, and it holds only the items read since the last batch was
            handed out.

  - id: derive-earliest
    phase: derive
    kind: step
    concept: E1.11/batches-and-shuffle-buffers
    title: The furthest forward
    prompt: >-
      With a buffer of $k$, at which output place, at the earliest, can the item at place $p$ of
      the stream come out, for $p$ at least $k$?
    answer:
      type: expression
      symbols:
        - { name: p, positive: true, integer: true }
        - { name: k, positive: true, integer: true }
      lhs: '\text{earliest place} ='
      reference: p - k + 1
      accept: ['p - (k - 1)', '1 + p - k']
      reject: ['p - k', 'p - k - 1', 'p + k - 1', 'p - k + 2', 'k - 1', 'p', 'p - 1', 'p + 1 - 2*k']
    explanation: >-
      Output $j$ is chosen from items that arrived before item $k + j$, so item $p$ can be chosen
      only when $p < k + j$, that is when $j \ge p - k + 1$. It arrives as output $p - k$ is chosen,
      one too late for it.
    review:
      variants:
        - prompt: >-
            With a buffer of 100, what is the earliest output place at which the item at place
            1,000 of the stream can come out? Places are counted from 0.
          answer: { type: number, value: 901, tolerance: { abs: 0 } }
          explanation: >-
            $1{,}000 - 100 + 1 = 901$: the item arrives as output 900 is chosen, too late for it.
        - prompt: With a buffer of $k$, by at most how many places can an item move forward?
          answer:
            type: expression
            symbols:
              - { name: k, positive: true, integer: true }
            lhs: '\text{places} ='
            reference: k - 1
            accept: ['-1 + k']
            reject: ['k', 'k + 1', 'k - 2', '2*k']
          explanation: >-
            From place $p$ to place $p - k + 1$ at the earliest, which is $k - 1$ places forward.

  - id: derive-list-memory
    phase: derive
    kind: estimate
    concept: E1.11/generators
    covers: [E1.11/streaming-pipelines]
    title: What a list costs
    prompt: >-
      A program keeps the squares of the whole numbers from 0 to 99,999,999 in a list, made by
      appending. On the 64-bit machines that train models, each slot of a list takes 8 bytes, and
      almost every one of these squares is an int that takes 32 bytes. Without a calculator, about
      how many gigabytes does the list take? A gigabyte is $10^9$ bytes.
    answer: { type: number, value: 4, tolerance: { factor: 1.2 }, unit: GB }
    explanation: >-
      $10^8$ squares at $8 + 32 = 40$ bytes each make $4 \times 10^9$ bytes, 4 GB, and a little
      more, since a list built by appending keeps some spare slots for the next appends.
    review:
      variants:
        - prompt: >-
            A list holds 10 million floats, each taking 24 bytes, in slots of 8 bytes. About how
            many megabytes does it take? A megabyte is $10^6$ bytes.
          answer: { type: number, value: 320, tolerance: { rel: 0.1 }, unit: MB }
          explanation: >-
            $10^7 \times (24 + 8) = 3.2 \times 10^8$ bytes, 320 MB.
        - prompt: >-
            The list is replaced by `sum(x * x for x in range(10**8))`. How many of the squares
            are held in memory at any one time?
          answer: { type: number, value: 1, tolerance: { abs: 0 } }
          explanation: >-
            The generator makes each square when `sum` asks for it, and `sum` adds it to its total
            before asking for the next, so one square at a time.

