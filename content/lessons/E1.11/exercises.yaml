        class Nothing:
            """A value that no stream in these tests holds, to mark that a stream has run dry."""


        def take(it, k):
            out = []
            for _ in range(k):
                x = next(it, Nothing)
                if x is Nothing:
                    break
                out.append(x)
            return out


        def test_example():
            """Lists and strings of different lengths take turns."""
            got = take(interleave([[1, 2, 3], "ab", []]), 20)
            assert got == [1, "a", 2, "b", 3], f'interleave([[1, 2, 3], "ab", []]) gave {got}, not [1, \'a\', 2, \'b\', 3].'


        def test_no_streams():
            """With no streams, interleave gives nothing."""
            got = take(interleave([]), 5)
            assert got == [], f"interleave([]) gave {got}, not []."


        def test_one_pass_streams():
            """Generators, which can be read only once, take turns too."""

            def letters():
                yield "x"
                yield "y"
                yield "z"

            def one():
                yield 1

            got = take(interleave([letters(), one(), letters()]), 20)
            want = ["x", 1, "x", "y", "y", "z", "z"]
            assert got == want, f"With the generators x y z, 1, and x y z, interleave gave {got}, not {want}."


        def test_endless():
            """An endless stream goes on after the others are used up."""

            def naturals():
                n = 0
                while True:
                    assert n < 1000, "interleave asked an endless stream for more than 1,000 items to hand out six: it should take each item only when it hands it out."
                    yield n
                    n = n + 1

            got = take(interleave([naturals(), "xy"]), 6)
            want = [0, "x", 1, "y", 2, 3]
            assert got == want, f'The first six items of interleave([naturals(), "xy"]) were {got}, not {want}.'


        def test_none_is_a_value():
            """A stream that holds None is not taken to be used up."""
            got = take(interleave([[None, 1], [2]]), 10)
            assert got == [None, 2, 1], f"interleave([[None, 1], [2]]) gave {got}, not [None, 2, 1]."


        def test_everything_once():
            """Every item of every stream comes out once, each stream's items in their order."""
            streams = [list(range(5)), list(range(10, 12)), [], list(range(20, 27))]
            got = take(interleave(streams), 100)
            assert len(got) == 14, f"The streams hold 14 items, but interleave gave {len(got)}: {got}."
            for s in streams:
                mine = [x for x in got if x in s]
                assert mine == s, f"The stream {s} came out as {mine}."
