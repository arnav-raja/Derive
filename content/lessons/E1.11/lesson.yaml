links:
  requires:
    - lesson: E1.4
      bridge: >-
        E1.4 looped over lists, made copies with `list(a)`, and found that a list is a row of
        slots side by side in memory, each referring to a value. This lesson asks what a `for` loop
        wants from a list, and finds a way to loop over values that are never all held at once.
    - lesson: E1.6
      bridge: >-
        E1.6 read a file with `for line in f`, one line at a time, without ever holding the whole
        of it. This lesson looks at what makes that work, and at why a second such loop over the
        same open file sees nothing.
    - lesson: E1.7
      bridge: >-
        E1.7's special methods let Python's own syntax call a class's methods, as `a + b` calls
        `__add__`. A `for` loop calls two more, `__iter__` and `__next__`, so a class of your own
        can be looped over.
  applies:
    - lesson: E1.2
      bridge: >-
        E1.2's `for` loop over a range turns out to be a `while` loop that calls `next` until the
        values run out, and its loop invariants prove that cutting a stream into batches loses no
        item and repeats none.
    - lesson: M1.3
      bridge: >-
        A pipeline of generators is a composition, as in M1.3: each stage's output is the next
        stage's input, and the order of the stages matters: `read` after `long_only` sees only the
        long words, while `read` before it sees them all.
  foreshadows:
    - lesson: E5.5
      bridge: >-
        PyTorch's `DataLoader` is an iterable, not an iterator: each `for` over it makes a fresh
        iterator, so every epoch sees all the data. E5.5 opens it up, with datasets that hand out
        one example at a time, batches collated from them, and worker processes that prepare the
        next batches while the current one trains.
    - lesson: E9.1
      bridge: >-
        A training set starts as a crawl of the web, far too large for any machine's memory. E9.1
        follows a token's path through a pipeline of stages like this lesson's: extracting text,
        filtering it, tokenising it, packing the tokens into sequences of a fixed length, and
        shuffling them with buffers on the way to a training batch.
