  - id: build-log-score
    phase: build
    kind: build
    concept: M1.5/log-rules
    covers: [M1.5/exponential-growth]
    title: The logarithm of a score
    prompt: >-
      Replace the `None` so that `log_score(p, n)` gives the logarithm to base 10 of the score of a
      passage of `n` words, each given the probability `p`.
    answer:
      type: code
      starter: |
        import math

        def log_score(p, n):
            return None    # log10 of the score of n words, each with probability p

        print(log_score(0.2, 1000), log_score(0.4, 1000))
      tests: |
        # close(a, b) is True when a and b agree to about nine significant figures.
        import math

        def test_answers():
            """log_score gives a number, not None."""
            assert log_score(0.2, 1000) is not None, "Replace the None with a formula."

        def test_one_word():
            """For a single word, log_score is the logarithm of that word's probability."""
            for p in (0.2, 0.4, 0.5, 0.01):
                assert close(log_score(p, 1), math.log10(p)), f"log_score({p}, 1) is {log_score(p, 1)}, not log10 of {p}."

        def test_short_passage():
            """For a short passage, 10 to the power log_score gives the score itself."""
            for p, n in ((0.2, 10), (0.5, 20), (0.9, 7)):
                assert close(10 ** log_score(p, n), p ** n), f"For {n} words with probability {p}, 10 to the power log_score is {10 ** log_score(p, n)}, but the score is {p ** n}."

        def test_adds_up():
            """A passage of m + n words scores the sum of an m-word and an n-word passage, up to 1,000 words."""
            for p, m, n in ((0.2, 3, 4), (0.4, 500, 500), (0.2, 600, 400)):
                assert close(log_score(p, m + n), log_score(p, m) + log_score(p, n)), f"log_score({p}, {m + n}) is {log_score(p, m + n)}, not log_score({p}, {m}) + log_score({p}, {n})."
      reference: |
        import math

        def log_score(p, n):
            return n * math.log10(p)

        print(log_score(0.2, 1000), log_score(0.4, 1000))
      wrong:
        - code: |
            import math

            def log_score(p, n):
                return math.log10(p ** n)

            print(log_score(0.2, 1000), log_score(0.4, 1000))
          why: >-
            Right as mathematics, but `p ** n` is worked out first, and for 1,000 words it is stored
            as 0.0, which has no logarithm.
        - code: |
            import math

            def log_score(p, n):
                return math.log10(p) ** n

            print(log_score(0.2, 1000), log_score(0.4, 1000))
          why: Raises the logarithm to a power instead of multiplying it.
        - code: |
            import math

            def log_score(p, n):
                return math.log10(p * n)

            print(log_score(0.2, 1000), log_score(0.4, 1000))
          why: Multiplies the probability by the number of words before taking the logarithm.
        - code: |
            import math

            def log_score(p, n):
                return n + math.log10(p)

            print(log_score(0.2, 1000), log_score(0.4, 1000))
          why: Adds the number of words to one logarithm instead of adding the logarithm n times.
        - code: |
            import math

            def log_score(p, n):
                return n * math.log(p)

            print(log_score(0.2, 1000), log_score(0.4, 1000))
          why: Uses the natural logarithm, `math.log`, instead of base 10.
    explanation: >-
      `n * math.log10(p)`: each of the `n` words adds the logarithm of its probability, so the
      logarithm of the score is `n` times `math.log10(p)`.

  - id: build-underflow
    phase: build
    kind: breakit
    concept: M1.5/exponential-growth
    title: Multiplying a thousand probabilities
    prompt: Predict what the program prints after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        a = 0.2 ** 10    # model A's score for a 10-word passage
        b = 0.4 ** 10    # model B's score for the same passage
        print(b > a)
      broken: |
        a = 0.2 ** 1000    # model A's score for a 1,000-word passage
        b = 0.4 ** 1000    # model B's score for the same passage
        print(b > a)
      change: The passage is now 1,000 words long, the length of the puzzle's passage.
      options:
        - { id: still-true, label: 'It still prints `True`, because B''s score is still the higher', when: "output.strip() == 'True'" }
        - { id: prints-false, label: 'It prints `False`', when: "output.strip() == 'False'" }
        - { id: error, label: 'Python stops with an error', when: 'error is not None' }
    explanation: >-
      The smallest positive number Python can store is about $5 \times 10^{-324}$, and a result much
      smaller than that is stored as `0.0`. Both scores are far smaller, so both become `0.0`, and
      `0.0 > 0.0` is `False`.

  - id: build-log-base
    phase: build
    kind: build
    concept: M1.5/log-rules
    covers: [M1.5/logarithms]
    title: A logarithm in any base
    prompt: >-
      Replace the `None` so that `log_base(x, b)` gives $\log_b x$, the power of `b` that gives `x`,
      using `math.log10` and nothing else from the `math` library.
    answer:
      type: code
      starter: |
        import math

        def log_base(x, b):
            return None    # the power of b that gives x

        print(log_base(8, 2), log_base(1024, 2))
      tests: |
        # close(a, b) is True when a and b agree to about nine significant figures.
        import math

        CASES = [(8, 2), (1024, 2), (1000, 10), (81, 3), (0.5, 2), (2, 8), (1e-6, 10), (7, 7)]

        def test_answers():
            """log_base gives a number, not None."""
            assert log_base(8, 2) is not None, "Replace the None with a formula."

        def test_undoes():
            """b to the power log_base(x, b) gives x back."""
            for x, b in CASES:
                y = log_base(x, b)
                assert close(b ** y, x), f"log_base({x}, {b}) is {y}, but {b} to that power is {b ** y}, not {x}."

        def test_library():
            """It agrees with Python's own math.log(x, b) to about nine significant figures."""
            for x, b in CASES:
                assert close(log_base(x, b), math.log(x, b)), f"log_base({x}, {b}) is {log_base(x, b)}, but math.log({x}, {b}) gives {math.log(x, b)}."

        def test_from_log10():
            """It is built from math.log10, not from math.log or math.log2."""
            saved = (math.log, math.log2)
            math.log = math.log2 = None
            try:
                log_base(8, 2)
            except TypeError:
                raise AssertionError("log_base uses math.log or math.log2. Build it from math.log10 alone.")
            finally:
                math.log, math.log2 = saved
      reference: |
        import math

        def log_base(x, b):
            return math.log10(x) / math.log10(b)

        print(log_base(8, 2), log_base(1024, 2))
      wrong:
        - code: |
            import math

            def log_base(x, b):
                return math.log10(b) / math.log10(x)

            print(log_base(8, 2), log_base(1024, 2))
          why: Divides the wrong way up, which gives the reciprocal of the answer.
        - code: |
            import math

            def log_base(x, b):
                return math.log10(x) - math.log10(b)

            print(log_base(8, 2), log_base(1024, 2))
          why: Subtracts the logarithms, which gives the logarithm of x divided by b.
        - code: |
            import math

            def log_base(x, b):
                return math.log10(x) / b

            print(log_base(8, 2), log_base(1024, 2))
          why: Divides by the base itself instead of by its logarithm.
        - code: |
            import math

            def log_base(x, b):
                return math.log(x, b)

            print(log_base(8, 2), log_base(1024, 2))
          why: Hands the work to `math.log`, which the exercise asks you to do without.
    explanation: >-
      `math.log10(x) / math.log10(b)`: the change of base rule from Derive, with base 10 underneath.

  - id: build-digits
    phase: build
    kind: build
    concept: M1.5/logarithms
    covers: [M1.5/log-scales]
    title: Counting digits
    prompt: >-
      Replace the `None` so that `digits(n)` gives the number of digits of the whole number `n`, for
      any `n` of 1 or more, using `math.log10`.
    answer:
      type: code
      starter: |
        import math

        def digits(n):
            return None    # how many digits the whole number n has

        print(digits(2 ** 100))
      tests: |
        import math

        def test_answers():
            """digits gives a number, not None."""
            assert digits(5) is not None, "Replace the None with a formula."

        def test_small():
            """digits is right from 1 to 12,345, including each power of ten and the number just below it."""
            cases = {1: 1, 9: 1, 10: 2, 99: 2, 100: 3, 999: 3, 1000: 4, 9999: 4, 10000: 5, 12345: 5}
            for n, d in cases.items():
                assert digits(n) == d, f"digits({n}) is {digits(n)}, but {n} has {d} digits."

        def test_large():
            """digits(2 ** 1000) is 302, as Derive found."""
            assert digits(2 ** 1000) == 302, f"digits(2 ** 1000) is {digits(2 ** 1000)}, not 302."

        def test_uses_log10():
            """digits counts with math.log10."""
            calls = []
            saved = math.log10
            math.log10 = lambda x: calls.append(x) or saved(x)
            try:
                digits(12345)
            finally:
                math.log10 = saved
            assert calls, "digits never calls math.log10. Count the digits with the logarithm."
      reference: |
        import math

        def digits(n):
            return math.floor(math.log10(n)) + 1

        print(digits(2 ** 100))
      wrong:
        - code: |
            import math

            def digits(n):
                return math.floor(math.log10(n))

            print(digits(2 ** 100))
          why: Gives one digit too few for every number.
        - code: |
            import math

            def digits(n):
                return math.ceil(math.log10(n))

            print(digits(2 ** 100))
          why: Rounds up, which is wrong at each power of ten, where the logarithm is a whole number.
        - code: |
            import math

            def digits(n):
                return round(math.log10(n)) + 1

            print(digits(2 ** 100))
          why: Rounds to the nearest whole number, which is wrong for 9, whose logarithm is about 0.95.
        - code: |
            import math

            def digits(n):
                return math.floor(math.log(n, 10)) + 1

            print(digits(2 ** 100))
          why: Uses `math.log(n, 10)`, which gives 2.9999999999999996 for 1,000 and so one digit too few.
        - code: |
            import math

            def digits(n):
                return len(str(n))

            print(digits(2 ** 100))
          why: Counts the characters, which is right, but without the logarithm the exercise asks for.
    explanation: >-
      `math.floor(math.log10(n)) + 1`. A number with $d$ digits has a logarithm from $d - 1$ up to
      $d$, so rounding the logarithm down gives $d - 1$, and adding 1 gives $d$.

  - id: build-sympy-log
    phase: build
    kind: build
    concept: M1.5/log-rules
    title: The rules in SymPy
    prompt: >-
      Replace the `None` so that `power` is `log(x**3)` rewritten by `expand_log`. Run the program.
      If SymPy has not used a rule on both logarithms, find out why, and fix it.
    answer:
      type: code
      starter: |
        from sympy import symbols, log, expand_log

        x, y = symbols('x y')
        product = expand_log(log(x * y))
        power = None    # expand_log applied to log(x**3)
        print(product)
        print(power)
      tests: |
        def test_power_filled():
            """power is filled in."""
            assert power is not None, "Replace the None in power."

        def test_product():
            """product prints as log(x) + log(y): SymPy has used the product rule."""
            assert str(product) == "log(x) + log(y)", f"product is {product}. SymPy has not used the product rule. Is the rule true for every x and y SymPy allows?"

        def test_power():
            """power prints as 3*log(x): SymPy has used the rule for powers."""
            assert str(power) == "3*log(x)", f"power is {power}, not 3*log(x)."

        def test_letters():
            """SymPy knows the facts about x and y that make both rules true."""
            assert x.is_positive and y.is_positive, "SymPy does not know that x and y are positive."
      reference: |
        from sympy import symbols, log, expand_log

        x, y = symbols('x y', positive=True)
        product = expand_log(log(x * y))
        power = expand_log(log(x**3))
        print(product)
        print(power)
      wrong:
        - code: |
            from sympy import symbols, log, expand_log

            x, y = symbols('x y')
            product = expand_log(log(x * y))
            power = expand_log(log(x**3))
            print(product)
            print(power)
          why: The letters could stand for negative numbers, so SymPy leaves both logarithms as they are.
        - code: |
            from sympy import symbols, log, expand_log

            x, y = symbols('x y', positive=True)
            product = expand_log(log(x * y))
            power = log(x)**3
            print(product)
            print(power)
          why: Cubes the logarithm instead of rewriting the logarithm of a cube.
        - code: |
            from sympy import symbols, log, expand_log

            x, y = symbols('x y')
            product = expand_log(log(x * y), force=True)
            power = expand_log(log(x**3), force=True)
            print(product)
            print(power)
          why: Forces the rules onto letters that could be negative, where the rules are false.
    explanation: >-
      Make the letters positive with `symbols('x y', positive=True)`, and set
      `power = expand_log(log(x**3))`. SymPy then prints `log(x) + log(y)` and `3*log(x)`.

  # Explain --------------------------------------------------------------------
  - id: explain-adding-logs
    phase: explain
    kind: explain
    concept: M1.5/log-rules
    covers: [M1.5/logarithms, M1.5/exponential-growth, M1.5/log-scales]
    title: Why models add logarithms
    prompt: >-
      Explain to your friend why a language model adds the logarithms of its probabilities instead
      of multiplying the probabilities, and how adding still lets it compare the puzzle's two models
      on the 1,000-word passage. Say what a logarithm is in plain words.
    answer:
      type: text
      rubric:
        - { id: what-log, criterion: 'Says in plain words what a logarithm is: the power of 10 that gives the number.' }
        - { id: product-sum, criterion: 'Says that the logarithm of a product is the sum of the logarithms, so the logarithm of a score is the sum of its words'' logarithms.' }
        - { id: why, criterion: 'Says why multiplying fails: the product of many probabilities is too small for a computer to store, and becomes 0.' }
        - { id: compare, criterion: 'Says that the higher logarithm belongs to the higher score, and that the difference of the logarithms gives the factor between the scores as a power of ten.' }
        - { id: numbers, criterion: 'Uses the puzzle''s numbers correctly: logarithms of about $-699$ and $-398$, a difference of about 301.' }
      reference: >-
        The logarithm of a number is the power you raise 10 to in order to get it: the logarithm of
        1,000 is 3, and the logarithm of 0.2 is about −0.699, because 10 to the power −0.699 is 0.2.
        Multiplying numbers adds their powers of 10, so the logarithm of a product is the sum of the
        logarithms. A model's score for a passage is the product of the probabilities it gave each
        word. For 1,000 words that product is far too small for a computer, which stores anything
        below about 10 to the power −324 as 0, so both models' scores come out as 0 and cannot be
        compared. The logarithms are ordinary numbers, though. Model A's score has logarithm
        1,000 × (−0.699), about −699, and model B's has 1,000 × (−0.398), about −398. A larger number
        always has a larger logarithm, so B's score is the higher. The difference, about 301, says
        how many times higher as a power of ten: B's score is about 10 to the power 301 times A's,
        because each word gives B a factor of 2 and 2 is 10 to the power 0.301.
      minWords: 80
      maxWords: 350
