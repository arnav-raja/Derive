        - { name: b, integer: true, positive: true }
      lhs: 'C(n) ='
      reference: a + b + 1
      accept: ['1 + a + b', 'b + a + 1', '(a + b) + 1']
      reject: ['a + b', 'a + b + 2', '2*a + 1', '2*b + 1', 'a*b', 'a + 1', '2*(a + b)', 'a + b - 1']
    explanation: >-
      The call `fib(n)` is one call. `fib(n - 1)` makes $a$ calls, counting its own, and
      `fib(n - 2)` makes $b$, so $C(n) = a + b + 1$.

  - id: derive-fib-double
    phase: derive
    kind: proof
    concept: E1.5/memoisation
    title: More than double for every two steps
    prompt: >-
      Here is why the calls of the plain `fib` more than double for every two steps up in $n$, and
      what that means for `fib(40)`. Each line follows from the lines above it. Choose the rule that
      justifies each line. A rule may be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: work-out, name: Work it out, label: 'Work out a power, a product or a comparison of known numbers.' }
        - { id: collect, name: Collect, label: 'For any number $v$, $v + v = 2v$, and adding 1 to a number makes it larger.' }
        - { id: doubling, name: Doubling sum, label: '$1 + 2 + 4 + \dots + 2^{k-1} = 2^k - 1$, as E1.4 showed.' }
        - { id: never-smaller, name: Never smaller, label: 'Each count from $C(2)$ on is the count before it plus more, so the counts never get smaller as $n$ grows.' }
        - { id: repeat, name: Repeat, label: 'A step that holds for every $n \ge 2$ can be taken again and again, each time with $n$ two smaller, for as long as $n$ stays at least 2.' }
        - { id: smaller-term, name: A smaller term, label: 'Replacing a term of a sum by a number no larger than it gives a sum no larger.' }
      start: 'C(n) = C(n - 1) + C(n - 2) + 1 \text{ for } n \ge 2 \text{, and } C(0) = C(1) = 1'
      lines:
        - math: 'C(n - 1) \ge C(n - 2) \text{ for every } n \ge 2'
          rule: never-smaller
        - math: 'C(n) \ge C(n - 2) + C(n - 2) + 1'
          rule: smaller-term
        - math: 'C(n) > 2\,C(n - 2)'
          rule: collect
        - math: 'C(2k) > 2\,C(2k - 2) > 2^2\,C(2k - 4) > \dots > 2^k\,C(0) = 2^k \text{ for every } k \ge 1'
          rule: repeat
        - math: 'C(40) > 2^{20} = 1{,}048{,}576 > 10^{6}'
          rule: work-out
    explanation: >-
      The counts never shrink, so $C(n - 1)$ is at least $C(n - 2)$, and putting the smaller term in
      its place gives $C(n) \ge 2C(n - 2) + 1 > 2C(n - 2)$. Taking that step again and again, down to
      $C(0) = 1$, gives $C(2k) > 2^k$, so `fib(40)` makes more than $2^{20}$ calls, over a million.
      The doubling sum is not needed: the calls are bounded by repeated doubling, not by adding
      powers of two.

  - id: derive-estimate
    phase: derive
    kind: estimate
    concept: E1.5/memoisation
    title: Fifty, the plain way
    prompt: >-
      On a computer where the plain `fib(25)` takes a quarter of a second, each step up in $n$
      multiplies its calls, and so its time, by about 1.6. About how many hours does the plain
      `fib(50)` take there? An answer within a factor of 2 counts.
    answer: { type: number, value: 11, tolerance: { factor: 2 }, unit: hours }
    explanation: >-
      From 25 to 50 is 25 steps. $1.6^{5}$ is about 10.5, so $1.6^{25}$ is about
      $10.5^{5} \approx 1.3 \times 10^{5}$, and a quarter of a second times that is about 32,000
      seconds, nearly 9 hours. The exact count, 40,730,022,147 calls at a million a second, gives
      40,730 seconds, about 11 hours.

  - id: derive-memo-calls
    phase: derive
    kind: step
    concept: E1.5/memoisation
    title: The calls with a memo, for any n
    prompt: >-
      With the memo empty, how many calls does the memoised `fib(n)` make, counting the first call
      itself, for $n \ge 1$? Write it as an expression in $n$.
    answer:
      type: expression
      symbols:
        - { name: n, integer: true, positive: true }
      lhs: '\text{calls} ='
      reference: 2*n - 1
      accept: ['2n - 1', 'n + (n - 1)', '2*(n - 1) + 1']
      reject: ['2*n', 'n', 'n + 1', '2*n + 1', 'n - 1', '2*n - 2']
    explanation: >-
      The first calls run down from `fib(n)` to `fib(1)`, one for each case: $n$ calls. On the way
      back, each call from `fib(n)` down to `fib(2)` makes its second call, which is a base case or
      is found in the memo and returns at once: $n - 1$ more. That is $n + (n - 1) = 2n - 1$.

