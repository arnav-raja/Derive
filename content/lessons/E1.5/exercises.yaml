  - id: build-memo-splits
    phase: build
    kind: debug
    concept: E1.5/memoisation
    title: Ways to cut a word
    prompt: >-
      A tokeniser that knows tokens of 1, 2 and 3 characters can cut a word into tokens in many ways,
      and `splits(n)` counts them for a word of $n$ characters. Run the script: `splits(4)` comes out
      at once, but `splits(60)` runs until the editor stops it. Fix `splits` so that it works
      each case out only once. The tests count the calls that `splits` makes.
    answer:
      type: code
      starter: |
        def splits(n):
            """The number of ways to cut a word of n characters into tokens of 1, 2 or 3 characters,
            keeping their order. n is a whole number, 0 or more. A word of no characters has one way,
            with no tokens at all."""
            if n < 0:
                return 0
            if n == 0:
                return 1
            return splits(n - 1) + splits(n - 2) + splits(n - 3)


        print(splits(4))    # 7: 1+1+1+1, 1+1+2, 1+2+1, 2+1+1, 2+2, 1+3 and 3+1
        print(splits(60))
      tests: |
        def test_small():
            """The counts for words of 0 to 6 characters."""
            for n, expected in [(0, 1), (1, 1), (2, 2), (3, 4), (4, 7), (5, 13), (6, 24)]:
                got = splits(n)
                assert got == expected, f"splits({n}) is {got!r}, not {expected}."

        def test_sixty():
            """splits(60) is 4,680,045,560,037,375."""
            got = splits(60)
            shown = f"{got:,}" if isinstance(got, int) else repr(got)
            assert got == 4680045560037375, f"splits(60) is {shown}, not 4,680,045,560,037,375."

        def test_calls():
            """splits(150) takes fewer than 1,000 calls of splits."""
            # Your program's own names are kept in splits.__globals__ (for a function made by
            # functools.cache, in splits.__wrapped__.__globals__), so putting a counting version of
            # splits there counts every call that splits makes of itself. counted is a function made
            # inside this test, and it can use the test's own names calls and plain. *args and
            # **kwargs pass on whatever arguments a call is given. The lines under finally: run even
            # if counted(150) stops with an error, so the real splits is always put back.
            names = getattr(splits, "__wrapped__", splits).__globals__
            plain = names["splits"]
            calls = [0]

            def counted(*args, **kwargs):
                calls[0] = calls[0] + 1
                assert calls[0] <= 1000, "splits(150) made more than 1,000 calls of splits, so some cases are being worked out again and again."
                return plain(*args, **kwargs)

            names["splits"] = counted
            try:
                counted(150)
            finally:
                names["splits"] = plain

        def test_rule():
            """From 3 characters on, each count is the sum of the three counts before it."""
            for n in range(3, 151):
                a, b, c, d = splits(n), splits(n - 1), splits(n - 2), splits(n - 3)
