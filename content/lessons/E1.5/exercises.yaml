  - id: explain-recursion
    phase: explain
    kind: explain
    concept: E1.5/memoisation
    covers: [E1.5/base-and-recursive-case, E1.5/call-stack, E1.5/recursive-structures]
    title: Functions that call themselves
    prompt: >-
      Explain to your friend how a function can call itself without its calls getting mixed up, what
      makes such a function stop and what Python does when one never stops, how you can trust one
      without following every call, why it suits data nested inside data, why the plain `fib` is hopelessly slow, and how a memo fixes
      that and when a memo is safe.
    answer:
      type: text
      rubric:
        - { id: stack, criterion: 'Explains that each call has names of its own and waits for the calls it makes, so that the calls in progress form a stack: the latest call finishes first and the one below carries on where it stopped; and that Python allows about 1,000 calls in progress, stopping with `RecursionError` beyond that.' }
        - { id: base, criterion: 'Explains base and recursive cases: a base case is answered without a further call, every recursive case calls the function on something smaller, so every chain of calls reaches a base case; and that a recursive function is trusted by checking its base case, and its recursive case on the assumption that the smaller calls are right.' }
        - { id: structures, criterion: 'Says that lists of lists or dicts of dicts can nest to any depth, which a fixed number of loops cannot follow, while a recursive function follows the shape of the data, with a base case for a value that holds nothing of its kind.' }
        - { id: memo-cost, criterion: 'Explains why the plain `fib` is slow: each call makes two more, the same smaller cases are worked out again and again, and the calls grow by about 1.6 times for each step in n, so fib(50) takes hours; and that a memo keeps each answer in a dict the first time and looks it up after that, so each case is worked out once, about 2n calls.' }
        - { id: memo-pure, criterion: 'Says that a memo is safe only for a pure function, whose answer depends on nothing but its arguments and which does nothing else, such as printing, since a kept answer must be the one a new call would give and a call answered from the memo does nothing else.' }
      reference: >-
        Each call of a function gets names of its own, so when countdown(3) calls countdown(2), the
        new call has its own n, 2, and the first call keeps its n, 3, and waits. The calls in
        progress pile up like plates: a new call goes on top, only the top one runs, and when it
        returns it comes off and the one below carries on from where it stopped. That is the
        call stack, and it is why countdown(3) prints 3 2 1 go and then 1 2 3 on the way back. A
        recursive function needs a base case, a case it answers without calling itself, like the
        empty list for total, whose sum is 0. Every other case must call the function on something
        smaller, a shorter list or a smaller number, so that every chain of calls reaches a base case.
        Without one the calls never end, and Python, which allows about 1,000 calls in progress,
        stops with RecursionError. To trust a recursive function you do not follow its calls. You
        check the base case, and then check the recursive case assuming the smaller call is right:
        if total(xs[1:]) is the sum of the rest, then xs[0] plus it is the sum of the whole list.
        Recursion suits nested data, such as a model's weights in dicts inside lists inside dicts,
        because each call handles one level and calls itself on what that level holds, as deep as
        Python has room for calls, while loops inside loops reach only as deep as there are loops. The plain fib is slow because
        each call makes two more, and the same cases are worked out again and again: fib(5) works
        out fib(3) twice and fib(2) three times. The calls grow by about 1.6 times for each step up in
        n, so fib(50) would take hours. A memo is a dict that keeps each answer the first
        time it is worked out, so each later call for the same n looks it up, and fib(n) takes about
        2n calls. That is only safe for a pure function, whose answer depends only on its arguments and
        which does nothing else, such as printing, because otherwise a kept answer could differ from
        what a new call would give, or a skipped call would leave something undone.
