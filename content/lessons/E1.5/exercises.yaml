      The memo is made once, outside the function, so every call shares it. The first call for each
      `n` works its answer out and keeps it, and every later call for that `n` hands it back at once,
      so each case is worked out only once: about three calls for each `n` instead of a number of
      calls that multiplies by about 1.8 with each step. `splits` is pure, so a kept answer is always
      the one a new call would give.

