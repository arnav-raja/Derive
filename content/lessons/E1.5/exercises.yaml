        - { id: at-once, label: 'Python stops with an error before it prints anything', when: "error is not None and output.split() == []" }
        - { id: recursion, label: 'It prints 15, and then Python stops with `RecursionError`', when: "error == 'RecursionError' and output.split() == ['15']" }
        - { id: other, label: 'Something else happens', when: "not ((error is None and output.split() == ['15', '0']) or (error in ('IndexError', 'RecursionError') and output.split() == ['15']) or (error is not None and output.split() == []))" }
