exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-countdown
    phase: puzzle
    kind: predict
    concept: E1.5/call-stack
    title: A countdown that calls itself
    prompt: >-
      What does the whole program print? Each `print` starts a new line; the options show the lines
      in order, with spaces between them.
    answer:
      type: choice
      options:
        - { id: stops-at-go, label: '`3 2 1 go`' }
        - { id: shared-n, label: '`3 2 1 go 0 0 0`' }
        - { id: right, label: '`3 2 1 go 1 2 3`' }
        - { id: same-order, label: '`3 2 1 go 3 2 1`' }
      correct: [right]
    explanation: >-
      Each call has an `n` of its own. `countdown(3)` prints 3 and waits for `countdown(2)`, which
      prints 2 and waits for `countdown(1)`, which prints 1 and waits for `countdown(0)`. That call
      prints `go` and returns. Then `countdown(1)` carries on from the line after its call and prints
      its own `n`, 1, and returns; then `countdown(2)` prints 2, and last of all `countdown(3)` prints
      3.

  # Recall ---------------------------------------------------------------------
  - id: recall-nested-call
    phase: recall
    kind: recall
    concept: E1.3/scope
    prompt: |
      What does this program print?

      ```python
      def double(n):
          return 2 * n

      def quad(n):
          m = double(n)
          return double(m)

      print(quad(3))
      ```
    answer: { type: number, value: 12, tolerance: { abs: 0 } }
    explanation: >-
      `quad(3)` calls `double(3)`, which returns 6, so `m` refers to 6, and then `double(6)` returns
      12. Each call of `double` has an `n` of its own, apart from `quad`'s.

  - id: recall-print-call
    phase: recall
    kind: recall
    concept: E1.3/defining-functions
    prompt: |
      What does this program print?

      ```python
      def add(a, b):
          total = a + b

      print(add(2, 3))
      ```
    answer:
      type: choice
      options:
        - { id: five, label: '`5`' }
        - { id: none, label: '`None`' }
        - { id: error, label: 'Nothing: Python stops with an error' }
      correct: [none]
    explanation: >-
      `add` makes its own `total` refer to 5 but never returns it, so the call gives back `None`,
      and `print` shows `None`.

  - id: recall-slice
    phase: recall
    kind: recall
    concept: E1.4/lists
    prompt: |
      What does this program print?

      ```python
      xs = [4, 5, 6]
      print(xs[0], xs[1:])
      ```
    answer:
      type: choice
      options:
        - { id: right, label: '`4 [5, 6]`' }
        - { id: one-based, label: '`5 [6]`' }
        - { id: whole, label: '`4 [4, 5, 6]`' }
        - { id: slot, label: '`4 5`' }
      correct: [right]
    explanation: >-
      `xs[0]` is the first slot, 4, and `xs[1:]` is a new list of every slot from index 1 to the
      end, `[5, 6]`.

  - id: recall-dict-in
    phase: recall
    kind: recall
    concept: E1.4/dicts-and-sets
    prompt: |
      What does this program print?

      ```python
      memo = {0: 0, 1: 1}
      memo[2] = 1
      print(2 in memo, 3 in memo, len(memo))
      ```
    answer:
      type: choice
      options:
        - { id: values, label: '`False False 3`' }
        - { id: two, label: '`True False 2`' }
        - { id: right, label: '`True False 3`' }
      correct: [right]
    explanation: >-
      `memo[2] = 1` adds the key 2. `in` asks about the keys, so `2 in memo` is `True` and
      `3 in memo` is `False`, and `len` counts the three keys, 0, 1 and 2.

  - id: recall-doubling
    phase: recall
    kind: recall
    concept: E1.4/cost-of-operations
    prompt: 'What is $1 + 2 + 4 + \dots + 512$, where each term is twice the one before?'
    answer: { type: number, value: 1023, tolerance: { abs: 0 } }
    explanation: >-
      E1.4 showed that $1 + 2 + \dots + 2^{k-1} = 2^k - 1$. Here the last term is $512 = 2^9$, so
      $k = 10$, and the sum is $2^{10} - 1 = 1{,}023$.

  # Explore --------------------------------------------------------------------
  - id: explore-print-after
    phase: explore
    kind: predict
    concept: E1.5/call-stack
    title: Printing after the call
    placement: true
    prompt: >-
      What does the program print? The options show the printed lines in order, with spaces between
      them.
    answer:
      type: choice
      options:
        - { id: down, label: '`3 2 1`' }
        - { id: right, label: '`1 2 3`' }
        - { id: zero, label: '`0 1 2 3`' }
        - { id: deepest, label: '`1`' }
      correct: [right]
    explanation: >-
      `show(3)` calls `show(2)` before it prints anything, `show(2)` calls `show(1)`, and `show(1)`
      calls `show(0)`, which does nothing, since `0 > 0` is `False`, and returns. Then `show(1)`
      carries on and prints 1, `show(2)` prints 2, and `show(3)` prints 3: the latest call finishes
      first.
    review:
      variants:
        - prompt: |
            What does this print? The options show the printed lines in order.

            ```python
            def both(n):
                if n > 0:
                    print(n)
                    both(n - 1)
                    print(n)

            both(2)
            ```
          answer:
            type: choice
            options:
              - { id: repeat, label: '`2 1 2 1`' }
              - { id: zero, label: '`2 1 0 1 2`' }
              - { id: reversed, label: '`1 2 2 1`' }
              - { id: right, label: '`2 1 1 2`' }
            correct: [right]
          explanation: >-
            `both(2)` prints 2 and calls `both(1)`, which prints 1, calls `both(0)`, which prints
            nothing, and then prints its own 1 again. Only then does `both(2)` print its 2 again.
        - prompt: |
            During `show(3)`, at most how many calls of `show` are in progress at once?

            ```python
            def show(n):
                if n > 0:
                    show(n - 1)
                    print(n)

            show(3)
            ```
          answer: { type: number, value: 4, tolerance: { abs: 0 } }
          explanation: >-
            `show(3)`, `show(2)`, `show(1)` and `show(0)` are all in progress when `show(0)` runs,
            since each of the others is waiting for the call it made.
        - prompt: |
            What does this print? The options show the printed lines in order.

            ```python
            def tree(n):
                if n > 0:
                    tree(n - 1)
                    print(n)
                    tree(n - 1)

            tree(2)
            ```
          answer:
            type: choice
            options:
              - { id: first, label: '`2 1 1`' }
              - { id: both-first, label: '`1 1 2`' }
              - { id: right, label: '`1 2 1`' }
              - { id: once, label: '`1 2`' }
            correct: [right]
          explanation: >-
            `tree(2)` first calls `tree(1)`, which calls `tree(0)`, prints 1 and calls `tree(0)` again,
            printing nothing more. Only once that `tree(1)` has returned does `tree(2)` print 2, and then
            its second call of `tree(1)` prints 1 again.

  - id: explore-no-base
    phase: explore
    kind: predict
    concept: E1.5/base-and-recursive-case
    title: A countdown with no base case
    prompt: What happens when the program runs?
    answer:
      type: choice
      options:
        - { id: once, label: 'It prints 3 and stops, since nothing makes it go on' }
        - { id: zero, label: 'It prints 3, 2, 1 and 0, and stops at 0' }
        - { id: error, label: 'It prints 3, 2, 1, 0, $-1$ and so on for a while, and then Python stops it with an error' }
        - { id: forever, label: 'It prints 3, 2, 1, 0, $-1$ and so on for ever, until someone stops it' }
      correct: [error]
    explanation: >-
      With no base case, every call makes another, with `n` one smaller, past 0 and on into the
      negative numbers. But every call stays in progress, waiting for the one it made, and Python
      allows only about 1,000 at once, so it stops the program with `RecursionError`.
    review:
      variants:
        - prompt: |
            What happens when this runs?

            ```python
            def countdown(n):
                if n == 0:
                    print("go")
                else:
                    print(n)
                    countdown(n - 2)

            countdown(5)
            ```
          answer:
            type: choice
            options:
              - { id: error, label: 'It prints 5, 3, 1, $-1$ and so on, and then Python stops with `RecursionError`' }
              - { id: go, label: 'It prints 5, 3, 1 and `go`' }
              - { id: stops, label: 'It prints 5, 3 and 1, and stops' }
            correct: [error]
          explanation: >-
            Counting down by 2 from 5 goes 5, 3, 1, $-1$, and never lands on 0, so the base case is
            never reached, and the calls pile up until Python stops them.
        - prompt: |
            What happens when this runs?

            ```python
            def countdown(n):
                if n <= 0:
                    print("go")
                else:
                    print(n)
                    countdown(n - 2)

            countdown(5)
            ```
          answer:
            type: choice
            options:
              - { id: error, label: 'It prints 5, 3, 1, $-1$ and so on, and then Python stops with `RecursionError`' }
              - { id: go, label: 'It prints 5, 3, 1 and `go`' }
              - { id: stops, label: 'It prints 5, 3 and 1, and stops' }
            correct: [go]
          explanation: >-
            `countdown(-1)` passes the test `n <= 0`, so it prints `go`. A base case that covers every
            number at or below 0 is reached from every starting point, odd or even.

  - id: explore-total-trust
    phase: explore
    kind: predict
    concept: E1.5/base-and-recursive-case
    title: A hundred numbers
    placement: true
    prompt: What does `print(total(list(range(1, 101))))` print?
    answer: { type: number, value: 5050, tolerance: { abs: 0 } }
    explanation: >-
      `total` gives the sum of its list, so this is the sum of 1 to 100, which E1.2 proved is
      $\frac{100 \times 101}{2} = 5{,}050$. Following the 101 calls one by one was never
      needed.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            def total(xs):
                if xs == []:
                    return 0
                rest = total(xs[1:])
                return xs[0] + rest

            print(total([10, -3, 2]) + total([]))
            ```
          answer: { type: number, value: 9, tolerance: { abs: 0 } }
          explanation: '`total([10, -3, 2])` is the sum, 9, and `total([])` is 0.'
        - prompt: |
            What does this print?

            ```python
            def f(xs):
                if xs == []:
                    return 0
                return 1 + f(xs[1:])

            print(f(list(range(50))))
            ```
          answer: { type: number, value: 50, tolerance: { abs: 0 } }
          explanation: >-
            `f([])` is 0, and if `f` counts the rest of a list correctly, one more than that is the
            length of the whole list. So `f` gives the length, 50, without following 51 calls.

  - id: explore-count-nested
    phase: explore
    kind: predict
    concept: E1.5/recursive-structures
    title: Numbers inside lists
    placement: true
    prompt: What does the program print?
    answer:
      type: choice
      options:
        - { id: top, label: '`3 2`' }
        - { id: empty-one, label: '`5 2`' }
        - { id: lists-too, label: '`8 3`' }
        - { id: right, label: '`5 0`' }
      correct: [right]
    explanation: >-
      Each number counts 1, and each list counts what its items count, at any depth:
      $1 + (1 + 1) + ((1) + 1) = 5$. The second list holds lists but no numbers, so every count
      inside it is 0.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            def count(x):
                if not isinstance(x, list):
                    return 1
                n = 0
                for item in x:
                    n = n + count(item)
                return n

            print(count([[1, 2], [3, [4, [5, 6]]]]))
            ```
          answer: { type: number, value: 6, tolerance: { abs: 0 } }
          explanation: 'Six numbers, 1 to 6, at depths from two to four; `count` finds them all, whatever the depth.'
        - prompt: |
            Counting the first call itself, how many calls of `count` does `count([1, [2, 3]])` make?

            ```python
            def count(x):
                if not isinstance(x, list):
                    return 1
                n = 0
                for item in x:
                    n = n + count(item)
                return n
            ```
          answer: { type: number, value: 5, tolerance: { abs: 0 } }
          explanation: >-
            One call for the whole list, one for `1`, one for `[2, 3]`, and one each for `2` and `3`:
            a call for every value, list or number, that the list holds at any depth, and one for the
            list itself.

  - id: explore-tree-value
    phase: explore
    kind: predict
    concept: E1.5/recursive-structures
    title: An expression tree
    prompt: What does the program print?
    answer: { type: number, value: 21, tolerance: { abs: 0 } }
    explanation: >-
      `value` works out both branches before it combines them: `["+", 1, 2]` gives 3, `["+", 3, 4]`
      gives 7, and the operation at the top multiplies them, $3 \times 7 = 21$.
    review:
      variants:
        - prompt: |
            What does this print?

            ```python
            def value(tree):
                if not isinstance(tree, list):
                    return tree
                left = value(tree[1])
                right = value(tree[2])
                if tree[0] == "+":
                    return left + right
                return left * right

            print(value(["+", ["*", 2, 3], ["*", 4, 5]]))
            ```
          answer: { type: number, value: 26, tolerance: { abs: 0 } }
          explanation: 'The branches give $2 \times 3 = 6$ and $4 \times 5 = 20$, and the top adds them: 26.'
        - prompt: |
            With the same `value`, which call returns first during `value(["*", ["+", 1, 2], 3])`?

            ```python
            def value(tree):
                if not isinstance(tree, list):
                    return tree
                left = value(tree[1])
                right = value(tree[2])
                if tree[0] == "+":
                    return left + right
                return left * right
            ```
          answer:
            type: choice
            options:
              - { id: right, label: 'The call for `1`' }
              - { id: branch, label: 'The call for `["+", 1, 2]`' }
              - { id: top, label: 'The first call, for the whole tree' }
              - { id: three, label: 'The call for `3`' }
            correct: [right]
          explanation: >-
            The first call starts on its left branch, `["+", 1, 2]`, and that call starts on its own
            left branch, `1`, a leaf, which returns at once. A leaf always returns before the calls
            that are waiting on it.

  - id: explore-fib-calls
    phase: explore
    kind: predict
    concept: E1.5/memoisation
    title: The calls of fib(5)
    prompt: Counting the first call itself, how many calls of `fib` does `fib(5)` make?
    answer: { type: number, value: 15, tolerance: { abs: 0 } }
    explanation: >-
      `fib(5)` calls `fib(4)` and `fib(3)`, `fib(4)` calls `fib(3)` and `fib(2)`, and so on down to
      `fib(1)` and `fib(0)`. Counted one by one, that is one `fib(5)`, one `fib(4)`, two `fib(3)`,
      three `fib(2)`, five `fib(1)` and three `fib(0)`: 15 calls.
    review:
      variants:
        - prompt: |
            Counting the first call itself, how many calls of `fib` does `fib(6)` make?

            ```python
            def fib(n):
                if n < 2:
                    return n
                return fib(n - 1) + fib(n - 2)
            ```
          answer: { type: number, value: 25, tolerance: { abs: 0 } }
          explanation: '`fib(6)` is one call, `fib(5)` makes 15 and `fib(4)` makes 9, so $1 + 15 + 9 = 25$.'
        - prompt: |
            During `fib(6)`, how many times is `fib(4)` called?

            ```python
            def fib(n):
                if n < 2:
                    return n
                return fib(n - 1) + fib(n - 2)
            ```
          answer: { type: number, value: 2, tolerance: { abs: 0 } }
          explanation: '`fib(6)` calls `fib(4)` itself, and so does `fib(5)`: twice.'

  - id: explore-memo-calls
    phase: explore
    kind: predict
    concept: E1.5/memoisation
    title: The calls with a memo
    placement: true
    prompt: With `memo` empty, how many calls of the memoised `fib` does `fib(6)` make, counting the first call itself?
    answer: { type: number, value: 11, tolerance: { abs: 0 } }
    explanation: >-
      `fib(6)` calls `fib(5)`, which calls `fib(4)`, and so on down to `fib(1)`: six calls, each the
      first for its `n`. On the way back up, each call from `fib(2)` to `fib(6)` makes its second
      call. `fib(2)`'s is `fib(0)` and `fib(3)`'s is `fib(1)`, both base cases, and from `fib(4)` up,
      each finds its answer in the memo. That is five more calls, eleven in all.
    review:
      variants:
        - prompt: |
            Straight after `fib(6)` has run, with what it left in `memo`, how many calls does a second
            `fib(6)` make, counting the first?

            ```python
            memo = {}

            def fib(n):
                if n < 2:
                    return n
                if n in memo:
                    return memo[n]
                answer = fib(n - 1) + fib(n - 2)
                memo[n] = answer
                return answer
            ```
          answer: { type: number, value: 1, tolerance: { abs: 0 } }
          explanation: 'The first `fib(6)` kept its answer under 6, so the second call finds it in the memo and returns at once.'
        - prompt: |
            With `memo` already holding the answers for 2 to 5, how many calls does `fib(8)` make,
            counting the first?

            ```python
            memo = {2: 1, 3: 2, 4: 3, 5: 5}

            def fib(n):
                if n < 2:
                    return n
                if n in memo:
                    return memo[n]
                answer = fib(n - 1) + fib(n - 2)
                memo[n] = answer
                return answer
            ```
          answer: { type: number, value: 7, tolerance: { abs: 0 } }
          explanation: >-
            `fib(8)`, `fib(7)` and `fib(6)` each have to be worked out, and the first call `fib(6)`
            makes, `fib(5)`, is found in the memo: four calls so far. On the way back, each of the
            three makes its second call, `fib(4)`, `fib(5)` and then `fib(6)`, and each of those is in
            the memo by then: seven in all.

  - id: explore-memo-pure
    phase: explore
    kind: predict
    concept: E1.5/memoisation
    title: Which answers can be kept
    prompt: >-
      A memo would keep each function's answer under its argument `n`. For which of the three
      functions would a kept answer always be the one a new call gives? Choose every one that fits.
    answer:
      type: choice
      multiple: true
      options:
        - { id: a, label: '`a`' }
        - { id: b, label: '`b`' }
        - { id: c, label: '`c`' }
      correct: [a]
    explanation: >-
      `a` is the plain `fib` under another name, and its answer depends only on `n`. `b` reads
      `rate`, which the script changes, so an answer kept before a change would be stale after it.
      `c` reads a new line of input at every call, so the same `n` can give a different answer each
      time.
    review:
      variants:
        - prompt: |
            `BASE` and `DECAY` are set once, at the top of a training script, and never changed. Is it
            safe to keep `lr_at`'s answers in a memo?

            ```python
            BASE = 0.1
            DECAY = 0.5

            def lr_at(step):
                return BASE * DECAY ** (step // 1000)
            ```
          answer:
            type: choice
            options:
              - { id: outside, label: 'No, since it reads names from outside the function' }
              - { id: right, label: 'Yes, since with those names fixed its answer depends only on `step`' }
            correct: [right]
          explanation: >-
            Reading a name from outside is harmless when the name never changes: every call with the
            same `step` gives the same answer, so a kept answer is always right.
        - prompt: |
            `model` is retrained every hour, which changes its weights. Is it safe to keep `score`'s
            answers in a memo for a day?

            ```python
            def score(text):
                return model.predict(text)
            ```
          answer:
            type: choice
            options:
              - { id: same-text, label: 'Yes, since the same text always gets the same answer' }
              - { id: right, label: 'No, since an answer kept before a retraining can differ from what the model gives after it' }
            correct: [right]
          explanation: >-
            `score` depends on the model's weights as well as on `text`, and the weights change every
            hour, so an answer kept in the morning may not be the one a new call would give in the
            afternoon.

  # Derive ---------------------------------------------------------------------
  - id: derive-total-proof
    phase: derive
    kind: proof
    concept: E1.5/base-and-recursive-case
    title: Why total gives the sum
    prompt: >-
      Here is why `total(xs)` is the sum of the numbers in `xs`, for every list `xs` of numbers,
      whenever Python has room for its calls. Each line follows from the lines above it. Choose the rule that justifies each line. A rule may
      be used more than once or not at all.
    answer:
      type: steps
      rules:
        - { id: local, name: Local names, label: 'Each call has names of its own, so the calls it makes cannot change which values its names refer to.' }
        - { id: one-length, name: One length at a time, label: 'A claim that holds for the empty list, and holds for each longer list whenever it holds for the lists shorter than it, holds for lists of every length.' }
        - { id: room, name: Room for calls, label: 'Python allows about 1,000 calls in progress at once.' }
        - { id: return-value, name: Return, label: 'A call ends at the first `return` it reaches, and the value after it is the value of the call.' }
        - { id: add, name: Adding, label: 'The first number of a list plus the sum of the others is the sum of all of them.' }
        - { id: slice, name: Slices, label: 'For a list that is not empty, `xs[0]` is its first value, and `xs[1:]` is a new list of the others, one slot shorter.' }
        - { id: trust, name: Trust the smaller call, label: 'In the recursive case, take the claim as true for a list shorter than the one in hand.' }
      start: '\text{Claim: for every list } \texttt{xs} \text{ of numbers, if Python has room for the calls, } \texttt{total(xs)} \text{ is the sum of the numbers in } \texttt{xs}'
      lines:
        - math: '\text{For } \texttt{xs = []} \text{, the test } \texttt{xs == []} \text{ is True, and the call gives 0, the sum of no numbers}'
          rule: return-value
        - math: '\text{For a list } \texttt{xs} \text{ that is not empty, } \texttt{xs[1:]} \text{ holds every number of } \texttt{xs} \text{ after its first, and is shorter than } \texttt{xs}'
          rule: slice
        - math: '\texttt{rest = total(xs[1:])} \text{ makes } \texttt{rest} \text{ the sum of those other numbers}'
          rule: trust
        - math: '\text{When that call returns, this call''s } \texttt{xs} \text{ still refers to its own list}'
          rule: local
        - math: '\text{The call gives } \texttt{xs[0] + rest}'
          rule: return-value
        - math: '\texttt{xs[0] + rest} \text{ is the sum of the numbers in } \texttt{xs}'
          rule: add
        - math: '\text{So } \texttt{total(xs)} \text{ is the sum for } \texttt{[]} \text{, then for every list of one number, then of two, and so on}'
          rule: one-length
    explanation: >-
      The base case gives the empty list its sum, 0. For a longer list, the slice is a new list one
      slot shorter, so the smaller call can be trusted to give the sum of the other numbers, and
      because this call's names are its own, its `xs` still refers to its list when that call
      returns. The call then gives the first number plus the sum of the others, which is the sum of
      them all. A claim that holds for the empty list and passes from shorter lists to longer ones
      holds for every length. The rule about room for calls is not needed: the claim leaves aside
      whether the calls fit, and says what `total` gives when they do.

  - id: derive-depth
    phase: derive
    kind: step
    concept: E1.5/call-stack
    title: How deep the calls go
    prompt: >-
      `total` is given a list of $n$ numbers. At the deepest point, how many calls of `total` are in
      progress at once? Write it as an expression in $n$.
    answer:
      type: expression
      symbols:
        - { name: n, integer: true, positive: true }
      lhs: '\text{calls in progress} ='
      reference: n + 1
      accept: ['1 + n', '(n + 1)']
      reject: ['n', 'n - 1', '2*n', 'n + 2', '2*n + 1', 'n^2']
    explanation: >-
      The calls are given lists of $n$, $n - 1$, and so on down to 0 numbers, and none of them
      returns before the call for the empty list has returned. That is $n + 1$ calls, one for each
      length from $n$ down to 0.

  - id: derive-fib-recurrence
