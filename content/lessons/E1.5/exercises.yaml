      `total([])` never reaches it. The empty list's length is 0, not 1, and its slice `[][1:]` is the
      empty list again, since a slice past the end is empty rather than an error. So every call makes
      the same call again, never one nearer a base case, until Python runs out of room for calls.
      And `xs[0]` on the last line, which would stop with `IndexError`, is never reached: every call
      is still waiting on line 4.

