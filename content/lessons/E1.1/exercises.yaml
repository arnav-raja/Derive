exercises:
  # Puzzle ---------------------------------------------------------------------
  - id: puzzle-learning-rate
    phase: puzzle
    kind: predict
    concept: E1.1/variables-as-names
    title: What the script prints
    prompt: What does the script print, now that line 4 has raised the batch size to 1,024?
    answer:
      type: choice
      options:
        - { id: point-four, label: '`0.4`, since the batch size is now four times as large' }
        - { id: point-one, label: '`0.1`, since line 4 changes only `batch_size`' }
        - { id: error, label: 'An error, since `lr` was worked out from the old batch size' }
      correct: [point-one]
    explanation: >-
      Python runs each line once, from the top. Line 3 works out `lr` with `batch_size` as it is at
      that moment, 256, so `lr` refers to $0.1 \times 256 / 256 = 0.1$. Line 4 makes `batch_size`
      refer to 1,024 but leaves `lr` alone, so the script prints `0.1`.

  # Recall ---------------------------------------------------------------------
  - id: recall-scientific
    phase: recall
    kind: recall
    concept: M1.1/powers-of-ten
    prompt: In Python, $2.5 \times 10^{-3}$ can be typed as `2.5e-3`. Which ordinary decimal is it?
    answer:
      type: choice
      options:
        - { id: hundredths, label: '0.025' }
        - { id: thousandths, label: '0.0025' }
        - { id: ten-thousandths, label: '0.00025' }
        - { id: thousands, label: '2,500' }
      correct: [thousandths]
    explanation: >-
      $10^{-3} = 0.001$, so $2.5 \times 10^{-3} = 0.0025$: the point moves three places to the left.

  - id: recall-tree-root
    phase: recall
    kind: recall
    concept: M1.2/expression-trees
    prompt: In the tree for $2 + 3 \times 4^2$, which operation sits at the top?
    answer:
      type: choice
      options:
        - { id: power, label: 'The power, $4^2$' }
        - { id: times, label: 'The multiplication' }
        - { id: together, label: 'All three, side by side' }
        - { id: plus, label: 'The addition' }
      correct: [plus]
    explanation: >-
      The power is worked out first and the addition last, $2 + 48 = 50$. The operation done last
      joins everything else, so the addition sits at the top.

  - id: recall-left-chain
    phase: recall
    kind: recall
    concept: M1.2/expression-trees
    prompt: What is $20 - 6 - 4$?
    answer: { type: number, value: 10, tolerance: { abs: 0 } }
    explanation: A chain of subtractions is worked from the left, $(20 - 6) - 4 = 14 - 4 = 10$.

  - id: recall-rounded-sum
    phase: recall
    kind: recall
    concept: M1.2/field-axioms
    prompt: >-
      M1.2's calculator keeps three significant figures and rounds after every operation. What does
      it show for $(1.00 + 0.004) + 0.004$?
    answer: { type: number, value: 1, tolerance: { abs: 0.001 } }
    explanation: >-
      $1.00 + 0.004 = 1.004$, which rounds to 1.00, and the second 0.004 is lost in the same way, so
      it shows 1.00.

  # Explore --------------------------------------------------------------------
  - id: explore-fix-order
    phase: explore
    kind: predict
    concept: E1.1/variables-as-names
    title: Making the rate follow
    prompt: >-
      The colleague wanted the learning rate to follow the new batch size, so that the script prints
      `0.4`. Which of these changes would do that? Choose every one that works.
    answer:
      type: choice
      multiple: true
      options:
        - { id: move-up, label: 'Move `batch_size = 1024` up, to just before the line that works out `lr`' }
        - { id: move-down, label: 'Move `batch_size = 1024` down, below `print(lr)`' }
        - { id: repeat, label: 'Add `lr = base_lr * batch_size / 256` again, between `batch_size = 1024` and `print(lr)`' }
        - { id: rename, label: 'Give the new size a new name instead, `new_batch_size = 1024`' }
      correct: [move-up, repeat]
    explanation: >-
      Both of the right changes make the line that works out `lr` run when `batch_size` already
      refers to 1,024, so $0.1 \times 1{,}024 / 256 = 0.4$. Moving the change below `print(lr)` prints
      0.1 before the batch size changes, and a new name leaves `batch_size`, and so `lr`, as they
      were.

  - id: explore-swap
    phase: explore
    kind: predict
    concept: E1.1/variables-as-names
    title: A swap in two lines
    placement: true
    prompt: |
      Lines 3 and 4 are meant to swap the values of `a` and `b`. What does the program print?

      ```python
      a = 1
      b = 2
      a = b
      b = a
      print(a, b)
      ```
    answer:
      type: choice
      options:
        - { id: two-one, label: '`2 1`' }
        - { id: one-two, label: '`1 2`' }
        - { id: two-two, label: '`2 2`' }
        - { id: one-one, label: '`1 1`' }
      correct: [two-two]
    explanation: >-
      Line 3 makes `a` refer to 2, the value of `b`. By line 4 the 1 is gone, so `b = a` makes `b`
      refer to 2 as well, and the program prints `2 2`. Given two values, `print` shows both, with a
      space between them.
    review:
      variants:
        - prompt: |
            What does this program print?

            ```python
            x = 4
            y = x
            x = 10
            print(y)
            ```
          answer: { type: number, value: 4, tolerance: { abs: 0 } }
          explanation: >-
            `y = x` makes `y` refer to 4, the value `x` refers to at that moment. Line 3 gives `x` a
            new value but leaves `y` alone, so the program prints 4.
        - prompt: |
            What does `n` refer to once these lines have run?

            ```python
            n = 3
            n = n * n
            n = n + 1
            ```
          answer: { type: number, value: 10, tolerance: { abs: 0 } }
          explanation: >-
            Line 2 works out `n * n` with `n` as 3 and makes `n` refer to 9. Line 3 works out
            $9 + 1$ and makes `n` refer to 10.
        - prompt: |
            What does this program print?

            ```python
            a = 5
            b = a + 1
            a = b * 2
            print(a, b)
            ```
          answer:
            type: choice
            options:
              - { id: ten-six, label: '`10 6`' }
              - { id: twelve-thirteen, label: '`12 13`' }
              - { id: six-twelve, label: '`6 12`' }
              - { id: twelve-six, label: '`12 6`' }
            correct: [twelve-six]
          explanation: >-
            `b` refers to $5 + 1 = 6$, then `a` to $6 \times 2 = 12$. Giving `a` a new value leaves
            `b` alone, so `b` keeps 6, and the program prints `12 6`.

  - id: explore-plus-means
    phase: explore
    kind: predict
    concept: E1.1/values-and-types
    title: Plus, with quotes
    prompt: What does `print("3" + "4")` show?
    answer:
      type: choice
      options:
        - { id: seven, label: '`7`' }
        - { id: thirty-four, label: '`34`' }
        - { id: spaced, label: '`3 4`' }
        - { id: error, label: 'Python stops with an error' }
      correct: [thirty-four]
    explanation: >-
      Quotes make text, so `"3"` and `"4"` are strings, and `+` between two strings joins them into
      one, `"34"`. `print` shows a string without its quotes.
    review:
      variants:
        - prompt: What does `print("ha" * 4)` show?
          answer:
            type: choice
            options:
              - { id: ha-four, label: '`ha4`' }
              - { id: repeated, label: '`hahahaha`' }
              - { id: spaced, label: '`ha ha ha ha`' }
              - { id: error, label: 'Python stops with an error' }
            correct: [repeated]
          explanation: >-
            `*` with a string and a whole number repeats the string that many times, with nothing in
            between.
        - prompt: What does `print("10" + "1")` show?
          answer:
            type: choice
            options:
              - { id: joined, label: '`101`' }
              - { id: eleven, label: '`11`' }
              - { id: spaced, label: '`10 1`' }
              - { id: error, label: 'Python stops with an error' }
            correct: [joined]
          explanation: Both are strings, so `+` joins them into `"101"`.
        - prompt: What does `print("4" * 2)` show?
          answer:
            type: choice
            options:
              - { id: eight, label: '`8`' }
              - { id: repeated, label: '`44`' }
              - { id: spaced, label: '`4 4`' }
              - { id: error, label: 'Python stops with an error' }
            correct: [repeated]
          explanation: >-
            `"4"` is a string, so `* 2` repeats it, giving `"44"`. Only the number 4 doubles to 8.

  - id: explore-mixed-types
    phase: explore
    kind: predict
    concept: E1.1/values-and-types
    title: Text plus a number
    placement: true
    prompt: What does `print("3" + 4)` show?
    answer:
      type: choice
      options:
        - { id: error, label: 'Python stops with an error' }
        - { id: seven, label: '`7`' }
        - { id: thirty-four, label: '`34`' }
      correct: [error]
    explanation: >-
      Python stops with `TypeError: can only concatenate str (not "int") to str`. It could join two
      strings or add two numbers, but a string and a number could mean either, and Python never
      guesses.
    review:
      variants:
        - prompt: What does `print(int("12") + 3)` show?
          answer: { type: number, value: 15, tolerance: { abs: 0 } }
          explanation: '`int("12")` converts the string to the whole number 12, so the `+` adds: 15.'
        - prompt: What does `print("12" + str(3))` show?
          answer:
            type: choice
            options:
              - { id: fifteen, label: '`15`' }
              - { id: spaced, label: '`12 3`' }
              - { id: joined, label: '`123`' }
              - { id: error, label: 'Python stops with an error' }
            correct: [joined]
          explanation: '`str(3)` converts the number to the string `"3"`, so the `+` joins: `"123"`.'
        - prompt: What does `print(float("2.5") * 2)` show?
          answer:
            type: choice
            options:
              - { id: five, label: '`5`' }
              - { id: five-float, label: '`5.0`' }
              - { id: repeated, label: '`2.52.5`' }
              - { id: error, label: 'Python stops with an error' }
            correct: [five-float]
          explanation: >-
            `float("2.5")` converts the string to the float 2.5, and arithmetic that mixes a float
            with an int gives a float, which `print` shows with its point: `5.0`.

  - id: explore-floor-divide
    phase: explore
    kind: predict
    concept: E1.1/values-and-types
    title: Full batches
    prompt: >-
      A training set of 1,000 examples is cut into batches of 64. What is `1000 // 64`, the number of
      full batches?
    answer: { type: number, value: 15, tolerance: { abs: 0 } }
    explanation: >-
      $15 \times 64 = 960$ and $16 \times 64 = 1{,}024$, which is more than 1,000, so there are 15
      full batches.
    review:
      variants:
        - prompt: What is `17 // 5`?
          answer: { type: number, value: 3, tolerance: { abs: 0 } }
          explanation: $17 = 3 \times 5 + 2$, so `17 // 5` is 3, rounded down from 3.4.
        - prompt: What is `17 % 5`?
          answer: { type: number, value: 2, tolerance: { abs: 0 } }
          explanation: '$17 = 3 \times 5 + 2$, so the remainder, `17 % 5`, is 2.'
        - prompt: What is `-9 // 4`?
          answer: { type: number, value: -3, tolerance: { abs: 0 } }
          explanation: >-
            $-9 / 4 = -2.25$, and `//` always rounds down, towards minus infinity, so it gives $-3$,
            not $-2$.

  - id: explore-power-chain
    phase: explore
    kind: predict
    concept: E1.1/evaluation-order
    title: A chain of powers
    placement: true
    prompt: What is `2 ** 3 ** 2`?
    answer: { type: number, value: 512, tolerance: { abs: 0 } }
    explanation: >-
      A chain of powers is grouped from the right, as in maths: `2 ** 3 ** 2` is `2 ** (3 ** 2)`,
      which is $2^9 = 512$. Grouped from the left, it would be $8^2 = 64$.
    review:
      variants:
        - prompt: What is `2 ** 2 ** 3`?
          answer: { type: number, value: 256, tolerance: { abs: 0 } }
          explanation: >-
            A chain of powers is grouped from the right: `2 ** (2 ** 3)` is $2^8 = 256$. Grouped from
            the left it would be $4^3 = 64$.
        - prompt: What is `2 * 3 ** 2`?
          answer: { type: number, value: 18, tolerance: { abs: 0 } }
          explanation: The power comes first, `3 ** 2` is 9, then $2 \times 9 = 18$.
        - prompt: What is `10 - 2 ** 3 // 3`?
          answer: { type: number, value: 8, tolerance: { abs: 0 } }
          explanation: >-
            The power first, `2 ** 3` is 8, then `8 // 3` is 2, and the subtraction last:
            $10 - 2 = 8$.

  - id: explore-negative-square
    phase: explore
    kind: predict
    concept: E1.1/evaluation-order
    title: A minus sign and a power
    prompt: What is `-3 ** 2`?
    answer: { type: number, value: -9, tolerance: { abs: 0 } }
    explanation: >-
      The power is worked out before the minus sign in front, so `-3 ** 2` is `-(3 ** 2)`, which is
      $-9$, just as $-3^2 = -9$ in maths.

  - id: explore-exact-sums
    phase: explore
    kind: predict
    concept: E1.1/floats-are-approximate
    title: Exact sums
    placement: true
    prompt: |
      `==` asks whether two values are equal, and gives `True` or `False`. Which of these does Python say are `True`?

      - `0.5 + 0.25 == 0.75`
      - `0.1 + 0.2 == 0.3`
    answer:
      type: choice
      options:
        - { id: both, label: 'Both' }
        - { id: neither, label: 'Neither' }
        - { id: second, label: 'Only `0.1 + 0.2 == 0.3`' }
        - { id: first, label: 'Only `0.5 + 0.25 == 0.75`' }
      correct: [first]
    explanation: >-
      0.5, 0.25 and 0.75 are held exactly, so their sum is exact. 0.1, 0.2 and 0.3 are not: each is
      stored as a float a tiny distance from the decimal, and the floats for 0.1 and 0.2 add up to a
      different float from the one for 0.3. `print(0.1 + 0.2)` shows `0.30000000000000004`.
    review:
      variants:
        - prompt: What does `print(0.25 + 0.125 == 0.375)` show?
          answer:
            type: choice
            options:
              - { id: 'yes', label: '`True`' }
              - { id: 'no', label: '`False`' }
            correct: ['yes']
          explanation: >-
            $0.25 = \frac{1}{4}$, $0.125 = \frac{1}{8}$ and $0.375 = \frac{3}{8}$ are each a whole
            number over a power of two, so all three are held exactly and so is their sum.
        - prompt: Which of these numbers can a float hold exactly?
          answer:
            type: choice
            multiple: true
            options:
              - { id: half, label: '`0.5`' }
              - { id: fifth, label: '`0.2`' }
              - { id: sixteenth, label: '`0.0625`' }
              - { id: seven-tenths, label: '`0.7`' }
            correct: [half, sixteenth]
          explanation: >-
            $0.5 = \frac{1}{2}$ and $0.0625 = \frac{1}{16}$ have powers of two below the line. $0.2 =
            \frac{1}{5}$ and $0.7 = \frac{7}{10}$ have a 5 there, which no power of two can cancel.
        - prompt: What does `print(0.1 * 3 == 0.3)` show?
          answer:
            type: choice
            options:
              - { id: 'yes', label: '`True`' }
              - { id: 'no', label: '`False`' }
            correct: ['no']
          explanation: >-
            Neither 0.1 nor 0.3 is held exactly, and three times the float for 0.1 rounds to a
            different float from the one for 0.3: `print(0.1 * 3)` shows `0.30000000000000004`.

  - id: explore-which-exact
    phase: explore
    kind: predict
    concept: E1.1/floats-are-approximate
    title: Which are exact
    prompt: >-
      Which of these can a float hold exactly? Decide from the pattern in the six numbers on the
      buttons.
    answer:
      type: choice
      multiple: true
      options:
        - { id: five-eighths, label: '`0.625`' }
        - { id: three-fifths, label: '`0.6`' }
        - { id: one-eighth, label: '`0.125`' }
        - { id: one-twentieth, label: '`0.05`' }
        - { id: seven-eighths, label: '`0.875`' }
      correct: [five-eighths, one-eighth, seven-eighths]
    explanation: >-
      $0.625 = \frac{5}{8}$, $0.125 = \frac{1}{8}$ and $0.875 = \frac{7}{8}$, each a whole number
      divided by a power of two, so each is a float. $0.6 = \frac{3}{5}$ and $0.05 = \frac{1}{20}$
      have a 5 below the line, which no power of two can cancel.

  - id: explore-float-gap
    phase: explore
    kind: predict
    concept: E1.1/floats-are-approximate
    title: Floats near 1e16
    prompt: >-
      `1e16` is $10^{16} = 10{,}000{,}000{,}000{,}000{,}000$, which lies between $2^{53}$ and
      $2^{54}$. How far apart are neighbouring floats there?
    answer: { type: number, value: 2, tolerance: { abs: 0 } }
    explanation: >-
      From $2^{53}$ to $2^{54}$ a whole number has 54 binary digits, one more than a float keeps, so
      the float's last binary digit must be 0: only the even numbers are floats, 2 apart.

  # Derive ---------------------------------------------------------------------
  - id: derive-trace-square
    phase: derive
    kind: step
    concept: E1.1/variables-as-names
    title: A program on paper
    prompt: |
      Run this program on paper, where `a` is any number. What does `x` refer to at the end? Write it in terms of $a$.

      ```python
      x = a
      x = 2 * x
      x = x + 1
      x = x * x
      ```
    answer:
      type: expression
      symbols:
        - { name: a }
      lhs: '\texttt{x} ='
      reference: (2*a + 1)**2
      accept: ['4*a^2 + 4*a + 1', '(2a + 1)^2', '(1 + 2*a)*(2*a + 1)']
      reject: ['2*a^2 + 1', '(2*a)^2 + 1', '2*a + 1', 'a^2', '4*a^2 + 1', '(a + 1)^2', '2*a']
    explanation: >-
      `x` refers to $a$, then $2a$, then $2a + 1$, and the last line multiplies that by itself:
      $(2a + 1)^2 = 4a^2 + 4a + 1$.

  - id: derive-swap-y
    phase: derive
    kind: step
    concept: E1.1/variables-as-names
    title: Line 4, on paper
    prompt: >-
      What does `y` refer to once line 4, `y = x - y`, has run? Write it in terms of $a$ and $b$.
    answer:
      type: expression
      symbols:
        - { name: a }
        - { name: b }
      lhs: '\texttt{y} ='
      reference: a
      accept: ['a + b - b', '(a + b) - b']
      reject: ['b', 'a + b', 'a - b', 'b - a', '0', '2*b', 'a + 2*b']
    explanation: >-
      Line 3 makes `x` refer to $a + b$. Line 4 works out `x - y` with `x` as $a + b$ and `y` as $b$,
      which is $(a + b) - b = a$.

  - id: derive-swap-x
    phase: derive
    kind: step
    concept: E1.1/variables-as-names
    title: Line 5, on paper
    prompt: >-
      What does `x` refer to once line 5, `x = x - y`, has run? Write it in terms of $a$ and $b$.
    answer:
      type: expression
      symbols:
        - { name: a }
        - { name: b }
      lhs: '\texttt{x} ='
      reference: b
      accept: ['a + b - a']
      reject: ['a', 'a + b', '2*a + b', 'b - a', '0', 'a - b']
    explanation: >-
      When line 5 runs, `x` still refers to $a + b$ from line 3, and `y` now refers to $a$, so
      `x - y` is $(a + b) - a = b$.

  - id: derive-precedence
    phase: derive
    kind: proof
    concept: E1.1/evaluation-order
    title: One expression, bracketed
    prompt: >-
      Each line puts in the brackets for one more level of the tree that Python builds, or works out
      part of it. Choose the rule that justifies each line. A rule may be used more than once or not
      at all.
    answer:
      type: steps
      rules:
        - { id: power-right, name: Powers from the right, label: 'A chain of powers is grouped from the right: `a ** b ** c` is `a ** (b ** c)`.' }
        - { id: work-out, name: Work it out, label: 'Work out a power, a product, a sum or a minus sign whose numbers are known, and write the value in its place.' }
        - { id: left-chain, name: Left to right, label: 'A chain of `*`, `/`, `//` and `%`, or of `+` and `-`, is grouped from the left.' }
        - { id: floor, name: Floor division, label: 'Work out `a // b`: divide, then round down to a whole number.' }
        - { id: minus-after-power, name: Power before minus, label: 'A minus sign in front is worked out after a power: `-a ** b` is `-(a ** b)`.' }
        - { id: add-last, name: Add and subtract last, label: '`+` and `-` come after every other operation, so they join the largest pieces.' }
      start: '\texttt{-2 ** 4 + 17 // 5 * 3}'
      lines:
        - math: '= \texttt{(-2 ** 4) + (17 // 5 * 3)}'
          rule: add-last
        - math: '= \texttt{(-(2 ** 4)) + (17 // 5 * 3)}'
          rule: minus-after-power
        - math: '= \texttt{(-(2 ** 4)) + ((17 // 5) * 3)}'
          rule: left-chain
        - math: '= \texttt{(-16) + ((17 // 5) * 3)}'
          rule: work-out
        - math: '= \texttt{(-16) + (3 * 3)}'
          rule: floor
        - math: '= \texttt{(-16) + 9}'
          rule: work-out
        - math: '= \texttt{-7}'
          rule: work-out
    explanation: >-
      The `+` is done last, so it joins the two largest pieces. On the left the power comes before
      the minus sign, and on the right `//` and `*` are grouped from the left. Then the tree is worked
      out from the leaves: `2 ** 4` is 16, `17 // 5` is 3, $3 \times 3 = 9$ and $-16 + 9 = -7$. With
      only one power, the rule for chains of powers is never needed.

  - id: derive-gap-estimate
    phase: derive
    kind: estimate
    concept: E1.1/floats-are-approximate
    title: Floats near 1e20
    prompt: >-
      Near $10^{16}$, neighbouring floats are 2 apart. About how far apart are they near $10^{20}$?
      Reason from why they are 2 apart near $10^{16}$. An answer within a factor of 2 counts.
    answer: { type: number, value: 16384, tolerance: { factor: 2 } }
    explanation: >-
      Each time the numbers pass a power of two they gain a binary digit that a float cannot keep, so
      the gap doubles. $10^{20}$ lies between $2^{66}$ and $2^{67}$, 13 doublings above $2^{53}$, so
      the gap there is $2 \times 2^{13} = 2^{14} = 16{,}384$. A rougher estimate is close too: the
      numbers grow by a factor of $10^4$, so the gap grows from 2 to about 20,000.

  # Build ----------------------------------------------------------------------
  - id: build-formulas
    phase: build
    kind: build
    concept: E1.1/evaluation-order
    title: Formulas into Python
    prompt: |
      Replace each `None` with its formula in Python, using the names above it.

      - `neg_square` is $-x^2$, minus the square of $x$.
      - `cube_root` is $27^{1/3}$, the cube root of 27.
      - `decayed_lr` is $\dfrac{\texttt{peak\_lr}}{1 + \dfrac{\texttt{step}}{\texttt{decay\_steps}}}$, a learning rate that shrinks as training goes on.
      - `step_size` is $\dfrac{\texttt{peak\_lr}}{\sqrt{\texttt{v}} + \texttt{eps}}$, the size of one step of an optimiser, where the tiny `eps` keeps the division safe.
    answer:
      type: code
      starter: |
        x = 3
        peak_lr = 0.001
        step = 250
        decay_steps = 1000
        v = 4e-6
        eps = 1e-8

        neg_square = None    # minus x squared
        cube_root = None     # the cube root of 27
        decayed_lr = None    # the shrinking learning rate
        step_size = None     # the optimiser's step size

