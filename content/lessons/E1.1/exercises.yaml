  # Explain --------------------------------------------------------------------
  - id: explain-learning-rate
    phase: explain
    kind: explain
    concept: E1.1/variables-as-names
    covers: [E1.1/values-and-types, E1.1/evaluation-order, E1.1/floats-are-approximate]
    title: A program, read exactly
    prompt: >-
      Explain to your friend why the puzzle's script prints 0.1, and what it takes to read a program
      the way Python runs it: what a name refers to, what types are for, the order in which Python
      works out `-x ** 2 + y / 2`, and why `0.1 + 0.2 == 0.3` is `False`.
    answer:
      type: text
      rubric:
        - { id: names, criterion: 'Says that a name refers to a value, never to the formula that made it, and that an assignment works out its right side with the values as they are when it runs.' }
        - { id: order, criterion: 'Explains that Python runs each line once, from the top, so changing `batch_size` after `lr` was worked out leaves `lr` at 0.1, and says how the script could be fixed.' }
        - { id: types, criterion: 'Says that every value has a type, such as int, float or str, that decides what an operation means, with an example such as `+` adding numbers but joining strings.' }
        - { id: precedence, criterion: 'Gives the tree for `-x ** 2 + y / 2`: the addition is done last, joining minus the square of x, where the power comes before the minus sign, and y / 2.' }
        - { id: floats, criterion: 'Explains that a float holds exactly only a whole number of limited size times a power of two, so 0.1, 0.2 and 0.3 are stored as the nearest floats and the sum lands on a different float, and that floats should be compared within a tolerance.' }
      reference: >-
        Python runs a script one line at a time, from the top, and each line once. An assignment such
        as lr = base_lr * batch_size / 256 works out the right side with the values the names refer
        to at that moment, 0.1 and 256, and makes lr refer to the result, 0.1. lr keeps only that
        number, not the formula, so when line 4 makes batch_size refer to 1,024, lr is unchanged and
        the script prints 0.1. To make it print 0.4, change the batch size before working out lr, or
        work out lr again afterwards. Every value also has a type. 1024 is an int, a whole number
        held exactly; 0.1 is a float; "1024" in quotes is a str, text. The type decides what an
        operation means: + adds two numbers but joins two strings, so "3" + "4" is "34", and
        "3" + 4 is an error, because Python never guesses which you meant. Python reads every
        expression as a tree, with fixed rules. In -x ** 2 + y / 2 the addition is done last: it
        joins -x ** 2, where the power comes before the minus sign, so it is minus the square of x,
        and y / 2. Finally, a float holds exactly only a whole number of at most 53 binary digits
        times a power of two, which gives about 16 significant figures. 0.1 is one tenth, which has a 5 in its denominator, so it is
        stored as the nearest float, slightly more than 0.1, and the same is true of 0.2 and 0.3.
        Adding the floats for 0.1 and 0.2 lands on the float just above the one for 0.3, so == says
        False. So floats should be compared within a tolerance, for example with math.isclose,
        which allows for rounding but still catches a real mistake.
