      tree. Run it: the two trees that the program prints must match.
    answer:
      type: code
      starter: |
        import ast

        bare = "-2 ** 2 ** 3 + 10 // 3 * 2"
        bracketed = "-2 ** 2 ** 3 + 10 // 3 * 2"    # put in a pair of brackets for every operation

        print(ast.dump(ast.parse(bare, mode="eval").body, indent=2))
        print(ast.dump(ast.parse(bracketed, mode="eval").body, indent=2))
        print(eval(bare), eval(bracketed))    # eval works out the expression written in a string
      tests: |
        import ast

        def tree(text):
            return ast.dump(ast.parse(text, mode="eval").body)

        def test_bare_unchanged():
            """bare is still the expression the exercise gives."""
            assert bare == "-2 ** 2 ** 3 + 10 // 3 * 2", "Leave bare as it is, and put the brackets into bracketed."

        def test_same_tree():
            """bracketed has exactly the same tree as bare."""
            assert tree(bracketed) == tree(bare), "The brackets change the tree. Compare the two trees that the program prints."

        def test_every_operation():
            """Every operation in bracketed sits inside a pair of brackets of its own."""
            ops = [n for n in ast.walk(ast.parse(bracketed, mode="eval")) if isinstance(n, (ast.BinOp, ast.UnaryOp))]

            def has_pair(n):
                return bracketed[:n.col_offset].rstrip().endswith("(") and bracketed[n.end_col_offset:].lstrip().startswith(")")

            missing = sum(1 for n in ops if not has_pair(n))
            assert missing == 0, f"Operations still without a pair of brackets of their own: {missing} of {len(ops)}. Find each one in the tree that the program prints."
      reference: |
