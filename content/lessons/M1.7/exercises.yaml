  - id: build-sympy-logic
    phase: build
    kind: build
    concept: M1.7/connectives
    covers: [M1.7/implication]
    title: Logic in SymPy
    prompt: >-
      Replace each `None`. `converse` and `contrapositive` use `satisfiable` to look for a row of the
      truth table where $p \Rightarrow q$ differs from its converse and from its contrapositive. With
      $p$ for "short" and $q$ for "in English", a filter keeps an email that is short and in English,
      or short and not in English: `short_filter` is that rule, simplified by `simplify_logic`.
    answer:
      type: code
      starter: |
        from sympy import symbols, And, Or, Not, Implies, Equivalent, satisfiable, simplify_logic

        p, q = symbols("p q")

        # De Morgan's law: False, since no row makes the two sides differ.
        de_morgan = satisfiable(Not(Equivalent(Not(And(p, q)), Or(Not(p), Not(q)))))

        converse = None        # a row where p => q and q => p differ, or False
        contrapositive = None  # a row where p => q and its contrapositive differ, or False
        short_filter = None    # (p and q) or (p and not q), as simply as possible

        print(de_morgan)
        print(converse)
        print(contrapositive)
        print(short_filter)
      tests: |
        def test_filled():
            """converse, contrapositive and short_filter are all filled in."""
            for name, value in (("converse", converse), ("contrapositive", contrapositive), ("short_filter", short_filter)):
                assert value is not None, f"Replace the None in {name}."

        def test_converse():
            """converse is a row of the truth table where p => q and q => p differ."""
            assert converse is not None, "Replace the None in converse first."
            assert converse is not False, "converse is False, which says that p => q and q => p agree in every row. Check which two statements the search compares."
            assert isinstance(converse, dict), f"converse is {converse}, but satisfiable gives either False or a row of the truth table, written like {{p: True, q: True}}."
            one, other = Implies(p, q).subs(converse), Implies(q, p).subs(converse)
            assert one != other, f"In the row {converse}, p => q is {one} and q => p is {other}: they agree there. The search should find a row where they differ."

        def test_contrapositive():
            """contrapositive is False: p => q and its contrapositive agree in every row."""
            assert contrapositive is not None, "Replace the None in contrapositive first."
            assert contrapositive is False, f"contrapositive is {contrapositive}, a row where the two differ, but the contrapositive agrees with p => q in every row. Check the statement it is compared with."

        def test_short_filter():
            """short_filter keeps exactly the emails the filter keeps, in every row of the truth table."""
            assert short_filter is not None, "Replace the None in short_filter first."
            for P in (True, False):
                for Q in (True, False):
                    keep = (P and Q) or (P and not Q)
                    got = short_filter.subs({p: P, q: Q})
                    assert bool(got) == keep, f"With p = {P} and q = {Q}, short_filter is {got}, but the filter gives {keep}."

        def test_short_filter_simplest():
            """short_filter is as simple as simplify_logic can make it."""
            assert short_filter is not None, "Replace the None in short_filter first."
            simpler = simplify_logic(short_filter)
            assert short_filter == simpler, f"short_filter is {short_filter}, which simplify_logic can still simplify."
      reference: |
        from sympy import symbols, And, Or, Not, Implies, Equivalent, satisfiable, simplify_logic

        p, q = symbols("p q")

        # De Morgan's law: False, since no row makes the two sides differ.
        de_morgan = satisfiable(Not(Equivalent(Not(And(p, q)), Or(Not(p), Not(q)))))

        converse = satisfiable(Not(Equivalent(Implies(p, q), Implies(q, p))))
        contrapositive = satisfiable(Not(Equivalent(Implies(p, q), Implies(Not(q), Not(p)))))
        short_filter = simplify_logic(Or(And(p, q), And(p, Not(q))))

        print(de_morgan)
        print(converse)
        print(contrapositive)
        print(short_filter)
      wrong:
        - code: |
            from sympy import symbols, And, Or, Not, Implies, Equivalent, satisfiable, simplify_logic

            p, q = symbols("p q")

            converse = satisfiable(Not(Equivalent(Implies(p, q), Implies(q, p))))
            contrapositive = satisfiable(Not(Equivalent(Implies(p, q), Implies(Not(p), Not(q)))))
            short_filter = simplify_logic(Or(And(p, q), And(p, Not(q))))
          why: Compares $p \Rightarrow q$ with $\neg p \Rightarrow \neg q$, which denies both parts without swapping them, instead of with the contrapositive.
        - code: |
            from sympy import symbols, And, Or, Not, Implies, Equivalent, satisfiable, simplify_logic

            p, q = symbols("p q")

            converse = satisfiable(Equivalent(Implies(p, q), Implies(q, p)))
            contrapositive = satisfiable(Not(Equivalent(Implies(p, q), Implies(Not(q), Not(p)))))
            short_filter = simplify_logic(Or(And(p, q), And(p, Not(q))))
          why: Leaves out the `Not`, so the search finds a row where the two agree.
        - code: |
            from sympy import symbols, And, Or, Not, Implies, Equivalent, satisfiable, simplify_logic

            p, q = symbols("p q")

            converse = satisfiable(Not(Equivalent(Implies(p, q), Implies(q, p))))
            contrapositive = satisfiable(Not(Equivalent(Implies(p, q), Implies(Not(q), Not(p)))))
            short_filter = Or(And(p, q), And(p, Not(q)))
          why: Writes the filter's rule without simplifying it.
        - code: |
            from sympy import symbols, And, Or, Not, Implies, Equivalent, satisfiable, simplify_logic

            p, q = symbols("p q")

            converse = satisfiable(Not(Equivalent(Implies(p, q), Implies(q, p))))
            contrapositive = satisfiable(Not(Equivalent(Implies(p, q), Implies(Not(q), Not(p)))))
            short_filter = simplify_logic(Or(And(p, q), And(Not(p), q)))
          why: Writes the second case as long and in English instead of short and not in English.
    explanation: >-
      `satisfiable(Not(Equivalent(Implies(p, q), Implies(q, p))))` finds a row where the claim and
      its converse differ, `satisfiable(Not(Equivalent(Implies(p, q), Implies(Not(q), Not(p)))))` is
      `False`, and `simplify_logic(Or(And(p, q), And(p, Not(q))))` is just `p`.

  # Explain --------------------------------------------------------------------
  - id: explain-claim
    phase: explain
    kind: explain
    concept: M1.7/implication
    covers: [M1.7/connectives, M1.7/sets, M1.7/quantifiers]
    title: The four cards, simply
    prompt: >-
      Explain to your friend which cards to turn over and why: what the claim promises, the one kind
      of email that would make it false, why card 3 cannot help, and why card 4 can. Then say what it
      would take to break the claim for a dataset of a million emails, and why a thousand emails that
      agree with it do not prove it.
    answer:
      type: text
      rubric:
        - { id: promise, criterion: 'Says that the claim is false only for an email labelled spam with no link, and holds for every other email, including those not labelled spam.' }
        - { id: cards, criterion: 'Chooses cards 1 and 4, saying what each could reveal: card 1 might have no link, and card 4 might be labelled spam.' }
        - { id: others, criterion: 'Explains why cards 2 and 3 cannot break the claim: card 2 is not labelled spam, and card 3 already has a link, whatever its label.' }
        - { id: contrapositive, criterion: 'Connects card 4 to the contrapositive, "if an email contains no link, then it is not labelled spam", which says the same as the claim.' }
        - { id: every, criterion: 'Says that one email labelled spam with no link breaks the claim, that a thousand agreeing emails cannot prove it, and that a full check need only look at the emails labelled spam.' }
      reference: >-
        The claim is a promise about spam: every email labelled spam has a link. Only one kind of
        email breaks it, an email labelled spam with no link. An email that is not labelled spam cannot
        break it, link or no link, because the claim promises nothing about such emails. So turn over
        card 1, because it is labelled spam and its other side might say "no link". Turn over card 4,
        because it has no link and its other side might say "labelled spam". That is the
        contrapositive at work: "if an email has no link, it is not labelled spam" says exactly the
        same as the claim, so card 4 tests the claim just as card 1 does. Card 3 already has a link,
        so whatever its label, it agrees with the claim: turning it over can only confirm, never
        refute. Card 2 is not labelled spam, so the claim says nothing about it. For a million emails,
        a single email labelled spam with no link makes the claim false; that is a counterexample. A
        thousand emails that agree say nothing about the other 999,000, any of which could be the
        counterexample. To settle it, look at every email labelled spam, or equally at every email
        with no link, and ignore the rest.
