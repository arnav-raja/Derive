    title: No losses at all
    prompt: Predict what happens after the change, then run both versions to see.
    answer:
      type: breakit
      code: |
        losses = [0.4, 0.3, 0.2]
        print(all(loss < 1 for loss in losses), any(loss < 1 for loss in losses))
      broken: |
        losses = []
        print(all(loss < 1 for loss in losses), any(loss < 1 for loss in losses))
      change: The list of losses is now empty.
      options:
        - { id: same, label: 'It still prints `True True`', when: "output.strip() == 'True True'" }
        - { id: false-false, label: 'It prints `False False`', when: "output.strip() == 'False False'" }
        - { id: error, label: 'Python stops with an error', when: 'error is not None' }
        - { id: true-false, label: 'It prints `True False`', when: "output.strip() == 'True False'" }
    explanation: >-
      It prints `True False`. `all` is `True` unless it finds a counterexample, and an empty list
      holds none, so every loss in it is below 1, vacuously. `any` is `True` only if it finds a
      witness, and an empty list holds none of those either.

