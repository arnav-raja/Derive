name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate route types
        run: npx next typegen

      - name: Derive's server, and its list of client components is current
        run: |
          npm run build:api
          git diff --exit-code src/generated || (echo "::error::Run npm run build:api and commit src/generated/client-modules.ts." && exit 1)

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Graph rules
        run: npm run check:graph

      - name: Lesson content
        run: npm run check:content

      - name: Exercises
        run: npm run check:exercises

      - name: Build the site and the server
        run: npm run build

  e2e:
    name: Pages, lessons and performance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Every page and lesson phase, at three widths in both themes, and the budgets
        run: npm run test:e2e

      - name: Keep the report, with every screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 14
